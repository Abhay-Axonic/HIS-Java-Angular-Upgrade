<form action="" class="second-level-tab-display-div" ng-show="tab==1 && isSetFirstTabLevel(1)">
<fieldset class=""><!-- main-fieldset -->
			<legend class="heading-div">Personal Details</legend>
				<div class="row margin-top10">
				
				  <div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4">
						<div class="row input-container">
							<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon"> 
								<i class="fa fa-object-group" aria-hidden="true"></i>
							</div>
							<div class="col-lg-11 col-sm-11 col-md-11 ">
								<div class="">{{prefixId}}
									<select  class="text-input floating-label " name="prefixId"  ng-model="unknownPatient.prefixId" ng-change="selectGender(unknownPatient.prefixId)" >
										<option value="">Select Prefix</option>
										<option ng-repeat="info in prefixList" value="{{info.prefixId}}">{{info.prefixDesc}}</option>
										
									</select>
									<label for="code">Prefix<span class="star">*</span></label>
								</div>
							</div>
						</div>
					</div>
					
					<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4">
						<div class="row input-container">
							<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
								<i class="fa fa-user-o" aria-hidden="true"></i>
							</div>
							<div class="col-lg-11 col-sm-11 col-md-11 ">
								<div class="">
									<input type="text" autocomplete="off"  name="code" id="my-field" ng-model="unknownPatient.patientName" ng-disabled="readOnlyFlag" class="text-input floating-label">
									<label for="code">Patient Name <span class="star">*</span></label>
								</div>
							</div>
						</div>
					</div>
					<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4">
						<div class="row input-container">
							<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
								<i class="fa fa-bullseye" aria-hidden="true"></i>
							</div>
							<div class="col-lg-11 col-sm-11 col-md-11 ">
								<div class="">
									<select class="text-input floating-label" convert-to-number name="code" ng-disabled="readOnlyFlag" ng-model="unknownPatient.genderId">
										<option>Select Gender</option>
										<option ng-repeat="info in genderList" value="{{info.id}}">{{info.desc}}</option>
									</select> <label for="code">Gender <span class="star">*</span></label>
								</div>
							</div>
						</div>
					</div>
					<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
						<div class="row input-container">
							<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
								<i class="fa fa-bullseye" aria-hidden="true"></i>
							</div>
							<div class="col-lg-6 col-sm-6 col-md-6 padding-left-right-set4">
								<div class="">
									<input type="text" autocomplete="off"  numbers-only  name="code" id="" ng-model="unknownPatient.age" ng-disabled="readOnlyFlag" class="text-input floating-label" maxlength="3">
									<label for="code">Age in years <span class="star">*</span></label>
								</div>
							</div>
							<div class="col-lg-5 col-sm-5 col-md-5 padding-left-right-10 padding-top2">
								<div class="">
									<select class="text-input floating-label" name="code" ng-disabled="readOnlyFlag" ng-model="unknownPatient.ageFormat">
										<option value="Y">Year</option>
										<option value="M">Month</option>
										<option value="D">Day</option>
									</select> <label for="code" class="padding-left10">Select (Y/M/D)<span class="star">*</span></label>
								</div>
							</div>
						</div>
					</div>
					<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4">
						<div class="row input-container">
							<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
								<i class="fa fa-phone" aria-hidden="true"></i>
							</div>
							<div class="col-lg-11 col-sm-11 col-md-11 ">
								<div class="">
									<input numbers-only type="text" autocomplete="off"  name="code" id="" ng-model="unknownPatient.mobileNo" ng-disabled="readOnlyFlag"  class="text-input floating-label" maxlength="10">
									<label for="code">Contact No.<span class="star">*</span></label>
								</div>
							</div>
						</div>
					</div>
				</div>
				<div class="row margin-top10">
					<div class="col-lg-3 col-md-3 col-sm-2 padding-left-right-set4" style="margin-left:7px">
						<input type="checkbox" ng-true-value="'Y'" ng-false-value="'N'" ng-model="unknownPatient.isMedicoLegal"> <span>Medico Legal Case</span>
					</div>
				</div>
				<div class="row margin-top10" ng-if="unknownPatient.isMedicoLegal == 'Y'">
					<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
						<div class="row input-container">
							<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
								<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
							</div>
							<div class="col-lg-11 col-sm-11 col-md-11 ">
								<div class="">
									<input type="text" autocomplete="off"  name="code" id="" ng-model="unknownPatient.accompaniedName" class="text-input floating-label">
									<label for="code">Accompanied by<span class="star">*</span></label>
								</div>
							</div>
						</div>
					</div>
					<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
						<div class="row input-container">
						
							<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
								<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
							</div>
							
							<div class="col-lg-11 col-sm-11 col-md-11 ">
								<div class="">
									 <select class="text-input floating-label" name="code" ng-model="unknownPatient.priorityId">
										<option value="null">Select Priority</option>
										<option ng-repeat="info in priorityList" value="{{info.priorityId}}">{{info.priorityCode}}</option>
									</select> <label for="code">Priority</label>
				
                                  </div>
							</div>
						</div>
					</div>
					
					<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
						<div class="row input-container">
							<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon"> 
								<i class="fa fa-user-o" aria-hidden="true"></i>
							</div>
							<div class="col-lg-11 col-sm-11 col-md-11 ">
								<div class="">
									 <select class="text-input floating-label" name="code" ng-model="unknownPatient.mlcRelationId">
										<option value="null">Select Relation</option>
										<option ng-repeat="info in relationList" value="{{info.id}}" >{{info.desc}}</option>
									</select> <label for="code">Relation</label>	
							</div>
						</div>
					</div>
					</div>
					
					<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
						<div class="row input-container">
							<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
								<i class="fa fa-phone" aria-hidden="true"></i>
							</div>
							<div class="col-lg-11 col-sm-11 col-md-11 ">
								<div class="">
									<input numbers-only type="text" autocomplete="off"  name="code" id="" ng-model="unknownPatient.mlcContactNo" class="text-input floating-label" maxlength="10">
									<label for="code">Contact No.</label>
							</div>
						</div>
					</div>
					</div>
					</div>
					
					<div class="row margin-top10" ng-if="unknownPatient.isMedicoLegal == 'Y'">
					<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
						<div class="row input-container">
							 <div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
								<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
							</div>
							<div class="col-lg-11 col-sm-11 col-md-11 ">
								<div class="">
									<input type="text" autocomplete="off"  name="code" id="" ng-model="unknownPatient.policeStationName" class="text-input floating-label">
									<label for="code">Police Station Name<span class="star">*</span></label>
							</div>
						</div>
					</div>
					</div>
					
						<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 ">
						<div class="row input-container">
							 <div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
								<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
							</div>
							<div class="col-lg-11 col-sm-11 col-md-11 ">
								<div class="">
									<input type="text" autocomplete="off"  name="code" id="" ng-model="unknownPatient.policeBuckleNo" class="text-input floating-label">
									<label for="code">Police Buckle No.<span class="star">*</span></label>
							</div>
						</div>
					</div>
					</div>
					
					<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
						<div class="row input-container">
							<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
								<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
							</div> 
							<div class="col-lg-11 col-sm-11 col-md-11 ">
								<div class="">
									<input type="text" autocomplete="off"  name="code" id="" ng-model="unknownPatient.firNo" class="text-input floating-label">
									<label for="code">FIR No.</label>
							</div>
						</div>
					</div>
					</div>
					
				</div>
				
				<div class="row padding-top15" ng-if="unknownPatient.isMedicoLegal == 'Y'">
				<div class="col-lg-4 col-md-6 col-sm-6 padding-left-right-set4">
						<div class="row input-container">
							<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
								<i class="fa fa-sticky-note-o" aria-hidden="true"></i>
							</div>
							<div class="col-lg-11 col-sm-11 col-md-11 ">
								<div class="">
									<input type="text" autocomplete="off"  name="code" id=""  ng-model="unknownPatient.remark" class="text-input floating-label">
									<label for="code">Remark</label>
								</div>
							</div>
						</div>
					</div>
					</div>
					</fieldset>
			</form>
