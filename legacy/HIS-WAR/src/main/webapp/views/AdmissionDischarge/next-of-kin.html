<form ng-show="tab=='2'" name="" class="second-level-tab-display-div">

			<legend class="sub-legend" ng-if="kinsList.length > 0">Next of Kin List</legend>
			
				<div class="row" ng-if="kinsList.length > 0">
					<div class="col-md-12 col-lg-12 headerHeight">
						<table class="table table-bordered">
							<tr>
								<th class="width1">
									<span class=""></span>
								</th>
								<th class="width15">
									<span class="">Name</span>
								</th>
								<!-- <th class="width5">
									Gender
								</th> -->
								<th class="width15">
									Mobile No.
								</th>
								<th class="width15">
									Relationship
								</th>
								<th class="date-column">
									Action taken
								</th>
							</tr>
							<tr ng-repeat = "kin in kinsList">
								<td>
									<input  type="radio" ng-model="nextOfKinId" ng-change="setKinId(kin.kinDetailsId)" value="{{kin.kinDetailsId}}"  name="kins-of-patient">
								</td>
								<td>
									{{kin.kinName}}
								</td>
								<!-- <td>
									-
								</td> -->
								<td>
									{{kin.mobileNo}}
								</td>
								<td>
									{{kin.relationDesc}}
								</td>
								<td>
									<a href="" ng-click="getKinDetailsById(kin.kinDetailsId)" data-toggle="modal" ><i class="fa fa-pencil" aria-hidden="true"></i></a> <!-- data-target="#editKinDetalsModal" -->
									<a href="" class="margin-left10" ng-click="updateKinDetailsStatus(kin.kinDetailsId)"><i class="fa fa-times" aria-hidden="true"></i></a>
								</td>
							</tr>
						</table>
					</div>
				</div>
</fieldset>
