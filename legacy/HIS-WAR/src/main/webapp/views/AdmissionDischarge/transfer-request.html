<div id="reasonDetails" class="modal fade ng-scope in common-small-popup" role="dialog">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header" style="margin-left: -34px;background-size: 210px 72px !important;">
					<div class="modal-title patient-details-row" >
						IPD Rejection Details...!!<button type="button" class="close" data-dismiss="modal">&times;</button>
					</div>
				</div>
				<div class="modal-body">
					<div class="row">
						<div class="col-lg-12 col-sm-12 col-md-12 padding-left-right-set">
							<div class="row input-container margin-top10">
									<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon"> 
										<i class="fa fa-sticky-note-o" aria-hidden="true"></i>
									</div>
									<div class="col-lg-11 col-sm-11 col-md-11 ">
										<div class="">
											<textarea name="code" rows="1" class="text-input floating-label" ng-disabled="true" ng-model="ADTRejectReason"></textarea>		
											<label for="code">Reasons</label>
										</div>
									</div>
								</div>
							<div class="row input-container margin-top10">
								<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
									<i class="fa fa-sticky-note" aria-hidden="true"></i>
								</div>
								<div class="col-lg-11 col-sm-11 col-md-11 ">
									<div class="">
										<textarea name="code" rows="4" class="text-input floating-label" ng-disabled="true" ng-model="ADTRejectionNote"></textarea>
										<label for="code">Rejection Note</label>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
				<div class="modal-footer" style="border:none;">
					<!-- <button type="button" data-dismiss="modal" class="btn btn-primary width12" id="" ng-click="rejectRequestForICU()" value="Save">Save</button> -->
					<div class="row">
						<div class="col-lg-1 col-md-2 col-sm-2  col-md-2 col-sm-2 padding-left-right-set4 text-width-auto float-right">
							<button class="btn btn-primary btn-save-box-shadow  width100" title="Cancel" data-dismiss="modal"  >
							<i class="fa fa-times" aria-hidden="true"></i> </button>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
