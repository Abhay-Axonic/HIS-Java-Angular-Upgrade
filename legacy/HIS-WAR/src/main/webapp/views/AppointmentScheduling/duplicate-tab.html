<style>
    /* Custom CSS */
     .container {
       max-width: 900px;
       width: 100%;
       padding: 15px;
     }

     .rating-table {
       width: 100%;
       margin-bottom: 20px;
     }

     .rating-table th,
     .rating-table td {
       text-align: center;
       vertical-align: middle;
       padding: 10px;
     }

     .stars label {
       cursor: pointer;
       font-size: 30px;
       color: #ccc;
     }

     .stars input[type="radio"] {
       display: none;
     }

     .stars input[type="radio"]:checked ~ label::before {
       color: #f1c40f;
     }

     .trClass {
       height: 70px;
     }

     .tdAsc {
       text-align: left;
       font-weight: bold;
       font-size: 15px;
     }

     img {
       max-width: 100%;
       height: auto;
     }

     .btn {
       width: 100%;
       padding: 15px;
     }

     @media (max-width: 768px) {
       .container {
         padding: 10px;
       }

       .rating-table th,
       .rating-table td {
         font-size: 14px;
         padding: 5px;
       }

       .stars label {
         font-size: 20px;
       }

       h3 {
         font-size: 1.5rem;
       }

       .tdAsc {
         font-size: 14px;
       }

       .btn {
         padding: 15px;
       }
     }

      .stars {
         display: inline-block;
         font-size: 24px;
     }

     .stars input {
         display: none;
     }

     .stars label {
         float: right;
         cursor: pointer;
         color: #ccc;
     }

     .stars label:before {
         content: '\2605';
         margin: 5px;
     }

     .stars input:checked ~ label {
         color: #ffc107;
     }
</style>
