<div class="row">
<div class="col-lg-12 col-md-12 col-sm-12 padding-left-right-set4 fix-height-scroll500">
						<div class="row searched-patient-details-row margin-top bg-for-list" style="background-color: #e6e6e6">
							<div class="col-md-12 col-sm-12 col-xs-12 " style="background-color: #e6e6e6">
								<span class="profile_pic margin-left10" > 
									<img alt="" src="resources/assets/images/tempImages/m.jpg" class="img-circle" style="width:30px">
								</span> 
								<span class="margin-left10" style="color: #1D4D73;"><!-- Dr. Mark Potter -->{{doctorName}}</span>
								<span class="margin-left10" style="color: #1D4D73;"><b class="padding-right5 " ng-if="specialityName != null && selectType == 'doctor'">Specialty :</b><b class="padding-right5 " ng-if="specialityName != null && selectType == 'modality'">Modality :</b>{{specialityName}} <!-- Cardiology --></span>
								<fieldset class=" div-fieldset ">
										<legend class="heading-div">
											<span>Year </span>
										</legend>
										<div class="row">
										
										 <div class="col-lg-2 col-md-2 col-xs-4 col-sm-3 padding-left-right-set4 col-lg-2-year-tab" ng-repeat="info in yearSlotList">
										 	<div class="row div-time">
											 	<div class="col-lg-10 col-md-10 col-sm-10 padding-left-right-set0">
													<a href="#/appointmentSchedulingUnitMaster/month" ng-click="getMonthWiseSlot(info.fromDate,'Y')">
														<div class=""> 
															{{info.appointmentDate}}
														</div>
													</a>
												</div>
												<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set0">
													<a ng-click="deactivateSlotsFlag(info,'Y')"><i class="fa fa-ban margin-left5" title="Deactive {{info.appointmentDate.substring(0,3)}} slots" style="font-size: 18px;color: #f0793a;" ></i></a>
												</div>
											</div>
										</div>
								</div>
							</fieldset>
						</div>
					</div>
					
</div>
</div>
