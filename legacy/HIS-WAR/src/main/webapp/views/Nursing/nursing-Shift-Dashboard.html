<div id="page-content-wrapper">
	<div class="container-fluid his-style">
	<fieldset class="row padding-top10"><!-- main-fieldset -->
			<legend class="main-heading-div">Nursing Shift Dashboard</legend>
		</fieldset>
		
		 <div  class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon ">
							<i class="fa fa-clock-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11 ">
								<div class="">
								<input type="text" autocomplete="off" class="text-input floating-label dirty"
											name="fromDatepicker" id="fromDatepickerObj"
										    uib-datepicker-popup="dd/MM/yyyy" ui-mask="99/99/9999"
											placeholder="DD/MM/YYYY" ng-model="fromDate"
											model-view-value="true" is-open="fromDatepickerObj.opened"
											datepicker-options="dateOptions" show-button-bar="false"
											ng-click="openFromDatePickerObj()"  required>
									<label for="description" class=""> Date (From) <span class="star">*</span></label>
								</div>
							</div>
					</div>
				</div>
				
				<div   class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon ">
							<i class="fa fa-clock-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11 ">
								<div class="">
									<input type="text" autocomplete="off" class="text-input floating-label dirty"
											name="toDatepicker" id="toDatepickerObj"
										    uib-datepicker-popup="dd/MM/yyyy" ui-mask="99/99/9999"
											placeholder="DD/MM/YYYY" ng-model="toDate"
											model-view-value="true" is-open="toDatepickerObj.opened"
											datepicker-options="dateOptions" show-button-bar="false"
											ng-click="openToDatePickerObj()"  required>
											<label for="description" class=""> Date-Till <span class="star">*</span></label>
								</div>
							</div>
					</div>
				</div>
				
				<div  class="col-lg-2 col-sm-2 col-md-2 text-width-auto padding-top8">
		              <div class="common-save-button" style="padding-top:  0px;">
		                <a href="" class="btn btn-primary btn-save-box-shadow" id="show" name="show" style="width: auto;margin-top: 7px;" ng-click="showRoasterFun()" title="Show Roster">
		                  <!-- <i class="fa fa-plus" aria-hidden="true"></i> -->Show Roster
		                </a>
		              </div>
		        </div>
		        
	  <div class="row padding-left-right-set4 padding-top5">
			<div id="fixed-thead-tfoot-scroll" class="fixed-thead-tfoot-scroll fix-height-scroll530">
			  <table ng-if="showRoaster=='Y'" id="main-table" class="main-table" ng-class="dateDiffForShow>10 ? 'width200':dateDiffForShow<=9 ?'width100':'width150'">
			    <thead>
			      <tr>
			        <th class="fixed" scope="col "></th>
			        <th scope="col"ng-repeat="nurseshiftList in nurseShiftListFinal">{{nurseshiftList.shiftDate}}</th>

			      </tr>
			    </thead>
			    <tbody>
			      <tr ng-repeat="list in finalNurseList|orderBy:column:reverse|filter:searchKeyword">
			        <td class="fixed" scope="col"> Shift </td>
			        <td ng-if="list.nurseId==shiftobj.nurseId" ng-repeat="shiftobj in shiftListNurseFinal">{{shiftobj.shiftName}}</td>
			        
			      </tr>
			      <tr ng-repeat="list in finalNurseList">
			        <td class="fixed" scope="col"> OP </td>
			        <td ng-repeat="opObj in opNurseShiftList track by $index ">{{opObj.specialityName+"-"+opObj.doctorName+"-"+opObj.cabinDesc}}</td>
			      </tr>
			      <tr ng-repeat="list in finalNurseList">
			        <td class="fixed" scope="col"> IP </td>
			        <td ng-if="list.nurseId==bedObj.nurseId" ng-repeat="bedObj in shiftListNurseFinal">{{bedObj.bedName}}</td>
			      </tr>
			    </tbody>
			  </table>
			</div>
		</div>
	</div>
</div>	




<script src="resources/assets/js/common/page-height.js"></script>
<script type="text/javascript">

$(document).ready(function() {  
	// $(".patienttSearchResult").hide();
	//$(".icon-span").hide();
	 $(".selectedPageName").text("Nursing Shift Dashboard");
	$(".sidebar-nav li").each(function() {
		$(this).find("a").parents("li").removeClass("active");
	});
	$('a[href$="nursingShiftDashboard"]').parents("li").addClass("active");
});
</script>
