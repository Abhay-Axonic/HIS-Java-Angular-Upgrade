<!-- Page Content -->
<div id="page-content-wrapper" class="">
	<div class="container-fluid his-style">
        <fieldset class="main-fieldset">
         <form action="" name="shiftForm" novalidate="novalidate">
			<div class="row">
				<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon ">
							<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11 ">
								<div class="form-group" show-errors>
									<input type="text" autocomplete="off" name="shiftName" id="" class="text-input floating-label" ng-model="shiftMasterObj.shiftName" required="required">
									<label for="shiftName" class="">Shift Name<span class="star">*</span></label>
									<p class="help-block" ng-if="shiftForm.shiftName.$error.required">Shift name is required</p>
								</div>
							</div>
					</div>
				</div>
				<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon ">
							<i class="fa fa-clock-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11 ">
						             <div class="form-group" show-errors>
						                 <div class="clockpicker">
												<input type="text" autocomplete="off" name="fromTime" id="" ng-model="shiftMasterObj.fromTime" class="text-input floating-label" ng-init="initClockPicker()" required="required" readonly> 
												<label for="fromTime" class="">Time(From)<span class="star">*</span></label>
												<p class="help-block" ng-if="shiftForm.fromTime.$error.required">Time(From) is required</p>
											</div>
									</div>
							</div>
					</div>
				</div>
				<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon ">
							<i class="fa fa-clock-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11 ">
						        <div class="form-group" show-errors>
						                  <div class="clockpicker">
												<input type="text" autocomplete="off" name="toTime" id="" ng-model="shiftMasterObj.toTime" class="text-input floating-label" ng-init="initClockPicker()" required="required" readonly> 
												<label for="toTime" class="">Time(Till)<span class="star">*</span></label>
												<p class="help-block" ng-if="shiftForm.toTime.$error.required">Time(Till) is required</p>
											</div>
								</div>
							</div>
					</div>
				</div>
				
				 <div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top12" style="margin-top: 4px;">
					<div class="row input-container">
						<!-- <div class="col-lg-1 col-sm-1 col-md-1 polymer-icon ">
							<i class="fa fa-clock-o" aria-hidden="true"></i>
						</div> -->
						<div class="col-lg-11 col-sm-11 col-md-11 ">
												<label class="checkbox-inline" >
													<input type="checkbox" ng-model="shiftMasterObj.isWeeklyOff" ng-true-value="'Y'" ng-false-value="'N'" >
													<span></span>Is Weekly Off
												</label>
								
							</div>
					</div>
				</div> 
				
			</div>	
			</form>
			
				<div class="row padding-top8">
				
				<div class="col-md-6 col-sm-7 padding-left-right-set4">
				<div class="row">
					<div class="col-lg-6 col-md-6 col-sm-6" style="padding-left: 0px;">
						<div class="search">
						<label class="show-entries">Show 
						<select name="DataTables_Table_0_length" aria-controls="DataTables_Table_0"
							ng-init="noOfRecordsPerPage='10'" ng-model="noOfRecordsPerPage"
							ng-change="setNoOfRecords();" class="search-popUp-ddl">
								<option value="10">10</option>
								<option value="25">25</option>
								<option value="50">50</option>
								<option value="100">100</option>
						</select> entries
						</label>
					</div>
					</div>
				</div>
			</div>
			
			<div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
				<div class=" ">
				 <a href="" class="btn btn-primary btn-save-box-shadow" title="Save" data-toggle="modal" ng-click="save()"
										ng-if="saveBtnFlag"> <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
										
						<a href="" class="btn btn-primary btn-save-box-shadow" title="Update" data-toggle="modal" ng-click="update()"
										ng-if="updateBtnFlag"> <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
					<!-- <a href="" class="btn btn-primary btn-save-box-shadow" title="Save" data-toggle="modal" ng-click="save();"s data-target="">
					<i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a> -->
				</div>
			</div>
				<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set0 float_right">
					<input type="text" autocomplete="off" class="text-search-box dirty" placeholder="Search" style="margin-top: 0px"  ng-model="searchKeyword">
					<i class="fa fa-search common-search-text-icon" aria-hidden="true"></i>
				</div>
			</div>
			
			 <div class="row padding-left-right-set4 table-container padding-top10">
			<div class="table-container">
				<div class="table-container-header">
					<table
						class="table table-striped table-hover table-condensed table-bordered">
						<thead>
							<tr>
								<th class="width3">
									Shift Name
								</th>
								<th class="width3">
									Time(From)
								</th>
								<th class="width3">
									Time(Till)
								</th>
								<th class="width2 text-center">
									Status(n)
								</th>
								<th class="width2 text-center">
									Action taken
								</th>
							</tr>
						</thead>
					</table>
				</div> 
				<div class="table-container-body fix-height-scroll400" style="overflow: overlay;"> <!-- fix-height-scroll230, background: #fff; -->
					<table
						class="table table-striped table-hover table-condensed table-bordered">
						<tbody>
							<tr ng-repeat="info in shiftMasterList |orderBy:column:reverse|filter:searchKeyword">
								<td class="width3">{{info.shiftName}}</td>
								<td class="width3">{{info.fromTime}}</td>
								<td class="width3">{{info.toTime}}</td>
								<td class="width2 vertical-middle text-center">
											<label class="switch">
											<input type="checkbox" ng-model="info.status" ng-true-value="'A'" ng-false-value="'I'" ng-change="updateStatus(info.shiftId,info.status)">
											<div class="slider round"></div>
										   </label>
										</td>
								<td class="width2 text-center" title="Remove ">
								<i class="fa fa-pencil" style="color: #3131d2;" aria-hidden="true " ng-click="showUpdateBtn(info.shiftId);" title="Edit"></i>
								<!-- &nbsp
								<i class="fa fa-times" style="color: #3131d2;" aria-hidden="true " title="Remove"></i> -->
							</td>
							</tr>
						</tbody>
					</table>
					<div class="row margin-bottom45 sss">
					     <ul ng-if="pager.pages.length" class="pagination table-list"
						style="font-size: 14px;">
						<li ng-class="{disabled:pager.currentPage === 1}"><a
							ng-click="setPage(1,'true')">First</a></li>
						<li ng-class="{disabled:pager.currentPage === 1}"><a
							ng-click="setPage(pager.currentPage - 1,'true')">Previous</a></li>
						<li ng-repeat="page in pager.pages"
							ng-class="{active:pager.currentPage === page}"><a
							ng-click="setPage(page,'true')">{{page}}</a></li>
						<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
							<a ng-click="setPage(pager.currentPage + 1,'true')">Next</a>
						</li>
						<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
							<a ng-click="setPage(pager.totalPages,'true')">Last</a>
						</li>
					    </ul>
				   </div>
				</div>
			</div>
		</div> 
		</fieldset>
	</div>
</div>
<modal visible="showModal"></modal> 
<script type="text/javascript">
$( document ).ready(function() {
	$(".selectedServicesList").hide();
	$(".selectedPageName").text("Shift Master");
	$(".sidebar-nav li").each(function() {
	$(this).find("a").parents("li").removeClass("active");
	$('a[href$="shiftMaster"]').parents("li").addClass("active");
	
	
});
});
</script>
