<style>
    .card {
      box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
      transition: 0.3s;
      border-radius: 10px;
    }

    .card:hover {
      box-shadow: 0 8px 16px 0 rgba(0,0,0,0.2);
    }

    .container {
      padding: 2px 16px;
    }
    .card-body{
    margin-left:6px;
    }
    .labelName{
    color:#212325;
    }

</style>

<div id="page-content-wrapper">
    <div class="container-fluid his-style">
        <div class="padding-top4" ng-include="'./views/common/nutritional-patient-search.html'" style="margin-top:-5px"></div>
        <div class="padding-top8 padding-left-right-set4" ng-include="'./views/common/nabh-patient-demography-info.html'"></div>
        <fieldset>
            <!-- <legend class="heading-div">Department Master</legend> -->
            <div class="row margin-top10">
                <form name="UtiReporting" novalidate ng-submit="submitForm()">
                   <div class="row">
                       <div class="col-lg-6 col-sm-6 col-md-6 padding-left-right-set4 padding-top10" >
                           <div class="card">
                               <label class="labelName" style="padding:5px"><b>Risk factor</b></label><br>
                               <div class="row">
                                   <div class="col-lg-12 col-sm-12 col-md-12" style="margin-left: 15px">
                                       <input type="checkbox" name="patient-list-radio2" ng-click="prescribing($index)"><label class="labelName" style="padding: 5px">In Place - Urinary catheter on place > 2 days on te date of event or present for any portion of the calendar day
                                   </label><br>
                                       <input type="checkbox" name="patient-list-radio2" ng-click="prescribing($index)"><label class="labelName" style="padding: 5px">Neither - Nkt Catheter associated - Neither in place nor removed
                                   </label><br>
                                       <input type="checkbox" name="patient-list-radio2" ng-click="prescribing($index)"><label class="labelName" style="padding: 5px">Removed - Urinary catheter in place > 2 days and removed the day before the date of event
                                   </label><br>
                                   </div>
                               </div>
                               <div class="row">
                                   <div class="col-lg-6 col-sm-6 col-md-6">
                                       <input type="checkbox" name="patient-list-radio2" ng-click="prescribing($index)"><label class="labelName" style="padding: 5px">Location of Device Insertion
                                   </label><br>
                                       <input type="checkbox" name="patient-list-radio2" ng-click="prescribing($index)"><label class="labelName" style="padding: 5px"> Birth Weight in gms if NICU patient</label>
                                   </div>
                                   <div class="col-lg-6 col-sm-6 col-md-6">
                                       <input type="checkbox" name="patient-list-radio2" ng-click="prescribing($index)"><label class="labelName" style="padding: 5px">Patient admitted with Catheter
                                   </label><br>
                                       <input type="checkbox" name="patient-list-radio2" ng-click="prescribing($index)"><label class="labelName" style="padding: 5px">Done after admission
                                   </label>
                                   </div>
                               </div>
                           </div>

                               <div class="col-lg-6 col-sm-6 col-md-6" style="margin-top: 20px;">
                                   <label class="labelName"> Secondary Blood stream Infection </label>
                                   <input type="checkbox" name="patient-list-radio2" ng-click="prescribing($index)">
                                   Yes
                                   <input type="checkbox" name="patient-list-radio2" ng-click="prescribing($index)">
                                   No <br>
                                   <label class="labelName"> Died</label>
                                   <input type="checkbox" name="patient-list-radio2" ng-click="prescribing($index)">
                                   Yes
                                   <input type="checkbox" name="patient-list-radio2" ng-click="prescribing($index)">
                                   No<br>
                                   <label class="labelName"> UTI Contributed to Death</label>
                                   <input type="checkbox" name="patient-list-radio2" ng-click="prescribing($index)">
                                   Yes
                                   <input type="checkbox" name="patient-list-radio2" ng-click="prescribing($index)">
                                   No
                               </div>

                       </div>
                       <div class="col-lg-6 col-sm-6 col-md-6 padding-left-right-set4 padding-top10" >
                           <div class="card">
                               <label class="labelName" style="padding:5px"><b>Event Details</b></label><br>
                               <div class="row">
                                   <div class="col-lg-6 col-sm-6 col-md-6">
                                      <label class="labelName" style="padding: 5px">Signs and Symtoms</label><br>
                                       <input type="checkbox" name="patient-list-radio2" ng-click="prescribing($index)"><label class="labelName" style="padding: 5px">Symptomatic UTI (SUTI)
                                   </label><br>
                                       <div class="card" style="padding: 5px;background: beige;padding: 5px; width:100%">
                                           <div class="anyPatientCard">
                                               <label class="labelName" ><b>Any Patients</b></label><br>
                                               <input type="checkbox" name="patient-list-radio2" ng-click="prescribing($index)"><label class="labelName" style="padding: 5px">Fever
                                           </label>
                                               <input type="checkbox" name="patient-list-radio2" ng-click="prescribing($index)"><label class="labelName" style="padding: 5px">Urgency
                                           </label><br>
                                               <input type="checkbox" name="patient-list-radio2" ng-click="prescribing($index)"><label class="labelName" style="padding: 5px">Frequency
                                           </label>
                                               <input type="checkbox" name="patient-list-radio2" ng-click="prescribing($index)"><label class="labelName" style="padding: 5px">Suprapubic tenderness
                                           </label><br>
                                               <input type="checkbox" name="patient-list-radio2" ng-click="prescribing($index)"><label class="labelName" style="padding: 5px">Costovertebral angle pain or tenderness
                                           </label>
                                           </div>
                                       </div>
                                       <div class="card" style="padding: 5px;background: beige;padding: 5px; width:210%;margin-top: 10px">
                                               <label class="labelName" ><b>Laboratory & Diagnostic Testing</b></label><br>
                                               <input type="checkbox" name="patient-list-radio2" ng-click="prescribing($index)"><label class="labelName" style="padding: 5px">Positive culture with no more than 2 species of organisms, at least one of which is a bacterium of ≥ 105 CFU/ml
                                       </label>
                                       </div>
                                   </div>
                                   <div class="col-lg-6 col-sm-6 col-md-6">
                                       <input type="checkbox" name="patient-list-radio2" ng-click="prescribing($index)"><label class="labelName" style="padding: 5px">Asymptomatic UTI (ABUTI)
                                   </label><br>
                                       <div class="card" style="padding: 5px;background: beige;padding: 5px; width:100%">
                                           <label class="labelName" ><b><= 1 Year Old</b></label><br>
                                           <input type="checkbox" name="patient-list-radio2" ng-click="prescribing($index)"><label class="labelName" style="padding: 5px">Fever
                                       </label>
                                           <input type="checkbox" name="patient-list-radio2" ng-click="prescribing($index)"><label class="labelName" style="padding: 5px">Apnea
                                       </label><br>
                                           <input type="checkbox" name="patient-list-radio2" ng-click="prescribing($index)"><label class="labelName" style="padding: 5px">Hypothermia
                                       </label>
                                           <input type="checkbox" name="patient-list-radio2" ng-click="prescribing($index)"><label class="labelName" style="padding: 5px">Bradycardia
                                       </label><br>
                                           <input type="checkbox" name="patient-list-radio2" ng-click="prescribing($index)"><label class="labelName" style="padding: 5px">Lethargy
                                       </label>
                                           <input type="checkbox" name="patient-list-radio2" ng-click="prescribing($index)"><label class="labelName" style="padding: 5px">Vomiting
                                       </label><br>
                                           <input type="checkbox" name="patient-list-radio2" ng-click="prescribing($index)"><label class="labelName" style="padding: 5px">Suprapubic tenderness
                                       </label>
                                       </div>
                                   </div>
                               </div>
                           </div>
                       </div>

                       <div class="row" style="margin-top: 10px">

                           <div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
                               <a href="" class="btn btn-primary btn-save-box-shadow" title="Save" data-toggle="modal" >
                                   Disable</a>
                           </div>
                           <div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
                               <button type="submit" href="" ng-disabled="nutritionalAssessment.$invalid" class="btn btn-primary btn-save-box-shadow" title="Save" data-toggle="modal" >
                                   <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></button>
                           </div>
                           <div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
                               <a href="" class="btn btn-primary btn-save-box-shadow" title="Save" data-toggle="modal" >
                                   Draft</a>
                           </div>
                       </div>
                   </div>
                </form>
            </div>
        </fieldset>

    </div>
</div>
<script>
    var documentHeight = $(window).height();
    var sideBarHeight = documentHeight - 55;
    $("#page-content-wrapper").css("height", sideBarHeight + "px");
    $(".selectedPageName").text("Department Master");
    $(".sidebar-nav li").each(function() {
        $(this).find("a").parents("li").removeClass("active");
    });
    $('a[href$="specialityMaster"]').parents("li").addClass("active");
</script>
