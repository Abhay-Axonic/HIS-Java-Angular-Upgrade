<div id="page-content-wrapper">
	<div class="container-fluid his-style">
		<!-- <div ng-include="'./views/common/common-patient-search-opd-without-counter.html'" class="ng-scope" style=""></div> -->
		<div ng-include="'./views/common/patient-search-billing.html'" style="margin-top:-5px;"></div>
		<div ng-include="'./views/common/patient-demography.html'"></div>
		<div class="row">
			<div class="col-lg-2 col-md-2 col-sm-3 padding-left-right-set4 padding-top10">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-calendar" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11">
						<div class="">
							<input type="text" autocomplete="off" class="text-input floating-label dirty" name="" id="" uib-datepicker-popup="dd/MM/yyyy" ui-mask="99/99/9999" press-enter="searchCNMaster()"
										placeholder="DD/MM/YYYY" ng-model="fromDate" model-view-value="true" is-open="fromDatePicker.opened" datepicker-options="dateOptions" 
									   show-button-bar="false"	ng-click="openFromDate()" required>
							<label for="description" class="LISDynamicLabel">From Date</label>
						</div>
					</div>
				</div>
			</div>
			<div class="col-lg-2 col-md-2 col-sm-3 padding-left-right-set4 padding-top10">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-calendar" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11">
						<div class="">
							<input type="text" autocomplete="off" class="text-input floating-label dirty" name="" id="" uib-datepicker-popup="dd/MM/yyyy" ui-mask="99/99/9999" press-enter="searchCNMaster()"
														placeholder="DD/MM/YYYY" ng-model="toDate" model-view-value="true" is-open="toDatePicker.opened" datepicker-options="dateOptions" 
														show-button-bar="false"	ng-click="openToDate()" required> 
							<label for="description" class="LISDynamicLabel">To Date</label>
						</div>
					</div>
				</div>
			</div>
			<div class="col-lg-2 col-md-2 col-sm-3 padding-left-right-set4 padding-top10">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-clock-o" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11">
						<div class="input-group clockpicker">
							<input type="text" autocomplete="off" name="description" id="" class="text-input floating-label dirty"  type="text" autocomplete="off" ng-model="vitalSearchObj.fromTime" > 
							<label for="description" class="LISDynamicLabel">From Time</label>
						</div>
					</div>
				</div>
			</div>
			<div class="col-lg-2 col-md-2 col-sm-3 padding-left-right-set4 padding-top10">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-clock-o" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11">
						<div class="input-group clockpicker">
							<input type="text" autocomplete="off" name="description" id="" class="text-input floating-label dirty"  type="text" autocomplete="off" ng-model="vitalSearchObj.toTime"> 
							<label for="description" class="LISDynamicLabel">To Time</label>
						</div>
					</div>
				</div>
			</div>
			<div class="col-md-2 col-sm-2 padding-left-right-set4 float_right text-width-auto padding-top5">
		        <div class="">
		          <a ng-click="addVital();">
		            <input type="button" value="Add New" class="btn btn-primary btn-save-box-shadow">
		          </a>
		        </div>
		      </div>
		      <div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right padding-top5 text-width-auto">
					<div class="">
						<a href="" class="btn btn-primary btn-save-box-shadow" title="Search" 	ng-click="searchVitals();">
							<i class="fa fa-search" style="font-size:15px !important;" aria-hidden="true"></i>
						</a>	
					</div>
				</div>
			
		</div>
		<div class="row padding-left-right-set4 table-container padding-top8">
			<div class="table-container">
			<!-- 	<div class="table-container-header">
					<table class="table table-striped table-hover table-condensed table-bordered">
						
					</table>
				</div> -->
				<div class="table-container-body fix-height-scroll450" style="overflow: overlay;">
					<table class="table table-striped table-hover table-condensed table-bordered">
					     <thead>
					         <tr>
								 <th class="width15">Parameter</th>
								<th class="width15" ng-repeat="vitalsDtls in vitalDetailsList"><div>{{vitalsDtls.createdDate}}</div><div>{{vitalsDtls.vitalTime}}</div></th>
							</tr>
						 </thead>
						<tbody>
							<tr ng-repeat=" vitals in vitalList track by $index"  >
								<td class="width15">{{vitals.vitalName}} &nbsp;<span></span></td>
								<td  class="width7 text-center" ng-repeat="vitalsDtls in vitals.detailsList track by $index" >{{vitalsDtls.observation}}</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
		
	</div>
</div>

<script src="resources/assets/js/common/page-height.js"></script>
<script>
$(document).ready(function() { 
	$('.billing-counter-no').hide();
	$('.clockpicker').clockpicker();
	// $(".patienttSearchResult").hide();
	 $(".selectedPageName").text("Vitals");
	$(".sidebar-nav li").each(function() {
		$(this).find("a").parents("li").removeClass("active");
	});
	$('a[href$="vitals"]').parents("li").addClass("active");
});
</script>
