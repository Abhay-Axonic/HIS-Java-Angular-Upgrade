<!-- LAST POPUP -->
 <div id="lastDetails" class="common-large-popup modal fade ng-scope in" role="dialog" data-backdrop="static">
		<div class="modal-dialog"> 
			<div class="modal-content">
				<div class="modal-header">
					<div class="modal-title patient-details-row">
						Last Orders
						<button type="button" class="close" data-dismiss="modal">&times;</button>
					</div>
				</div>
				<div class="modal-body">
				<div class="row serachedPatientList padding-legt-right-10">
													<div class="col-md-12 col-lg-12">
														<table class="table table-bordered  margin-top5">
															<tr>
																<th class="width10">
																	<span class="">Visit Type</span>
																</th>
																<th class="width10">
																	 <span class="">Specialty</span>
																</th>
																<th class="width10">
																	 <span class="">Doctor</span>
																</th>
																<th class="width10">
																	<span class="">Date</span>
																</th>
																<th class="width1">
																</th>
																
															</tr>
															<tr ng-repeat="info in medicationEncounterList">
															<td>
																<div>{{info.visitTypeCode}}</div>
																<div ng-if="info.visitTypeCode==null">OP</div>
															</td>
															<td>
																{{info.specialityName}}
															</td>
															<td>
																{{info.doctorName}}
															</td>
															<td>
																{{info.visitDate}}<!-- 2 Times a day -->
															</td>
															<td>
																<a data-toggle="modal" data-target="#medicationHistoryDetails" ng-click="getMedicationListByEncounter(info)"><i class="fa fa-info-circle"></i></a>
															</td>
														</tr>
														 <tr ng-hide="medicationEncounterList.length > 0  || medicationEncounterList.length > 0">
														     <td class="text-center"	class="ng-binding" colspan="5">No last orders available</td>
													     </tr>
														
														</table>
													</div>
												</div>
