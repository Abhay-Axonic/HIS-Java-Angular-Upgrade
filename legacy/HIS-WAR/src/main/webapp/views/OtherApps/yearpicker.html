<body>


<div class="col-3">
<strong>Examples</strong>
<div class="form-group">

<input type="text" class="yearpicker form-control" name="toYearDatepicker" id="toYearDatepicker"
										           uib-datepicker-popup="yyyy"
											     	ng-model="info.toyear$index"
											        model-view-value="true" is-open="toYearDatepicker.opened" 
											        datepicker-options="dateOptionsToYear" show-button-bar="false" onkeydown="event.preventDefault()"
											        ng-click="openToYearDatePicker()" ng-change="validateYear()"  required
 style="width: 12% !important;border-bottom-color: black;border-right: none;border-left: none;border-top: none;
    "/>
</div>
</div>
<!-- border-right: none !important;
    border-left: none !important;
    border-top: none !important;
    -webkit-box-shadow: none !important; -->

<script>
$(document).ready(function () {
$(".yearpicker").yearpicker({
startYear: new Date().getFullYear() - 10,
endYear: new Date().getFullYear() + 10,
});



$("#example2").yearpicker({
year: new Date().getFullYear(),
startYear: new Date().getFullYear() - 10,
endYear: new Date().getFullYear() + 10,
onChange: function (value) {
$("#OutputContainer").html(value);
},
});
});
</script>
