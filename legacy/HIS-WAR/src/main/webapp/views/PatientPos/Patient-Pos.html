		[type="radio"]:checked,
		[type="radio"]:not(:checked) {
		    position: absolute;
		    left: -9999px;
		}
		[type="radio"]:checked + label,
		[type="radio"]:not(:checked) + label
		{
		    position: relative;
		    padding-left: 28px;
		    cursor: pointer;
		    line-height: 20px;
		    display: inline-block;
		    color: #666;
		}
		[type="radio"]:checked + label:before,
		[type="radio"]:not(:checked) + label:before {
		        content: '';
			    position: absolute;
			    left: 1px;
			    top: 1px;
			    width: 20px;
			    height: 20px;
			    border: 1px solid #ccc;
			    border-radius: 100%;
			    background: #fff;
		}
		[type="radio"]:checked + label:after,
		[type="radio"]:not(:checked) + label:after {
		    content: '';
		    width: 14px;
		    height: 14px;
		    background: #2e6ea2;
		    position: absolute;
		    top: 4px;
		    left: 4px;
		    border-radius: 100%;
		    -webkit-transition: all 0.2s ease;
		    transition: all 0.2s ease;
		}
		[type="radio"]:not(:checked) + label:after {
		    opacity: 0;
		    -webkit-transform: scale(0);
		    transform: scale(0);
		}
		[type="radio"]:checked + label:after {
		    opacity: 1;
		    -webkit-transform: scale(1);
		    transform: scale(1);
		}

<div id=""><!-- style="padding-right: 10px !important;" -->
  <div class="his-style">
    <div class="kiosk_bg" id=""></div>

<!--    <div ng-include="'./views/common/poc-footer.html'"></div>-->


    <div class="padding-left-right-10">

      <form novalidate id="patientRegistrationform">
        <fieldset class="normalRegistration margin-top10 padding-left-right-set4">
          <legend class="heading-div">Visitor Information </legend>
        </fieldset>
        <div class="row">
          <div class="col-lg-12 col-md-12 col-sm-12">
            <div class="row padding-top10">
              <div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
                <div >
                  <label for="sel1">Prefix<span class="star">*</span></label>
                  <select class="form-control dirty" convert-to-number name="prefixId" ng-model="prefix" ng-change="selectGender(prefix)"  ng-disabled="hideShowSearch" required >
                    <option value="">Select Prefix</option>
                    <option ng-repeat="info in prefixList" value="{{info.prefixId}}">{{info.prefixDesc}}</option>
                  </select>
<!--                  <p class="help-block" ng-if="patientRegistrationform.prefixId.$error.required">Prefix is required</p>-->
                </div>
              </div>
              <div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
                <div >
                  <label for="">First Name<span class="star">*</span> </label>
                  <input type="text" autocomplete="off"   only-letters-input class="form-control" name="firstName" ng-model="patientObj.firstName" ng-disabled="hideShowSearch" style="text-transform: capitalize">
<!--                  <p class="help-block" ng-if="patientRegistrationform.firstName.$error.required">First Name is required</p>-->
                </div>
              </div>
              <div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
                <div >
                  <label for="">Middle Name </label>
                  <input type="text" autocomplete="off"  only-letters-input class="form-control" id="" ng-model="patientObj.middleName" ng-disabled="hideShowSearch" style="text-transform: capitalize">
                </div>
              </div>
              <div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
                <div >
                  <label for="">Last Name</label>
                  <input type="text" autocomplete="off"  only-letters-input class="form-control" name="lastName"  ng-model="patientObj.lastName" ng-disabled="hideShowSearch" style="text-transform: capitalize">
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="row padding-left-right-set4">
          <div class="col-lg-3 col-md-3 col-sm-3">
            <div >
              <label for="sel1">Gender<span class="star">*</span></label>
              <select class="form-control dirty" convert-to-number id="sel1"  name="genderId" ng-model="gender" ng-disabled="hideShowSearch" >
                <option value="">Select Gender</option>
                <option ng-repeat="sex in genderList" value="{{sex.id}}">{{sex.desc}}</option>
              </select>
<!--              <p class="help-block" ng-if="patientRegistrationform.genderId.$error.required">Gender is required</p>-->
            </div>
          </div>

          <div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
            <div class="col-lg-4 col-md-4 col-sm-4 padding-left-right-set4">
              <div >
                <label for="">Code<span class="star">*</span></label>
                <input type="" class="form-control" name="countryCallingCode" id=""   ng-model="patientObj.countryCallingCode=91" ng-disabled="hideShowSearch" required>
<!--                <p class="help-block" ng-if="patientRegistrationform.countryCallingCode.$error.required">Code is required</p>-->
              </div>
            </div>
            <div class="col-lg-8 col-md-8 col-sm-8">
              <div >
                <label for="">Mobile No.<span class="star">*</span></label>
                <input type="" class="form-control" numbers-only type="text" autocomplete="off" name="mobileNo" id="mobileNo"  ng-model="patientObj.mobileNumber" ng-disabled="hideShowSearch" maxlength="10"> <!--   ng-pattern="ph_numbr"-->
<!--                <p class="help-block" ng-if="patientRegistrationform.mobileNo.$error.required">Number is required</p>-->
                <p class="help-block" ng-if="patientRegistrationform.mobileNo.$error.pattern">Please enter a 10 digit number</p>
              </div>
            </div>
          </div>
          <div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4" >
            <div >
              <label for="">Email Id.<span class="star">*</span></label>
              <input type="" class="form-control"  type="text" autocomplete="off" name="email" id="email"  ng-model="patientObj.email" ng-change = "checkEmail();" ng-disabled="hideShowSearch" >
            </div>
          </div>
          <div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4" >
            <div >
              <label for="">Reason For Visit <span class="star">*</span></label>
              <select class="form-control" name="reason"  id="reason"  ng-model="reason" convert-to-number ng-disabled="hideShowSearch">
                <option value="0">Select Reason</option>
                <option value="1">Radiology Investigation</option>
                <option value="2">Laboratory</option>
                <option value="3">OPD Visit</option>
                <option value="4">Inpatient Visit</option>
                <option value="5">Other</option>
<!--                <option ng-repeat="info in identificationList" value="{{info.identificationId}}">{{info.identificationName}}</option>-->
              </select>
              <p class="help-block" ng-if="patientRegistrationform.reason.$error.required">Reason is required</p>
            </div>
          </div>
        </div>
        <div class="row padding-top10">

          <div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4" ng-if="patientObj.reasonTypeId=='5'" >
            <div >
              <label for="">Remark</label>
              <input type="" class="form-control" type="text" autocomplete="off" name="identificationNumber" id="identificationNumber"  ng-model="patientObj.remark" ng-disabled="hideShowSearch"> <!--   ng-pattern="ph_numbr"-->
              <!-- <p class="help-block" ng-if="patientRegistrationform.mobileNo.$error.required">Number is required</p>
            <p class="help-block" ng-if="patientRegistrationform.mobileNo.$error.pattern">Please enter a 10 digit number</p> -->
            </div>
          </div>
          <div class="col-lg-1 col-md-1 col-sm-1 padding-left-right-set4">
            <!-- camera icon icon code put here -->
            <div >
                <button type="button" data-dismiss="modal" style="font-size: 15px !important;margin-top: 30px" class="btn btn-primary" id="" ng-click="patientPosSave()">Save</button>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
  <div ng-include="'./views/common/poc-footer.html'"></div>
</div>
