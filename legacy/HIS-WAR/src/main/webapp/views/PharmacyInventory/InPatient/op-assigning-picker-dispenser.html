            <div class="row margin-bottom45 center-block">
                <ul ng-if="vm.model.pagination.totalPages > 1" class="pagination table-list"
                    style="font-size: 14px; cursor: pointer;">
                    <li ng-class="{disabled:vm.model.pagination.currentPage === 1}"><a
                        ng-click="vm.model.pagination.setFirstPage(vm.model.pagination)">First</a>
                    </li>
                    <li ng-class="{disabled:vm.model.pagination.currentPage === 1}"><a
                        ng-click="vm.model.pagination.setPreviousPage(vm.model.pagination)">Previous</a>
                    </li>
                    <li ng-repeat="page in vm.model.pagination.getPagesList(vm.model.pagination)"
                        ng-class="{active:vm.model.pagination.currentPage === page}"><a
                        ng-click="vm.model.pagination.setPage(page, vm.model.pagination)">{{page}}</a>
                    </li>
                    <li ng-class="{disabled:vm.model.pagination.currentPage === vm.model.pagination.totalPages}">
                        <a ng-click="vm.model.pagination.setNextPage(vm.model.pagination)">Next</a>
                    </li>
                    <li ng-class="{disabled:vm.model.pagination.currentPage === vm.model.pagination.totalPages}">
                        <a ng-click="vm.model.pagination.setLastPage(vm.model.pagination)">Last</a>
                    </li>
                </ul>

<!-- confirm cancel -->
<div id="confirmCancel" class="modal fade ng-scope in common-small-popup" role="dialog" data-backdrop="static" style="background: rgba(0, 0, 0, 0.33); z-index: 1300 !important;">
    <div class="modal-dialog">
        <!-- width: 25% !important;margin: 200px 0 0 510px !important; -->
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title patient-details-row">
                    Prescription Cancellation
                    <button type="button" class="close" ng-click="vm.model.ModalDismiss('confirmCancel')">&times;</button>
                </div>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-12 padding-left-right-set">
                        <div class="row input-container margin-top10">
                            <div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
                                <i class="fa fa-sticky-note-o" aria-hidden="true"></i>
                            </div>
                            <div class="col-lg-11 col-sm-11 col-md-11 ">
                                <div>
                                    <select name="cancelReason" id="cancelReason" class="text-input floating-label" 
                                        ng-model="vm.model.cancelReason" ng-class="{dirty: vm.model.cancelReason}"
                                        ng-change="vm.model.isReasonValid = false">
                                        <option></option>
                                        <option ng-repeat="reason in vm.model.reasons" value="{{reason.id}}">{{reason.reason}}</option>
                                    </select>
                                    <label for="code">Select Reasons</label>
                                </div>
                                <p ng-if="vm.model.isReasonValid" class="errorMsg">Select Reason</p>
                            </div>
                        </div>
                        <div class="row input-container margin-top10">
                            <div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
                                <i class="fa fa-sticky-note" aria-hidden="true"></i>
                            </div>
                            <div class="col-lg-11 col-sm-11 col-md-11 ">
                                <div>
                                    <textarea name="rejectNote" rows="4" id="noteReject" class="text-input floating-label ng-pristine ng-untouched ng-valid ng-empty"
                                        ng-model="vm.model.rejectNote" ng-class="{dirty: vm.model.rejectNote}"></textarea>
                                    <label for="rejectNote">Note</label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer" style="border:none;">
                <div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
					<div class=" ">
						<a href="" class="btn btn-primary btn-save-box-shadow width100" title="Save" data-dismiss="modal">
						<i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a> 
					</div>
				</div>
            </div>
        </div>
    </div>
</div>
<!-- CONFIRM POPUP FOR SAVE END -->    
        
<script type="text/javascript">
    $(document).ready(function () {
        $(".selectedPageName").text("Pending List For Assigning Picker");/* Dispenser */
        $(".sidebar-nav li").each(function () {
            $(this).find("a").parents("li").removeClass("active");
        });
        $('a[href$="assigningPickerDispenser"]').parents("li").addClass("active");
    });
</script>
