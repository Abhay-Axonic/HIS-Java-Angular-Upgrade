<!-- Page Content -->
<div id="page-content-wrapper" class="">
	<div class="container-fluid his-style">
		<fieldset>
			<!-- Store  -->
			<div class="row margin-top10">
				<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-tasks" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<div class="">
								<select name="fromStore" id="fromStore" class="text-input floating-label dirty" ng-model="vm.model.fromStore" data-ng-options="fromStore.store for fromStore in vm.model.fromStores">
								</select>

								<label for="code">Store (Requester)</label>
							</div>
						</div>
					</div>
				</div>
				<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-tasks" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<div class="">
								<select name="toStore" id="toStore" class="text-input floating-label dirty" ng-model="vm.model.toStore" data-ng-options="toStore.store for toStore in vm.model.toStores">
								</select>
								<label for="code">Issuing Store</label>
							</div>
						</div>
					</div>
				</div>
				<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-bullseye" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<div class="">
								<input type="text" autocomplete="off" name="code" id="" class="text-input floating-label" ng-model="searchReturnNo"
								ng-change="vm.model.pagination.searchDataByField(vm.model.searchMaterialRejectData, vm.model.pagination,{ returnNo:searchReturnNo})">
								<label for="code">Return No.</label>
							</div>
						</div>
					</div>
				</div>
				<div class="col-lg-2 col-md-2 col-sm-1 padding-left-right-set4 padding-top10">
					<div class="row input-container">
						<div class="col-lg-2 col-sm-2 col-md-2 polymer-icon ">
							<i class="fa fa-dot-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-10 col-sm-10 col-md-10">
							<div class="">

								<select name="status" id="status" class="text-input floating-label dirty" ng-model="vm.model.status" data-ng-options="status.status for status in vm.model.statuses">
								</select>
								<label for="description" class="LISDynamicLabel">Status(n)</label>

							</div>
						</div>
					</div>
				</div>
				<div class="col-lg-1 col-md-1 col-sm-1 padding-left-right-set1">
					<div class="padding-top10">
						<a class="btn btn-primary btn-save-box-shadow width30" id="searchBtn" ng-click="vm.model.MaterialRejectAcceptanceData()">
							<i class="fa fa-search" aria-hidden="true"></i>
						</a>
					</div>
				</div>
				<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
						<div class="search">
							<label class="show-entries">Show 
							<select ng-init="vm.model.pagination.pageSize='10'" 
								ng-model="vm.model.pagination.pageSize" 
								ng-change="vm.model.pagination.setTotalPages(vm.model.pagination)" class="search-popUp-ddl">
									<option value="10">10</option>
									<option value="25">25</option>
									<option value="50">50</option>
									<option value="100">100</option>
							</select> (records) 
							</label>
						</div>
				</div>
			</div>
		</fieldset>
		<div class="row margin-top8">
			<div class="col-md-12 col-lg-12 col-sm-8 padding-left-right-set4" id="nonBillableTableHt">
				<fieldset>
					<div class="row">
						<div class="container-fluid his-style">
							<div class="table-container padding-left-right-set4 padding-top5">
								<div class="table-container-header">
									<table class="table table-striped table-hover table-condensed table-bordered">
										<thead class="mainServiceTableCommon">
											<tr>

												<th class="width4" title="Return No">Return No.
													<div class="float_right" ng-click="vm.model.pagination.sortBy(vm.model.pagination, 'returnNo', sortReverse = !sortReverse)">
														<div>
															<i class="fa fa-caret-up" aria-hidden="true"></i>
														</div>
														<div class="margin-top-8">
															<i class="fa fa-caret-down" aria-hidden="true"></i>
														</div>
													</div>
												</th>
												<th class="width5" title="Return Date">Return Date
													<div class="float_right" ng-click="vm.model.pagination.sortBy(vm.model.pagination, 'returnDate', sortReverse = !sortReverse)">
														<div>
															<i class="fa fa-caret-up" aria-hidden="true"></i>
														</div>
														<div class="margin-top-8">
															<i class="fa fa-caret-down" aria-hidden="true"></i>
														</div>
													</div>
												</th>
												<th class="width6" title="Store (Requester)">Store (Requester)
													<div class="float_right" ng-click="vm.model.pagination.sortBy(vm.model.pagination, 'fromStore', sortReverse = !sortReverse)">
														<div>
															<i class="fa fa-caret-up" aria-hidden="true"></i>
														</div>
														<div class="margin-top-8">
															<i class="fa fa-caret-down" aria-hidden="true"></i>
														</div>
													</div>
												</th>
												<th class="width6" title="Issuing Store">Issuing Store
													<div class="float_right" ng-click="vm.model.pagination.sortBy(vm.model.pagination, 'toStore', sortReverse = !sortReverse)">
														<div>
															<i class="fa fa-caret-up" aria-hidden="true"></i>
														</div>
														<div class="margin-top-8">
															<i class="fa fa-caret-down" aria-hidden="true"></i>
														</div>
													</div>
												</th>
												<th class="width8" title="Rejected By">Rejected By
													<div class="float_right" ng-click="vm.model.pagination.sortBy(vm.model.pagination, 'returnBy', sortReverse = !sortReverse)">
														<div>
															<i class="fa fa-caret-up" aria-hidden="true"></i>
														</div>
														<div class="margin-top-8">
															<i class="fa fa-caret-down" aria-hidden="true"></i>
														</div>
													</div>
												</th>
												<!-- comment to resolved HIS-9510 Hide Is consignment from store screens -->
												<!-- <th class="width6" title="Is Consignment">
													Is Consignment
													<div class="float_right" ng-click="vm.model.pagination.sortBy(vm.model.pagination, 'isConsignment', sortReverse = !sortReverse)">
														<div>
															<i class="fa fa-caret-up" aria-hidden="true"></i>
														</div>
														<div class="margin-top-8">
															<i class="fa fa-caret-down" aria-hidden="true"></i>
														</div>
													</div>
												</th> -->
												<th class="width6" title="Status(n)">
													Status(n)
													<div class="float_right" ng-click="vm.model.pagination.sortBy(vm.model.pagination, 'status', sortReverse = !sortReverse)">
														<div>
															<i class="fa fa-caret-up" aria-hidden="true"></i>
														</div>
														<div class="margin-top-8">
															<i class="fa fa-caret-down" aria-hidden="true"></i>
														</div>
													</div>
												</th>
												<th class="width5" title="Action taken">Action taken
											</tr>
										</thead>
									</table>
								</div>
								<div class="table-container-body" style="height:400px; overflow-y: scroll;">
									<table class="table table-striped table-hover table-condensed table-bordered">
										<tbody>
											<tr ng-repeat="item in vm.model.pagination.data">

												<td class="width4" title="{{item.returnNo}}">{{item.returnNo}}</td>
												<td class="width5" title="{{item.returnDate | date:'dd/MM/yyyy'}}">{{item.returnDate | date:'dd/MM/yyyy'}}</td>
												<td class="width6" title="{{item.toStore}}">{{item.toStore}}</td>
												<td class="width6" title="{{item.fromStore}}">{{item.fromStore}}</td>
												<td class="width8" title="{{item.returnBy}}">{{item.returnBy}}</td>
												<!-- comment to resolved HIS-9510 Hide Is consignment from store screens -->
												<!-- <td class="width6" align="center">
													<i class="fa fa-{{item.isConsignment == true ? 'check' : 'times'}}" title="{{item.isConsignment == true ? 'True' : 'False'}}"
													 style=" color: #337ab7;"></i>
												</td> -->
												<td class="width6" title="{{item.status}}">{{item.status}}</td>
												<td style="width: 4.8% !important;">
														<span>
															<a title="Print" ng-click="vm.model.printRejectedMaterialAcceptanceReport(item)">
																<i class="fa fa-print" aria-hidden="true"></i>
															</a>
														</span>
														<a href="#/detailsRejectedMaterialAcceptance"ng-click="vm.model.materialRejectAcceptanceDetails(item)">Details</a>
												</td>
											</tr>
											<tr ng-if="!vm.model.pagination.data || vm.model.pagination.data == false">
												<td class="text-center">
													<p>No Record Found</p>
												</td>
											</tr>
										</tbody>
									</table>
								</div>
							</div>
							<div class="row margin-bottom45 center-block">
									<ul ng-if="vm.model.pagination.totalPages > 1" class="pagination table-list"
									  style="font-size: 14px; cursor: pointer;">
									  <li ng-class="{disabled:vm.model.pagination.currentPage === 1}"><a
										ng-click="vm.model.pagination.setFirstPage(vm.model.pagination)">First</a>
									  </li>
									  <li ng-class="{disabled:vm.model.pagination.currentPage === 1}"><a
										ng-click="vm.model.pagination.setPreviousPage(vm.model.pagination)">Previous</a>
									  </li>
									  <li ng-repeat="page in vm.model.pagination.getPagesList(vm.model.pagination)"
										ng-class="{active:vm.model.pagination.currentPage === page}"><a
										ng-click="vm.model.pagination.setPage(page, vm.model.pagination)">{{page}}</a>
									  </li>
									  <li ng-class="{disabled:vm.model.pagination.currentPage === vm.model.pagination.totalPages}">
										<a ng-click="vm.model.pagination.setNextPage(vm.model.pagination)">Next</a>
									  </li>
									  <li ng-class="{disabled:vm.model.pagination.currentPage === vm.model.pagination.totalPages}">
										<a ng-click="vm.model.pagination.setLastPage(vm.model.pagination)">Last</a>
									  </li>
									</ul>
								  </div>
						</div>
					</div>
			</div>
			</fieldset>
		</div>
	</div>
</div>
</div>
<script type="text/javascript">
	$(".selectedPageName").text("Rejected Material Acceptance");
	$(".sidebar-nav li").each(function () {
		$(this).find("a").parents("li").removeClass("active");
	});
	$('a[href$="rejectedMaterialAcceptance"]').parents("li").addClass("active");
</script>
