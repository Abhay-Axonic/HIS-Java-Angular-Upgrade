<div id="page-content-wrapper">
	<div class="container-fluid his-style">
		<fieldset>
			<div class="row">
				<div class="col-lg-4 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<div class="">
								<input type="text" autocomplete="off" name="code" class="text-input floating-label" ng-change="vm.model.isclassificationCodeValid = false"
								 ng-class="{dirty: vm.model.code}" ng-model="vm.model.code" maxlength="10" />
								<p ng-if="vm.model.isclassificationCodeValid" class="errorMsg">Code is required</p>
								<label for="code">Pharmalogical Classification Code<span class="star">*</span></label>
							</div>
						</div>
					</div>
				</div>
				<div class="col-lg-4 col-md-4 col-sm-4 padding-left-right-set4 padding-top10">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon ">
							<i class="fa fa-sticky-note-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11 ">
							<div class="">
								<input type="text" autocomplete="off" name="classification" class="text-input floating-label" ng-change="vm.model.isclassificationValid = false"
								 ng-class="{dirty: vm.model.classification}" ng-model="vm.model.classification" maxlength="100"/>
								<p ng-if="vm.model.isclassificationValid" class="errorMsg">Pharmalogical Classification is required</p>
								<label for="description" class="LISDynamicLabel">Pharmacological Classification Name<span class="star">*</span></label>
							</div>
						</div>
					</div>
				</div>
				
				
				<div class="col-lg-1 col-md-1 col-sm-1 padding-left-right-set0 padding-top10">
                       
                    </div>
                    
                    
				<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set0 padding-top10">
                        <div class="row input-container padding-top12">
                            <div class="col-lg-11 col-sm-11 col-md-11">
                                    <label class="LISDynamicLabel checkbox-inline">
										<input type="checkbox" ng-model="vm.model.antibioticTest"  ng-true-value=true  ng-false-value=false>
										<span></span>Antibiotic test
									</label>
                            </div>            
                        </div>
                    </div>
				
				
			</div>
		</fieldset>
		<div class="row margin-top10">
			<div class="col-md-7">
				<div class="search">
					<label class="show-entries">Show 
					<select ng-init="vm.model.pagination.pageSize='10'" 
						ng-model="vm.model.pagination.pageSize" 
						ng-change="vm.model.setTotalPages(vm.model.pagination)" class="search-popUp-ddl">
							<option value="10">10</option>
							<option value="25">25</option>
							<option value="50">50</option>
							<option value="100">100</option>
					</select> (records) 
					</label>
				</div>
			</div>
			<div class="col-md-5 col-sm-5">
				<div class="col-lg-9 col-md-9 col-sm-9">
					<input type="text" autocomplete="off" class="text-search-box" ng-model="vm.model.pagination.search" ng-change="vm.model.searchPharmacological(vm.model.pharmalogicalClassificationList, vm.model.pagination)" placeholder="Search">
					<i class="fa fa-search common-search-text-icon padding-top8" aria-hidden="true"></i>
				</div>
				<div class="col-md-2 col-sm-3  padding-leftright15" style="margin-top: 5px;">
					<input type="button" value="Clear" class="btn btn-primary btn-save-box-shadow" ng-click="vm.model.ClearFields(); vm.model.clearSearch();" id="clearBtn">
				</div>
				<div class="col-md-1 col-sm-2 padding-leftright15 float_right">
					<div class="width-div-for-patient-reg padding-top4">
						<a href="" class="btn btn-primary btn-save-box-shadow" title="Save" data-toggle="modal" data-target="#confirmSave" type="submit"
						 ng-class="{disabled: !vm.model.code || !vm.model.classification}">
							<i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i>
						</a>
					</div>
				</div>
			</div>
		</div>
		<div class="row table-container padding-left-right-set4 padding-top5">
			<div class="col-md-12 col-lg-12 col-sm-8 table-container-header">
				<table class="table table-striped table-hover table-condensed table-bordered">
					<thead>
						<tr>
							<th class="width8" title="Code">
								Code
								<div class="float_right" ng-click="vm.model.pagination.sortBy(vm.model.pagination, 'code', sortReverse = !sortReverse)">
									<div>
										<i class="fa fa-caret-up" aria-hidden="true"></i>
									</div>
									<div class="margin-top-8">
										<i class="fa fa-caret-down" aria-hidden="true"></i>
									</div>
								</div>
							</th>
							<th class="width15" title="Pharmacological Classification">
								Pharmacological Classification
								<div class="float_right" ng-click="vm.model.pagination.sortBy(vm.model.pagination, 'classification', sortReverse = !sortReverse)">
									<div>
										<i class="fa fa-caret-up" aria-hidden="true"></i>
									</div>
									<div class="margin-top-8">
										<i class="fa fa-caret-down" aria-hidden="true"></i>
									</div>
								</div>
							</th>
							<th class="width4 text-center" title="Status">
								Status(n)
							</th>
							<th class="width4 text-center" title="Action">
								Action taken
							</th>
						</tr>
					</thead>
				</table>
			</div>
			<div class="table-container-body" style="height: 440px; overflow-y: scroll;">
				<table class="table table-striped table-hover table-condensed table-bordered">
					<tbody>
						<tbody>
							<tr ng-repeat="pharmaclassification in vm.model.pagination.data | filter : vm.model.search | orderBy:sortType:sortReverse">
								<td class="width8" title="{{pharmaclassification.code}}">{{pharmaclassification.code}}</td>
								<td class="width15" title="{{pharmaclassification.classification}}">{{pharmaclassification.classification}}</td>
								<td class="width4 text-center">
									<label class="switch switch-small" title="{{pharmaclassification.status == true ? 'Active' : 'Inactive'}}">
										<input type="checkbox" class="switchInput" ng-model="pharmaclassification.status" ng-change="vm.model.ToggleStatus(pharmaclassification)"
										 data-target="#confirmSave">
										<div class="slider round slider-small"></div>
									</label>
								</td>
								<td class="padding-edit-button-table text-center" style="width:3.88% !important">
									<a ng-click="vm.model.PopulatePharmalogicalClassification(pharmaclassification.id);" ng-class="{disabled: !pharmaclassification.status}">
										<i class="fa fa-pencil" aria-hidden="true" title="Edit"></i>
									</a>
								</td>
							</tr>
							<tr ng-if="!vm.model.pagination.data || vm.model.pagination.data == false">
								<td colspan="4" class="text-center">
								  <p>No Record Found</p>
								</td>
							  </tr>
						</tbody>
				</table>
			</div>
		</div>
		<div class="row margin-bottom45 center-block">
			<ul ng-if="vm.model.pagination.totalPages > 1" class="pagination table-list"
				style="font-size: 14px; cursor: pointer;">
				<li ng-class="{disabled:vm.model.pagination.currentPage === 1}"><a
					ng-click="vm.model.pagination.setFirstPage(vm.model.pagination)">First</a>
				</li>
				<li ng-class="{disabled:vm.model.pagination.currentPage === 1}"><a
					ng-click="vm.model.pagination.setPreviousPage(vm.model.pagination)">Previous</a>
				</li>
				<li ng-repeat="page in vm.model.pagination.getPagesList(vm.model.pagination)"
					ng-class="{active:vm.model.pagination.currentPage === page}"><a
					ng-click="vm.model.pagination.setPage(page, vm.model.pagination)">{{page}}</a>
				</li>
				<li ng-class="{disabled:vm.model.pagination.currentPage === vm.model.pagination.totalPages}">
					<a ng-click="vm.model.pagination.setNextPage(vm.model.pagination)">Next</a>
				</li>
				<li ng-class="{disabled:vm.model.pagination.currentPage === vm.model.pagination.totalPages}">
					<a ng-click="vm.model.pagination.setLastPage(vm.model.pagination)">Last</a>
				</li>
			</ul>
		</div>
	</div>
</div>

<!--  confirmSave modal start -->

<div id="confirmSave" class="modal fade ng-scope in" role="dialog">
	<div class="modal-dialog" style="width: 560px !important; margin: 80px auto !important;">
		<div class="modal-content" style="border-radius: 0px !important;">
			<div class="modal-header" style="padding: 0px!important;">
				<div class="modal-title patient-details-row">
					Confirm
					<button type="button" class="close" data-dismiss="modal">&times;</button>
				</div>
			</div>
			<div class="modal-body">
				<div class="margin-left10">
					<span>Are you sure you want to Save?</span>
				</div>
			</div>
			<div class="modal-footer" style="border:none;">
				<button type="button" ng-click="vm.model.SavePharmalogicalClassification()" data-dismiss="modal" class="btn btn-primary">Ok</button>
				<button type="button" data-dismiss="modal" class="btn btn-primary">Cancel</button>
			</div>
		</div>
	</div>
</div>

<!--  confirmSave modal end -->

<script type="text/javascript">
	$(document).ready(function () {

		$(".selectedPageName").text("Pharmacological Classification Master");
		$(".sidebar-nav li").each(function () {
			$(this).find("a").parents("li").removeClass("active");
		});
		$('a[href$="pharmacologicalClassificationMaster"]').parents("li").addClass("active");
	}); 
</script>
