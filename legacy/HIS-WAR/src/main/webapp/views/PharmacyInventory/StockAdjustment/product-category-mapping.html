<style>
	.hideDropdown {
		display: none;
	}
	.borderRed {
				border: 2px solid red;
			}
</style>
<fieldset class="margin-top4 padding-left-right-set4">
	<div class="row margin-top4" style="margin-top: 12px;">
		<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
			<div class="row input-container">
				<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon ">
					<i class="fa fa-building-o" aria-hidden="true"></i>
				</div>
				<div class="col-lg-11 col-sm-11 col-md-11 ">
					<div class="">
						<select name="store" id="store" class="text-input floating-label dirty" data-ng-options="store.store for store in vm.model.Stores"
						 ng-model="vm.model.store"  ng-focus="vm.model.SetOldValueStore(vm.model.store)" 
						 ng-change="vm.model.isStoreValid = false; vm.model.ChangeFromStore(vm.model.store)">
						</select>
						<label for="description" class="LISDynamicLabel">Store</label>
					</div>
				</div>
			</div>
		</div>
		<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
			<div class="row input-container">
				<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
					<i class="fa fa-search" aria-hidden="true"></i>
				</div>
				<div class="col-lg-11 col-sm-11 col-md-11">
					<div class="">
						<input type="text" autocomplete="off" name="search" id="search" ng-model="vm.model.pagination.search" 
						ng-change="vm.model.pagination.searchData(vm.model.categoryMappingList, vm.model.pagination)" class="text-input floating-label">
						<label for="code">Search Category</label>
					</div>
				</div>
			</div>
		</div>
		<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10 float_right">
			<div class="search">
				<label class="show-entries">Show 
				<select ng-init="vm.model.pagination.pageSize='10'" 
					ng-model="vm.model.pagination.pageSize" 
					ng-change="vm.model.pagination.setTotalPages(vm.model.pagination)" class="search-popUp-ddl">
						<option value="10">10</option>
						<option value="25">25</option>
						<option value="50">50</option>
						<option value="100">100</option>
				</select> records 
				</label>
			</div>
		</div>
	</div>
	<div class="row table-container padding-left-right-set4 padding-top5">
		<div class="col-md-12 col-lg-12 col-sm-8 table-container-header">
			<table class="table table-striped table-hover table-condensed table-bordered">
				<thead>
					<tr>
						<th class="width10" title="Asset Type">
							Asset Type
							<div class="float_right" ng-click="vm.model.pagination.sortBy(vm.model.pagination, 'assetType', sortReverse = !sortReverse)">
								<div>
									<i class="fa fa-caret-up" aria-hidden="true"></i>
								</div>
								<div class="margin-top-8">
									<i class="fa fa-caret-down" aria-hidden="true"></i>
								</div>
							</div>
						</th>
						<th class="width10" title="Asset Category">
							Asset Category
							<div class="float_right" ng-click="vm.model.pagination.sortBy(vm.model.pagination, 'assetCategory', sortReverse = !sortReverse)">
								<div>
									<i class="fa fa-caret-up" aria-hidden="true"></i>
								</div>
								<div class="margin-top-8">
									<i class="fa fa-caret-down" aria-hidden="true"></i>
								</div>
							</div>
						</th>
						<th class="width10" title="Product Category">
							Product Category
							<div class="float_right" ng-click="vm.model.pagination.sortBy(vm.model.pagination, 'productCategory', sortReverse = !sortReverse)">
								<div>
									<i class="fa fa-caret-up" aria-hidden="true"></i>
								</div>
								<div class="margin-top-8">
									<i class="fa fa-caret-down" aria-hidden="true"></i>
								</div>
							</div>
						</th>
						<th class="width3" title="Status">
							Status(n)
						</th>
					</tr>
				</thead>
				</table>
				</div>
				<div class="table-container-body" style="height: 430px; overflow-y: scroll;">
					<table class="table table-striped table-hover table-condensed table-bordered">
						<tbody>
					<tr ng-repeat="categoryMapping in vm.model.pagination.data | filter : search">
						<td class="width10" title="{{categoryMapping.assetType}}">{{categoryMapping.assetType}}</td>
						<td class="width10" title="{{categoryMapping.assetCategory}}">{{categoryMapping.assetCategory}}</td>
						<td class="width10" title="{{categoryMapping.productCategory}}">{{categoryMapping.productCategory}}</td>
						<td style="width:2.90% !important">
							<!-- <i class="fa {{categoryMapping.status == true ?  'fa-check' : 'fa-times'}}" style="color: #3131d2;"></i> -->
							<label class="switch switch-small" title="{{categoryMapping.status == true ? 'Active' : 'Inactive'}}">
								<input type="checkbox" class="switchInput" ng-model="categoryMapping.status" ng-change="vm.model.ToggleStatus(categoryMapping)">
								<div class="slider round slider-small"></div>
							</label>
						</td>
					</tr>
					<tr ng-if="!vm.model.pagination.data ||vm.model.pagination.data == false">
						<td colspan="4" class="text-center">
						  <p>No Record Found</p>
						</td>
					  </tr>
				</tbody>
			</table>
		</div>
	</div>
	<div class="row margin-bottom45 center-block">
		<ul ng-if="vm.model.pagination.totalPages > 1" class="pagination table-list"
			style="font-size: 14px; cursor: pointer;">
			<li ng-class="{disabled:vm.model.pagination.currentPage === 1}"><a
				ng-click="vm.model.pagination.setFirstPage(vm.model.pagination)">First</a>
			</li>
			<li ng-class="{disabled:vm.model.pagination.currentPage === 1}"><a
				ng-click="vm.model.pagination.setPreviousPage(vm.model.pagination)">Previous</a>
			</li>
			<li ng-repeat="page in vm.model.pagination.getPagesList(vm.model.pagination)"
				ng-class="{active:vm.model.pagination.currentPage === page}"><a
				ng-click="vm.model.pagination.setPage(page, vm.model.pagination)">{{page}}</a>
			</li>
			<li ng-class="{disabled:vm.model.pagination.currentPage === vm.model.pagination.totalPages}">
				<a ng-click="vm.model.pagination.setNextPage(vm.model.pagination)">Next</a>
			</li>
			<li ng-class="{disabled:vm.model.pagination.currentPage === vm.model.pagination.totalPages}">
				<a ng-click="vm.model.pagination.setLastPage(vm.model.pagination)">Last</a>
			</li>
		</ul>
	</div>
</fieldset>


	<!-- change store -->
	<div id="confirmStore" class="modal fade ng-scope in" role="dialog">
		<div class="modal-dialog" style="width: 560px !important; margin: 80px auto !important;">
		  <div class="modal-content">
			<div class="modal-header" style="padding: 0px!important;">
			  <div class="modal-title patient-details-row">
				Confirm
				<button type="button" class="close" data-dismiss="modal">&times;</button>
			  </div>
			</div>
			<div class="modal-body">
			  <div class="margin-left10"><span>Are you sure you want to change store?</span></div>
			</div>
			<div class="modal-footer" style="border:none;">
			  <button type="button" class="btn btn-primary" ng-click="vm.model.ConfirmStorePopup(vm.model.store)" style="width: 100px !important;">Ok</button>
			  <button type="button" data-dismiss="modal" class="btn btn-primary" style="width: 100px !important;">Cancel</button>
			</div>
		  </div>
		</div>
	  </div>

<script>
	$(".addsavebtn").hide();
</script>
<script type="text/javascript">
	$(document).ready(function () {
		var documentHeight = $(window).height();
		var sideBarHeight = documentHeight - 55;
		$("#page-content-wrapper").css("height", sideBarHeight + "px");
	});
	$(".selectedPageName").text("Product Restriction");
	$(".sidebar-nav li").each(function () {
		$(this).find("a").parents("li").removeClass("active");
	});
	$('a[href$="productCategroryMapping"]').parents("li").addClass("active");

	$("#chkCheckbox").click(function () {
		if ($(this).is(":checked")) {
			$(".hideDropdown").show();
		} else {
			$(".hideDropdown").hide();
		}
	});
</script>
