<!-- *****************************************************************************************************************************
								                    Expired Return Acceptance
****************************************************************************************************************************** -->
<!-- Page Content start-->
<div id="page-content-wrapper" class=" ">
	<div class="container-fluid his-style">
		<div class="row">
			<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-2 col-md-1 polymer-icon">
						<i class="fa fa-calendar" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-10">
						<div class="">
							<input type="text" autocomplete="off" class="text-input floating-label dirty" name="fromDate" id="fromDate" uib-datepicker-popup="dd/MM/yyyy"
							 placeholder="DD/MM/YYYY" ng-model="vm.model.fromDate" model-view-value="true" is-open="vm.model.fromDateOpened" datepicker-options="vm.model.fromDateOptions"
							 show-button-bar="false" ng-click="vm.model.OpenFromDate()">
							<label for="code">Date (From)</label>
						</div>
					</div>
				</div>
			</div>
			<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-2 col-md-1 polymer-icon">
						<i class="fa fa-calendar" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-10">
						<div class="">
							<input type="text" autocomplete="off" class="text-input floating-label dirty" name="toDate" id="toDate" uib-datepicker-popup="dd/MM/yyyy" placeholder="DD/MM/YYYY"
							 ng-model="vm.model.toDate" model-view-value="true" is-open="vm.model.toDateOpened" datepicker-options="vm.model.toDateOptions"
							 show-button-bar="false" ng-click="vm.model.OpenToDate()">
							<label for="code">Date-Till</label>
						</div>
					</div>
				</div>
			</div>
			<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-building-o" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11">
						<div class="">
							<select name="store" id="store" class="text-input floating-label dirty" ng-model="vm.model.store" data-ng-options="store.store for store in vm.model.stores">
							</select>
							<label for="code">Store</label>
						</div>
					</div>
				</div>
			</div>
			<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11">
						<div class="">
							<select name="status" id="status" class="text-input floating-label dirty" ng-model="vm.model.status" data-ng-options="status.status for status in vm.model.statuses">
							</select>
							<label for="code">Status(n)</label>
						</div>
					</div>
				</div>
			</div>
			<div class="col-lg-2 col-sm-2 col-md-2 text-width-auto padding-top10 padding-left-right-set4">
				<div class="common-save-button" style="padding-top:  0px;">
					<a href="" class="btn btn-primary btn-save-box-shadow" id="searchBtn" ng-click="vm.model.searchStockAdjustmentApproval(this);" style="width: auto;">
						<i class="fa fa-search" aria-hidden="true"></i>
					</a>
				</div>
			</div>
		</div>
		<div class="row">
			<!-- <div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
				<div class=" ">
					<a href="" class="btn btn-primary btn-save-box-shadow" ng-class="{disabled: !vm.model.isItemChecked }" 
					title="Save" ng-click="vm.model.ValidateAndUpdate('Update','confirmLogout1', {})">
						<i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i>
					</a>
				</div>
			</div> -->
			<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set0 float_right">
				<input type="text" autocomplete="off" class="text-search-box dirty" ng-model="search" placeholder="Search" 
				style="margin-top: 0px">
				<i class="fa fa-search common-search-text-icon" aria-hidden="true"></i>
			</div>
		</div>
		<div class="row padding-left-right-set4 fix-height-scroll550 margin-top5">
			<div class="container-fluid his-style">
				<div class="table-container padding-left-right-set4 padding-top5">
					<div class="table-container-header">
						<table class="table table-striped table-hover table-condensed table-bordered">
							<thead class="mainServiceTableCommon">
								<tr class="">
									<th class="width1 text-center">
										<input type="checkbox" ng-click="vm.model.SelectAllRequests()" ng-model="vm.model.selectAllRows" ng-disabled="vm.model.confirmStockData == false"/>
									</th>
									<th class="width8">Stock Adj No.</th>
									<th class="width8">Stock Adj Date</th>
									<th class="width8">Store</th>
									<th class="width8">Uploaded By</th>
									<th class="width6 text-center">Status(n)</th>
									<th class="width8 text-center">Action taken</th>
								</tr>
							</thead>
						</table>
					</div>
					<div class="table-container-body" style="height:400px; overflow-y: scroll;">
						<table class="table table-striped table-hover table-condensed table-bordered">
							<tbody>
								<tr ng-repeat="stock in vm.model.stockAdjustmentApprovalData | orderBy:sortType:sortReverse | filter:search">
									<td class=" text-center width1">
										<input type="checkbox" ng-model="stock.isSelected" ng-click="vm.model.SelectUploadStock(stock)" ng-disabled="vm.model.isDisable(stock)"
										/>
									</td>
									<td class="width8">{{stock.uploadNo}}</td>
									<td class="width8">{{stock.uploadDate | date:'dd/MM/yyyy'}}</td>
									<td class="width8">{{stock.store}}</td>
									<td class="width8">{{stock.uploadedBy}}</td>
									<td class="width6">{{stock.status}}</td>
									<td class="width8 text-center" style="width: 8.3% !important;">
										<span>
											<a title="Cancel">
												<i class="fa fa-ban" aria-hidden="true" ng-class="{disabled: vm.model.isDisable(stock)}" ng-click="vm.model.ValidateAndUpdate('Cancel','confirmCancel', stock.id)"></i>
											</a>
										</span>&nbsp;
										<span>
											<a title="Print" ng-click="vm.model.printUploadStockApprovalReport(stock)">
												<i class="fa fa-print"></i>
											</a>
										</span>&nbsp;
										<span>
											<a href="" ng-click="vm.model.StockApprovalDetails(stock)" title="Details" class="cursor-pointer">Details</a>
										</span>
									</td>
								</tr>
								<tr ng-if="!vm.model.stockAdjustmentApprovalData || vm.model.stockAdjustmentApprovalData == false">
									<td colspan="9" class="text-center">
										<p>No Record Found</p>
									</td>
								</tr>
						</table>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
<!-- Page Content start-->

<div id="confirmCancel" class="modal fade ng-scope in common-small-popup" role="dialog" style="background: rgba(0, 0, 0, 0.33); z-index: 1300 !important;">
	<div class="modal-dialog">
		<!-- width: 25% !important;margin: 200px 0 0 510px !important; -->
		<div class="modal-content">
			<div class="modal-header">
				<div class="modal-title patient-details-row">
					Cancellation
					<button type="button" class="close" data-dismiss="modal" ng-click="vm.model.ModalDismiss('confirmCancel')">&times;</button>
				</div>
			</div>
			<div class="modal-body">
				<div class="row">
					<div class="col-md-12 padding-left-right-set">
						<div class="row input-container margin-top10">
							<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
								<i class="fa fa-sticky-note-o" aria-hidden="true"></i>
							</div>
							<div class="col-lg-11 col-sm-11 col-md-11 ">
								<div class="">
									<select name="cancelReason" id="cancelReason" class="text-input floating-label" ng-model="vm.model.cancelReason" ng-class="{dirty: vm.model.cancelReason}"
									 ng-change="vm.model.isReasonValid = false">
										<!-- ng-options="cancelReason.reason for cancelReason in vm.model.reasons" -->
										<option value="">Select Reason</option>
										<option ng-repeat="reason in vm.model.reasons" value="{{reason.id}}">{{reason.reason}}</option>
									</select>
									<label for="code">Select Reasons</label>
								</div>
								<p ng-if="vm.model.isReasonValid" class="errorMsg">Select Reason</p>
							</div>
						</div>
						<div class="row input-container margin-top10">
							<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
								<i class="fa fa-sticky-note" aria-hidden="true"></i>
							</div>
							<div class="col-lg-11 col-sm-11 col-md-11 ">
								<div class="">
									<textarea name="cancelNote" rows="4" id="cancelNote" class="text-input floating-label ng-pristine ng-untouched ng-valid ng-empty"
									 ng-model="vm.model.cancelNote" ng-class="{dirty: vm.model.cancelNote}"></textarea>
									<label for="cancelNote">Note</label>
								</div>
							</div>
						</div>
						<!-- <input type="text" autocomplete="off" id="commonId" /> -->
					</div>
				</div>
			</div>
			<div class="modal-footer" style="border:none;">
				<button type="button" ng-disabled="cancelNote == ''" class="btn btn-primary" ng-click="vm.model.ApproveStockAdjustment();">Save</button>
			</div>
		</div>
	</div>
</div>

<div id="confirmLogout1" class="modal fade ng-scope in" role="dialog" style="padding-left: 17px;">
	<div class="modal-dialog" style="width: 560px !important; margin: 80px auto !important;">
		<!-- style="width: 25% !important;margin: 200px 0 0 510px !important;" -->
		<div class="modal-content">
			<div class="modal-header" style="padding: 0px!important;">
				<div class="modal-title patient-details-row">
					Confirm
					<button type="button" class="close" data-dismiss="modal">&times;</button>
				</div>
			</div>
			<div class="modal-body">
				<div class="margin-left10">
					<span>Are you sure you want to Save?</span>
				</div>
			</div>
			<div class="modal-footer" style="border:none;">
				<button type="button" data-dismiss="modal" class="btn btn-primary" id="" ng-click="vm.model.ApproveStockAdjustment();">Ok</button>
				<button type="button" data-dismiss="modal" class="btn btn-primary">Cancel</button>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
	$(document).ready(function () {
		$(".selectedPageName").text("Confirm Stock");
		$(".sidebar-nav li").each(function () {
			$(this).find("a").parents("li").removeClass("active");
		});
		$('a[href$="confirmStock"]').parents("li").addClass("active");

		$(".rejection-details-row").hide();
		$(".radioRejected").change(function () {
			if ($(this).is(":checked")) {
				$(this).closest(".row").siblings(".rejection-details-row").show();
			}
		});
		$(".radioAccepted").change(function () {
			if ($(this).is(":checked")) {
				$(this).closest(".row").siblings(".rejection-details-row").hide();
			}
		});

	});
</script>

<script src="resources/assets/js/common/page-height.js"></script>
