<div id="page-content-wrapper">
	<div class="container-fluid his-style">
		<fieldset>
			<!-- <legend class="heading-div">Unit Master</legend> -->
			<div class="row">
				<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-2 col-md-2 polymer-icon">
							<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11 ">
							<div class="">
								<input type="text" autocomplete="off" name="code" class="text-input floating-label form-control" ng-change="vm.model.isunitCodeValid = false"
								 ng-class="{dirty: vm.model.code}" ng-model="vm.model.code" maxlength="10" />
								<p ng-if="vm.model.isunitCodeValid" class="errorMsg">Strength Clinical Unit Code is required</p>
								<label for="code">Strength Clinical Unit Code<span class="star">*</span></label>
							</div>
						</div>
					</div>
				</div>
				<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-2 col-md-2 polymer-icon">
							<i class="fa fa-sticky-note-o" aria-hidden="true"></i>
						</div>

						<div class="col-lg-11 col-sm-11 col-md-11">
							<div class="">
								<input type="text" autocomplete="off" name="code" id="" class="text-input floating-label form-control" ng-change="vm.model.isunitDescriptionValid = false"
								 ng-class="{dirty: vm.model.units}" ng-model="vm.model.units" maxlength="100">
								<p ng-if="vm.model.isunitDescriptionValid" class="errorMsg">Strength Clinical Unit Description is required</p>
								<label for="code">Strength Clinical Unit Description<span class="star">*</span></label>
							</div>
						</div>
					</div>
				</div>
			</div>
		</fieldset>
		<div class="row margin-top10">
				<div class="col-md-7">
						<div class="search">
								<label class="show-entries">Show 
								<select ng-init="vm.model.pagination.pageSize='10'" 
									ng-model="vm.model.pagination.pageSize" 
									ng-change="vm.model.setTotalPages(vm.model.pagination)" class="search-popUp-ddl">
										<option value="10">10</option>
										<option value="25">25</option>
										<option value="50">50</option>
										<option value="100">100</option>
								</select> (records) 
								</label>
							</div>
				</div>
				<div class="col-md-5 col-sm-5">
					<div class="col-lg-9 col-md-9 col-sm-9">
						<input type="text" autocomplete="off" class="text-search-box" ng-model="vm.model.pagination.search" ng-change="vm.model.searchStrength(vm.model.UnitList, vm.model.pagination)" placeholder="Search" >
						<i class="fa fa-search common-search-text-icon padding-top8" aria-hidden="true"></i>
					</div>
					<div class="col-md-2 col-sm-3  padding-leftright15" style="margin-top: 5px;">
						<input type="button" value="Clear" class="btn btn-primary btn-save-box-shadow" ng-click="vm.model.ClearFields(); vm.model.clearSearch();" id="clearBtn">
					</div>
					<div class="col-md-1 col-sm-2 padding-leftright15 float_right">
						<div class="width-div-for-patient-reg padding-top4">
							<a href="" class="btn btn-primary btn-save-box-shadow" title="Save" data-toggle="modal" data-target="#confirmSave" type="submit" ng-class="{disabled: !vm.model.code || !vm.model.units}"
							>
								<i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i>
							</a>
						</div>
					</div>
				</div>
			</div>
		<div class="row table-container padding-left-right-set4 padding-top5">
			<div class="col-md-12 col-lg-12 col-sm-8 table-container-header">
				<table class="table table-striped table-hover table-condensed table-bordered">
					<thead>
						<tr>
							<th class="width2" title="Strength Unit Code">
								Strength Unit Code
								<div class="float_right" ng-click="vm.model.pagination.sortBy(vm.model.pagination, 'code', sortReverse = !sortReverse)">
									<div>
										<i class="fa fa-caret-up" aria-hidden="true"></i>
									</div>
									<div class="margin-top-8">
										<i class="fa fa-caret-down" aria-hidden="true"></i>
									</div>
								</div>
							</th>
							<th class="width10" title="Strength Unit Description">
								Strength Unit Description
								<div class="float_right" ng-click="vm.model.pagination.sortBy(vm.model.pagination, 'unit', sortReverse = !sortReverse)">
									<div>
										<i class="fa fa-caret-up" aria-hidden="true"></i>
									</div>
									<div class="margin-top-8">
										<i class="fa fa-caret-down" aria-hidden="true"></i>
									</div>
								</div>
							</th>
							<th class="width1 text-center" title="Status">
								Status(n)
							</th>
							<th class="width1 text-center" title="Action">
								Action taken
							</th>
						</tr>
					</thead>
				</table>
			</div>
			<div class="table-container-body" style="height: 450px; overflow-y: scroll;">
				<table class="table table-striped table-hover table-condensed table-bordered">
					<tbody>
						<tr ng-repeat="unit in vm.model.pagination.data">
							<td class="width2"  title="{{unit.code}}">
								{{unit.code}}
							</td>
							<td class="width10" title="{{unit.unit}}">
								{{unit.unit}}
							</td>
							<td class="width1 text-center">
								<label class="switch switch-small" title="{{unit.status == true ? 'Active' : 'Inactive'}}">
									<input type="checkbox" class="switchInput" ng-model="unit.status" ng-change="vm.model.ToggleStatus(unit)" data-target="#confirmSave">
									<div class="slider round slider-small"></div>
								</label>
							</td>
							<!-- focusInput=true; -->
							<td class="text-center" style="width:0.94% !important">
								<a ng-click="vm.model.PopulateStrengthUnits(unit.id);" ng-class="{disabled: !unit.status}" title="Edit">
									<i class="fa fa-pencil" aria-hidden="true"></i>
								</a>
							</td>
						</tr>
						<tr ng-if="!vm.model.pagination.data || vm.model.pagination.data == false">
							<td class="text-center">
							  <p>No Record Found</p>
							</td>
						  </tr>
					</tbody>
				</table>
			</div>
		</div>
		<div class="row margin-bottom45 center-block">
				<ul ng-if="vm.model.pagination.totalPages > 1" class="pagination table-list"
					style="font-size: 14px; cursor: pointer;">
					<li ng-class="{disabled:vm.model.pagination.currentPage === 1}"><a
						ng-click="vm.model.pagination.setFirstPage(vm.model.pagination)">First</a>
					</li>
					<li ng-class="{disabled:vm.model.pagination.currentPage === 1}"><a
						ng-click="vm.model.pagination.setPreviousPage(vm.model.pagination)">Previous</a>
					</li>
					<li ng-repeat="page in vm.model.pagination.getPagesList(vm.model.pagination)"
						ng-class="{active:vm.model.pagination.currentPage === page}"><a
						ng-click="vm.model.pagination.setPage(page, vm.model.pagination)">{{page}}</a>
					</li>
					<li ng-class="{disabled:vm.model.pagination.currentPage === vm.model.pagination.totalPages}">
						<a ng-click="vm.model.pagination.setNextPage(vm.model.pagination)">Next</a>
					</li>
					<li ng-class="{disabled:vm.model.pagination.currentPage === vm.model.pagination.totalPages}">
						<a ng-click="vm.model.pagination.setLastPage(vm.model.pagination)">Last</a>
					</li>
				</ul>
			</div>
	</div>
</div>


<!--  confirmSave modal start -->

<div id="confirmSave" class="modal fade ng-scope in" role="dialog">
	<div class="modal-dialog" style="width: 560px !important; margin: 80px auto !important;">
		<div class="modal-content" style="border-radius: 0px !important;">
			<div class="modal-header" style="padding: 0px!important;">
				<div class="modal-title patient-details-row">
					Confirm
					<button type="button" class="close" data-dismiss="modal">&times;</button>
				</div>
			</div>
			<div class="modal-body">
				<div class="margin-left10">
					<span>Are you sure you want to Save?</span>
				</div>
			</div>
			<div class="modal-footer" style="border:none;">
				<button type="button" ng-click="vm.model.SaveStrengthUnits()" data-dismiss="modal" class="btn btn-primary">Ok</button>
				<button type="button" data-dismiss="modal" class="btn btn-primary">Cancel</button>
			</div>
		</div>
	</div>
</div>

<!--  confirmSave modal end -->


<script type="text/javascript">
	$(document).ready(function () {
		var documentHeight = $(window).height();
		var sideBarHeight = documentHeight - 55;
		$("#page-content-wrapper").css("height", sideBarHeight + "px");
	});

	$(".selectedPageName").text("Strength Unit Master");
	$(".sidebar-nav li").each(function () {
		$(this).find("a").parents("li").removeClass("active");
	});
	$('a[href$="pharmacyStrengthUnitMaster"]').parents("li").addClass("active");

</script>
