<div id="page-content-wrapper">
    <div class="container-fluid his-style">
        <legend class="main-heading-div">Role Permissions</legend>
        
        <div class="row">
            <div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto padding-top5">
							<div class=" ">
								<a href="" class="btn btn-primary btn-save-box-shadow" title="Add" ng-click="initModal(null, 'Add')"><i class="fa fa-plus vertical-middle" style="font-size: 18px;" aria-hidden="true"></i></a>
							</div>
						</div>
            <!-- <div class="col-lg-1 col-md-1 col-sm-4 padding-left-right-set4 pull-right" style="padding-top:2%;">
                <a href="" data-toggle="modal" data-target="#instructionDetails" class="btn btn-primary btn-save-box-shadow" title="" ng-click="initModal(null, 'Add')">
                    <i class="fa fa-plus" style="font-size:21px" aria-hidden="true"></i>
                </a>

            </div> -->
        </div>
        <div class="row padding-left-right-set4 padding-top5">
            <div class="col-md-12">
                <table class="table table-bordered">
                    <thead>
                        <tr>
	                        <th width=10%;>
	                        	Sr. No.
	                        </th>
                            <th>
                                Role
                            </th>
                            <th class="text-center" width=10%;>
                                Action taken
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                    	<tr ng-repeat="item in permissionList">
                    		<td>{{$index + 1}}</td>
                    		<td>{{getRoleDesc(item.roleId)}}</td>
                    		<td class="text-center">
								<a href="" data-toggle="modal" data-target="#confirmDelete">
									<i class="fa fa-trash" aria-hidden="true" title="Remove " ng-click="initModal(item, 'Delete')"></i>
								</a>
								&nbsp;
								<a href="">
									<i class="fa fa-pencil" aria-hidden="true" title="Edit" ng-click="initModal(item, 'Edit')"></i>
								</a>
							</td>
                    	</tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<div id="instructionDetails" class="common-medium-popup modal fade ng-scope" role="dialog" style="display: none;">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title patient-details-row">
                    {{ui.modalTitle}}
                    <button type="button" class="close" data-dismiss="modal">×</button>
                </div>
            </div>
            <div class="modal-body">
               <div class="row " ng-if="ui.showRoleForm">
	                    <div class="col-lg-3 col-md-3 col-sm-4 padding-left-right-set4 padding-top10" ng-if="type === 'role'">
			                <div class="row input-container">
			                    <div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
			                        <i class="fa fa-stop-circle-o" aria-hidden="true"></i>
			                    </div>
			                    <div class="col-lg-11 col-sm-11 col-md-11">
			                        <div class="">
			                            <select class="text-input floating-label" ng-options="role.roleId as role.roleDesc for role in ui.roles" ng-disabled="ui.edit"
			                            	 ng-model="accessFormObj.roleId" ng-change="roleChanged()">
			                            </select>
			                            <label for="code">Select Role</label>
			                        </div>
			                    </div>
			                </div>
			            </div>
                    </div>
               <div class="row">
			<div class="custom-sub-tab padding-left-right-set4 ">
				<ul class="tabs nav nav-tabs">
					<li ng-class="{ active : isSetFirstTabLevel(1) }" id="nor" class="width12 active" style="">
						<a href="" ng-click="setFirstTabLevel(1)">HIS</a>
					</li>
					<li ng-class="{ active : isSetFirstTabLevel(2) }" class="width12" style="">
						<a href="" ng-click="setFirstTabLevel(2)" class="employeeRegRadioParent">BI</a>
					</li>
					<!-- <li ng-class="{ active : isSetFirstTabLevel(3) }" class="width12" style="">
						<a href="" ng-click="setFirstTabLevel(3)" class="employeeRegRadioParent">OTIMS</a>
					</li> -->
				</ul>
			</div>
			<div class="row padding-left-right-set4">
				<div ng-show="isSetFirstTabLevel(1)" class="second-level-tab-display-div" style="">
					<div>
                	
                	<div class="fix-height-scroll400" style="margin-left:30%; margin-top:2%;">
                		<div ivh-treeview="hisBags" ivh-treeview-on-cb-change="selectionChanged(ivhNode, ivhIsSelected, ivhTree)" ivh-treeview-default-selected-state="false"></div>
                	</div>
                	
                	<div class="row" ng-if="ui.showRoleForm" style="padding-bottom:2%">
                		<div class="col-md-4 pull-right">
                			<button type="button" class="btn btn-primary padding-left10" id="complaint-add-btn" data-dismiss="modal" style="border: 1px solid #EA0303 !important;background-color: #FCE0E0 !important;color:#EA0303 !important;">Cancel</button>
                            <button  type="button" class="btn btn-primary padding-left10" id="complaint-add-btn" data-dismiss="modal" ng-click="savePermissions(1);" ng-disabled="((accessFormObj.roleId == '') || (accessFormObj.roleId == undefined) || ui.duplicateRole)" style="color: #03A096 !important;background-color: #E0F3F2 !important;border-color: #03A096 !important;">Save</button>
                            
                            
                    	</div>
                	</div>
               	</div>
				</div>
				<div ng-show="isSetFirstTabLevel(2)" class="second-level-tab-display-div" style="">
					<div>
                	<div class="fix-height-scroll400" style="margin-left:30%; margin-top:2%;">
                		<div ivh-treeview="biBags" ivh-treeview-on-cb-change="selectionChanged(ivhNode, ivhIsSelected, ivhTree)" ivh-treeview-default-selected-state="false"></div>
                	</div>
                	
                	<div class="row" ng-if="ui.showRoleForm" style="padding-bottom:2%">
                		<div class="col-md-4 pull-right">
                			<button type="button" class="btn btn-primary padding-left10" id="complaint-add-btn" data-dismiss="modal" style="border: 1px solid #EA0303 !important;background-color: #FCE0E0 !important;color:#EA0303 !important;">Cancel</button>
                            <button  type="button" class="btn btn-primary padding-left10" id="complaint-add-btn" data-dismiss="modal" ng-click="savePermissions(2);" ng-disabled="((accessFormObj.roleId == '') || (accessFormObj.roleId == undefined) || ui.duplicateRole )" style="color: #03A096 !important;background-color: #E0F3F2 !important;border-color: #03A096 !important;">Save</button>
                    	</div>
                	</div>
               	</div>
				</div>
				<div ng-show="isSetFirstTabLevel(3)" class="second-level-tab-display-div" style="">
					<div>
                	<div class="fix-height-scroll400" style="margin-left:30%; margin-top:2%;">
                		<div ivh-treeview="bags" ivh-treeview-on-cb-change="selectionChanged(ivhNode, ivhIsSelected, ivhTree)" ivh-treeview-default-selected-state="false"></div>
                	</div>
                	
                	<div class="row" ng-if="ui.showRoleForm" style="padding-bottom:2%">
                		<div class="col-md-4 pull-right">
                			<button type="button" class="btn btn-primary padding-left10" id="complaint-add-btn" data-dismiss="modal">Cancel</button>
                            <button  type="button" class="btn btn-primary padding-left10" id="complaint-add-btn" data-dismiss="modal" ng-click="savePermissions(3);" ng-disabled="((accessFormObj.roleId == '') || (accessFormObj.roleId == undefined) || ui.duplicateRole)">Save</button>
                    	</div>
                	</div>
               	</div>
				</div>
			</div>
		</div>
                
            </div>
        </div>
    </div>
</div>



<div id="confirmDelete" class="common-small-popup modal fade ng-scope" role="dialog" style="display: none;">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title patient-details-row">
                    Confirm
                    <button type="button" class="close" data-dismiss="modal">×</button>
                </div>
            </div>
            <div class="modal-body">
	            <div class="row" style="padding-bottom:3%; padding-top:3%;">
	   	        	<p style="padding-left: 3%;">Do you want to delete permissions for this role ?</p>
	       	    	<div class=" pull-right" style="padding-right: 3%; padding-top:3%;">
	       	    		<button type="button" class="btn btn-primary padding-left10" id="complaint-add-btn" data-dismiss="modal" ng-click="deletePermissions()">Yes</button>
	       				<button type="button" class="btn btn-primary padding-left10" id="complaint-add-btn" data-dismiss="modal">Cancel</button>	               	    
	               	</div>	
        		</div>
        	</div>
    	</div>
    </div>
</div>

<script type="text/javascript">
    $(document).ready(function() {
        var documentHeight = $(window).height();
        var sideBarHeight = documentHeight - 55;
        $("#page-content-wrapper").css("height", sideBarHeight + "px");

        $(".selectedPageName").text("Role Permission");
        $(".sidebar-nav li").each(function() {
            $(this).find("a").parents("li").removeClass("active");
        });
        $('a[href$="accessControl"]').parents("li").addClass("active");
    });
</script>
