<fieldset>
	<legend class="heading-div">Add</legend>
		<div class="row height420">
	<div class="row margin-top4">
		<div class="col-lg-12 col-md-12 col-sm-12">
		
		<table class="table table-bordered" ><!-- table-striped -->
      		<tbody class="label-color-grey" id="form1">
      			<tr>
      				<td>
      					<label> Systolic Blood Pressure</label>
      				</td>
      				<td>
      					<select ng-model="systolic" name="systolic" id="systolic" class="custom-dropdown select-box width50" ng-change="commnadditionSys(systolic,'{{systolic}}')" convert-to-number>
							<option ng-selected="true"  value="">Choose</option>
							<option value="3"> = 70 mmHg  &nbsp; &nbsp; &nbsp; +3</span></option>
							<option value="2"> 71-80 mmHg  &nbsp; &nbsp; &nbsp; +2 </option>
							<option value="1"> 81-100 mmHg  &nbsp; &nbsp; &nbsp; +1</option>
							<option value="0"> 101-199 mmHg  &nbsp; &nbsp; &nbsp; 0</option>
							<option value="2">  >=200 mmHg   &nbsp; &nbsp; &nbsp; +2</option>
						</select>
      				</td>
      			</tr>
      			<tr>
      				<td>
      					<label>Heart Rate</label>
      				</td>
      				<td>
      					<select ng-model="heart" name="heart" id="heart" class="custom-dropdown select-box width50" ng-change="commnadditionHeart(heart,'{{heart}}')" convert-to-number>
							<option ng-selected="true" value="">Choose</option>
							<option value="2"> 40 bpm  &nbsp; &nbsp; &nbsp; +2 </option>
							<option value="1"> 41-50 bpm   &nbsp; &nbsp; &nbsp; +1</option>
							<option value="0"> 51-100 bpm   &nbsp; &nbsp; &nbsp; 0</option>
							<option value="1"> 101-129 bpm   &nbsp; &nbsp; &nbsp; +1</option>
							<option value="2"> 111-129 bpm   &nbsp; &nbsp; &nbsp; +2</option>
							<option value="3"> >=130 bpm   &nbsp; &nbsp; &nbsp; +3</option>
						</select>
      				</td>
      			</tr>
      			<tr>	
      				<td>
      					<label>Respiratory Rate</label>
      				</td>
      				<td>
      					<select ng-model="respiratory" name="respiratory" id="respiratory" class="custom-dropdown select-box width50" ng-change="commnadditionrespiratory(respiratory,'{{respiratory}}')" convert-to-number>
							<option ng-selected="true"   value="">Choose</option>
							<option value="2" > 9 bpm  &nbsp; &nbsp; &nbsp; +2 </option><!-- +2 -->
							<option value="1"> 9=14 bpm  &nbsp; &nbsp; &nbsp; +1</option><!-- 0 -->
							<option value="0"> 15-20 bpm  &nbsp; &nbsp; &nbsp; 0</option><!-- +1 -->
							<option value="2"> 21-29 bpm &nbsp; &nbsp; &nbsp; +2</option><!-- +2 -->
						</select>
      				</td>
      			</tr>
      			<tr>
      				<td>
      					<label>Temperature</label>
      				</td>
      				<td>
      					<select  ng-model="selectedTemperature" name="temperature" id="temperature" class="custom-dropdown select-box width50" ng-change="commnadditiontemperature(selectedTemperature,'{{selectedTemperature}}')" convert-to-number> 
							<option ng-selected="true" value="">Choose</option>
							<option  value="2"> 35 C/95 F &nbsp; &nbsp; &nbsp; +2</option><!-- +2 -->
							<option value="0"> 35-38.4 C/95-101.1 F &nbsp; &nbsp; &nbsp; 0</option><!-- 0-->
							<option value="2"> >=38.5 C/101.3F &nbsp; &nbsp; &nbsp; +2</option><!-- +2 -->
						</select>
      				</td>
      			</tr>
      			<tr>
      				<td>
      					<label>AVPU Score</label>
      				</td>
      				<td>
      					<select ng-model="avpu" name="avpu" id="avpu" class="custom-dropdown select-box width50" ng-change="commnadditionavpu(avpu,'{{avpu}}')" convert-to-number>
							<option ng-selected="true" value="">Choose</option>
							<option  value="0"> Alert &nbsp; &nbsp; &nbsp; 0</option>
							<option value="1"> Reacts to Voice &nbsp; &nbsp; &nbsp;+1 </option>
							<option value="2"> Reacts to Pain &nbsp; &nbsp; &nbsp; +2</option>
							<option value="3"> Unresponsive &nbsp; &nbsp; &nbsp; +3</option>
						</select>
      				</td>
      			</tr>
      		</tbody>
      		<tfoot>
      			<tr class="header-tr-color" colspan="2">
      				<th><span style="font-weight: 700">Total Score</span></th>
      				<th><span style="font-weight: 700" ng-model="sum" id="sum">{{sum}}</span></th>
      			</tr>
      		</tfoot>
      	</table>
      </div>
	</div>
	<div class="row">
		<div class="col-lg-11 col-md-10 col-sm-10 margin-top10"></div>
   		<div class="col-lg-1 col-md-2 col-sm-2 padding-left0px-right6px margin-top10 text-right">
			<div class="common-save-button">
				<button class="btn btn-primary btn-save-box-shadow text-width-auto" id="saveBtn" data-dismiss="modal" ng-click="save()">Save</button>
			</div>
		</div>
	</div>
	</div>
</fieldset>
		
<script type="text/javascript">

$(document).ready(function(){

	
	$(".custom-dropdown select-box width50").each(function() {

		$(this).keyup(function(){
			calculateSum();
		});
	});

});

function calculateSum() {

	var sum = 0;
	//iterate through each textboxes and add the values
	$(".custom-dropdown select-box width50").each(function() {

		//add only if the value is number
		if(!isNaN(this.value) && this.value.length!=0) {
			sum += parseFloat(this.value);
		}

	});
	//.toFixed() method will roundoff the final sum to 2 decimal places
	$("#sum").html(sum.toFixed(2));
}

</script>
