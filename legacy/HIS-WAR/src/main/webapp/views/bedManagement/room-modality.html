<div id="page-content-wrapper" class="ng-scope">
	<div class="container-fluid his-style">
	<form name="modalityForm" novalidate="novalidate">
		<div class="row">
			<div class="col-lg-2 col-md-2 col-sm-3 padding-left-right-set4 padding-top10">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11">
						<div class="form-group"  show-errors>
							<select class="text-input floating-label" name="roomModalityId" ng-model="roomModalityObj.roomModalityId"  convert-to-number required="required">
								<option ng-repeat="info in modalityRoomList" value="{{info.roomId}}">{{info.roomDesc}}</option> 
							</select> <label for="code">Room Modality<span class="star">*</span></label>
							<p class="help-block" ng-if="modalityForm.ward.$error.required">Room modality is required</p>
						</div>
					</div>
				</div>
			</div>
			<div class="col-lg-2 col-md-2 col-sm-3 padding-left-right-set4 padding-top10">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11">
					{{subSpecialityId}}
						<div class="form-group"  show-errors>                              
							<select class="text-input floating-label" name="subSpecialityId" ng-model="roomModalityObj.subSpecialityId" ng-change="getModalityBySubSpeciality(roomModalityObj.subSpecialityId)" convert-to-number  required="required">
								<option ng-repeat="info in subSpecialityList" value="{{info.subSpecialityId}}" >{{info.subSpecialityName}}</option>

							</select> <label for="code">Sub Speciality<span class="star">*</span></label>
							<p class="help-block" ng-if="modalityForm.ward.$error.required">Select Sub Speciality</p>
						</div>
					</div>
				</div>
			</div>
			<div class="col-lg-2 col-md-2 col-sm-3 padding-left-right-set4 padding-top10">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11">
						<div class="form-group"  show-errors>
							<select class="text-input floating-label" name="modalityId" ng-model="roomModalityObj.modalityId"  convert-to-number  required="required">
								<option>-</option>
								<option ng-repeat="info in modalityMasterList" value="{{info.modalityId}}">{{info.modalityDesc}}</option>
							</select> <label for="code">Modality Machine<span class="star">*</span></label>
							<p class="help-block" ng-if="modalityForm.ward.$error.required">Modality machine is required</p>
						</div>
					</div>
				</div>
			</div>
		</div>
		</form>
		<div class="row padding-top0">
		
		<div class="col-md-6 col-sm-7 padding-left-right-set4">
				<div class="row">
					<div class="col-lg-3 col-md-6 col-sm-6" style="padding-left: 0px;">
						<div class="search">
							<label class="show-entries">Show <select
								name="DataTables_Table_0_length"
								aria-controls="DataTables_Table_0"
								ng-init="noOfRecordsPerPage='10'" ng-model="noOfRecordsPerPage"
								ng-change="setNoOfRecords();" class="search-popUp-ddl">
									<option value="10">10</option>
									<option value="25">25</option>
									<option value="50">50</option>
									<option value="100">100</option>
							</select> entries
							</label>
						</div>
					</div>
				</div>
			</div>
			<div
				class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
				<div class=" ">
					<a href="" class="btn btn-primary btn-save-box-shadow" title="Save"
						data-toggle="modal" ng-click="saveRoomModality()"
						ng-if="saveBtnFlag"> <i class="fa fa-floppy-o"
						style="font-size: 21px" aria-hidden="true"></i></a> <a href=""
						class="btn btn-primary btn-save-box-shadow" title="Update"
						data-toggle="modal" ng-click="updateRoomModality()"
						ng-if="updateBtnFlag"> <i class="fa fa-floppy-o"
						style="font-size: 21px" aria-hidden="true"></i></a>
				</div>
			</div>
			<div
				class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set0 float_right">
				<input type="text" autocomplete="off" class="text-search-box" placeholder="Search"
					style="margin-top: 0px"> <i
					class="fa fa-search common-search-text-icon" aria-hidden="true"></i>
			</div>
			
		</div>
		<div class="row padding-left-right-set4 table-container padding-top5">
			<div class="table-container">
				<div class="table-container-header">
					<table class="table table-striped table-hover table-condensed table-bordered">
						<thead>
							<tr>
								<th class="width10">Room Modality</th>
								<th class="width10">Sub Speciality</th>
								<th class="width3">Modality Machine</th>
								<th class="width3 text-center">Status</th>
								<th class="width3 text-center">Action</th> 
							</tr>
						</thead>
					</table>
				</div>
				<div class="table-container-body fix-height-scroll380" style="overflow: overlay;"> <!-- fix-height-scroll230, background: #fff; -->
					<table class="table table-striped table-hover table-condensed table-bordered">
						<tbody>
							<tr ng-repeat="info in roomModalityMasterList">
								<td class="width10">{{info.roomName}}</td>
								<td class="width10">{{info.subSpecialityName}}</td>
								<td class="width10">{{info.modalityDesc}}</td>
								<td class="width3 text-center">
									<label class="switch vertical-middle"> 
									<input type="checkbox" ng-model="info.status" ng-true-value="'A'" ng-false-value="'I'"
														ng-change="updateStatus(info.roomModalityMasterId,info.status)">
									<div class="slider round"></div>
								</label>
								</td>
								<td class="width3 text-center">
									<a title="Edit">
									<i class="fa fa-pencil" aria-hidden="true" ng-click="showUpdateBtn(info.roomModalityMasterId)"></i>
								</a>&nbsp;
								</td> 
							</tr>
						</tbody>
					</table>
				</div>
			</div>
			<div class="row margin-bottom45 sss">
					<ul ng-if="pager.pages.length" class="pagination table-list"
						style="font-size: 14px;">
						<li ng-class="{disabled:pager.currentPage === 1}"><a
							ng-click="setPage(1,'true')">First</a></li>
						<li ng-class="{disabled:pager.currentPage === 1}"><a
							ng-click="setPage(pager.currentPage - 1,'true')">Previous</a></li>
						<li ng-repeat="page in pager.pages"
							ng-class="{active:pager.currentPage === page}"><a
							ng-click="setPage(page,'true')">{{page}}</a></li>
						<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
							<a ng-click="setPage(pager.currentPage + 1,'true')">Next</a>
						</li>
						<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
							<a ng-click="setPage(pager.totalPages,'true')">Last</a>
						</li>
					</ul>
				</div>
		</div>
	</div>
</div>


<!-- CONFIRM POPUP FOR UPDATE END -->
<modal visible="showModal"></modal>
<script src="resources/assets/js/common/page-height.js"></script>
<script type="text/javascript">

$(document).ready(function() {  
	// $(".patienttSearchResult").hide();
	//$(".icon-span").hide();
	 $(".selectedPageName").text("Room Modality");
	$(".sidebar-nav li").each(function() {
		$(this).find("a").parents("li").removeClass("active");
	});
	$('a[href$="patientType"]').parents("li").addClass("active");
});
</script>
