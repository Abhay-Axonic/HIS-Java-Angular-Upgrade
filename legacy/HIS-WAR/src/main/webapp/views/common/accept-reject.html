
<div id="accepatReject" class="modal fade ng-scope in common-small-popup" role="dialog" style="z-index:1300 !important;background: rgba(0, 0, 0, 0.33);" data-keyboard="false" data-backdrop="static">
		<div class="modal-dialog"> <!-- width: 25% !important;margin: 200px 0 0 510px !important; -->
			<div class="modal-content">
				<div class="modal-header">
					<div class="modal-title patient-details-row">
						Rejection
						<button type="button" class="close" data-dismiss="modal" ng-click="closeNotePopUpRejet()">&times;</button>
					</div>
				</div>
				<div class="modal-body">
					<div class="row">
						<div class="col-md-12 padding-left-right-set">
							<div class="row input-container margin-top10">
									<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon"> 
										<i class="fa fa-sticky-note-o" title="Reason Type -'Rejection'" aria-hidden="true"></i>
									</div>
									<div class="col-lg-11 col-sm-11 col-md-11 ">
										<div class="">
											<select class="text-input floating-label dirty"  id="rejectReasonIdDrpDN" name="code" ng-model="rejectReasonId">
											<option value="">Select Reason</option>
											<option ng-repeat="info in reasonList" ng-if="info.reasonTypeId == 5" value="{{info.reasonMasterId}}"  >{{info.reasonDesc}}</option>
											</select>		
											<label for="code">Select Reasons</label>
										</div>
									</div>
								</div>
							<div class="row input-container margin-top10">
										<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
											<i class="fa fa-sticky-note" aria-hidden="true"></i>
										</div>
										<div class="col-lg-11 col-sm-11 col-md-11 ">
											<div class="">
												<textarea name="code" rows="4" id="noteRejectDrpDN"
													class="text-input floating-label" ng-model="noteReject"></textarea>
												<label for="code">Note</label>
											</div>
										</div>
									</div>
									<!-- <input type="text" autocomplete="off" id="commonId" /> -->
						</div>
					</div>
				</div>
				<div class="modal-footer" style="border:none;">
					<!-- <button type="button" data-dismiss="modal" class="btn btn-primary" id="" ng-click="saveAcceptReject(rejectReasonId)">Save</button> -->
					<div class="row">
						<div class="col-lg-1 col-md-2 col-sm-2  col-md-2 col-sm-2 padding-left-right-set4 text-width-auto float-right">
							<button class="btn btn-primary btn-save-box-shadow  width100" title="Save" ng-click="saveAcceptReject(rejectReasonId)" data-dismiss="modal">
							<i class="fa fa-floppy-o" aria-hidden="true"></i> </button>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
