<head>
	<style>

.angular-ui-tree-handle {
  background: #f8faff;
  border: 1px solid #dae2ea;
  color: #7c9eb2;
  padding: 10px 10px;
}

.angular-ui-tree-handle:hover {
  color: #438eb9;
  background: #f4f6f7;
  border-color: #dce2e8;
}

.angular-ui-tree-placeholder {
  background: #f0f9ff;
  border: 2px dashed #bed2db;
  -webkit-box-sizing: border-box;
  -moz-box-sizing: border-box;
  box-sizing: border-box;
}

tr.angular-ui-tree-empty {
  height: 100px
}

.group-title {
  background-color: #687074 !important;
  color: #FFF !important;
}


/* --- Tree --- */

.tree-node {
  border: 1px solid #dae2ea;
  background: #f8faff;
  color: #7c9eb2;
}

.nodrop {
  background-color: #f2dede;
}

.tree-node-content {
  	margin: 0;
    margin-top: 10px;
}

.tree-handle {
  padding: 10px;
  background: #428bca;
  color: #FFF;
  margin-right: 10px;
}

.angular-ui-tree-handle:hover {}

.angular-ui-tree-placeholder {
  background: #f0f9ff;
  border: 2px dashed #bed2db;
  -webkit-box-sizing: border-box;
  -moz-box-sizing: border-box;
  box-sizing: border-box;
}

<div id="page-content-wrapper">
	<div class="container-fluid his-style">
			
			
	<script type="text/ng-template" id="nodes_renderer.html">
      <div class="tree-node tree-node-content" >
        <a  class="btn btn-success width2" ng-if="node.nodes && node.nodes.length > 0" data-nodrag ng-click="toggle(this)"><span
        class="glyphicon "
        ng-class="{
          'glyphicon-chevron-right': collapsed,
          'glyphicon-chevron-down': !collapsed
        }"></span></a> 

<input type="text" autocomplete="off" ng-model="node.icon" placeholder="Icon" />
<input type="text" autocomplete="off" ng-model="node.label" placeholder="label" />
<input ng-if="node.isUrl" class="inputUrl" type="text" autocomplete="off" ng-model="node.url" placeholder="Url" />
	

        <a class="pull-right btn btn-danger width3" data-nodrag ng-click="remove(this)"><span
        class="glyphicon glyphicon-remove"></span></a>
        <a class="pull-right btn btn-primary width3" data-nodrag ng-click="newSubItem(this)" style="margin-right: 8px;"><span
        class="glyphicon glyphicon-plus"></span></a>

	<label class="checkbox-inline pull-right margin-top5 padding-left-right-set4"><input type="checkbox" value="" ng-model="node.isUrl" id="checkUrl" class="margin-top5">Url</label>
      </div>
      <ol ui-tree-nodes="" ng-model="node.nodes" ng-class="{hidden: collapsed}">
        <li ng-repeat="node in node.nodes" ui-tree-node ng-include="'nodes_renderer.html'">
        </li>
      </ol>
    </script>

    <div class="row padding-top10">
      <div class="col-md-2 col-sm-2 padding-left-right-set4 text-width-auto padding-top4">

     <div class="col-md-2 col-sm-2 padding-left-right-set4 text-width-auto padding-top4">

             </a>
         </div>
     </div>

        <div ui-tree id="tree-root">
          <ol ui-tree-nodes ng-model="data">
            <li ng-repeat="node in data" ui-tree-node ng-include="'nodes_renderer.html'"></li>
          </ol>
        </div>
      </div>

		<div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
			<div class=" ">
				<a href="" class="btn btn-primary btn-save-box-shadow" title="Save" data-toggle="modal" data-target="#confirmLogout">
				<i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
			</div>
		</div>
		<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set1 float_right">
			<input type="text" autocomplete="off" class="text-search-box dirty" placeholder="Search" style="margin-top: 0px">
			<i class="fa fa-search common-search-text-icon" aria-hidden="true"></i>
		</div>
	</div>
    <div class="row">
		<div class="table-container padding-left-right-set4 padding-top5">
			<div class="table-container-header">
				<table class="table table-striped table-hover table-condensed table-bordered">
					<thead class="mainServiceTableCommon">
						<tr>
							<th class="width10">Menu</th>
							<th class="width1 text-center">Action</th>
						</tr>
					</thead>
				</table>
			</div>
			<div class="table-container-body fix-height-scroll230" style="overflow-y: overlay;">
				<table class="table table-striped table-hover table-condensed table-bordered">
					<tbody>
						<tr>
							<td class="width10 vertical-middle">-</td>
							<td class="width1 text-center vertical-middle">
								<a title="Edit" data-toggle="modal" data-target="#editViewMenu"><i class="fa fa-pencil"></i></a>
								<a title="Remove"><i class="fa fa-times"></i></a>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
