<div id="addReferralModal" class="modal fade ng-scope in common-large-popup" role="dialog" data-keyboard="false" data-backdrop="static">
	<div class="modal-dialog"> <!-- width: 25% !important;margin: 200px 0 0 510px !important; -->
		<div class="modal-content">
			<div class="modal-header padding-zero" style="padding:0px;">
				<div class="modal-title patient-details-row">
					Add New Referral
					<button type="button" class="close" data-dismiss="modal">&times;</button>
				</div>
			</div>
			<div class="modal-body">
				<form name="referralform" novalidate class="row padding-top5">
					<div class="row margin-top10">
						<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4">
							<div class="row input-container">
								<div class="col-lg-1 col-sm-2 col-md-2 polymer-icon"> 
									<i class="fa fa-dot-circle-o" aria-hidden="true"></i>
								</div>
								<input type="hidden" ng-model="referral.referralId">
								<div class="col-lg-11 col-sm-10 col-md-10">
									<div class="form-group"   show-errors> 
										<select class="text-input floating-label" name="referralTypeId" ng-model="referral.referralTypeId" required>
											<option value="">Select Referral Type</option>
											<option ng-repeat="info in referralTypeList" value="{{info.id}}">{{info.desc}}</option>
										</select>
										<label for="code">Referral Type<span class="star">*</span></label>
										<p class="help-block" ng-if="referralform.referralTypeId.$error.required">Referral Type is required</p>
									</div>
								</div>
							</div>
						</div>
						<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4">
							<div class="row input-container">
								<div class="col-lg-1 col-sm-2 col-md-2 polymer-icon"> 
									<i class="fa fa-dot-circle-o" aria-hidden="true"></i>
								</div>
								<div class="col-lg-11 col-sm-10 col-md-10 ">
									<div class="form-group"   show-errors>
										<input type="text" autocomplete="off" name="referralName" chars="letters" id="" ng-model="referral.referralName" class="text-input floating-label" required/>
										<label for="code">Referral Name<span class="star">*</span></label>
										<p class="help-block" ng-if="referralform.referralName.$error.required">Referral Name is required</p>
									</div>
								</div>
							</div>
						</div>
						<div class="col-lg-4 col-md-4 col-sm-4 padding-left-right-set4">
							<div class="row input-container">
								<div class="col-lg-1 col-sm-2 col-md-2 polymer-icon width4"> 
									<i class="fa fa-map-marker" aria-hidden="true"></i>
								</div>
								<div class="col-lg-11 col-sm-10 col-md-10 width96">
									<div class="form-group" >
										<input type="text" autocomplete="off" name="address" id="" ng-model="referral.address" class="text-input floating-label" required/>
										<label for="code">Address</label>
										<!-- <p class="help-block" ng-if="referralform.address.$error.required">Address is required</p> -->
									</div>
								</div>
							</div>
						</div>
						<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4">
							<div class="row input-container">
								<div class="col-lg-1 col-sm-2 col-md-2 polymer-icon"> 
									<i class="fa fa-flag" aria-hidden="true"></i>
								</div>
								<div class="col-lg-11 col-sm-10 col-md-10">
										<div class="form-group">
									
										<select class="text-input floating-label" name="countryId" ng-model="referral.countryId" ng-change="getStateByCountry(referral.countryId)" convert-to-number>
											<option value="">Select Country</option>
											<option ng-repeat="info in countryList" value="{{info.countryId}}">{{info.countryName}}</option>
										</select> <label for="code">Country</label>
<!-- 										<p class="help-block" ng-if="referralform.countryId.$error.required">Country is required</p> -->
									</div>
								</div>
							</div>
						</div>
						<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4">
							<div class="row input-container">
								<div class="col-lg-1 col-sm-2 col-md-2 polymer-icon"> 
									<i class="fa fa-university" aria-hidden="true"></i>
								</div>
								<div class="col-lg-11 col-sm-10 col-md-10 ">
										<div class="form-group">
											<select class="text-input floating-label" name="stateId" ng-model="referral.stateId" ng-change="getDistrictByState(referral.stateId)" convert-to-number>
												<option value=""></option>
												<option ng-repeat="info in stateList" value="{{info.stateId}}">{{info.stateName}}</option>
											</select> <label for="code">State</label>
<!-- 											<p class="help-block" ng-if="referralform.stateId.$error.required">State is required</p> -->
										</div>
									</div>
							</div>
						</div>
						
						
						<!-- <div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4">
							<div class="row input-container">
								<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon"> 
									<i class="fa fa-dot-circle-o" aria-hidden="true"></i>
								</div>
								<div class="col-lg-11 col-sm-11 col-md-11 ">
									<div class="">
										<input type="button" value="+" class="btn btn-primary btn-save-box-shadow text-width-auto">
									</div>
								</div>
							</div>
						</div> -->
					</div>
			<div class="row padding-top10 padding-bottom10">
				<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-2 col-md-2 polymer-icon"> 
							<i class="fa fa-building-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-10 col-md-10 ">
								<div class="form-group"   >
								<select class="text-input floating-label" name="districtId" ng-model="referral.districtId" ng-change="getCityByDistrict(referral.districtId)" convert-to-number >
									<option value=""></option>
									<option ng-repeat="info in districtList" value="{{info.districtId}}">{{info.districtName}}</option>
								</select> <label for="code">District</label>
<!-- 								<p class="help-block" ng-if="referralform.districtId.$error.required">District is required</p> -->
							</div>
						</div>
					</div>
				</div>
				<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-2 col-md-2 polymer-icon"> 
							<i class="fa fa-building-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-10 col-md-10">
							<div class="form-group" >
								<select class="text-input floating-label" name="cityId" ng-model="referral.cityId" ng-change="getAreaByCity(referral.cityId)" convert-to-number>
									<option value=""></option>
									<option ng-repeat="info in cityList" value="{{info.cityId}}">{{info.cityName}}</option>
								</select> <label for="code">City</label>
<!-- 								<p class="help-block" ng-if="referralform.cityId.$error.required">City is required</p> -->
							</div>
						</div>
					</div>
				</div>
				<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-2 col-md-2 polymer-icon"> 
							<i class="fa fa-street-view" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-10 col-md-10">
							<div class="form-group" >
								<select class="text-input floating-label" name="areaId" ng-model="referral.areaId" convert-to-number>
									<option value=""></option>
									<option ng-repeat="info in areaList" value="{{info.areaId}}">{{info.areaName}}</option>
								</select> <label for="code">Area</label>
<!-- 								<p class="help-block" ng-if="referralform.areaId.$error.required">Area is required</p> -->
							</div>
						</div>
					</div>
				</div>
					<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4">
						<div class="row input-container">
							<div class="col-lg-1 col-sm-2 col-md-2 polymer-icon"> 
								<i class="fa fa-envelope-o" aria-hidden="true"></i>
							</div>
							<div class="col-lg-11 col-sm-10 col-md-10 ">
								<div class="form-group">
									<input type="text" autocomplete="off" name="email"  ng-model="referral.email" class="text-input floating-label" required>
									<label for="code">Email</label>
									<!-- <p class="help-block" ng-if="referralform.email.$error.required">Email is required</p> -->
								</div>
							</div>
						</div>
					</div>
					<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4">
						<div class="row input-container">
							<div class="col-lg-1 col-sm-2 col-md-2 polymer-icon"> 
								<i class="fa fa-mobile" aria-hidden="true"></i>
							</div>
							<div class="col-lg-11 col-sm-10 col-md-10 ">
								<div class="form-group"  >
									<input numbers-only type="text" autocomplete="off" name="contact" ng-model="referral.contact" id="" class="text-input floating-label" maxlength="{{registrationFieldObj.mobileDigit}}" required>
									<label for="code">Contact No.</label>
									<!-- <p class="help-block" ng-if="referralform.contact.$error.required">Contact Number is required</p> -->
								</div>
							</div>
						</div>
					</div>
					<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4">
						<div class="row input-container">
							<div class="col-lg-1 col-sm-2 col-md-2 polymer-icon"> 
								<i class="fa fa-user" aria-hidden="true"></i>
							</div>
							<div class="col-lg-11 col-sm-10 col-md-10 ">
									<div class="form-group"  >
									<input type="text" autocomplete="off" name="contactPerson" chars="letters" id=""  ng-model="referral.contactPerson" class="text-input floating-label">
									<label for="code">Contact Person</label>
<!-- 									<p class="help-block" ng-if="referralform.contactPerson.$error.required">Contact Person is required</p> -->
								</div>
							</div>
						</div>
					</div>
				</div>
			</form>
			</div>
			<div class="modal-footer padding-top10" style="border:none;">
				<!-- <button type="button" class="btn btn-primary width7" id="" ng-click="setReferralObject()">Save</button> -->
				<div class="row">
					<div class="col-lg-1 col-md-2 col-sm-2  padding-left-right-set4 text-width-auto float-right">
						<button class="btn btn-primary btn-save-box-shadow  width100" title="Save" ng-click="setReferralObject()">
						<i class="fa fa-floppy-o" aria-hidden="true"></i> </button>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
