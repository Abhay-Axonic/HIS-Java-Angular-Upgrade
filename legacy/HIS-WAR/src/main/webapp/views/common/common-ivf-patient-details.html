<div id="femaleDetailsModal" class="modal fade ng-scope in common-medium-popup" role="dialog">

				</div>
			</div>
			<div class="modal-body">
				<div class="row padding-left-right-set4 table-container padding-top4">

							</tr>
						</thead>
					</table>
				</div>

						class="table table-striped table-hover table-condensed table-bordered">
						<tbody>
							<tr>

								<td class="width10 text-center">0.9</td>
								<td class="width10 text-center">12 - 15</td>
								<td class="width10 text-center">-</td>
								<td class="width10 text-center">-</td>
							</tr>
						</tbody>
					</table>
