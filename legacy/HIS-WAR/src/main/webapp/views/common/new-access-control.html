<div id="page-content-wrapper" >
	<div class="container-fluid his-style">
		<div class="row">
			<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11">
						<div class="">
							<input type="text" autocomplete="off" name="description" id="" class="text-input floating-label dirty" ng-model="common.actionName"> 
							<label for="description" class="LISDynamicLabel">Menu Name<span class="star">*</span></label>
						</div>
					</div>
				</div>
			</div>
			<div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 padding-top10 text-center">
				<label class="checkbox-inline padding-top10"><input type="checkbox" value="" id="checkMenu" ng-true-value="'Y'" ng-false-value="'N'" ng-model="common.isChild"> is Child</label>
			</div>
			<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10 inputMenu">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11">
						<div class="">
<!-- 							<input type="text" autocomplete="off" name="description" id="" class="text-input floating-label dirty" ng-model="common.parentActioName">  -->
								<input type="text" autocomplete="off"  class="text-input floating-label" tabindex="3" placeholder="Search"
				                       uib-typeahead="group.name  for group in getListByName($viewValue)"
				                       typeahead-editable="false" typeahead-on-select="selectParentId($item, $model, $label);" name="groupName"  ng-model="common.name" >
							<label for="description" class="LISDynamicLabel">Menu Name</label>
						</div>
					</div>
				</div>
			</div>
			<div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto padding-top10">
				<div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
			        <a href="" class="btn btn-primary btn-save-box-shadow" title="Save" data-toggle="modal" ng-click="save()" ng-if="saveBtnFlag">
			        <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
			      
			        <a href="" class="btn btn-primary btn-save-box-shadow" title="Update" data-toggle="modal" ng-click="update()" ng-if="updateBtnFlag">
			        <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
			      </div>
			      
							
			</div>
			
		</div>
		
		<div class="row padding-left-right-set4 margin-top8">
			<div class="row margin-top4">
				<div class="col-md-6 col-sm-7 padding-left-right-set4">
							<div class="row">
								<div class="col-lg-3 col-md-6 col-sm-6" style="padding-left: 0px;">
									<div class="search">
										<label class="show-entries">Show <select
											name="DataTables_Table_0_length"
											aria-controls="DataTables_Table_0"
											ng-init="noOfRecordsPerPage='10'" ng-model="noOfRecordsPerPage"
											ng-change="setNoOfRecords();" class="search-popUp-ddl">
												<option value="10">10</option>
												<option value="25">25</option>
												<option value="50">50</option>
												<option value="100">100</option>
										</select> entries
										</label>
									</div>
								</div>
							</div>
						</div>
						<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 float_right">
						<input type="text" autocomplete="off" class="text-search-box" placeholder="Search" style="margin-top: 0px" ng-model="searchKeyword"> 
						<i class="fa fa-search common-search-text-icon" aria-hidden="true"></i>
					</div>
				</div>		
		<div class="row padding-left-right-set4 table-container padding-top8">
		
			<div class="table-container">

				<div class="table-container-header">
					<table class="table table-striped table-hover table-condensed table-bordered">
						<thead>
							<tr>
								<th class="width2 vertical-top" title="Menu Name"><span class="">Id</span></th>
								<th class="width8 vertical-top" title="Menu Name"><span class="">Menu Name</span></th>
								<th class="width4 vertical-top" title="Is Child"><span class="">Is Child</span></th>
								<th class="width8 vertical-top" title="Menu Name"><span class="">Menu Name</span></th>
								<th class="width4 vertical-top text-center" title="Status"><span class="">Status</span></th>
								<th class="width4 vertical-top text-center" title="Action"><span class="">Action</span></th>
							</tr>
						</thead>
					</table>
				</div>
				<div class="table-container-body fix-height-scroll450" style="overflow: overlay;">
					<table class="table table-striped table-hover table-condensed table-bordered">
						<tbody>
							<tr ng-repeat="info in commonList|orderBy:column:reverse|filter:searchKeyword">
								<td class="width2">{{info.actionId}}</td>
								<td class="width8">{{info.actionName}}</td>
								<td class="width4">
										<div ng-if="info.parentId==0">N</div>
										<div ng-if="info.parentId!=0">Y</div>
								</td>
								<td class="width8">{{info.parentActioName}}</td>
								<td class="width4 text-center">
									<label class="switch"> 
									<input type="checkbox" ng-model="info.status" ng-true-value="'A'" ng-false-value="'I'"
														ng-change="updateStatus(info.actionId,info.status)">
									<div class="slider round"></div>
								</label>
								</td>
								<td class="width4 text-center">
									<a><i class="fa fa-pencil" aria-hidden="true" ng-click="showUpdateBtn(info.actionId)"></i></a>&nbsp;
									<a><i class="fa fa-times" ng-click="getRemovedAction(info.actionId)"></i></a>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
				<div class="row margin-bottom45 sss">
					<ul ng-if="pager.pages.length" class="pagination table-list"
						style="font-size: 14px;">
						<li ng-class="{disabled:pager.currentPage === 1}"><a
							ng-click="setPage(1,'true')">First</a></li>
						<li ng-class="{disabled:pager.currentPage === 1}"><a
							ng-click="setPage(pager.currentPage - 1,'true')">Previous</a></li>
						<li ng-repeat="page in pager.pages"
							ng-class="{active:pager.currentPage === page}"><a
							ng-click="setPage(page,'true')">{{page}}</a></li>
						<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
							<a ng-click="setPage(pager.currentPage + 1,'true')">Next</a>
						</li>
						<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
							<a ng-click="setPage(pager.totalPages,'true')">Last</a>
						</li>
					</ul>
				</div>
			</div>
		</div>
	</div>
</div>

<modal visible="showModal"></modal>
<script src="resources/assets/js/common/page-height.js"></script>
<script>
$(".inputMenu").hide();
$(document).ready(function() {  
$("#checkMenu").click(function() {
    if($(this).is(":checked")) {
        $(".inputMenu").show();
    } else {
        $(".inputMenu").hide();
    }
});
	 $(".selectedPageName").text("Access Control");
	$(".sidebar-nav li").each(function() {
		$(this).find("a").parents("li").removeClass("active");
	});
	$('a[href$="accessControl"]').parents("li").addClass("active");
});
</script>
