
<fieldset class="normalRegistration sub-fieldset "><!-- main-fieldset -->
    <legend class="main-heading-div commonPatientSearch cursor-pointer">
        Patient Search
    </legend>
    <div class="row patienttSearchResult">
        <div class="row">
            <div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
                <div class="row input-container">
                    <div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
                        <i class="fa fa-bullseye" aria-hidden="true"></i>
                    </div>
                    <div class="col-lg-11 col-sm-11 col-md-11">
                        <div class="">
                            <input type="text" autocomplete="off" name="registrationNumber"   ng-model="patientSearchObj.uhIdNumber" id="" class="text-input floating-label dirty" press-enter="searchPatient(patientSearchObj)">
                            <label for="description" class="LISDynamicLabel">UHID</label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
                <div class="row input-container">
                    <div class="col-lg-1 col-sm-1 col-md-1 polymer-icon ">
                        <i class="fa fa-user" aria-hidden="true"></i>
                    </div>
                    <div class="col-lg-11 col-sm-11 col-md-11 ">
                        <div class="">
                            <input id="my-field" type="text" autocomplete="off" name="description"   chars="alpha-numeric-hypen" ng-model="patientSearchObj.patientName" class="text-input floating-label dirty" press-enter="searchPatient(patientSearchObj)"> <!--  onkeypress="return /[A-Z-a-z]/i.test(event.key)"  -->
                            <label for="description" class="LISDynamicLabel">Patient Name</label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 padding-top12">
                <div class="row input-container">
                    <div class="col-lg-2 col-sm-2 col-md-2 polymer-icon ">
                        <i class="fa fa-venus-mars" aria-hidden="true"></i>
                    </div>
                    <div class="col-lg-10 col-sm-10 col-md-10">
                        <div class="">
                            <select class="text-input floating-label" ng-model="patientSearchObj.genderId" press-enter="searchPatient(patientSearchObj)">
                                <option></option>
                                <option ng-repeat="sex in sexMasterList" value="{{sex.id}}">{{sex.desc}}</option>
                            </select> <label for="code">Gender</label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10 dynamicLabelForEmployeeText">
                <div class="row input-container">
                    <div class="col-lg-1 col-sm-1 col-md-1 polymer-icon ">
                        <i class="fa fa-mobile" aria-hidden="true"></i>
                    </div>
                    <div class="col-lg-11 col-sm-11 col-md-11 ">
											<div class="">
										<select class="text-input floating-label dirty"
											ng-model="patientSearchObj.wardId"
											name="identificationTypeId">
											<option></option>
											<option ng-repeat="id in wardListForView"
												value="{{id.wardId}}">{{id.wardName}}</option>
										</select> <label for="code">Ward</label>
									</div>
                    </div>
                </div>
            </div>

            <div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10 dynamicLabelForEmployeeText">
                <div class="row input-container">
                    <div class="col-lg-1 col-sm-1 col-md-1 polymer-icon ">
                        <i class="fa fa-mobile" aria-hidden="true"></i>
                    </div>
                    <div class="col-lg-11 col-sm-11 col-md-11 ">
                        <div class="">
                            <input numbers-only type="text" autocomplete="off" name="description" id=""  onkeypress="return /[0-9-+]/i.test(event.key)" class="text-input floating-label dirty" ng-model="patientSearchObj.mobileNo" press-enter="searchPatient(patientSearchObj)"> <label for="description" class="">Bed Number</label>

                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10 dynamicLabelForEmployeeText">
                <div class="row input-container">
                    <div class="col-lg-1 col-sm-1 col-md-1 polymer-icon ">
                        <i class="fa fa-mobile" aria-hidden="true"></i>
                    </div>
                    <div class="col-lg-11 col-sm-11 col-md-11 ">
    									<div class="">
								       <input type="text" autocomplete="off" class="text-input floating-label ng-pristine ng-untouched ng-valid dirty ng-empty"
										 tabindex="3" ng-model="search.doctorName" placeholder="Search"
										  uib-typeahead="group.doctorName  for group in searchGroupSurgen($viewValue)" typeahead-on-select="selectDoctor($item, $model, $label,idx)"
										   typeahead-editable="true" name="groupName" aria-autocomplete="list" aria-expanded="false" aria-owns="typeahead-89-8614">
									 <label for="code">Doctor Name</label>
								</div>                    	
                    </div>
                </div>
            </div>



            <div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right padding-top10">
                <div class=" "><!-- width-div-for-patient-reg -->
                    <a href="" id="searchBtn" class="btn btn-primary btn-save-box-shadow width30" title="Search" ng-click="searchPatient(patientSearchObj)">
                        <i class="fa fa-search" aria-hidden="true"></i></a><!-- style="font-size: 21px"  -->
                </div>
            </div>
        </div>
        <fieldset class="normalRegistration sub-fieldset border-none padding-top10">
            <!-- <legend class="main-heading-div border-bottom-none">List</legend> -->


            <div class="row padding-left-right-set4 table-container padding-top5 serachedPatientList">
                <div class="table-container">
                    <div class="table-container-header">
                        <table class="table table-striped table-hover table-condensed table-bordered">
                            <thead>
                            <tr>
                                <th class="width2">
                                </th>
                                <th class="width10">
                                    <span class="">UHID</span>
                                </th>
                                <th class="width15">
                                    <span class="">Patient's Name</span>
                                </th>
                                <th class="width5">
                                    Gender
                                </th>
                                <th class="width15">
                                    Mobile No.
                                </th>

                            </tr>
                            </thead>
                            <tbody>
                            <tr 
                            class="cursor-pointer" ng-repeat="patient in patientList" ng-click="getPatientDetailsByIndex($index);selectedPatientRadioCommon($index)"><!-- ng-repeat="patient in patientList" -->
                                <td >
                                    <input type="radio" name="patient-list-radio" ng-click="getPatientDetailsByIndex($index)" id="patientSelectRadioCommon_{{$index}}">
                                </td>
                               <td >{{patient.uhIdNumber}}</td>
					            <td >{{patient.patientName}}</td>
					            <td >{{patient.genderName}}</td>
					            <td >{{patient.mobileNo}}</td>
                                
<!--                             <td ng-click="getPatientDetailsByIndex($index)" class="width23 cursur-pointer">{{patient.uhIdNumber}}</td> -->
<!-- 						<td ng-click="getPatientDetailsByIndex($index)" class="width23 cursur-pointer">{{patient.patientName}}</td> -->
<!-- 					<td ng-click="getPatientDetailsByIndex($index)" class="width23 cursur-pointer">{{patient.genderName}}</td> -->
<!-- 				<td ng-click="getPatientDetailsByIndex($index)" class="width23 cursur-pointer">{{patient.mobileNo}}</td> -->
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <!-- <div class="table-container-body" style="overflow: overlay;"> fix-height-scroll230, background: #fff;
                        <table class="table table-striped table-hover table-condensed table-bordered">
                            
                        </table>
                    </div> -->
                </div>
            </div>
        </fieldset>
    </div>
</fieldset>
<script>
    $(document).ready(function() {
        $(".patienttSearchResult").show();

        function testInput(event) {
            var value = String.fromCharCode(event.which);
            var pattern = new RegExp(/[a-z��� ]/i);
            return pattern.test(value);
         }

         $('#my-field').bind('keypress', testInput);
    });

    $(document).on('click', '.commonPatientSearch', function(){
        //alert()
        $(this).closest(".patienttSearchResult").toggle();
    });

</script>
