<style>
	.masterborderScroll1 {
    border: 1px solid gainsboro;
    height: 158px;
    padding: 10px;
    max-height: 158px;
    border-top: none;
    overflow-y: auto;
}

	background-color: transparent !important;

<link rel="stylesheet" type="text/css" href="resources/assets/css/template/drag-drop.css"/>
<!-- Page Content -->
<div id="page-content-wrapper">
	<div class="container-fluid his-style">
		<fieldset>
			<!-- <legend class="heading-div"> Document Type Master</legend> -->
			
		</fieldset>
		<div class="row padding-top10">
			<div class="col-lg-2 col-md-2 col-sm-3 padding-left-right-set4 padding-top10">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11">
						<div class="">
							<input type="text" autocomplete="off" name="code" id="" ng-model="common.incidentReportCode" class="text-input floating-label dirty" ng-disabled="common.incidentReportId != ''  && common.incidentReportId < 100"> 
							<label for="Code" class="">Code<span class="star">*</span></label>
						</div>
					</div>
				</div>
			</div>
			<div class="col-lg-2 col-md-2 col-sm-3 padding-left-right-set4 padding-top10">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11">
						<div class="">
							<input type="text" autocomplete="off" name="description" id="" ng-model="common.incidentReportDesc" class="text-input floating-label dirty" ng-disabled="common.incidentReportId != ''  && common.incidentReportId < 100"> 
							<label for="description" class="">Description<span class="star">*</span></label>
						</div>
					</div>
				</div>
			</div>
		
			<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon ">
						<i class="fa fa-dot-circle-o ddp-padding-top" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11 ">
						<div class="multiselect-drop-down">
							<label> Role<span class="star">*</span></label>
							<div class="custom-drop-down-btn" ng-dropdown-multiselect="" options="getActiveRoleList" selected-model="selectedRoleList" ng-click="clicked('selectedRoleList')" selected-model="selectedRoleList"></div>
						</div>
					</div>
					
				</div>
			</div>
			
			
		</div>
		<div class="row padding-top10">
						<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4"></div>
						<div class="col-lg-8 col-md-8 col-sm-8 padding-left-right-set4">
							<div class="row col-md-5set" id="">
								<div class="col-lg-5 col-md-5 col-sm-5 padding-left-right-set4">
									<div class="">
										<label class="common-lable-color-set">Templates</label>
										<div class="col-lg-12 col-md-12 col-sm-12 padding-left-right-set0" style="margin-bottom: 15px;">
												<input type="text" autocomplete="off" class="text-search-box dirty" ng-model="serachTemplate" placeholder="Search" style=" margin-top:  2px;">
												<i class="fa fa-search common-search-text-icon padding-left-right-set10 padding-top4" aria-hidden="true"></i>
										</div>
										<div class="masterborderScroll1">
											<div class="checkbox" ng-repeat="template in templateList|filter:serachTemplate |unique : 'title' ">
												<label class="common-lable-color-set">
												<input type="checkbox" value="" class="" ng-model="selectedTemplateList[template.templateId]" 
									             ng-click="addTempStore(template.templateId,template.title)" value="{{template.templateId}}">{{template.title}}</label>
											</div>
										</div>
									</div>
								</div>
								<div class="col-lg-1 col-md-1 col-sm-1 padding-left-right-set4">
									<div class="text-center margintop120">
										<button type="button" class="btn btn-primary text-width-auto btn-sm selectionBtn" ng-click="selectTemplate()"> << >> </button>
									</div>
								</div>
								<div class="col-lg-5 col-md-5 col-sm-5 padding-left-right-set4">
									<div class="" style="padding-top: 45px;">
										<label class="common-lable-color-set">Selected Template</label>
										<div class="masterborderScroll">
											<div class="checkbox ng-scope" ng-repeat="info in selectedTemplateList1">
												<label class="common-lable-color-set">{{info.title}}</label>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
						<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4"></div>
					</div>
		<div class="row">
			<div class="col-md-6 col-sm-7 padding-left-right-set4 padding-top10">
				<div class="row">
					<div class="col-lg-3 col-md-6 col-sm-6" style="padding-left: 0px;">
						<div class="search">
						<label class="show-entries">Show 
						<select name="DataTables_Table_0_length" aria-controls="DataTables_Table_0"
							ng-init="noOfRecordsPerPage='10'" ng-model="noOfRecordsPerPage"
							ng-change="setNoOfRecords();" class="search-popUp-ddl">
								<option value="10">10</option>
								<option value="25">25</option>
								<option value="50">50</option>
								<option value="100">100</option>
						</select> entries
						</label>
					</div>
					</div>
				</div>
			</div>
			<div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto padding-top5">
		        <a href="" class="btn btn-primary btn-save-box-shadow" title="Save" data-toggle="modal" ng-click="save()" ng-if="saveBtnFlag"> 
					<i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i>
				</a>

				<a href="" class="btn btn-primary btn-save-box-shadow" title="Update" data-toggle="modal" ng-click="update()" ng-if="updateBtnFlag">
					<i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i>
				</a>
		      </div>
		     <div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set0 float_right">
				<input type="text" autocomplete="off" class="text-search-box oneeeee" placeholder="Search" ng-model="searchKeyword" ng-change="globalSearch();">
				 <i class="fa fa-search common-search-text-icon padding-top8" aria-hidden="true"></i>
			</div>
		</div>
			
		<div class="row padding-top10 padding-left-right-set4">
			<div id="fixed-thead-tfoot-scroll" class="fixed-thead-tfoot-scroll fix-height-scroll400">
			  <table id="main-table" class="main-table width100">
				<thead>
					<tr class="">
						<th class="width6">
							 Code
						</th>
						<th class="width10">
							Description
						</th>
						<th class="width10 text-center">
							Role
						</th>
						<th class="width3 text-center">
							Template
						</th>
						<th class="width3 text-center">
							Status(s)
						</th>
						<th class="width3 text-center">
							Action taken
						</th>
					</tr>
					</thead>
					<tbody>
					<tr ng-repeat="info in commonList|filter:searchKeyword">
						<td>{{info.incidentReportCode}}</td>
						<td>{{info.incidentReportDesc}}</td>
						<td class="text-center vertical-middle">
							<a class="" data-toggle="modal" data-target="#TemplateInfoRole" ng-click="getInformation(info,1)"><i class="fa fa-info-circle"></i></a>
						</td>
						<td class="text-center vertical-middle">
							<a class="" data-toggle="modal" data-target="#TemplateInfoModal" ng-click="getInformation(info,2)"><i class="fa fa-info-circle"></i></a>
						</td>
						<td class="text-center">
							<label class="switch"> 
							<input type="checkbox" ng-model="info.status" ng-checked="info.status=='A'" ng-true-value="'A'" ng-false-value="'I'" ng-change="updateStatus(info.incidentReportId,info.status)">
							<div class="slider round"></div>
							</label>
						</td>
						<td class="text-center">
						<a ng-click="showUpdateBtn(info.incidentReportId)"><i class="fa fa-pencil" aria-hidden="true"></i></a>
						<!-- <a><i class="fa fa-times" aria-hidden="true"></i></a> -->
						</td>
					</tr>
					</tbody>
				</table>
				<div class="row margin-bottom45 sss">
					<ul ng-if="pager.pages.length" class="pagination table-list"
						style="font-size: 14px;">
						<li ng-class="{disabled:pager.currentPage === 1}"><a
							ng-click="setPage(1,'true')">First</a></li>
						<li ng-class="{disabled:pager.currentPage === 1}"><a
							ng-click="setPage(pager.currentPage - 1,'true')">Previous</a></li>
						<li ng-repeat="page in pager.pages"
							ng-class="{active:pager.currentPage === page}"><a
							ng-click="setPage(page,'true')">{{page}}</a></li>
						<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
							<a ng-click="setPage(pager.currentPage + 1,'true')">Next</a>
						</li>
						<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
							<a ng-click="setPage(pager.totalPages,'true')">Last</a>
						</li>
					</ul>
				</div>
				
			</div>
		</div>
	</div>
</div>

<!-- TemplateInfoModal START -->

<div id="viewTemplateModal" class="modal fade ng-scope in common-large-popup" 
style=" background-color: white;margin-left: 10%;width: 80%;height: 100%;margin-top: 4%;padding-right: 0 !important;background-color:transparent !important;position: absolute;" role="dialog">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header padding-zero">
				<div class="modal-title patient-details-row">
					Template
					<button type="button" class="close" data-dismiss="modal">&times;</button>
				</div>
			</div>
			<div class="modal-body"  style="overflow-y: scroll !important; max-height:600px; padding-bottom:15px !important;" ng-show="templateFormatId==1">
				<div style="padding:4px 8px !important; background-color: white !important;">
					<div ng-class="(saveTrasactionFlag==false && updateTrasactionFlag==false)?'readOnlyTemp':''" id="htmlContent" class="row">
					</div>
				</div>
			</div>
			<div class="col-lg-12 col-md-12"ng-show="templateFormatId==2">
                             <textarea ck-editor ng-model="value"></textarea>
                              
			  </div>
		</div>
	</div>		

</div>

<div id="TemplateInfoModal" class="modal fade ng-scope in common-small-popup" role="dialog">
<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header padding-zero">
				<div class="modal-title patient-details-row">
					Details
					<button type="button" class="close" data-dismiss="modal">&times;</button>
				</div>
			</div>
			<div class="modal-body">
				<div class="row padding-left-right-set4 table-container padding-top8">
					<div class="table-container">
						<div class="table-container-header">
							<table class="table table-striped table-hover table-condensed table-bordered">
								<thead>
									<tr>
										<th class="width5"><span class="">Sr No.</span></th>
										<th class="width15"><span class="">Template Name</span></th>
										<th class="width10"><span class="">View</span></th>
									</tr>
								</thead>
							</table>
						</div>
						<div class="table-container-body fix-height-scroll230" style="overflow: overlay;">
							<table class="table table-striped table-hover table-condensed table-bordered">
								<tbody>
									<tr ng-repeat="info in incidentReportTemplateMapperList1 track by $index">
										<td class="width5">{{$index+1}}</td>
										<td class="width15">{{info.title}}</td>
										<td class="width10"><a class="" data-toggle="modal" data-target="#viewTemplateModal" title="View Document" ng-click="addTemplate(info)"><i class="fa fa-eye"></i></a></td>
									</tr>
								</tbody>
							</table>
						</div>

					</div>
				</div>
			</div>
			<div class="modal-footer" style="border: none;">
				<button type="button" style="width: auto;" data-dismiss="modal" class="btn btn-primary width15" id="okBtn">Ok</button>
			</div>
		</div>
		</div>
</div>


<!-- TemplateInfoModal END -->

<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header padding-zero">
				<div class="modal-title patient-details-row">
					Details
					<button type="button" class="close" data-dismiss="modal">&times;</button>
				</div>
			</div>
			<div class="modal-body">
				<div class="row padding-left-right-set4 table-container padding-top8">
					<div class="table-container">
						<div class="table-container-header">
							<table class="table table-striped table-hover table-condensed table-bordered">
								<thead>
									<tr>
										<th class="width2"><span class="">Sr No.</span></th>
										<th class="width10"><span class="">Role</span></th>
									</tr>
								</thead>
							</table>
						</div>
						<div class="table-container-body fix-height-scroll230" style="overflow: overlay;">

										<td class="width10">{{info.roleName}}</td>
									</tr>
								</tbody>

					</div>
				</div>

			<div class="modal-footer" style="border: none;">
