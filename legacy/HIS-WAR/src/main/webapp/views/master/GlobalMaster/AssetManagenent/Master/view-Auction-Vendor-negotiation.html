<!-- Page Content -->
<div id="page-content-wrapper">
        <div class="container-fluid his-style">
          <fieldset>
            <div class="row margin-top4">
              <div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
                <span><b class="padding-right10 ">Scrap
                    No. :</b> <lable></lable></span>
              </div>
              <div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
                <span class="margin-left10"><b class="padding-right10">Scrap
                    Date:</b><lable></lable> </span>
              </div>
              <div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
                <span class="margin-left10"><b class="padding-right10 ">VSR 
                    No. :</b><lable></lable> </span>
              </div>
              <div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
                <span class="margin-left10"><b class="padding-right10 ">VSR
                    Date:</b><lable><lable> </lable></lable></span>
              </div>
            </div>
            <div class="row">
              <div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
                <span><b class="padding-right10 ">Store
                     :</b> <lable></lable></span>
              </div>
              <div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
                <span class="margin-left10"><b class="padding-right10 ">Vendor
                    :</b><lable></lable> </span>
              </div>
              <div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
                <span class="margin-left10"><b class="padding-right10 ">Reference  
                    No. :</b><lable></lable> </span>
              </div>
              <div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
                <span class="margin-left10"><b class="padding-right10 ">Reference 
                    Date:</b><lable><lable> </lable></lable></span>
              </div>
            </div>
            <div class="row margin-top4">
              <div class="col-lg-12 col-md-12 col-sm-12 padding-left-right-set4 padding-bottom10" style="height:610px !important;overflow:auto;">
                <table ng-repeat="item in vm.model.itemInfo" class="table table-bordered">
                  <thead>
                    <tr>
                      <th class="vertical-middle width15">Item Details</th>
                      <!-- <th rowspan="2" class="vertical-middle">Parameter Details</th> -->
                      <th class="vertical-middle width12"><!-- QR Details --> Terms</th>
                      <th class="vertical-middle width12"><!-- Vendor Details --> Comparison Details</th>
                      <th class="" colspan="{{item.negotiationDetails.length}}">Negotiated Details</th>
                      <!-- <th class="width20">Required to add multiple Negotitated Details if Required</th> -->
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td rowspan="7" class="vertical-middle">
                        <div>Item : </div>
                        <div>Qty : </div>
                      </td>
                      <td></td>
                      <td></td>
                      <td ng-repeat="negotitateData in item.negotiationDetails">
                        <div>Date: </div>
                      </td>
                    </tr>
                    <tr>
                      <td>COP</td>
                      <td class="text-center">
                        <i class="fa fa-info-circle" ng-click="vm.model.OpenPopup('Open', 'commonComparisonDetailsModal'); vm.model.ViewTermsModal(item, 'cop')" title="COP" aria-hidden="true"></i>
                      </td>
                      <td>
                        <input type="text" autocomplete="off" readonly class="w-100">
                      </td>
                    </tr>
                    <tr>
                      <td>Warranty Period</td>
                      <td class="text-center">
                        <i class="fa fa-info-circle" ng-click="vm.model.OpenPopup('Open', 'commonComparisonDetailsModal'); vm.model.ViewTermsModal(item, 'warrantyPeriod')" title="Warranty Period" aria-hidden="true"></i>
                      </td>
                      <td>
                        <input type="text" autocomplete="off" readonly class="w-100">
                      </td>
                    </tr>
                    <tr>
                      <td>Support Terms</td>
                      <td class="text-center">
                        <i class="fa fa-info-circle" ng-click="vm.model.OpenPopup('Open', 'commonComparisonDetailsModal'); vm.model.ViewTermsModal(item, 'supportTerms')" title="Support Terms" aria-hidden="true"></i>
                      </td>
                      <td>
                        <input type="text" autocomplete="off" readonly class="w-100">
                      </td>
                    </tr>
                    <tr>
                      <td>Technical Specification</td>
                      <td class="text-center">
                        <i class="fa fa-info-circle" ng-click="vm.model.OpenPopup('Open', 'commonComparisonDetailsModal'); vm.model.ViewTermsModal(item, 'techSpecs')" title="Technical Specification" aria-hidden="true"></i>
                      </td>
                      <td>
                        <input type="text" autocomplete="off" readonly class="w-100">
                      </td>
                    </tr>
                    <tr>
                      <td>Payment Terms</td>
                      <td class="text-center">
                        <i class="fa fa-info-circle" ng-click="vm.model.OpenPopup('Open', 'commonComparisonDetailsModal'); vm.model.ViewTermsModal(item, 'paymentTerms')" aria-hidden="true" title="Payment Terms"></i>
                      </td>
                      <td>
                        <input type="text" autocomplete="off" readonly class="w-100">
                      </td>
                    </tr>
                    <tr>
                      <td>Remarks</td>
                      <td class="text-center">
                        <i class="fa fa-info-circle" ng-click="vm.model.OpenPopup('Open', 'commonComparisonDetailsModal'); vm.model.ViewTermsModal(item, 'remark')" title="remark" aria-hidden="true"></i>
                      </td>
                      <td>
                        <input type="text" autocomplete="off" readonly class="w-100">
                      </td>
                    </tr>
                    <tr>
                      <td colspan="3"></td>
                      <td>
                        <div class="row">
                          <label class="radio-inline">
                            <input type="radio" ng-model="negotitateData.negotitateStatus" ng-value="1" name="{{item.id + 'data' + $index}}" ng-change="vm.model.ButtonVisible()" disabled>Accept
                          </label>
                          <label class="radio-inline">
                            <input type="radio" ng-model="negotitateData.negotitateStatus" ng-value="2" name="{{item.id + 'data' + $index}}" ng-change="vm.model.ButtonVisible()" disabled>Reject
                          </label>
                          <label class="radio-inline">
                            <input type="radio" ng-model="negotitateData.negotitateStatus" ng-value="3" name="{{item.id + 'data' + $index}}" ng-change="vm.model.ButtonVisible()" disabled>On Hold
                          </label>
                        </div>
                        <div class="row margin-top4">
                          <input type="text" autocomplete="off" ng-model="negotitateData.rejectNote" readonly ng-if="negotitateData.negotitateStatus == 2" class="w-100">
                        </div>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </fieldset>
          <footer class="col-lg-12 col-md-12 col-sm-12 padding-left-right-set4" style="margin-bottom: 15px !important;padding-right:40px !important">
            <div class="row his-style margin-top10 padding-right20">
              <div class="col-lg-1 col-md-1 padding-left-right-set4 pull-right">
                <a href="" ng-click="vm.model.NavigateToBack()">
                  <input type="button" value="Back" class="btn btn-primary btn-save-box-shadow">
                </a>
              </div>
            </div>
          </footer>
        </div>
      </div>
      <div id="commonComparisonDetailsModal" class="modal fade ng-scope in common-large-popup" role="dialog">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <div class="modal-title patient-details-row">
                Comparison Details
                <button type="button" class="close" data-dismiss="modal">&times;</button>
              </div>
            </div>
            <div class="modal-body">
              <div class="row padding-left-right-set4">
                <div class="row">
                  <fieldset class="div-fieldset">
                    <legend class="heading-div">
                      <span></span>
                    </legend>
                    <div class="row">
                      <div class="col-md-12">
                        <textarea class="resize-set" rows="4" cols="50" readonly></textarea>
                      </div>
                    </div>
                  </fieldset>
                </div>
                <div class="row">
                  <fieldset class="div-fieldset">
                    <legend class="heading-div">
                      <span></span>
                    </legend>
                    <div class="row">
                      <div class="col-md-12">
                        <textarea class="resize-set" rows="4" cols="50" readonly></textarea>
                      </div>
                    </div>
                  </fieldset>
                </div>    
              </div>    
            </div>
          </div>
        </div>
      </div>
    <script type="text/javascript">
        $(document).ready(function() {
          var documentHeight= $(window).height();
            var sideBarHeight = documentHeight - 55;
          $("#page-content-wrapper").css("height", sideBarHeight + "px" );
        }); 
          $(".selectedPageName").text("Vendor Negotitation Details");
          $(".sidebar-nav li").each(function() {
            $(this).find("a").parents("li").removeClass("active");
          });
          $('a[href$="detailsVendorNegotitation"]').parents("li").addClass("active");
        
        
        $(".rejection-details-row1").hide();
        $(".rejection-details-row2").hide();
        $(".rejection-details-row3").hide();
        $(".rejection-details-row4").hide();
        
        /* ************** radioRejected1 ********** */
        
        $( ".radioRejected1" ).change(function() {
          if ($(this).is(":checked"))
          {
            $(this).closest(".row").siblings(".rejection-details-row1").show();
          }
        });
        $( ".radioAcceptedHold1" ).change(function() {
          if ($(this).is(":checked"))
          {
            $(this).closest(".row").siblings(".rejection-details-row1").hide();
          }
        });

        $( ".radioAcceptedHold3" ).change(function() {

        $( ".radioRejected4" ).change(function() {
          if ($(this).is(":checked"))
          {
            $(this).closest(".row").siblings(".rejection-details-row4").show();
          }
        });
        $( ".radioAcceptedHold4" ).change(function() {
          if ($(this).is(":checked"))
          {
            $(this).closest(".row").siblings(".rejection-details-row4").hide();
          }
        });
    </script>
