<div id="page-content-wrapper">
	<div class="container-fluid his-style">
		<fieldset>
			<!-- <legend class="heading-div">Diet Type Master</legend> -->
			<form name="tubeFeedingProducts" novalidate >
			<div class="row">
				<div
					class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<div class="form-group" show-errors>
								<input type="text" autocomplete="off" name="dietCode" id=""
									class="text-input floating-label" ng-model="common.productsCode" required="required"> <label for="code">
									Code<span class="star">*</span></label>
									<p class="help-block" ng-if="tubeFeedingProducts.dietCode.$error.required">Product code is required</p>
							</div>
						</div>
					</div>
				</div>
				<div
					class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-sticky-note-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<div class="form-group" show-errors>
								<input type="text" autocomplete="off" name="dietTypeDesc" id=""
									class="text-input floating-label" ng-model="common.productsDesc" required="required"> <label for="code">Description<span class="star">*</span></label>
							<p class="help-block" ng-if="tubeFeedingProducts.dietTypeDesc.$error.required">Product description is required</p>
							</div>
						</div>
					</div>
				</div>
				<!-- <div
					class="col-lg-4 col-md-4 col-sm-4 padding-left-right-set padding-top10">
					<div class="row input-container border-set-type">
						<label for="" class="font-weight700">Diet Type :</label> 
							<input type="radio" name="FixedAssestRadioB" id="FixedAssestRadioB" class=""> 
						<label for="FixedAssestRadioB" class="checkbox-margin-left-right cursor-pointer">Vegetarian</label> 
						
							<input type="radio" name="FixedAssestRadioB" id="FixedAssestRadioB2" class=""> 
						<label for="FixedAssestRadioB2" class="checkbox-margin-left-right cursor-pointer">Non-Vegetarian</label>
						
							<input type="radio" name="FixedAssestRadioB" id="FixedAssestRadioB3" class=""> 
						<label for="FixedAssestRadioB3" class="checkbox-margin-left-right cursor-pointer">Vegan</label>
					</div>
				</div> -->
			</div>
			</form>
		</fieldset>
		<modal visible="showModal"></modal> 
		<div class="row margin-top10 padding-left-right-set1">
		<!-- added Start code by Minesh -->
		<div class="col-md-8 col-sm-8">
			<div>
				<div class="row">
					<div class="col-lg-3 col-md-6 col-sm-6" style="padding-left: 10px;">
						<div class="search">
							<label class="show-entries">Show 
							<select name="DataTables_Table_0_length" aria-controls="DataTables_Table_0"
								ng-init="noOfRecordsPerPage='10'" ng-model="noOfRecordsPerPage"
								ng-change="setNoOfRecords();" class="search-popUp-ddl">
									<option value="10">10</option>   	
									<option value="25">25</option>
									<option value="50">50</option>
									<option value="100">100</option>
							</select> entries
							</label>
						</div>
					</div>
				</div>
			</div>
		</div>
		<!-- added End code by Minesh -->
		
			<div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
				<div class=" ">
						 <a href="" class="btn btn-primary btn-save-box-shadow" title="Save" data-toggle="modal" ng-click="save()" ng-if="saveBtnFlag">
		        <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
		      
		        <a href="" class="btn btn-primary btn-save-box-shadow" title="Update" data-toggle="modal" ng-click="update()" ng-if="updateBtnFlag">
		        <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
					</div>
			</div>
			<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set0 float_right">
				<input type="text" autocomplete="off" class="text-search-box" placeholder="Search" style="margin-top: 0px"
				 ng-model='searchText'> <i class="fa fa-search common-search-text-icon" aria-hidden="true"></i>
			</div>
		</div>
		<div class="row padding-left-right-set4 padding-top8">
				<div class="col-md-12">
					<table class="table table-bordered">
						<tr class="">
							<th class="width5"> Code
								<div class="float_right">
									<div>
										<i class="fa fa-caret-up" aria-hidden="true"></i>
									</div>
									<div class="margin-top-8">
										<i class="fa fa-caret-down" aria-hidden="true"></i>
									</div>
								</div>
							</th>
							<th class="width25">Description
								<div class="float_right">
									<div>
										<i class="fa fa-caret-up" aria-hidden="true"></i>
									</div>
									<div class="margin-top-8">
										<i class="fa fa-caret-down" aria-hidden="true"></i>
									</div>
								</div>
							</th>
							<th class="width5">Status(n)
								<div class="float_right">
									<div>
										<i class="fa fa-caret-up" aria-hidden="true"></i>
									</div>
									<div class="margin-top-8">
										<i class="fa fa-caret-down" aria-hidden="true"></i>
									</div>
								</div>
							</th>
							<th class="width5 text-center">Action taken
								<div class="float_right">
									<div>
										<i class="fa fa-caret-up" aria-hidden="true"></i>
									</div>
									<div class="margin-top-8">
										<i class="fa fa-caret-down" aria-hidden="true"></i>
									</div>
								</div>
							</th>
						</tr>
						<tr ng-repeat="info in commonList | orderBy : 'productsCode' | filter:searchText">
							<td>{{info.productsCode}}</td>
							<td>{{info.productsDesc}}</td>
							<td>
							<label class="switch"> 
							<input type="checkbox" ng-model="info.status"  ng-true-value="'A'"  ng-false-value="'I'"  ng-change="updateStatus(info.tubeFeedingProductsId, info.status)">
							<div class="slider round"></div>
							</label>
							</td>
							<td class="text-center"><a><i class="fa fa-pencil" aria-hidden="true" ng-click="showUpdateBtn(info.tubeFeedingProductsId)"></i></a></td>
						</tr>
					</table>
				</div>
				<!-- added Start code by Minesh -->
				<div class="row margin-bottom45 sss">
					<ul ng-if="pager.pages.length" class="pagination table-list" style="font-size: 14px;">
						<li ng-class="{disabled:pager.currentPage === 1}"><a
							ng-click="setPage(1,'true')">First</a></li>
						<li ng-class="{disabled:pager.currentPage === 1}"><a
							ng-click="setPage(pager.currentPage - 1,'true')">Previous</a></li>
						<li ng-repeat="page in pager.pages"
							ng-class="{active:pager.currentPage === page}"><a
							ng-click="setPage(page,'true')">{{page}}</a></li>
						<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
							<a ng-click="setPage(pager.currentPage + 1,'true')">Next</a>
						</li>
						<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
							<a ng-click="setPage(pager.totalPages,'true')">Last</a>
						</li>
					</ul>
				</div>
				<!-- added End code by Minesh -->
				
			</div>
	</div>
</div>
<script type="text/javascript">
	$(document).ready(function() {
		var documentHeight = $(window).height();
		var sideBarHeight = documentHeight - 55;
		$("#page-content-wrapper").css("height", sideBarHeight + "px");

		$(".selectedPageName").text("Tube Feeding Products");
		$(".sidebar-nav li").each(function() {
			$(this).find("a").parents("li").removeClass("active");
		});
		$('a[href$="tubeFeedingProducts"]').parents("li").addClass("active");
	});
</script>
