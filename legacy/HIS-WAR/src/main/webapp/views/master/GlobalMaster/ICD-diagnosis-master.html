									ng-if="saveBtnFlag"> <i class="fa fa-floppy-o"

									<a href=""

									data-toggle="modal" ng-click="update()"

					<div class="col-lg-4 col-md-4 col-sm-4 padding-left-right-set0 float_right">

		<div class="row padding-left-right-set4 margin-top2">

						<tr>

							<th>ICD10 Code</th>
							<th>ICD10 Description</th>
							<th>Gender</th>
							<th class="width6">Notifiable</th>
							<th class="width8">Communicable</th>
							<th class="width10">Non-Communicable</th>
							<th class="width8">Medico legal</th>
							<th class="width5 text-center">Status</th>
							<th class="width5 text-center">Action</th>
						</tr>
					</thead>
					<tbody>
						<tr ng-repeat="info in commonList|orderBy:column:reverse|filter:searchKeyword"">
							<td>{{info.diagnosisName}}</td>
							<td>{{info.code}}</td>
							<td  class="width3 text-center">
								<a data-toggle="modal" data-target="#fieldDetailsModal" ng-click="getGenderListByDiagnosisId(info)">
								<i class="fa fa-info-circle" aria-hidden="true" ></i>
								</a>
							</td>
							<td class="text-center width6">
								<div class="appointmentList btn-group colors margin-top2" ng-show="info.isNotifiable=='Y'">
									<img src="resources/assets/images/icon/check-mark.png" class="width21px " title="">
								</div>
							</td>
							<td class="text-center width6">
								<div class="appointmentList btn-group colors margin-top2" ng-show="info.isCommunicable=='Y'">
									<img src="resources/assets/images/icon/check-mark.png" class="width21px " title="">
								</div>
							</td>
							<td class="text-center width6">
								<div class="appointmentList btn-group colors margin-top2" ng-show="info.isNonCommunicable=='Y'">
									<img src="resources/assets/images/icon/check-mark.png" class="width21px " title="">
								</div>
							</td>
							<td class="text-center width6">
								<div class="appointmentList btn-group colors margin-top2" ng-show="info.isMedicoLegal=='Y'">
									<img src="resources/assets/images/icon/check-mark.png" class="width21px " title="">
								</div>
							</td>
							<td class="text-center">
								<label class="switch"> 
									<input type="checkbox" ng-model="info.status" ng-true-value="'A'" ng-false-value="'I'" ng-change="updateStatus(info.diagnosisId,info.status)">
									<div class="slider round"></div>
								</label>
							</td>
							<td class="padding-edit-button-table text-center vertical-middle">
								<a title="Edit" ng-click="showUpdateBtn(info)"><i class="fa fa-pencil" aria-hidden="true"></i></a>
							</td>
						</tr>
					</tbody>
				</table>
				<div class="row margin-bottom45 sss">
					<ul ng-if="pager.pages.length" class="pagination table-list"
						style="font-size: 14px;">
						<li ng-class="{disabled:pager.currentPage === 1}"><a
							ng-click="setPage(1,'true')">First</a></li>
						<li ng-class="{disabled:pager.currentPage === 1}"><a
							ng-click="setPage(pager.currentPage - 1,'true')">Previous</a></li>
						<li ng-repeat="page in pager.pages"
							ng-class="{active:pager.currentPage === page}"><a
							ng-click="setPage(page,'true')">{{page}}</a></li>
						<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
							<a ng-click="setPage(pager.currentPage + 1,'true')">Next</a>
						</li>
						<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
							<a ng-click="setPage(pager.totalPages,'true')">Last</a>
						</li>
					</ul>

<div id="fieldDetailsModal" class="modal fade ng-scope in common-small-popup" role="dialog" >
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<div class="modal-title patient-details-row">
					Gender Details
					<button type="button" class="close" data-dismiss="modal">&times;</button>
				</div>
			</div>
			<div class="modal-body">
				<div class="row serachedPatientList padding-left-right-set4">
					<div class="col-md-12 col-lg-12  fix-height-scroll230">
						<table class="table table-bordered  margin-top4">
							<thead>
								<tr>
							 		<th><span class="">Sr No.</span></th>
									<th><span class="">Gender</span></th>
								</tr>
							</thead>
							<tbody>
								<tr ng-repeat="info in listOfGenderByDiagnosisId  track by $index">
									<td>{{$index+1}}</td>
									<td>{{info.genderDesc}}</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
		</div>
	</div>
