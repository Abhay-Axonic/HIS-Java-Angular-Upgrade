<style>
.text-search-box{
	border: 1px solid #f9f9f9 !important;
    padding-left: 25px !important;
    font-size: 13px !important;
    color: #272325 !important;
    background-color: #fff !important;
    -webkit-box-shadow: 0px 0px 0px 1px rgba(0, 0, 0, 0.25) !important;
    -moz-box-shadow: 0 1px 2px rgba(0, 0, 0, 0.16) !important;
    -webkit-box-shadow: 0px 0px 0px 1px rgba(0, 0, 0, 0.25) !important;
    -o-box-shadow: 0 1px 2px rgba(0, 0, 0, 0.16) !important;
    transition: all 0.2s linear !important;
    -moz-transition: all 0.2s linear !important;
    -webkit-transition: all 0.2s linear !important;
    -o-transition: all 0.2s linear !important;
    width: 100% !important;
    margin-bottom: -8px !important !important;
    height: 32px !important;
    margin-top: 6px !important;
    border-radius: 4px !important;
}
</style>

<div id="page-content-wrapper">
	<div class="container-fluid his-style">
			<div class="row padding-top8">
				<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<input type="text" autocomplete="off" name="" class="text-input floating-label" ng-model="checklistItemObj.code"> 
							<label for="code">Code</label>
						</div>
					</div>
				</div>
				<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<input type="text" autocomplete="off" name="" class="text-input floating-label" ng-model="checklistItemObj.description"> 
							<label for="code">Description</label>
						</div>
					</div>
				 </div>
			</div>
			
			<div class="row margin-top10 padding-left-right-set1">
			
			<div class="col-md-6 col-sm-7 padding-left-right-set4">
				<div class="row">
					<div class="col-lg-3 col-md-6 col-sm-6" style="padding-left: 0px;">
						<div class="search">
						<label class="show-entries">Show 
						<select name="DataTables_Table_0_length" aria-controls="DataTables_Table_0"
							ng-init="noOfRecordsPerPage='10'" ng-model="noOfRecordsPerPage"
							ng-change="setNoOfRecords();" class="search-popUp-ddl">
								<option value="10">10</option>
								<option value="25">25</option>
								<option value="50">50</option>
								<option value="100">100</option>
						</select> entries
						</label>
					</div>
					</div>
				</div>
			</div>
				<div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
					<div class=" padding-top4">
						 <a href="" class="btn btn-primary btn-save-box-shadow text-width-auto" title="Save" ng-click="saveCheckListItem();">
		        			<i class="fa fa-floppy-o" style="font-size: 21px;width: 100%;" aria-hidden="true"></i></a>
		      		</div>
				</div>
				<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set0 float_right">
					<input type="text" autocomplete="off" class="text-search-box oneeeee" placeholder="Search" style="margin-top: 0px;" ng-model="searchKeyword">
					 <i class="fa fa-search common-search-text-icon padding-top8" aria-hidden="true"></i>
				</div>
			</div>
			
			<div class="row padding-left-right-set4 table-container padding-top8">
			<div class="table-container">
				<div class="table-container-header">
					<table class="table table-striped table-hover table-condensed table-bordered">
						<thead>
							<tr class="">
								<th class="width5">Code</th>
								<th class="width12">Description</th>
								<th class="width3 text-center">Status(n)</th>
								<th class="width3 text-center">Action taken</th>
							</tr>
						</thead>
					</table>
				</div>
				<div class="table-container-body fix-height-scroll400" style="overflow: overlay;"> <!-- fix-height-scroll230, background: #fff; -->
					<table class="table table-striped table-hover table-condensed table-bordered">
						<tbody>

							<tr ng-repeat="info in checklistItemList|filter:searchKeyword">
								<td class="width5">{{info.code}}</td>
								<td class="width12">{{info.description}}</td>
								<td class="width3 text-center">
									<label class="switch vertical-middle"> 
										<input type="checkbox" ng-model="info.status" ng-true-value="'A'" ng-false-value="'I'" ng-change="updateStatus(info.checklistItemMasterId,info.status)">
										<div class="slider round"></div>
									</label>
								</td>
								<td class="width3 text-center">
									<a><i class="fa fa-pencil" aria-hidden="true" ng-click="update(info);" ></i></a>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
		<div class="row margin-bottom45 sss">
					     <ul ng-if="pager.pages.length" class="pagination table-list"
						style="font-size: 14px;">
						<li ng-class="{disabled:pager.currentPage === 1}"><a
							ng-click="setPage(1,'true')">First</a></li>
						<li ng-class="{disabled:pager.currentPage === 1}"><a
							ng-click="setPage(pager.currentPage - 1,'true')">Previous</a></li>
						<li ng-repeat="page in pager.pages"
							ng-class="{active:pager.currentPage === page}"><a
							ng-click="setPage(page,'true')">{{page}}</a></li>
						<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
							<a ng-click="setPage(pager.currentPage + 1,'true')">Next</a>
						</li>
						<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
							<a ng-click="setPage(pager.totalPages,'true')">Last</a>
						</li>
					    </ul>
		</div>
	</div>
</div>

<script type="text/javascript">
$(document).ready(function() {
	var documentHeight= $(window).height();
    var sideBarHeight = documentHeight - 55;
  $("#page-content-wrapper").css("height", sideBarHeight + "px" );
  
  $(".selectedPageName").text("Checklist Item");
	$(".sidebar-nav li").each(function() {
		$(this).find("a").parents("li").removeClass("active");
	});
	$('a[href$="checklistItem"]').parents("li").addClass("active");
});
</script>
