						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<div class="">
								<select class="text-input floating-label" ng-model="notesObj.templateFormatId" convert-to-number>
									    <option selected="" value="">Select Template Format</option>
							    		<option value="3">Form Engine</option>

								</select> <label for="code">Template Format

						</div>

				<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top4" style="margin-top: 20px;">

						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<input type="text" autocomplete="off" name="" class="text-input floating-label" ng-model="notesObj.code"> 
							<label for="code">Code
								<span class="star">*</span>
							</label>
						</div>
					</div>
				</div>
				<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top4" style="margin-top: 20px;">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<input type="text" autocomplete="off" name="" class="text-input floating-label" ng-model="notesObj.description"> 
							<label for="code">Description
								<span class="star">*</span>
							</label>
						</div>
					</div>
				 </div>
				 <div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top4" style="margin-top: 20px;">
			 		<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<div class="">
								<select class="text-input floating-label" ng-model="notesObj.noteType" convert-to-number>
									<option value="1">Anesthesia Notes</option>
									<option value="3">Discharge Notes</option>
									<option value="4">Follow-up Notes</option>
									<option value="2">Surgery Notes</option>
								</select> <label for="code">Note Type
									<span class="star">*</span>
								</label>
							</div>
						</div>
					</div>
				</div>
				<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top4"  ng-if="notesObj.templateFormatId==2" style="margin-top: 20px;">
					<div class="" ng-if="notesObj.templateFormatId==2">
						<a href="">
							<input type="button" value="Add Template" class="btn btn-primary btn-save-box-shadow" data-target="#addNotesModal" data-toggle="modal" id="addBtn">
						</a>
					</div>
				</div>
					<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top4" ng-if="notesObj.templateFormatId==3"  style="margin-left: 15px;">
					
					<div class="" ng-if="notesObj.templateFormatId==3">
					<label  for="code" style="color: #3f51b5;">Template Title <span class="star">*</span> </label>
					<input ng-if="notesObj.templateFormatId==3" autocomplete="off"   class="text-input floating-label" id="templateTitle" 
					 type="text" ng-model="notesObj.title" placeholder="Custom template"
					  uib-typeahead="temp as temp.templateName for temp in newTemplateList | filter:{templateName:$viewValue}" 
					  class="form-control"  
					   typeahead-show-hint="true" typeahead-min-length="1"  typeahead-on-select="templateSelect($item)" required>
					   </div>
				</div>
				
				<div class="col-md-2 col-sm-2 padding-left-right-set4 text-width-auto" ng-if="notesObj.templateFormatId==3" style="margin-top: 20px;">
					<input ng-show="notesObj.title" type="submit" 
					value="Preview" ng-click="previewTemplate();" class="btn btn-primary" id="updateBtn" style="">
				</div>
			</div>
			
			<div class="row padding-top8">

						</div>
					</div>
				</div> -->
			</div>
			
			
			<div class="row margin-top10 padding-left-right-set1">
			<div class="col-md-6 col-sm-7 padding-left-right-set4">
					<div class="row">
						<div class="col-lg-3 col-md-6 col-sm-6" style="padding-left: 0px;">
							<div class="search">
							<label class="show-entries">Show 
							<select name="DataTables_Table_0_length" aria-controls="DataTables_Table_0"
								ng-init="noOfRecordsPerPage='10'" ng-model="noOfRecordsPerPage"
								ng-change="setNoOfRecords();" class="search-popUp-ddl">
									<option value="10">10</option>
									<option value="25">25</option>
									<option value="50">50</option>
									<option value="100">100</option>
							</select> entries
							</label>
						</div>
						</div>
					</div>
				</div>
				
				
				<div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
					<div class=" padding-top4"> <!--  change savebtn and updatebtn by minesh -->
						 <a href="" class="btn btn-primary btn-save-box-shadow text-width-auto" title="Save"  ng-if="saveBtnFlag" ng-click="saveNotesMaster();">
		        			<i class="fa fa-floppy-o" style="font-size: 21px;width: 100%;" aria-hidden="true"></i></a>
   						<a href="" class="btn btn-primary btn-save-box-shadow text-width-auto" title="Update"  ng-if="updateBtnFlag" ng-click="updateNotesMaster();">
		        			<i class="fa fa-floppy-o" style="font-size: 21px;
   							 	border-color: #FFB800 !important;  width: 100%;" aria-hidden="true"></i></a> <!-- end change savebtn and updatebtn by minesh -->
		      		</div>
				</div>
				<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set0 float_right">
					<input type="text" autocomplete="off" class="text-search-box oneeeee" placeholder="Search" style="margin-top: 0px;" ng-model="searchWord">
					 <i class="fa fa-search common-search-text-icon padding-top8" aria-hidden="true"></i>
				</div>
			</div>
			
			<div class="row padding-left-right-set4 table-container padding-top8">
			<div class="table-container">
				<div class="table-container-header">
					<table class="table table-striped table-hover table-condensed table-bordered">
						<thead>
							<tr class="">
							    <th class="width3">Template Format</th>
								<th class="width3">Code</th>
								<th class="width10">Description</th>
								<th class="width3">Type</th>
								<th class="width2 text-center">View</th>
								<th class="width2 text-center">Status(n)</th>
								<th class="width2 text-center">Action taken</th>
							</tr>
						</thead>
					</table>
				</div>
				<div class="table-container-body fix-height-scroll400" style="overflow: overlay;"> <!-- fix-height-scroll230, background: #fff; -->
					<table class="table table-striped table-hover table-condensed table-bordered">
						<tbody>
							<tr ng-repeat="info in notesMasterList|filter:searchWord">
							    <td class="width3">
								    <div ng-if="info.templateFormatId == 2">
								        Word Template
								    </div>
								    <div ng-if="info.templateFormatId == 3">
								         Form Engine
								    </div>
							    </td>
							
								<td class="width3">{{info.code}}</td>
								<td class="width10">{{info.description}}</td>
								<td class="width3">
									<div ng-if="info.noteType==1">Anesthesia Notes</div>
									<div ng-if="info.noteType==2">Surgery Notes</div>
									<div ng-if="info.noteType==3">Discharge Notes</div>
									<div ng-if="info.noteType==4">Follow-up Notes</div>
								</td>
								<td class="width2 text-center">
									<a class="" title="Info" data-toggle="modal" ng-click="showTemplate(info);"><i class="fa fa-info-circle" ></i></a>
								</td>
								<td class="width2 text-center">
									<label class="switch vertical-middle"> 
										<input type="checkbox" ng-model="info.status" ng-true-value="'A'" ng-false-value="'I'" ng-change="updateStatus(info.noteMasterId ,info.status)">
										<div class="slider round"> </div>
										
									</label>
								</td>
								<td class="width2 text-center">
									<a class="" title="Edit"><i class="fa fa-pencil" ng-click="update(info);"></i></a>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
				<div class="row margin-bottom45 sss">
					  <ul ng-if="pager.pages.length" class="pagination table-list"
						style="font-size: 14px;">
						<li ng-class="{disabled:pager.currentPage === 1}"><a
							ng-click="setPage(1,'true')">First</a></li>
						<li ng-class="{disabled:pager.currentPage === 1}"><a
							ng-click="setPage(pager.currentPage - 1,'true')">Previous</a></li>
						<li ng-repeat="page in pager.pages"
							ng-class="{active:pager.currentPage === page}"><a
							ng-click="setPage(page,'true')">{{page}}</a></li>
						<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
							<a ng-click="setPage(pager.currentPage + 1,'true')">Next</a>
						</li>
						<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
							<a ng-click="setPage(pager.totalPages,'true')">Last</a>
						</li>
					</ul>
				</div>
			</div>
		</div>
	</div>
</div>

<div id="addNotesModal" class="modal fade ng-scope in" role="dialog" data-keyboard="false" data-backdrop="static">
	<div class="modal-dialog"> <!-- width: 25% !important;margin: 200px 0 0 510px !important; -->
		<div class="modal-content">
			<div class="modal-header padding-zero" style="padding:0px;">
				<div class="modal-title patient-details-row">
					Add Template
					<button type="button" class="close" data-dismiss="modal">&times;</button>
				</div>
			</div>
			<div class="modal-body">
				<div class="row  padding-left-right-10">
					<div class="row margin-top10">
						<div id="formeo-editor"></div>
						<div id="myHtml" class="render-form" style="display: none"></div>
					</div>
					<div class="col-lg-12 col-md-12">
						<textarea name="editor" type="text" autocomplete="off" id="editor" rows="10" cols="50" ck-editor ng-model="notesObj.template"></textarea>
					</div>
				</div>
			</div>
			<div class="modal-footer" style="border:none;">
				<button type="button" data-dismiss="modal" class="btn btn-primary" id="">Save</button>
				<button type="button" data-dismiss="modal" class="btn btn-primary">Cancel</button>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
$(document).ready(function() {
	var documentHeight= $(window).height();
    var sideBarHeight = documentHeight - 55;
  $("#page-content-wrapper").css("height", sideBarHeight + "px" );
  
  $(".selectedPageName").text("Notes Master");
	$(".sidebar-nav li").each(function() {
		$(this).find("a").parents("li").removeClass("active");
	});
	$('a[href$="notesMaster"]').parents("li").addClass("active");
});
</script>
