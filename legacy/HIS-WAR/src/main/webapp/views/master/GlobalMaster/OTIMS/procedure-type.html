
<style>
.text-search-box{
	border: 1px solid #f9f9f9 !important;
    padding-left: 25px !important;
    font-size: 13px !important;
    color: #272325 !important;
    background-color: #fff !important;
    -webkit-box-shadow: 0px 0px 0px 1px rgba(0, 0, 0, 0.25) !important;
    -moz-box-shadow: 0 1px 2px rgba(0, 0, 0, 0.16) !important;
    -webkit-box-shadow: 0px 0px 0px 1px rgba(0, 0, 0, 0.25) !important;
    -o-box-shadow: 0 1px 2px rgba(0, 0, 0, 0.16) !important;
    transition: all 0.2s linear !important;
    -moz-transition: all 0.2s linear !important;
    -webkit-transition: all 0.2s linear !important;
    -o-transition: all 0.2s linear !important;
    width: 100% !important;
    margin-bottom: -8px !important !important;
    height: 32px !important;
    margin-top: 6px !important;
    border-radius: 4px !important;
}
</style>

<div id="page-content-wrapper">
	<div class="container-fluid his-style">
		<form name="procedureTypeform" novalidate >
			<div class="row padding-top8">
				<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<div class="form-group" show-errors>
								<input required type="text" autocomplete="off" name="procedureTypeCode" class="text-input floating-label" ng-model="common.procedureTypeCode"> 
								<label for="code">Code</label>
								<p class="help-block" ng-if="procedureTypeform.procedureTypeCode.$error.required">Code is required</p>
							</div>
						</div>
					</div>
				</div>
				<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-sticky-note-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<div class="form-group" show-errors>
								<input required type="text" autocomplete="off" name="procedureTypeName" class="text-input floating-label" ng-model="common.procedureTypeName" >
								<label for="code">Type</label>
								<p class="help-block" ng-if="procedureTypeform.procedureTypeName.$error.required">Name is required</p>
							</div>
						</div>
					</div>
				</div>
					<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
						<div class="row input-container">
							<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
								<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
							</div>
							<div class="col-lg-11 col-sm-11 col-md-11">
								<div class="form-group" show-errors>
									<input required type="text" autocomplete="off" name="procedureTypeDesc" class="text-input floating-label" ng-model="common.procedureTypeDesc"> 
									<label for="code">Description</label>
									<p class="help-block" ng-if="procedureTypeform.procedureTypeDesc.$error.required">Description is required</p>
								</div>
							</div>
						</div>
					</div>
				</div>
			<div class="row margin-top10 padding-left-right-set1">
				<div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
					<div class=" padding-top4">
						 <a href="" class="btn btn-primary btn-save-box-shadow" title="Save" data-toggle="modal" ng-click="save()"
										ng-if="saveBtnFlag"> <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
						<a href="" class="btn btn-primary btn-save-box-shadow" title="Update" data-toggle="modal" ng-click="update()"
										ng-if="updateBtnFlag"> <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
		      		</div>
				</div>
				<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set0 float_right">
					<input type="text" autocomplete="off" class="text-search-box oneeeee" placeholder="Search" ng-model="searchKeyword" ng-keyup="serachTestmaster(searchKeyword);" style="margin-top: 0px;">
					 <i class="fa fa-search common-search-text-icon padding-top8" aria-hidden="true"></i>
				</div>
			</div>
			
			
			<div class="row padding-left-right-set4 margin-top8">
				<div class="col-md-6 col-sm-7 padding-left-right-set4">
							<div class="row">
								<div class="col-lg-3 col-md-6 col-sm-6" style="padding-left: 0px;">
									<div class="search">
										<label class="show-entries">Show <select
											name="DataTables_Table_0_length"
											aria-controls="DataTables_Table_0"
											ng-init="noOfRecordsPerPage='10'" ng-model="noOfRecordsPerPage"
											ng-change="setNoOfRecords();" class="search-popUp-ddl">
												<option value="10">10</option>
												<option value="25">25</option>
												<option value="50">50</option>
												<option value="100">100</option>
										</select> entries
										</label>
									</div>
								</div>
							</div>
						</div>
				<div class="col-md-12">
					<table class="table table-bordered">
						<tr class="">
							<th class="width5">Code
								<div class="float_right">
									<div>
										<i class="fa fa-caret-up" aria-hidden="true"></i>
									</div>
									<div class="margin-top-8">
										<i class="fa fa-caret-down" aria-hidden="true"></i>
									</div>
								</div>
							</th>
							<th class="width12">Name
								<div class="float_right">
									<div>
										<i class="fa fa-caret-up" aria-hidden="true"></i>
									</div>
									<div class="margin-top-8">
										<i class="fa fa-caret-down" aria-hidden="true"></i>
									</div>
								</div>
							</th>
							<th class="width18">Description
								<div class="float_right">
									<div>
										<i class="fa fa-caret-up" aria-hidden="true"></i>
									</div>
									<div class="margin-top-8">
										<i class="fa fa-caret-down" aria-hidden="true"></i>
									</div>
								</div>
							</th>
							<th class="width1">Status(n)
								<div class="float_right">
									<div>
										<i class="fa fa-caret-up" aria-hidden="true"></i>
									</div>
									<div class="margin-top-8">
										<i class="fa fa-caret-down" aria-hidden="true"></i>
									</div>
								</div>
							</th>
							<th class="width1 text-center">Action taken
								<div class="float_right">
									<div>
										<i class="fa fa-caret-up" aria-hidden="true"></i>
									</div>
									<div class="margin-top-8">
										<i class="fa fa-caret-down" aria-hidden="true"></i>
									</div>
								</div>
							</th>
						</tr>
						<tr ng-repeat="info in commonList | filter:searchKeyword track by $index">
							<td>{{info.procedureTypeCode}}</td>
							<td>{{info.procedureTypeName}}</td>
							<td>{{info.procedureTypeDesc}}</td>
							<td>
								<label class="switch"> 
									<input type="checkbox" ng-model="info.status" ng-true-value="'A'" ng-false-value="'I'"
														ng-change="updateStatus(info.procedureTypeId,info.status)">
									<div class="slider round"></div>
								</label>
							</td>
							<td class="text-center">
								<a ng-class="{disabled: info.status=='I'}"  ><i class="fa fa-pencil" aria-hidden="true" ng-click="showUpdateBtn(info.procedureTypeId)"></i></a>
							</td>
						</tr>
					</table>
					<div class="row margin-bottom45 sss">
									<ul ng-if="pager.pages.length" class="pagination table-list"
										style="font-size: 14px;">
										<li ng-class="{disabled:pager.currentPage === 1}"><a
											ng-click="setPage(1,'true')">First</a></li>
										<li ng-class="{disabled:pager.currentPage === 1}"><a
											ng-click="setPage(pager.currentPage - 1,'true')">Previous</a></li>
										<li ng-repeat="page in pager.pages"
											ng-class="{active:pager.currentPage === page}"><a
											ng-click="setPage(page,'true')">{{page}}</a></li>
										<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
											<a ng-click="setPage(pager.currentPage + 1,'true')">Next</a>
										</li>
										<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
											<a ng-click="setPage(pager.totalPages,'true')">Last</a>
										</li>
									</ul>
								</div>
				</div>
			</div>	
			</form>
		</div>
	</div>
<modal visible="showModal"></modal> 
<script type="text/javascript">
$(document).ready(function() {
	var documentHeight= $(window).height();
    var sideBarHeight = documentHeight - 55;
  $("#page-content-wrapper").css("height", sideBarHeight + "px" );
  
  $(".selectedPageName").text("Procedure Type");
	$(".sidebar-nav li").each(function() {
		$(this).find("a").parents("li").removeClass("active");
	});
	$('a[href$="procedureType"]').parents("li").addClass("active");
});
</script>
