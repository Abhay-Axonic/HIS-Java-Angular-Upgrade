				<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 float_right">

					 <i class="fa fa-search common-search-text-icon padding-top8" aria-hidden="true"></i>
				</div>

			<div class="row padding-left-right-set4 margin-top8">
				<div class="col-md-12">

						<tr class="">
							<th class="width10">Code</th>
							<th class="width10">Clinical Service Name</th>
							<th class="width10">Specialty</th>
							<th class="width10">Clinical Service Type</th>
							<th class="width3 text-center"> View</th>
							<th class="width5 text-center">Status(n)</th>
							<th class="width2 text-center">Action taken</th>
						</tr>
						<tr ng-repeat="proc in pagination.data | filter:searchKeyword">
							<td>{{proc.cptCode}}</td>
							<td>{{proc.service}}</td>
							<td>{{proc.speciality}}</td>
							<td>{{proc.procedureType}}</td>
							<td class="width3 text-center">
								<a class="" data-toggle="modal" data-target=""><i class="fa fa-info-circle" ng-click="viewProcConf(proc)"></i></a>
							</td>
							<td class="text-center">
								<label class="switch"> 
								<input type="checkbox" ng-true-value="'A'" ng-false-value="'I'" ng-change="changeStatus(proc.procedureConfigId,proc.status)" ng-model="proc.status">
										<div class="slider round"></div>
								</label>
							</td>
							<!-- <td class="text-center"
							 ng-click="editProcConf(proc)">
							 <i class="fa fa-pencil" aria-hidden="true"></i>
							 </td> -->
							 <td class="text-center">
								<a ng-click="editProcConf(proc)">
								<i class="fa fa-pencil" aria-hidden="true"></i></a>
							</td> 
						</tr>
					</table>
				</div>
				<div class="row margin-bottom45 center-block">
					<ul ng-if="pagination.totalPages > 1" class="pagination table-list"
						style="font-size: 14px; cursor: pointer;">
						<li ng-class="{disabled:pagination.currentPage === 1}"><a
							ng-click="pagination.setFirstPage(pagination)">First</a>
						</li>
						<li ng-class="{disabled:pagination.currentPage === 1}"><a
							ng-click="pagination.setPreviousPage(pagination)">Previous</a>
						</li>
						<li ng-repeat="page in pagination.getPagesList(pagination)"
							ng-class="{active:pagination.currentPage === page}"><a
							ng-click="pagination.setPage(page, pagination)">{{page}}</a>
						</li>
						<li ng-class="{disabled:pagination.currentPage === pagination.totalPages}">
							<a ng-click="pagination.setNextPage(pagination)">Next</a>
						</li>
						<li ng-class="{disabled:pagination.currentPage === pagination.totalPages}">
							<a ng-click="pagination.setLastPage(pagination)">Last</a>
						</li>
					</ul>

<script type="text/javascript">
$(document).ready(function() {
	var documentHeight= $(window).height();
    var sideBarHeight = documentHeight - 55;
  $("#page-content-wrapper").css("height", sideBarHeight + "px" );
  
  $(".selectedPageName").text("Procedure Configuration");
	$(".sidebar-nav li").each(function() {
		$(this).find("a").parents("li").removeClass("active");
	});
	$('a[href$="procedureConfigurations"]').parents("li").addClass("active");
});
</script>
