<!-- Page Content -->
<div id="page-content-wrapper">
	<div class="container-fluid his-style">
		<fieldset>
			<!-- <legend class="heading-div">Prefix Master</legend> -->
			<div class="row margin-top10">
				<form name="cardTypeform" novalidate>
					<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
						<div class="row input-container">
							<div class="col-lg-1 col-sm-2 col-md-2 polymer-icon">
								<i class="fa fa-dot-circle-o" aria-hidden="true"></i>
							</div>
							<div class="col-lg-11 col-sm-10 col-md-10 ">
								<div class="form-group"   show-errors>
								<input type="hidden" ng-model="cardType.cardTypeId">
									<input type="text" autocomplete="off" name="cardTypeCode" id="cardTypeCode"
										class="text-input floating-label" ng-model="cardType.cardTypeCode" required> <label for="code"
										class=""> Code</label>
										<p class="help-block" ng-if="cardTypeform.cardTypeCode.$error.required">Code is required</p>
								</div>
							</div>
						</div>
					</div>
					<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
						<div class="row input-container">
							<div class="col-lg-1 col-sm-2 col-md-2 polymer-icon">
								<i class="fa fa-sticky-note-o" aria-hidden="true"></i>
							</div>
							<div class="col-lg-11 col-sm-10 col-md-10 ">
								<div class="form-group"   show-errors>
									<input type="text" autocomplete="off" name="cardTypeName" id="cardTypeName"
										class="text-input floating-label" ng-model="cardType.cardTypeName" required > <label for="code"
										class="">Description</label>
										<p class="help-block" ng-if="cardTypeform.cardTypeName.$error.required">Name is required</p>
								</div>
							</div>
						</div>
					</div>
				</form>
			</div>
		</fieldset>
		<modal visible="showModal"></modal> 
		
			<div class="row padding-top10">
			   <div class="col-lg-8 col-md-8 col-sm-8 padding-left-right-set4">
								<div class="search">
									<label class="show-entries">Show 
									<select ng-init="pagination.pageSize='10'" 
										ng-model="pagination.pageSize" 
										ng-change="pagination.setTotalPages(pagination)" class="search-popUp-ddl">
											<option value="10">10</option>
											<option value="25">25</option>
											<option value="50">50</option>
											<option value="100">100</option>
									</select> (records) 
									</label>
								</div>
				</div>
				<div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
			        <a href="" class="btn btn-primary btn-save-box-shadow" title="Save" data-toggle="modal" ng-click="saveCardType()" ng-show="saveBtnFlag">
			        <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
			      	<!-- Update -->
			        <a href="" class="btn btn-primary btn-save-box-shadow" title="Update" data-toggle="modal" ng-click="updateCardType()" ng-show="updateBtnFlag">
			        <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
			      </div>
			      <div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set0 float_right">
			        <input type="text" autocomplete="off" class="text-search-box ng-pristine ng-untouched ng-valid ng-empty search-popUp-ddl" placeholder="Search" style="margin-top:0px" ng-model="searchKeyword">
			        <i class="fa fa-search common-search-text-icon" aria-hidden="true"></i>
			      </div>
			</div>
		
		<div class="row padding-top5 padding-left-right-set4">
			<div id="fixed-thead-tfoot-scroll" class="fixed-thead-tfoot-scroll fix-height-scroll420">
			  <table id="main-table" class="main-table width100">
			    <thead>
			      <tr class="">
					<th class="width8">Code</th>
					<th class="width15">Description</th>
					<th class="text-center width5" style="z-index:1023">Status(n)</th>
					<th class="text-center width5">Action taken</th>
				</tr>
			    </thead>
			    <tbody>
			      <tr ng-repeat="info in pagination.data|filter:searchKeyword">
						<td>{{info.cardTypeCode}}</td>
						<td>{{info.cardTypeName}}</td>
						<td class="text-center">
							<label class="switch"> 
							<input type="checkbox" ng-model="info.status"  ng-true-value="'A'"  ng-false-value="'I'"  ng-change="updateStatus(info.cardTypeId,info.status)">
							<div class="slider round"></div>
							</label>
						</td>
						<td class="text-center"><a><i class="fa fa-pencil" aria-hidden="true" ng-click="showUpdateBtn(info)"></i></a></td>
					</tr>
			    </tbody>
			  </table>
			</div>
			<div class="row margin-bottom45 center-block">
				<ul ng-if="pagination.totalPages > 1" class="pagination table-list"
					style="font-size: 14px; cursor: pointer;">
					<li ng-class="{disabled:pagination.currentPage === 1}"><a
						ng-click="pagination.setFirstPage(pagination)">First</a>
					</li>
					<li ng-class="{disabled:pagination.currentPage === 1}"><a
						ng-click="pagination.setPreviousPage(pagination)">Previous</a>
					</li>
					<li ng-repeat="page in pagination.getPagesList(pagination)"
						ng-class="{active:pagination.currentPage === page}"><a
						ng-click="pagination.setPage(page, pagination)">{{page}}</a>
					</li>
					<li ng-class="{disabled:pagination.currentPage === pagination.totalPages}">
						<a ng-click="pagination.setNextPage(pagination)">Next</a>
					</li>
					<li ng-class="{disabled:pagination.currentPage === pagination.totalPages}">
						<a ng-click="pagination.setLastPage(pagination)">Last</a>
					</li>
				</ul>
			</div>
		</div>
</div>
</div>
<script type="text/javascript">
$(document).ready(function() {
	var documentHeight= $(window).height();
    var sideBarHeight = documentHeight - 55;
 	$("#page-content-wrapper").css("height", sideBarHeight + "px" );
});	
	$(".selectedPageName").text("Card Type  Master");
	$(".sidebar-nav li").each(function() {
		$(this).find("a").parents("li").removeClass("active");
	});
	$('a[href$="cardTypeMaster"]').parents("li").addClass("active");
</script>
