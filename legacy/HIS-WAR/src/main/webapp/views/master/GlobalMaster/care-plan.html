
	<div id="page-content-wrapper">
		<div class="container-fluid his-style">
			<fieldset>
				 <!-- <legend class="heading-div">Care Plan Master</legend>  -->
				<form name="careplanform" novalidate>
					<div class="row padding-top8">
						<div
							class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
							<div class="row input-container">
								<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
									<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
								</div>
								<div class="col-lg-11 col-sm-11 col-md-11">
									<div class="form-group" show-errors>
										<input type="text" autocomplete="off" name="code" id="code"
											ng-model="carePlanMasterObj.code"
											class="text-input floating-label" required> <label
											for="code">CarePlan Code<span class="star">*</span></label>
										<p class="help-block"
											ng-if="careplanform.code.$error.required">Code is
											required</p>
									</div>
								</div>
							</div>
						</div>
						<div
							class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
							<div class="row input-container">
								<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
									<i class="fa fa-sticky-note-o" aria-hidden="true"></i>
								</div>
								<div class="col-lg-11 col-sm-11 col-md-11">
									<div class="form-group" show-errors>
										<input type="text" autocomplete="off" name="name" id=""
											ng-model="carePlanMasterObj.name"
											class="text-input floating-label" required>
										<label for="code">CarePlan Name<span class="star">*</span></label>
										<p class="help-block"
											ng-if="careplanform.name.$error.required">Name is
											required</p>
									</div>
								</div>
							</div>
						</div>

						<div
							class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
							<div class="row input-container">
								<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
									<i class="fa fa-sticky-note-o" aria-hidden="true"></i>
								</div>
								<div class="col-lg-11 col-sm-11 col-md-11">
									<div class="form-group" show-errors>
										<input type="text" autocomplete="off" name="description" id=""
											ng-model="carePlanMasterObj.description"
											class="text-input floating-label" required>
										<label for="code">CarePlan Description<span class="star">*</span></label>
										<p class="help-block"
											ng-if="careplanform.description.$error.required">Description
											is required</p>
									</div>
								</div>
							</div>
						</div>
						
						
					<!-- 	<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
					<div class="row input-container">
						<div class="col-lg-2 col-sm-2 col-md-2 polymer-icon">
							<i class="fa fa-th" aria-hidden="true"></i>
						</div>
					
						 -->
 							<div
					class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-dot-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							
							<div class="">
									<label for="" class="LISDynamicLabel">Select Intervention<span class="star">*</span></label>
									<div class="custom-drop-down-btn" ng-dropdown-multiselect=""
										options="interventionList" 
										selected-model="selectedIntervention" >
									</div>
								</div>
						</div>
					</div>
				</div>
 
						
				<!-- 		
					</div> -->
				</div>


					
				</form>
			</fieldset>
					<modal visible="showModal"></modal>
			<div class="row margin-top10 padding-left-right-set1">
				<div
					class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
					<div class=" ">
						<a href="" class="btn btn-primary btn-save-box-shadow"
							title="Save" data-toggle="modal" ng-click="saveCarePlan()"
							ng-if="saveBtnFlag"> <i class="fa fa-floppy-o"
							style="font-size: 21px" aria-hidden="true"></i></a>
							 <a href=""
							class="btn btn-primary btn-save-box-shadow" title="Update"
							data-toggle="modal" ng-click="updateCarePlan()"
							ng-if="updateBtnFlag"> <i class="fa fa-floppy-o"
							style="font-size: 21px" aria-hidden="true"></i></a>
					</div>
				</div>
				<div
					class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set0 float_right">
					<input type="text" autocomplete="off" class="text-search-box" placeholder="Search" ng-model='searchText'
						style="margin-top: 0px"> <i
						class="fa fa-search common-search-text-icon" aria-hidden="true"></i>
				</div>
			</div>

	

			<div class="row padding-left-right-set4 margin-top8 table-container">
				<div class="col-lg-12 col-md-12 col-sm-12">
                	<div class="table-container">
						<div class="table-container-header" >
	                    <table class="table table-bordered table-hover table-condensed table-bordered">
						<tr class="">
							<th class="width10">Care Plan Code
								<div class="float_right">
									<div>
										<i class="fa fa-caret-up" aria-hidden="true"></i>
									</div>
									<div class="margin-top-8">
										<i class="fa fa-caret-down" aria-hidden="true"></i>
									</div>
								</div>
							</th>
							<th class="width10">Care Plan Name
								<div class="float_right">
									<div>
										<i class="fa fa-caret-up" aria-hidden="true"></i>
									</div>
									<div class="margin-top-8">
										<i class="fa fa-caret-down" aria-hidden="true"></i>
									</div>
								</div>
							</th>
							<th class="width10">Care Plan Description
								<div class="float_right">
									<div>
										<i class="fa fa-caret-up" aria-hidden="true"></i>
									</div>
									<div class="margin-top-8">
										<i class="fa fa-caret-down" aria-hidden="true"></i>
									</div>
								</div>
							</th>
								<th class="width10">Intervention Code
								<div class="float_right">
									<div>
										<i class="fa fa-caret-up" aria-hidden="true"></i>
									</div>
									<div class="margin-top-8">
										<i class="fa fa-caret-down" aria-hidden="true"></i>
									</div>
								</div>
							</th>
							<th class="width3">Status(n)
								<div class="float_right">
									<div>
										<i class="fa fa-caret-up" aria-hidden="true"></i>
									</div>
									<div class="margin-top-8">
										<i class="fa fa-caret-down" aria-hidden="true"></i>
									</div>
								</div>
							</th>
							<th class="width2 text-center">Action taken
								<div class="float_right">
									<div>
										<i class="fa fa-caret-up" aria-hidden="true"></i>
									</div>
									<div class="margin-top-8">
										<i class="fa fa-caret-down" aria-hidden="true"></i>
									</div>
								</div>
							</th>
						</tr>
					</table>
					</div>
						<div class="table-container-body" style="overflow: overlay; height:500px;"> <!-- fix-height-scroll230, background: #fff; -->
						    <table class="table table-striped table-hover table-condensed table-bordered">
								<tbody>
									<tr ng-repeat="info in carePlanList  | orderBy : 'name' | filter:searchText">
										<td class="width10">{{info.code}}</td>
										<td class="width10">{{info.name}}</td>
										<td class="width10">{{info.description}}</td>
										<td class="width10"><div ng-repeat="intervnetion in info.interventionVOs">
										 {{intervnetion.label}}</div></td>
										<td class="width3"><label class="switch"> <input type="checkbox"
												ng-model="info.status" ng-true-value="'A'" ng-false-value="'I'"
												ng-change="updateStatusCarePlan(info)">
												<div class="slider round"></div>
										</label></td>
										<td class="text-center width2"><a><i class="fa fa-pencil"
												aria-hidden="true" ng-click="editCarePlan(info)"></i></a></td>
									</tr>
								</tbody>
							</table>
						</div>
					</div>
				</div>
			</div>
		</div>
</div>
<script src="resources/assets/js/common/page-height.js"></script>
<script type="text/javascript">
  
  $(".selectedPageName").text("Care Plan");
	$(".sidebar-nav li").each(function() {
		$(this).find("a").parents("li").removeClass("active");
	});
	$('a[href$="careplan"]').parents("li").addClass("active");

</script>
