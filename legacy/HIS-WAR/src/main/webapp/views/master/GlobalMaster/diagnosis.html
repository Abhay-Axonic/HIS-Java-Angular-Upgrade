<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Insert title here</title>
</head>
<body>

	<!-- <div class="row">
		<p class="legend">Activity Master</p>
	</div>
 -->
	<div id="page-content-wrapper">
		<div class="container-fluid his-style">
			<fieldset>
				 <!-- <legend class="heading-div">Diagnosis Master1</legend>  -->
				<form name="diagnosisform" novalidate>
					<div class="row padding-top8">
						<div
							class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
							<div class="row input-container">
								<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
									<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
								</div>
								<div class="col-lg-11 col-sm-11 col-md-11">
									<div class="form-group" show-errors>
										<input type="text" autocomplete="off" name="domain" id="domain"
											ng-model="diagnosisMasterObj.domain"
											class="text-input floating-label" required> <label
											for="code">Diagnosis Code<span class="star">*</span></label>
										<p class="help-block"
											ng-if="diagnosisform.domain.$error.required">Domain is
											required</p>
									</div>
								</div>
							</div>
						</div>
						<div
							class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
							<div class="row input-container">
								<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
									<i class="fa fa-sticky-note-o" aria-hidden="true"></i>
								</div>
								<div class="col-lg-11 col-sm-11 col-md-11">
									<div class="form-group" show-errors>
										<input type="text" autocomplete="off" name="description" id=""
											ng-model="diagnosisMasterObj.description"
											class="text-input floating-label" required="required">
										<label for="code">Diagnosis Description<span class="star">*</span></label>
										<p class="help-block"
											ng-if="diagnosisform.description.$error.required">Description
											is required</p>
									</div>
								</div>
							</div>
						</div>
						<div
							class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
							<div class="row input-container">
								<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
									<i class="fa fa-sticky-note-o" aria-hidden="true"></i>
								</div>
								<div class="col-lg-11 col-sm-11 col-md-11">
									<div class="form-group" show-errors>
										<input type="text" autocomplete="off" name="className" id=""
											ng-model="diagnosisMasterObj.className"
											class="text-input floating-label" required>
										<label for="code">Diagnosis Class<span class="star">*</span></label>
										<p class="help-block"
											ng-if="diagnosisform.className.$error.required">Class is
											required</p>
									</div>
								</div>
							</div>
						</div>
						
						
 
 							<div
					class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-dot-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							
							<div class="">
									<label for="" class="LISDynamicLabel">Select CarePlan<span class="star">*</span></label>
									<div class="custom-drop-down-btn" ng-dropdown-multiselect=""
										options="carePlanList" 
										selected-model="selectedCarePlan" >
									</div>
								</div>
						</div>
					</div>
				</div>


					</div>
				</form>
			</fieldset>
					<modal visible="showModal"></modal>
			<div class="row margin-top10 padding-left-right-set1">
				<div
					class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
					<div class=" ">
						<a href="" class="btn btn-primary btn-save-box-shadow"
							title="Save" data-toggle="modal" ng-click="saveDiagnosis()"
							ng-if="saveBtnFlag"> <i class="fa fa-floppy-o"
							style="font-size: 21px" aria-hidden="true"></i></a>
							 <a href=""
							class="btn btn-primary btn-save-box-shadow" title="Update"
							data-toggle="modal" ng-click="updateCarePlan()"
							ng-if="updateBtnFlag"> <i class="fa fa-floppy-o"
							style="font-size: 21px" aria-hidden="true"></i></a>
					</div>
				</div>
				<div
					class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set0 float_right">
					<input type="text" autocomplete="off" class="text-search-box" placeholder="Search" ng-model='searchText'
						style="margin-top: 0px"> <i
						class="fa fa-search common-search-text-icon" aria-hidden="true"></i>
				</div>
			</div>

	

			<div class="row padding-left-right-set4 margin-top8">
				<div class="col-md-12">
					<table class="table table-bordered">
						<tr class="">
							<th class="width10 text-center">Diagnosis Domain
								<div class="float_right">
									<div>
										<i class="fa fa-caret-up" aria-hidden="true"></i>
									</div>
									<div class="margin-top-8">
										<i class="fa fa-caret-down" aria-hidden="true"></i>
									</div>
								</div>
							</th>
							<th class="width10 text-center">Diagnosis Description
								<div class="float_right">
									<div>
										<i class="fa fa-caret-up" aria-hidden="true"></i>
									</div>
									<div class="margin-top-8">
										<i class="fa fa-caret-down" aria-hidden="true"></i>
									</div>
								</div>
							</th>
							<th class="width10 text-center">Diagnosis Class Name</th>
								<div class="float_right">
									<div>
										<i class="fa fa-caret-up" aria-hidden="true"></i>
									</div>
									<div class="margin-top-8">
										<i class="fa fa-caret-down" aria-hidden="true"></i>
									</div>
								</div>
							</th>
								<th class="width10 text-center">CarePlan Code
								<div class="float_right">
									<div>
										<i class="fa fa-caret-up" aria-hidden="true"></i>
									</div>
									<div class="margin-top-8">
										<i class="fa fa-caret-down" aria-hidden="true"></i>
									</div>
								</div>
							</th>
							<th class="width5 text-center" >Status(n)
								<div class="float_right">
									<div>
										<i class="fa fa-caret-up" aria-hidden="true"></i>
									</div>
									<div class="margin-top-8">
										<i class="fa fa-caret-down" aria-hidden="true"></i>
									</div>
								</div>
							</th>
							<th class="width2 text-center">Action taken
								<div class="float_right">
									<div>
										<i class="fa fa-caret-up" aria-hidden="true"></i>
									</div>
									<div class="margin-top-8">
										<i class="fa fa-caret-down" aria-hidden="true"></i>
									</div>
								</div>
							</th>
						</tr>
						<tr ng-repeat="info in diagnosisList | orderBy : 'className' | filter:searchText">
							<td>{{info.domain}}</td>
							<td>{{info.description}}</td>
							<td>{{info.className}}</td>
							<td><div ng-repeat="carePlan in info.carePlanVOs">
							 {{carePlan.code}}</div></td>
							<td><label class="switch"> <input type="checkbox"
									ng-model="info.status" ng-true-value="'A'" ng-false-value="'I'"
									ng-change="updateStatusDiagnosis(info)">
									<div class="slider round"></div>
							</label></td>
							<td class="text-center"><a><i class="fa fa-pencil"
									aria-hidden="true" ng-click="editDiagnosis(info)"></i></a></td>
						</tr>
					</table>
				</div>
			</div>
		</div>
	</div>





</body>
</html>
