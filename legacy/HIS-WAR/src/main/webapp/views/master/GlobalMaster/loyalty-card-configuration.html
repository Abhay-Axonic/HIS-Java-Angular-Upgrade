<!-- Page Content -->
<div id="page-content-wrapper">
	<div class="container-fluid his-style">
		<fieldset>
			<!-- <legend class="heading-div"> Document Type Master</legend> -->
			
		</fieldset>
		<div class="row padding-top10">
			<div class="col-lg-2 col-md-2 col-sm-3 padding-left-right-set4 padding-top10">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11">
						<div class="">
							<input type="text" autocomplete="off" name="description" id="" class="text-input floating-label dirty" ng-model="common.minStartAmount"> 
							<label for="description" class="LISDynamicLabel">Minimum Amt To Start<span class="star">*</span></label>
						</div>
					</div>
				</div>
			</div>
			<div class="col-lg-2 col-md-2 col-sm-3 padding-left-right-set4 padding-top10">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11">
						<div class="">
							<input type="text" autocomplete="off" name="description" id="" class="text-input floating-label dirty" ng-model="common.thresholdAmount"> 
							<label for="description" class="LISDynamicLabel">Threshold Level<span class="star">*</span></label>
						</div>
					</div>
				</div>
			</div>
			<div class="col-lg-2 col-md-2 col-sm-3 padding-left-right-set4 padding-top10">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11">
						<div class="">
							<input type="text" autocomplete="off" name="description" id="" class="text-input floating-label dirty" ng-model="common.minRechargeAmount"> 
							<label for="description" class="LISDynamicLabel">Minimum Recharge Amt<span class="star">*</span></label>
						</div>
					</div>
				</div>
			</div>
		</div>
		<modal visible="showModal"></modal> 
					
		<div class="row">
			<div class="col-md-6 col-sm-7 padding-left-right-set4 padding-top10">
				<div class="row">
					<div class="col-lg-3 col-md-6 col-sm-6" style="padding-left: 0px;">
						<div class="search">
						<label class="show-entries">Show 
						<select name="DataTables_Table_0_length" aria-controls="DataTables_Table_0"
							ng-init="noOfRecordsPerPage='10'" ng-model="noOfRecordsPerPage"
							ng-change="setNoOfRecords();" class="search-popUp-ddl">
								<option value="10">10</option>
								<option value="25">25</option>
								<option value="50">50</option>
								<option value="100">100</option>
						</select> entries
						</label>
					</div>
					</div>
				</div>
			</div>
			<div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto padding-top5">
		        <a href="" class="btn btn-primary btn-save-box-shadow" title="Save" data-toggle="modal" ng-click="save()"
										ng-if="saveBtnFlag"> <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
										
						<a href="" class="btn btn-primary btn-save-box-shadow" title="Update" data-toggle="modal" ng-click="update()"
										ng-if="updateBtnFlag"> <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
		      </div>
		     <div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set0 float_right">
					<input type="text" autocomplete="off" class="text-search-box oneeeee" placeholder="Search" ng-model="searchKeyword">
					 <i class="fa fa-search common-search-text-icon padding-top8" aria-hidden="true"></i>
				</div>
		</div>
			
		<div class="row padding-left-right-set4 margin-top8">
			<div class="col-md-12">
				<table class="table table-bordered">
				<thead>
					<tr class="">
						<th class="width12">
							Minimum Amount To Start
						</th>
						<th class="width10">
							Threshold Level
						</th>
						<th class="width10">
							Minimum Recharge Amount
						</th>
						<th class="width3 text-center">
							Status(n)
						</th>
						<th class="width3 text-center">
							Action taken
						</th>
					</tr>
					</thead>
					<tbody>
					<tr ng-repeat="info in commonList|orderBy:column:reverse|filter:searchKeyword">
						<td>{{info.minStartAmount}}</td>
						<td>{{info.thresholdAmount}}</td>
						<td>{{info.minRechargeAmount}}</td>
						<td class="text-center">
							<label class="switch"> 
							<input type="checkbox" ng-model="info.status" ng-checked="info.status=='A'" ng-true-value="'A'" ng-false-value="'I'" ng-change="updateStatus(info.cardConfigurationId,info.status)">
							<div class="slider round"></div>
							</label>
						</td>
						<td class="text-center"><a><i class="fa fa-times" aria-hidden="true"  ng-click="getRemovedAction(info.cardConfigurationId)" ></i></a></td>
					</tr>
					</tbody>
				</table>
					<div class="row margin-bottom45 sss">
					<ul ng-if="pager.pages.length" class="pagination table-list"
						style="font-size: 14px;">
						<li ng-class="{disabled:pager.currentPage === 1}"><a
							ng-click="setPage(1,'true')">First</a></li>
						<li ng-class="{disabled:pager.currentPage === 1}"><a
							ng-click="setPage(pager.currentPage - 1,'true')">Previous</a></li>
						<li ng-repeat="page in pager.pages"
							ng-class="{active:pager.currentPage === page}"><a
							ng-click="setPage(page,'true')">{{page}}</a></li>
						<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
							<a ng-click="setPage(pager.currentPage + 1,'true')">Next</a>
						</li>
						<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
							<a ng-click="setPage(pager.totalPages,'true')">Last</a>
						</li>
					</ul>
				</div>
				
			</div>
		</div>
	</div>
</div>
<script type="text/javascript">
$(document).ready(function() {
});	
	$(".selectedPageName").text(" Loyalty Card Configuration");
	$(".sidebar-nav li").each(function() {
		$(this).find("a").parents("li").removeClass("active");
	});
	$('a[href$="loyaltyCardConfiguration"]').parents("li").addClass("active");
</script>
