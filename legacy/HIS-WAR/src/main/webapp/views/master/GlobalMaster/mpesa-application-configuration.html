<div id="page-content-wrapper" style="height:100%; overflow-y:auto ">
	<div class="container-fluid his-style">
		<div class="row padding-top10">
			<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top4">
			 		<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<div class="">
								<select class="text-input floating-label" ng-model="mpesaObj.unitId" convert-to-number>
	                            	<option value="">Choose</option>
	                            	<option ng-repeat="info in unitList" value="{{info.unitId}}">{{info.unitName}}</option>
		                         </select><label for="code">Hospital</label>
							</div>
						</div>
					</div>
				</div>
			<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<div class="">
								<input type="text" autocomplete="off" name="description" id="" class="text-input floating-label" ng-model="mpesaObj.businessShortcode"> 
								<label for="description" class="">Business Shortcode</label>
							</div>
						</div>
					</div>
				</div>
					<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<div class="">
								<input type="text" autocomplete="off" name="description" id="" class="text-input floating-label" ng-model="mpesaObj.partyB"> 
								<label for="description" class="">Party B</label>
							</div>
						</div>
					</div>
				</div>
				
				<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<div class="">
								<input type="text" autocomplete="off" name="description" id="" class="text-input floating-label" ng-model="mpesaObj.terminalMsisdn"> 
								<label for="description" class="">Terminal MSISDN</label>
							</div>
						</div>
					</div>
				</div>
		</div>
		<div class="row padding-top10">
		
			<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<div class="">
								<textArea  name="description" id="" class="text-input floating-label" ng-model="mpesaObj.validationPassword"> </textArea>
								<label for="description" class="">Validation Password</label>
							</div>
						</div>
					</div>
				</div>
			<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<div class="">
								<textArea  name="description" id="" class="text-input floating-label" ng-model="mpesaObj.stkPushPassword"> </textArea>
								<label for="description" class="">STK Push Password</label>
							</div>
						</div>
					</div>
				</div>
			
				<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon width6">
							<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<div class="">
								<textArea  name="description" id="" class="text-input floating-label" ng-model="mpesaObj.appKey"> </textArea>
								<label for="description" class="">App Key</label>
							</div>
						</div>
					</div>
				</div>
				<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<div class="">
								<textArea  name="description" id="" class="text-input floating-label" ng-model="mpesaObj.appSecretKey"> </textArea>
								<label for="description" class="">App Secret Key</label>
							</div>
						</div>
					</div>
				</div>
		</div>
		
		<div class="row margin-top10 padding-left-right-set1">
				<div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
					<div class=" padding-top4">
						 <a href="" class="btn btn-primary btn-save-box-shadow text-width-auto" title="Save">
		        			<i class="fa fa-floppy-o" style="font-size: 21px; width: 100%;" aria-hidden="true" ng-click="saveMpesa();"></i></a>
		      		</div>
				</div>
				<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 float_right margin-top5">
					<input type="text" autocomplete="off" class="text-search-box dirty" placeholder="Search" style="margin-top:0px">
					<i class="fa fa-search common-search-text-icon" aria-hidden="true"></i>
				</div>
			</div>
		
	<div class="row padding-top10 padding-left-right-set4 padding-top5">
		<div id="fixed-thead-tfoot-scroll" class="fixed-thead-tfoot-scroll fix-height-scroll510">
		  <table id="main-table" class="main-table">
		    <thead>
					<tr>
						<th class="width5">Hospital</th>
						<th class="width4">Business Shortcode</th>
						<th class="width3">Party B</th>
						<th class="width4">Terminal MSISDN</th>
						<th class="width4">Validation Password</th>
						<th class="width4">STK Push Password</th>
						<th class="width5">App Key</th>
						<th class="width5">App Secret Key</th>
						<th class="width2 text-center">Status</th>
						<th class="width2 text-center">Action</th>
						
					</tr>
				</thead>
		    <tbody>
		      <tr ng-repeat=" info in mpesaObjectList" >
				<td class="width5">{{info.unitName}}</td>
				<td class="width4">{{info.businessShortcode}}</td>
				<td class="width3">{{info.partyB}}</td>
				<td class="width4"><b>******...</b></td>
				<td class="width4"><b>******...</b></td>
				<td class="width4"><b>******************...</b></td>
				<td class="width5"><b>******...</b></td>
				<td class="width5"><b>******...</b></td>
				<td class="width2 text-center">
					<label class="switch vertical-middle"> 
							<input type="checkbox" ng-model="info.status" ng-true-value="'A'" ng-false-value="'I'" ng-change="updateStatus(info.mpesaApplicationConfigurationId,info.status)">
							<div class="slider round"></div>
					</label>
				</td>
				<td class="width2 text-center">
					<a><i class="fa fa-pencil" aria-hidden="true" ng-click="update(info);" ></i></a>
				</td>
			</tr>
		    </tbody>
		  </table>
		</div>
	</div>
	</div>
</div>
