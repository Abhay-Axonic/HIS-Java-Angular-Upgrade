<!-- Page Content -->
<div id="page-content-wrapper">
	<div class="container-fluid his-style">
		<form name="siteOfAdminform" novalidate >
		<div class="row margin-top10">
			<div class="col-lg-3 col-md-3 col-sm-4 padding-left-right-set4 padding-top8">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-dot-circle-o" aria-hidden="true"></i>
					</div>

					<div class="col-lg-11 col-sm-11 col-md-11 ">
						<div class="form-group" show-errors>
							<input type="text" autocomplete="off" class="text-input floating-label"
							ng-model="common.outsideHospitalCode" name="siteCode" required>
							<label>Hospital Code<span class="star">*</span></label>
							<p class="help-block" ng-if="siteOfAdminform.outsideHospitalCode.$error.required">Hospital Code is required</p>
						</div>
					</div>
				</div>
			</div>	
			<div class="col-lg-6 col-md-6 col-sm-6 padding-left-right-set4 padding-top8">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-dot-circle-o" aria-hidden="true"></i>
					</div>

					<div class="col-lg-11 col-sm-11 col-md-11 ">
						<div class="form-group" show-errors>
							<input type="text" autocomplete="off" class="text-input floating-label"
							ng-model="common.outsideHospitalDesc" name="siteName" required>
							<label>Hospital Name<span class="star">*</span></label>
							<p class="help-block" ng-if="siteOfAdminform.outsideHospitalDesc.$error.required">Hospital Name is required</p>
						</div>
					</div>
				</div>
			</div>	
			
		</div>
		
		<div class="row margin-top4 padding-left-right-10">
			<div class="col-md-6 col-sm-7 padding-left-right-set4 padding-top8">
				<div class="row">
					<div class="col-lg-3 col-md-6 col-sm-6" style="padding-left: 0px;">
						<div class="search">
						<label class="show-entries">Show 
						<select name="DataTables_Table_0_length" aria-controls="DataTables_Table_0"
							ng-init="noOfRecordsPerPage='10'" ng-model="noOfRecordsPerPage"
							ng-change="setNoOfRecords();" class="search-popUp-ddl">
								<option value="10">10</option>
								<option value="25">25</option>
								<option value="50">50</option>
								<option value="100">100</option>
						</select> entries
						</label>
					</div>
					</div>
				</div>
			</div>
			
			<div class="row margin-top10 padding-left-right-set1">
				<div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
					<div class=" ">
						 <a href="" class="btn btn-primary btn-save-box-shadow" title="Save" data-toggle="modal" ng-click="save()"
										ng-if="saveBtnFlag"> <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
										
						<a href="" class="btn btn-primary btn-save-box-shadow" title="Update" data-toggle="modal" ng-click="update()"
										ng-if="updateBtnFlag"> <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
		      		</div>
				</div>
				<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set0 float_right">
					<input type="text" autocomplete="off" class="text-search-box oneeeee" placeholder="Search" style="margin-top: 0px;" ng-model="searchKeyword" >
					 <i class="fa fa-search common-search-text-icon " aria-hidden="true"></i>
				</div>
			</div>
		</div>
		<div class="row padding-left-right-set4 table-container padding-top8">
			<div class="table-container">
				<div class="table-container-header">
					<table
						class="table table-striped table-hover table-condensed table-bordered">
						<thead>
							<tr class="">
								<th class="width5">Site Code
									<div class="float_right">
										<div>
											<i class="fa fa-caret-up" aria-hidden="true"></i>
										</div>
										<div class="margin-top-8">
											<i class="fa fa-caret-down" aria-hidden="true"></i>
										</div>
									</div>
								</th>
								<th class="width10">Site Name
									<div class="float_right">
										<div>
											<i class="fa fa-caret-up" aria-hidden="true"></i>
										</div>
										<div class="margin-top-8">
											<i class="fa fa-caret-down" aria-hidden="true"></i>
										</div>
									</div>
								</th>
								<!--Added column on 12/07/2021  -->
								<th class="width5">Doctor Details      
									<div class="float_right">
										<div>
											<i class="fa fa-caret-up" aria-hidden="true"></i>
										</div>
										<div class="margin-top-8">
											<i class="fa fa-caret-down" aria-hidden="true"></i>
										</div>
									</div>
								</th>
								<!-- ------------------------------------------------------ -->
								<th class="width8">Status(n)
									<div class="float_right">
										<div>
											<i class="fa fa-caret-up" aria-hidden="true"></i>
										</div>
										<div class="margin-top-8">
											<i class="fa fa-caret-down" aria-hidden="true"></i>
										</div>
									</div>
								</th>
								<th class="text-center width3">Action taken</th>
							</tr>
						</thead>
					</table>
				</div>
				<div class="table-container-body fix-height-scroll450" >
					<table class="table table-striped table-hover table-condensed table-bordered">
						<tbody>
							<tr ng-repeat="info in commonList|orderBy:column:reverse|filter:searchKeyword">
								<td class="width5">{{info.outsideHospitalCode}}</td>
								<td class="width10">{{info.outsideHospitalDesc}}</td>
								<td class="width5 text-center">
									<a title="View Doctor detail" data-toggle="modal" data-target="#outsidehospitalModel" ng-click="getOutsideHopId(info.outsideHospitalId)">
									<i class="fa fa-info-circle" aria-hidden="true"></i>
									</a>
									
								</td>
								<td class="width8">
									<label class="switch">
											<input type="checkbox" ng-model="info.status" ng-true-value="'A'" ng-false-value="'I'" ng-change="updateStatus(info.outsideHospitalId,info.status)" >
											<div class="slider round"></div>
									</label>
								</td>
								<td class="text-center width3">
									<a>
										<i class="fa fa-pencil" aria-hidden="true" ng-click="showUpdateBtn(info.outsideHospitalId)"></i>
									</a>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</form>					
			<div class="row margin-bottom45 sss">
				<ul ng-if="pager.pages.length" class="pagination table-list"
					style="font-size: 14px;">
					<li ng-class="{disabled:pager.currentPage === 1}"><a
						ng-click="setPage(1,'true')">First</a></li>
					<li ng-class="{disabled:pager.currentPage === 1}"><a
						ng-click="setPage(pager.currentPage - 1,'true')">Previous</a></li>
					<li ng-repeat="page in pager.pages"
						ng-class="{active:pager.currentPage === page}"><a
						ng-click="setPage(page,'true')">{{page}}</a></li>
					<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
						<a ng-click="setPage(pager.currentPage + 1,'true')">Next</a>
					</li>
					<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
						<a ng-click="setPage(pager.totalPages,'true')">Last</a>
					</li>
				</ul>
			</div>
	</div>
</div>

<modal visible="showModal"></modal>
<script src="resources/assets/js/common/page-height.js"></script>
<script type="text/javascript">
	$(".selectedPageName").text("Site Of Administration");
	$(".sidebar-nav li").each(function() {
		$(this).find("a").parents("li").removeClass("active");
	});
	$('a[href$="siteOfAdministration"]').parents("li").addClass("active");
</script>
