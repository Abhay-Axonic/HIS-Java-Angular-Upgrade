<div id="page-content-wrapper">
	<div class="container-fluid his-style">
			<div class="row">
				<div class="col-lg-2 col-md-2 col-sm-2  padding-left-right-set4 padding-top10 margin-top10">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-dot-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<div class="">
								<select class="text-input floating-label" ng-model="common.vitalCategoryId">
									<option ng-repeat="info in vitalCategoryList" ng-value="{{info.vitalCategoryId}}" 
									value="{{info.vitalCategoryId}}">{{info.vitalCategoryDesc}}</option>
								</select>
								<label required="required" >Category<span class="star">*</span></label>
							</div>
						</div>
					</div>
				</div>
				<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10 margin-top8">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon ">
							<i class="fa fa fa-stop-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11 ">
							<!--<div class="form-group" show-errors> -->
							<input type="text" autocomplete="off" name="systemName" class="text-input floating-label" ng-model="common.vitalQualifireCode" required="required">
							<label for="" class="LISDynamicLabel">Code<span class="star">*</span></label>
							<!-- </div> -->
						</div>
					</div>
				</div>
					<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10 margin-top8">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon ">
							<i class="fa fa fa-stop-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11 ">
							<!--<div class="form-group" show-errors> -->
							<input type="text" autocomplete="off" name="systemName" class="text-input floating-label" ng-model="common.vitalQualifireDesc" required="required">
							<label for="" class="LISDynamicLabel">Description<span class="star">*</span></label>
							<!-- </div> -->
						</div>
					</div>
				</div>
			</div>
			
			
				
				<div class="row padding-left-right-set1">
				<div class="col-md-6 col-sm-7 padding-left-right-set4">
					<div class="row">
						<div class="col-lg-3 col-md-6 col-sm-6" style="padding-left: 0px;">
							<div class="search">
							<label class="show-entries">Show 
							<select name="DataTables_Table_0_length" aria-controls="DataTables_Table_0"
								ng-init="noOfRecordsPerPage='10'" ng-model="noOfRecordsPerPage"
								ng-change="setNoOfRecords();" class="search-popUp-ddl">
									<option value="10">10</option>
									<option value="25">25</option>
									<option value="50">50</option>
									<option value="100">100</option>
							</select> entries
							</label>
						</div>
						</div>
					</div>
				</div>
				 <div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto margin-top10">
					<div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
						 <a href="" class="btn btn-primary btn-save-box-shadow" title="Save" data-toggle="modal" ng-click="save()"
										ng-if="saveBtnFlag"> <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
										
						<a href="" class="btn btn-primary btn-save-box-shadow" title="Update" data-toggle="modal" ng-click="update()"
										ng-if="updateBtnFlag"> <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
		      		</div>
				</div>
				<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 float_right margin-top10">
					<input type="text" autocomplete="off" class="text-search-box" placeholder="Search" style="margin-top: 0px" ng-model="searchKeyword">
					<i class="fa fa-search common-search-text-icon" aria-hidden="true"></i>
				</div>
				</div>
			<div class="row padding-left-right-set4 margin-top4">
				<div class="col-md-12 fix-height-scroll600">
					<table class="table table-bordered">
						<thead>
							<tr>
								<th>Category</th>
								<th>Code</th>
								<th>Description</th>
								<th class="width5 text-center">Status(n)</th>
								<th class="width5 text-center">Action taken</th>
							</tr>
						</thead>
						<tbody>
							<tr ng-repeat="info in commonList|orderBy:column:reverse|filter:searchKeyword">
								<td>{{info.vitalCategoryDesc}}</td>
								<td>{{info.vitalQualifireCode}}</td>
								<td>{{info.vitalQualifireDesc}}</td>
								<td class="text-center">
									<label class="switch">
									<input type="checkbox" ng-model="info.status" ng-true-value="'A'" ng-false-value="'I'" ng-change="updateStatus(info.vitalQualifireId,info.status)">
									<div class="slider round"></div>
									</label>
								</td>
								<td class="padding-edit-button-table text-center vertical-middle">
									<a><i class="fa fa-pencil" aria-hidden="true" ng-click="showUpdateBtn(info.vitalQualifireId)" ></i></a>
								</td>
							</tr>
						</tbody>
					</table>
					<div class="row margin-bottom45 sss">
					<ul ng-if="pager.pages.length" class="pagination table-list"
						style="font-size: 14px;">
						<li ng-class="{disabled:pager.currentPage === 1}"><a
							ng-click="setPage(1,'true')">First</a></li>
						<li ng-class="{disabled:pager.currentPage === 1}"><a
							ng-click="setPage(pager.currentPage - 1,'true')">Previous</a></li>
						<li ng-repeat="page in pager.pages"
							ng-class="{active:pager.currentPage === page}"><a
							ng-click="setPage(page,'true')">{{page}}</a></li>
						<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
							<a ng-click="setPage(pager.currentPage + 1,'true')">Next</a>
						</li>
						<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
							<a ng-click="setPage(pager.totalPages,'true')">Last</a>
						</li>
					</ul>
				</div>
				</div>
		</div>
	</div>
</div>
<modal visible="showModal"></modal> 
<script src="resources/assets/js/common/page-height.js"></script>
<script type="text/javascript">
	$(document).ready(function() {

		$(".selectedPageName").text("Vital Qualifier Master");
		$(".sidebar-nav li").each(function() {
			$(this).find("a").parents("li").removeClass("active");
		});
		$('a[href$="vitalQualifierMaster"]').parents("li").addClass("active");
	});
</script>
