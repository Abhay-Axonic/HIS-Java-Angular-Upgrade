<!-- Template -->
<link rel="stylesheet" type="text/css" href="resources/assets/css/template/drag-drop.css"/>
<div id="page-content-wrapper">
<div  class="container-fluid" >
	<section class="content padding-left-right-set4">
		<div class="row col-md-12">
	<!-- 	ng-disabled="vm.model.updateFlag"
		ng-disabled="vm.model.updateFlag"
		ng-disabled="vm.model.updateFlag" -->
		<div class="col-md-2"><input  type="radio" ng-model="vm.model.type" value="all" id="allSpec" name="templateType" ><label for="allSpec">All</label></div>
		<div class="col-md-2"><input  type="radio" ng-model="vm.model.type" value="subSpc" id="subSpec" name="templateType" ><label for="subSpec">Sub Speciality</label></div>
		<div class="col-md-2"><input  type="radio" ng-model="vm.model.type" value="doctor" id="doctor" name="templateType" ><label for="doctor">Doctor</label></div>
		</div>
		<div class="row col-md-12">
			   <div class="col-md-3 form-group" style="margin-right:0px" >
					<div class="" >
				    	<label for="inputdefault">Specialty</label>
				    	<!-- ng-disabled="vm.model.updateFlag" -->
				    	<select class="form-control"  name="speciality" ng-model="vm.model.template.templateFormatId"  id="" convert-to-number>
				    		<option selected value>Select Template Format</option>
				    		<option value="1" >Data Object</option>
				    		<option value="2" >Word Template</option>
				    	</select>
				    	
					</div>
				</div>
				<div class="col-md-3 form-group" style="margin-right:0px" ng-show="vm.model.type == 'subSpc'" >
					<div class="" >
				    	<label for="inputdefault">Specialty</label>
				    	<!-- ng-disabled="vm.model.updateFlag" -->
				    	<select class="form-control"  name="speciality" ng-model="vm.model.template.specialityId" ng-change="vm.model.getSubSpecialityBySpecialityId(vm.model.template.specialityId)" id="" >
				    		<option value="" selected>Select Specialty</option>
				    		<option value="{{spc.specialityId}}" ng-value="spc.specialityId" ng-repeat="spc in vm.model.specialityList">{{spc.specialityName}}</option>
				    	</select>
				    	
					</div>
				</div>
				<div class="col-md-3 form-group" style="margin-right:0px" ng-show="vm.model.type == 'subSpc'">
					<div class="">
				    	<label for="inputdefault">Sub Specialty</label>
				    <!-- 	ng-disabled="vm.model.updateFlag" -->
				    	<select class="form-control"  name="subSpeciality" ng-model="vm.model.template.subSpecialityId" required>
				    		<option value="" selected>Select SubSpecialty</option>
				    		<option value="{{subspc.subSpecialityMasterId}}" ng-value="subspc.subSpecialityMasterId" ng-repeat="subspc in vm.model.subSpecialityList">{{subspc.subSpecialityMasterName}}</option>
				    	</select>
					</div>
				</div>
				<div class="col-md-3 form-group" style="margin-right:0px" ng-show="vm.model.type == 'doctor'">
					<div class="">
					<!-- ng-disabled="vm.model.updateFlag" -->
				    	<label for="inputdefault">Doctor</label>
				    	<select class="form-control" name=""  ng-model="vm.model.template.doctorId" required>
				    		<option value="" selected>Select Doctor</option>
				    		<option value="{{doc.doctorId}}" ng-value="doc.doctorId" ng-repeat="doc in vm.model.doctorList">{{doc.firstName + ' ' + doc.middleName + ' ' +doc.lastName}}</option>
				    	</select>
					</div>
				</div>
				<div class="col-md-3 form-group padding-left-right-set4" style="margin-right:0px" >
					<div class="">
					<!-- ng-disabled="vm.model.updateFlag" -->
				    	<label for="inputdefault">Template Type</label>
				    	<select class="form-control" name=""  ng-model="vm.model.template.templateTypeId" required>
				    		<option value="" selected>Select Type</option>
				    		<option value="{{type.id}}" ng-value="type.id" ng-repeat="type in vm.model.templateTypes">{{type.name}}</option>
				    	</select>
					</div>
				</div>
				<!-- ng-disabled="vm.model.updateFlag" -->
				<div class="col-md-3 form-group" style="margin-right:0px" >
					<div class="">
				    	<label for="inputdefault">Template Title</label>
				    	<input class="form-control"  id="templateTitle" type="text" autocomplete="off" placeholder="Template Title" name="templateTitle" ng-model="vm.model.template.title" required>
					</div>
				</div>
				
		</div>
		
	</section>
	<section class="row col-md-12">
	
	<fieldset id="dynamicHtmlFieldset3" class="scheduler-border coolfieldset">
	<legend class="scheduler-border">Section</legend>
	<div class="w3-container padding-left-right-set4" ng-show="vm.model.template.templateFormatId==1">
	<div id="sticky-anchor"></div>
	  <div class="w3-accordion bg-lightgrey w3-card-4 w3-third w3-margin-top" id="sticky" >
	    <div class="w3-margin-top" ng-click="getDataObjectList()">
	    	 <button type="button" onclick="animation('dataObject')" class="w3-btn-block w3-left-align w3-teal">
	     		Data Object's
	    	</button>
	    	<div id="dataObject" class="w3-accordion-content w3-animate-left" style="overflow-y: scroll;height: 313px;">
	    		<ul class="list-group">
				    <div ng-repeat="dataObj in vm.model.dataObjects">
				    	<li id="{{dataObj.dataObjectId}}" class="list-group-item source-data data-object list-group-item" draggable="true" ondragstart="drag(event)">{{dataObj.title}}</li>
				     </div >
				  </ul>
	    	</div>
	    </div>	
	  </div>
  	<div class="w3-rest">
	  	<div class="w3-card-4 card-margin" id="dropContainer">
			<div class="bg-white ">
				<input type="text" autocomplete="off"  class="w3-btn-block w3-left-align w3-teal" readonly/>
			</div>
			<div id="dynamicHtmlContent3" class="bg-lightgrey w3-container panel-height right-panel" ondrop="drop(event)" ondragover="allowDrop(event)" style="height:auto;min-height:600px;padding-bottom:80px;">
				<!-- PLACE HOLDER CONTAINER -->
							
			</div>
		</div> 
  	</div>
</div>
		       <!-- <div class="row">
			       	<div class="col-lg-12 col-md-12" ng-show="vm.model.template.templateFormatId==2">
	                             <textarea  name="editor" type="text" autocomplete="off" id="editor"  rows="10" cols="50" ck-editor ng-model="value"></textarea>
	                              
					</div>
		       </div> -->
</fieldset>

function animation(id) {
    var x = document.getElementById(id);
    if ($(x).hasClass("w3-show")) {
	  $(x).removeClass('w3-show').addClass('w3-hide')
    } else { 
	  $(x).removeClass('w3-hide').addClass('w3-show')
    }
}
function sticky_relocate() {
    var window_top = $(window).scrollTop();
    var div_top = $('#sticky-anchor').offset().top - 50;
    if (window_top > div_top) {
        $('#sticky').addClass('stick');
        $('#sticky-anchor').height($('#sticky').outerHeight());
        $('#dropContainer').removeClass("container-onstick").addClass("container-onstick");
    } else {
        $('#sticky').removeClass('stick');
        $('#sticky-anchor').height(0);
        $('#dropContainer').removeClass("container-onstick");
    }
}
