<div id="page-content-wrapper">
	<div class="container-fluid his-style">
		<form name="testCostHeadForm" novalidate >
		<div class="row">
			<div class="col-lg-2 col-md-2 col-sm-3 padding-left-right-set4 padding-top10">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11">
						<div class="form-group" show-errors>
							<input type="text" autocomplete="off" name="testCostHeadCode" id="" class="text-input floating-label dirty" ng-model="common.testCostHeadCode" required> 
							<label for="description" class="LISDynamicLabel">Cost Head ID <span class="star">*</span></label>
							<p class="help-block" ng-if="testCostHeadForm.testCostHeadCode.$error.required">Cost Head ID is required</p>
						</div>
					</div>
				</div>
			</div>
			<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11">
						<div class="form-group" show-errors>
							<input type="text" autocomplete="off" name="testCostHeadDesc" id="" class="text-input floating-label dirty" ng-model="common.testCostHeadDesc" required> 
							<label for="description" class="LISDynamicLabel">Cost Head Description<span class="star">*</span></label>
							<p class="help-block" ng-if="testCostHeadForm.testCostHeadDesc.$error.required">Cost Head Description is required</p>
						</div>
					</div>
				</div>
			</div>
		</div>
		<div class="row padding-top8">
		<div class="col-md-6 col-sm-7 padding-left-right-set4">
					<div class="row">
						<div class="col-lg-3 col-md-6 col-sm-6" style="padding-left: 0px;">
								<div class="search">
								<label class="show-entries">Show 
								<select name="DataTables_Table_0_length" aria-controls="DataTables_Table_0"
									ng-init="noOfRecordsPerPage='10'" ng-model="noOfRecordsPerPage"
									ng-change="setNoOfRecords();" class="search-popUp-ddl">
										<option value="10">10</option>
										<option value="25">25</option>
										<option value="50">50</option>
										<option value="100">100</option>
								</select> entries 
								</label>
							</div>
						</div>
					</div>
				</div>
			<div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
				<div class=" ">
					<a href="" class="btn btn-primary btn-save-box-shadow" title="Save" data-toggle="modal"  ng-click="save()" ng-hide="saveBtnFlag">
					<i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
					<a href="" class="btn btn-primary btn-save-box-shadow" title="Update" data-toggle="modal" ng-click="update()" ng-hide="updateBtnFlag">
			        <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
				</div>
			</div>
			<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set0 float_right">
				<input type="text" autocomplete="off" class="text-search-box dirty" placeholder="Search" ng-model="searchKeyword" style="margin-top: 0px"> <i class="fa fa-search common-search-text-icon" aria-hidden="true"></i>
			</div>
		</div>
		<modal visible="showModal"></modal> 
		<div class="row padding-left-right-set4 table-container padding-top5">
			<div class="table-container">
				<div class="table-container-header">
					<table class="table table-striped table-hover table-condensed table-bordered">
						<thead>
							<tr>
								<th class="width10">Cost Head ID</th>
								<th class="width10">Cost Head Description</th>
								<th class="width5 text-center">Status(n)</th>
								<th class="width5 text-center">Action taken</th>
							</tr>
						</thead>
					</table>
				</div>
				<div class="table-container-body fix-height-scroll400" style="overflow: overlay;"> <!-- fix-height-scroll230, background: #fff; -->
					<table class="table table-striped table-hover table-condensed table-bordered">
						<tbody>
							<tr ng-repeat="info in commonList | filter:searchKeyword">
								<td class="width10">{{info.testCostHeadCode}}</td>
								<td class="width10">{{info.testCostHeadDesc}}</td>
								<td class="width5 text-center">
									<label class="switch"> 
										<input type="checkbox" class="ng-pristine ng-untouched ng-valid ng-empty" ng-model="info.status" ng-true-value="'A'" ng-false-value="'I'"
									ng-change="updateStatus(info.testCosHeadId,info.status)">
										<div class="slider round"></div>
									</label>
								</td>
								<td class="width5 text-center">
									<a class="cursor-pointer" title="Edit"><i class="fa fa-pencil" ng-click="showUpdateBtn(info.testCosHeadId)"></i></a>&nbsp;
									<!-- <a class="cursor-pointer" title="Remove"><i class="fa fa-times"></i></a> -->
								</td>
								
							</tr>
						</tbody>
					</table>
					<div class="row margin-bottom45 sss">
					<ul ng-if="pager.pages.length" class="pagination table-list"
						style="font-size: 14px;">
						<li ng-class="{disabled:pager.currentPage === 1}"><a
							ng-click="setPage(1,'true')">First</a></li>
						<li ng-class="{disabled:pager.currentPage === 1}"><a
							ng-click="setPage(pager.currentPage - 1,'true')">Previous</a></li>
						<li ng-repeat="page in pager.pages"
							ng-class="{active:pager.currentPage === page}"><a
							ng-click="setPage(page,'true')">{{page}}</a></li>
						<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
							<a ng-click="setPage(pager.currentPage + 1,'true')">Next</a>
						</li>
						<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
							<a ng-click="setPage(pager.totalPages,'true')">Last</a>
						</li>
					</ul>
				</div>
				</div>
			</div>
		</div>
		</form>
	</div>
</div>
<!-- Modal END -->
<script src="resources/assets/js/common/page-height.js"></script>
<script type="text/javascript">

$(document).ready(function() {  
	// $(".patienttSearchResult").hide();
	$(".icon-span").hide();
	 $(".selectedPageName").text("Test Cost Head");
	$(".sidebar-nav li").each(function() {
		$(this).find("a").parents("li").removeClass("active");
	});
	$('a[href$="testCostHead"]').parents("li").addClass("active");
});
</script>
