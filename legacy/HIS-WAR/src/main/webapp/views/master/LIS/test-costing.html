<div id="page-content-wrapper">
	<div class="container-fluid his-style">
		<form name="testCostingform" novalidate >
		<div class="row padding-top10">
				<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<div class="form-group" show-errors>
								<select class="text-input floating-label dirty" name="specialityId" ng-model="common.specialityId" ng-change="getSubSpecialityBySpeciality(common.specialityId)" required>
									<option ng-repeat="info in specialityList" value="{{info.specialityId}}" ng-if="info.specialityId==labId">{{info.specialityName}}</option>
								</select> <label for="code">Department<span class="star">*</span></label>
								<p class="help-block" ng-if="testCostingform.specialityId.$error.required">Department is required</p>
							</div>
						</div>
					</div>
				</div>
			<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11">
						<div class="form-group" show-errors>
							<select class="text-input floating-label dirty" name="subSpecialityId" ng-model="common.subSpecialityId" required>
								<option ng-repeat="info in subSpecialityList" value="{{info.subSpecialityId}}">{{info.subSpecialityName}}</option>
							</select> <label for="code">Sub Department<span class="star">*</span></label>
							<p class="help-block" ng-if="testCostingform.subSpecialityId.$error.required">Sub Department is required</p>
						</div>
					</div>
				</div>
			</div>
			<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11">
						<div class="form-group" show-errors>
							<input type="text" autocomplete="off" name="service" id="searchServiceId" class="text-input floating-label dirty"
								ng-model="search" typeahead-min-length="2" uib-typeahead = "serviceMaster.serviceStandardName + '|' +serviceMaster.serviceStandardCode for serviceMaster in searchServices($viewValue)" 
								typeahead-on-select="addServiceToTempServiceList($item, $model, $label)" required />
								<label for="code">Hospital Service<span class="star">*</span></label>
							<p class="help-block" ng-if="testCostingform.service.$error.required">Service is required</p>	
						</div>
					</div>
				</div>
			</div>
			<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 text-width-auto">
				<div class="">
					<a href="">
						<input type="button" value="Cost" id="costBtn" class="btn btn-primary btn-save-box-shadow text-width-auto" data-toggle="modal" data-target="#costModal">
					</a>
				</div>
			</div>
		</div>
		<div class="row padding-top8">
			<div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
				<div class=" ">
					<a href="" class="btn btn-primary btn-save-box-shadow" title="Save" data-toggle="modal" ng-click="save()" data-target="#confirmLogout" >
					<i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
				</div>
			</div>
			<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set0 float_right">
				<input type="text" autocomplete="off" class="text-search-box dirty" placeholder="Search" style="margin-top: 0px">
				<i class="fa fa-search common-search-text-icon" aria-hidden="true"></i>
			</div>
			
		</div>
		<div class="row padding-left-right-set4 table-container padding-top8">
			<div class="table-container">
				<div class="table-container-header">
					<table
						class="table table-striped table-hover table-condensed table-bordered">
						<thead>
							<tr>
								<th class="width10">Department</th>
								<th class="width10">Sub Department</th>
								<th class="width10">Hospital Service</th>
								<th class="width5">Total Cost</th>
								<th class="width2 text-center"></th>
							</tr>
						</thead>
					</table>
				</div>
				<div class="table-container-body fix-height-scroll400" style="overflow: overlay;"> <!-- fix-height-scroll230, background: #fff; -->
					<table class="table table-striped table-hover table-condensed table-bordered">
						<tbody>
							<tr>
								<td class="width10"></td>
								<td class="width10"></td>
								<td class="width10"></td>
								<td class="width5"></td>
								<td class="width2 text-center">
									<a class="cursor-pointer" data-toggle="modal" data-target="#costModalDetails"><i class="fa fa-info-circle"></i></a>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
		</form>
	</div>
</div>
<!--  costModal START -->
<div id="costModal" class="modal fade ng-scope in common-small-popup" role="dialog">
	<div class="modal-dialog"> <!-- width: 25% !important;margin: 200px 0 0 510px !important; -->
		<div class="modal-content">
			<div class="modal-header" style="padding:0px;">
				<div class="modal-title patient-details-row">
					Cost
					<button type="button" class="close" data-dismiss="modal" ng-click="cancel();">&times;</button>
				</div>
			</div>
			<div class="modal-body">
				<div class="">
					<div
						class="row padding-left-right-10 table-container padding-top8">
						<div class="table-container">
							<div class="table-container-header">
								<table
									class="table table-striped table-hover table-condensed table-bordered">
									<thead>
										<tr>
											<th class="width12">Cost Head</th>
											<th class="width8">Cost</th>
											<th class="width5">Action</th>
										</tr>
									</thead>
								</table>
							</div>
							<div class="table-container-body fix-height-scroll250" style="overflow: overlay;">
								<!-- fix-height-scroll230, background: #fff; -->
								<table class="table table-striped table-hover table-condensed table-bordered">
									<tbody>										
										<tr ng-repeat="info in dataList">
											<td class="width12">
												<select class="w-100" ng-model="info.testCostHeadId">
													<option ng-repeat="infoList in costHeadList" value="{{infoList.testCosHeadId}}">{{infoList.testCostHeadDesc}}</option>
												</select>
											</td>
											<td class="width8">
												<input type="text" autocomplete="off" class="w-100" ng-model="info.cost" ng-blur="getTotal();">
											</td>
											<td class="width5"><input type="button" name="" id=""
												value="+" class="btn btn-info width40" title="Add" ng-click="add();">&nbsp;
												<input type="button" name="" id="" value="-"
												class="btn btn-info width40" title="Remove" ng-click="remove($index);"></td>
										</tr>
									</tbody>
								</table>
							</div>
							<div class="table-container-footer">
								<table class="table table-striped table-hover table-condensed table-bordered">
									<tfoot>
										<tr>
											<td class="width12 text-right">Total</td>
											<td class="width8 border-right-none"></td>
											<td class="width5">{{finalTotal}}</td>
										</tr>
									</tfoot>
								</table>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div class="modal-footer" style="border:none;">
				<button type="button" data-dismiss="modal" class="btn btn-primary" id="" ng-click="saveDetails();">Save</button>
				<button type="button" data-dismiss="modal" class="btn btn-primary" ng-click="cancelHeadCost();">Cancel</button>
			</div>
		</div>
	</div>
</div>
<!-- costModal END -->
<!--  costModalDetails START -->
<div id="costModalDetails" class="modal fade ng-scope in common-small-popup" role="dialog">
	<div class="modal-dialog"> <!-- width: 25% !important;margin: 200px 0 0 510px !important; -->
		<div class="modal-content">
			<div class="modal-header" style="padding:0px;">
				<div class="modal-title patient-details-row">
					Costing Details
					<button type="button" class="close" data-dismiss="modal" ng-click="cancel();">&times;</button>
				</div>
			</div>
			<div class="modal-body">
				<div class="">
					<div class="row padding-left-right-10 table-container padding-top8">
						<div class="table-container">
							<div class="table-container-header">
								<table
									class="table table-striped table-hover table-condensed table-bordered">
									<thead>
										<tr>
											<th class="width12">Cost Head</th>
											<th class="width8">Cost</th>
										</tr>
									</thead>
								</table>
							</div>
							<div class="table-container-body fix-height-scroll250" style="overflow: overlay;">
								<!-- fix-height-scroll230, background: #fff; -->
								<table class="table table-striped table-hover table-condensed table-bordered">
									<tbody>
										<tr>
											<td class="width12"></td>
											<td class="width8"></td>
										</tr>
									</tbody>
								</table>
							</div>
							<div class="table-container-footer">
								<table class="table table-striped table-hover table-condensed table-bordered">
									<tfoot>
										<tr>
											<td class="width12 text-right">Total</td>
											<td class="width8"></td>
										</tr>
									</tfoot>
								</table>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div class="modal-footer" style="border:none;">
				<button type="button" data-dismiss="modal" class="btn btn-primary" id="okBtn" ng-click="saveDetails();">Ok</button>
			</div>
		</div>
	</div>
</div>
<!-- costModalDetails END -->

<script src="resources/assets/js/common/page-height.js"></script>
<script type="text/javascript">

$(document).ready(function() {  
	// $(".patienttSearchResult").hide();
	$(".icon-span").hide();
	 $(".selectedPageName").text("Test Costing");
	$(".sidebar-nav li").each(function() {
		$(this).find("a").parents("li").removeClass("active");
	});
	$('a[href$="testCosting"]').parents("li").addClass("active");
});
</script>
