
<div id="page-content-wrapper">
	<div class="container-fluid his-style">
		<fieldset>
			<form name="textualRefRangeMasterForm" novalidate >
			<div class="row">
				<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<div class="form-group" show-errors>
								<input type="text" autocomplete="off" name="textualRangeCode" id="" class="text-input floating-label dirty" ng-model="common.textualRangeCode" required>
								 <label for="code"> Code<span class="star">*</span></label>
								 <p class="help-block" ng-if="textualRefRangeMasterForm.textualRangeCode.$error.required">Code is required</p>
							</div>
						</div>
					</div>
				</div>
				<div class="col-lg-6 col-md-6 col-sm-6 padding-left-right-set4 padding-top10">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<div class="form-group" show-errors>
								<input type="text" autocomplete="off" name="textualRangeName" id="" class="text-input floating-label dirty" ng-model="common.textualRangeName" required> 
								<label for="code">Description<span class="star">*</span></label>
								<p class="help-block" ng-if="textualRefRangeMasterForm.textualRangeName.$error.required">Description is required</p>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div class="row margin-top10">
				<div class="col-md-8"></div>
				<div class="col-md-4 col-sm-4">
					<div class="col-lg-10 col-md-10 col-sm-10">
						<input type="text" autocomplete="off" class="text-search-box dirty" placeholder="Search" ng-model="searchKeyword">
						<i class="fa fa-search common-search-text-icon padding-top8" aria-hidden="true"></i>
					</div>
					<div class=" col-lg-2 col-md-2 col-sm-2  float_right  padding-top8 padding-left-right-set4">
						<div class="width-div-for-patient-reg ">
							<a href="" class="btn btn-primary btn-save-box-shadow" title="Save" data-toggle="modal" ng-click="save()"
											ng-if="saveBtnFlag"> <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
							<a href="" class="btn btn-primary btn-save-box-shadow" title="Update" data-toggle="modal" ng-click="update()"
											ng-if="updateBtnFlag"> <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
						</div>
					</div>
				</div>
			</div>
			</form>
		</fieldset>
		<div class="row margin-top4">
				<div class="col-md-6 col-sm-7 padding-left-right-set4">
					<div class="row">
						<div class="col-lg-3 col-md-6 col-sm-6" style="padding-left: 0px;">
							<div class="search">
								<label class="show-entries">Show <select
									name="DataTables_Table_0_length"
									aria-controls="DataTables_Table_0"
									ng-init="noOfRecordsPerPage='10'" ng-model="noOfRecordsPerPage"
									ng-change="setNoOfRecords();" class="search-popUp-ddl">
										<option value="10">10</option>
										<option value="25">25</option>
										<option value="50">50</option>
										<option value="100">100</option>
								</select> entries
								</label>
							</div>
						</div>
					</div>
				</div>
			<div class="col-md-12 col-lg-12 col-sm-12 padding-left-right-set4">
				<table class="table table-bordered">
					<tbody><tr class="">
						<th class="width15">
							 Code
							 <div class="float_right">
									<div>
									  <i ng-click='sortColumn("textualRangeCode")' class="fa fa-caret-up" aria-hidden="true"></i>
								    </div>
								    <div class="margin-top-8">
									  <i ng-click='sortColumn("textualRangeCode")' class="fa fa-caret-down"  aria-hidden="true"></i>
								   </div>
							</div>
						</th>
						<th class="">
							Description
							<div class="float_right">
									<div>
									  <i ng-click='sortColumn("textualRangeName")' class="fa fa-caret-up" aria-hidden="true"></i>
								    </div>
								    <div class="margin-top-8">
									  <i ng-click='sortColumn("textualRangeName")' class="fa fa-caret-down"  aria-hidden="true"></i>
								   </div>
							</div>
						</th>
						<th class="width8">Status(n)
							<!-- <div class="float_right">
								<div>
									<i ng-click='sortColumn("desc")'class="fa fa-caret-up" aria-hidden="true"></i>
								</div>
								<div class="margin-top-8">
									<i class="fa fa-caret-down" aria-hidden="true"></i>
								</div>
							</div> -->
						</th>
						<th class="width8 text-center">
							Action taken
							<!-- <div class="float_right">
								<div><i class="fa fa-caret-up" aria-hidden="true"></i></div>
								<div class="margin-top-8"><i class="fa fa-caret-down" aria-hidden="true"></i></div>
							</div> -->
						</th>
					</tr>
					<tr ng-repeat="info in commonList |orderBy:column:reverse|filter:searchKeyword">
						<td>{{info.textualRangeCode}}</td>
						<td>{{info.textualRangeName}}</td>
						<td>
							<label class="switch"> 
							<input type="checkbox" ng-model="info.status" ng-true-value="'A'" ng-false-value="'I'"
														ng-change="updateStatus(info.textualRangeId,info.status)">
								<div class="slider round"></div>
							</label>
						</td>
						<td class="padding-edit-button-table text-center">
							<a>
								<i class="fa fa-pencil" aria-hidden="true" title="Edit" ng-click="showUpdateBtn(info.textualRangeId)"></i>
							</a>
						</td>
					</tr>
				</tbody>
				</table>
				<div class="row margin-bottom45 sss">
									<ul ng-if="pager.pages.length" class="pagination table-list"
										style="font-size: 14px;">
										<li ng-class="{disabled:pager.currentPage === 1}"><a
											ng-click="setPage(1,'true')">First</a></li>
										<li ng-class="{disabled:pager.currentPage === 1}"><a
											ng-click="setPage(pager.currentPage - 1,'true')">Previous</a></li>
										<li ng-repeat="page in pager.pages"
											ng-class="{active:pager.currentPage === page}"><a
											ng-click="setPage(page,'true')">{{page}}</a></li>
										<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
											<a ng-click="setPage(pager.currentPage + 1,'true')">Next</a>
										</li>
										<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
											<a ng-click="setPage(pager.totalPages,'true')">Last</a>
										</li>
									</ul>
								</div>
			</div>
		</div>
	</div>
</div>
<modal visible="showModal"></modal> 
<script type="text/javascript">
$(document).ready(function() {
	var documentHeight= $(window).height();
    var sideBarHeight = documentHeight - 55;
  $("#page-content-wrapper").css("height", sideBarHeight + "px" );
});
  
  $(".selectedPageName").text("Textual Reference Range Master");
	$(".sidebar-nav li").each(function() {
		$(this).find("a").parents("li").removeClass("active");
	});
	$('a[href$="textualReferenceRangeMaster"]').parents("li").addClass("active");

</script>
