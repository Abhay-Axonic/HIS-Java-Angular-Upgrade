<div id="page-content-wrapper" style="overflow-x : hidden !important;">
	<div class="container-fluid his-style">
		<form name="QMSCounterForm" novalidate >
		<div class="row padding-top12">
		  <div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11">
						<div class="form-group"   show-errors>
							<input type="text" autocomplete="off" name="qmsCounterCode" id="" class="text-input floating-label" ng-model="common.qmsCounterCode" required> 
							<label for="description" class="LISDynamicLabel">Code<span class="star">*</span></label>
							<p class="help-block" ng-if="QMSCounterForm.qmsCounterCode.$error.required">Code is required</p>
						</div>
					</div>
				</div>
			</div>
			<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11">
						<div class="form-group"   show-errors>
							<input type="text" autocomplete="off" name="qmsCounterDesc" id="" class="text-input floating-label" ng-model="common.qmsCounterDesc" required> 
							<label for="description" class="LISDynamicLabel">Description<span class="star">*</span></label>
							<p class="help-block" ng-if="QMSCounterForm.qmsCounterDesc.$error.required">Description is required</p>
						</div>
					</div>
				</div>
			</div>
			<div class="col-lg-3 col-md-3 col-sm-3">
				<div class="row input-container">
				<div class="col-lg-2 col-sm-2 col-md-2 polymer-icon">
					<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
				</div>
				<div class="col-lg-10 col-sm-10 col-md-10">
					<div class="form-group"   show-errors>
						<select class="text-input floating-label dirty" name="qmsKioskMasterId" ng-change="getQMSActiveDeptMasterListByKioskId(common.qmsKioskMasterId);" ng-model="common.qmsKioskMasterId" convert-to-number required>
							<option value="0">-</option>
							<option value="{{qms.qmsKioskMasterId}}" ng-repeat="qms in activeQMSList">{{qms.qmsDesc}}</option>
						</select> 
						<label for="code">Kiosk<span class="star">*</span></label>
						<p class="help-block" ng-if="QMSCounterForm.qmsKioskMasterId.$error.required">Kiosk is required</p>
					</div>
				</div>
				</div>
			</div>
			<div class="col-lg-3 col-md-3 col-sm-3">
				<div class="row input-container">
				<div class="col-lg-2 col-sm-2 col-md-2 polymer-icon">
					<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
				</div>
				<div class="col-lg-10 col-sm-10 col-md-10">
					<div class="col-md-8 col-sm-8 col-xs-8 padding-left-right-set4" style=" margin-top: -16px;">
						<label for="code">Department<span class="star">*</span></label>
										<div ng-dropdown-multiselect="" options="activeQMSDeptList"
												selected-model="departmentModel"
												extra-settings="example14settings" ng-click="clicked()">
									</div>
					</div>
						
				</div>
				</div>
			</div>
		</div>
		</form>
		<div class="row padding-top8">
		<div class="col-md-6 col-sm-7 padding-left-right-set4">
				<div class="row">
					<div class="col-lg-3 col-md-6 col-sm-6" style="padding-left: 0px;">
						<div class="search">
						<label class="show-entries">Show 
						<select name="DataTables_Table_0_length" aria-controls="DataTables_Table_0"
							ng-init="noOfRecordsPerPage='10'" ng-model="noOfRecordsPerPage"
							ng-change="setNoOfRecords();" class="search-popUp-ddl">
								<option value="10">10</option>
								<option value="25">25</option>
								<option value="50">50</option>
								<option value="100">100</option>
						</select> entries
						</label>
					</div>
					</div>
				</div>
			</div>
			<div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
				<div class=" ">
					<a href="" class="btn btn-primary btn-save-box-shadow" title="Save" data-toggle="modal"  data-target="" ng-click="save()" ng-if="saveBtnFlag">
					<i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
					<a href="" class="btn btn-primary btn-save-box-shadow" title="Save" data-toggle="modal"  data-target="" ng-click="update()" ng-if="updateBtnFlag">
					<i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
				</div>
			</div>
			<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set0 float_right">
				<input type="text" autocomplete="off" class="text-search-box dirty" placeholder="Search" ng-model="searchKeyword" style="margin-top: 0px" >
				<i class="fa fa-search common-search-text-icon" aria-hidden="true"></i>
			</div>
		</div>
		<div class="row padding-left-right-set4 table-container padding-top10">
			<div class="table-container">
				<div class="table-container-header">
					<table
						class="table table-striped table-hover table-condensed table-bordered">
						<thead>
							<tr>
								<th class="width3">
									Code
								</th>
								<th class="width3">
									Description
								</th>
							<!-- 	<th class="width3">
									Kiosk
								</th> -->
								<th class="width1">
									Department Details
								</th>
								<th class="width2 text-center">
									Status(n)
								</th>
								<th class="width2 text-center">
									Action taken
								</th>
							</tr>
						</thead>
					</table>
				</div>
				<div class="table-container-body fix-height-scroll450" style="overflow: overlay;"> <!-- fix-height-scroll230, background: #fff; -->
					<table
						class="table table-striped table-hover table-condensed table-bordered">
						<tbody>
							<tr ng-repeat="info in commonList | filter:searchKeyword">
								<td class="width3">{{info.qmsCounterCode}}</td>
								<td class="width3">{{info.qmsCounterDesc}}</td>
								<!-- <td class="width3">{{info.qmsDesc}}</td> -->
								<td class="width1"><a> <i class="fa fa-info-circle" title="Department Details" ng-click="departmentDetails(info.qmsCounterId)" aria-hidden="true"></i>
								</a></td>
								<td class="width2 vertical-middle text-center">
											<label class="switch"> 
												<input type="checkbox" ng-model="info.status"  ng-true-value="'A'"  ng-false-value="'I'"  ng-change="updateStatus(info.qmsCounterId,info.status)">
												<div class="slider round"></div>
											</label>
										</td>
								<td class="width2 text-center" title="Remove ">
								<i class="fa fa-pencil" style="color: #3131d2;" aria-hidden="true" ng-click="showUpdateBtn(info.qmsCounterId)" title="Edit"></i>
								</td>
							</tr>
						</tbody>
					</table>
					
				</div>
			</div>
		</div> 
		<div class="row "><!-- margin-bottom45 sss -->
					<ul ng-if="pager.pages.length" class="pagination table-list"
						style="font-size: 14px;">
						<li ng-class="{disabled:pager.currentPage === 1}"><a
							ng-click="setPage(1,'true')">First</a></li>
						<li ng-class="{disabled:pager.currentPage === 1}"><a
							ng-click="setPage(pager.currentPage - 1,'true')">Previous</a></li>
						<li ng-repeat="page in pager.pages"
							ng-class="{active:pager.currentPage === page}"><a
							ng-click="setPage(page,'true')">{{page}}</a></li>
						<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
							<a ng-click="setPage(pager.currentPage + 1,'true')">Next</a>
						</li>
						<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
							<a ng-click="setPage(pager.totalPages,'true')">Last</a>
						</li>
					</ul>
				</div>
	</div>
</div>

			<div class="modal-content">

				</div>

					<div class="row padding-bottom10">

								<div class="col-lg-12 col-md-12 col-sm-12 padding-left-right-set4 padding-top10 padding-bottom10">
							 		<div class="row input-container">
										<div class="col-lg-11 col-sm-11 col-md-11">
										<table class="table table-bordered">
											<tbody>
												<tr>
													<th class="width8">
														<div>QMS Name</div>
													</th>
													<th class="width8">
														<div>QMS Department Name</div>

												</tr>

														<div>{{info.qmsDesc}}</div>

													<td>
														<div>{{info.qmsDeptName}}</div>
													</td>
												</tr>
											</tbody>
										</table>
									</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
</div>
