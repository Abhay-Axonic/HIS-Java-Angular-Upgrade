<div id="page-content-wrapper">
	<div class="container-fluid his-style">
		<div
			class="col-lg-3 col-md-4 col-sm-4 padding-left-right-set padding-top10">
			<span class="heading-name-font" style="color: grey">Kiosk :
				{{kioskName}}</span><span class="heading-name-font"> <span
				class="heading-name-font" style="color: grey" title="Kiosk Details"
				data-toggle="modal" data-target="#qmsKioskDetailsModal"> <i
					class="fa fa-stack-exchange" aria-hidden="true"></i>
			</span>
		</div>
		<div class="row padding-top5 padding-left-right-set">
			<div
				class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto ng-scope">
				<div class=" ">
					<a href="" class="btn btn-primary btn-save-box-shadow dropdown" id="linkBtn"
						title="" data-toggle="dropdown"> <i class="fa fa-link"
						style="font-size: 21px;color:#2A83F2 !important;" aria-hidden="true"></i></a>
					<ul class="dropdown-menu">
						<li><a href="#QMS">Issue Token URL</a></li>
					</ul>
				</div>
			</div>
			<div class="col-lg-1 col-md-1 col-sm-2"></div>
		</div>
	</div>
</div>


<div id="qmsKioskDetailsModal"class="modal fade ng-scope common-small-popup in" role="dialog"
	data-keyboard="false" data-backdrop="static">
	<div class="modal-dialog">
		<!-- width: 25% !important;margin: 200px 0 0 510px !important; -->
		<div class="modal-content">
			<div class="modal-header">
				<div class="modal-title patient-details-row">
					Kiosk Details
					<!-- <button type="button" class="close" data-dismiss="modal">&times;</button> -->
				</div>
			</div>
			<div class="modal-body">
				<div class="margin-left10 row padding-top10">
					<div class="col-md-3 col-lg-3 col-sm-3">
						<span>Select Kiosk</span>
					</div>
					<div class="col-md-6 col-lg-6 col-sm-6">
						<select class="dirty" style="width: 100%"
							ng-change="selectQMSKiosk(common.qmsKioskMasterId);"
							ng-model="common.qmsKioskMasterId">
							<option selected value>Select Kiosk</option>
							<option value="{{qms.qmsKioskMasterId}}"
								ng-repeat="qms in activeQMSList">{{qms.qmsDesc}}</option>
						</select>
					</div>

				</div>
			</div>
			<div class="modal-footer" style="border: none;">
				<button type="button" data-dismiss="modal"
					class="btn btn-primary width13" id="otpOk" ng-click="confirmQMS();">Ok</button>
			</div>
		</div>
	</div>
</div>
<!-- QMS kiosk DetailsModal END -->
<script>
	$(document).ready(function() {
		// $(".patienttSearchResult").hide();
		$(".selectedPageName").text("QMS Token Display");
		$(".sidebar-nav li").each(function() {
			$(this).find("a").parents("li").removeClass("active");
		});
		$('a[href$="display"]').parents("li").addClass("active");
	});
</script>
