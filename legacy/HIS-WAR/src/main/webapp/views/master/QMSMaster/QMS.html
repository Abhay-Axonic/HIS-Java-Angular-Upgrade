<!-- QMS kiosk DetailsModal START -->
<div id="qmsKioskDetailsModal"
	class="modal fade ng-scope common-small-popup in" role="dialog"
	data-keyboard="false" data-backdrop="static">
	<div class="modal-dialog">
		<!-- width: 25% !important;margin: 200px 0 0 510px !important; -->
		<div class="modal-content">
			<div class="modal-header">
				<div class="modal-title patient-details-row">
					Kiosk Details
					<!-- <button type="button" class="close" data-dismiss="modal">&times;</button> -->
				</div>
			</div>
			<div class="modal-body">
				<div class="margin-left10 row padding-top10">
					<div class="col-md-3 col-lg-3 col-sm-3">
						<span>Select Kiosk</span>
					</div>
					<div class="col-md-6 col-lg-6 col-sm-6">
						<select class="dirty" style="width: 100%"
							ng-change="selectQMSKiosk(common.qmsKioskMasterId);"
							ng-model="common.qmsKioskMasterId">
							<option selected value>Select Kiosk</option>
							<option value="{{qms.qmsKioskMasterId}}"
								ng-repeat="qms in activeQMSList">{{qms.qmsDesc}}</option>
						</select>
					</div>

				</div>
			</div>
			<div class="modal-footer" style="border: none;">
				<button type="button" data-dismiss="modal"
					class="btn btn-primary width13" id="otpOk" ng-click="confirmQMS();">Ok</button>
			</div>
		</div>
	</div>
</div>
<!-- QMS kiosk DetailsModal END -->

<div id="tokenNumberPopup"
	class="modal fade ng-scope in kiosk kiosk-small-modal" role="dialog"

			</div>
			<div class="modal-footer" style="border: none;">
				<button type="button" data-dismiss="modal" class="btn btn-primary"

				<!-- data-target="#tokenDisplayModal" -->
				<button type="button" data-dismiss="modal" class="btn btn-primary">Cancel</button>
			</div>
		</div>
	</div>
</div>
