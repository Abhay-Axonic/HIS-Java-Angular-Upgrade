<!-- Page Content -->
<div id="page-content-wrapper" class="">
	<div class="container-fluid his-style">
		<!-- 		<div class="ng-scope" ng-include="'./views/common/patient-demography-opd.html'" style=""></div> -->
		<div class="row margin-top4">
			<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
				<span class="margin-left10"> <b class="padding-right10 ">Patient Name: </b>
					<label>{{vm.model.implantIndentDetails.patientName}}</label>
				</span>
			</div>
			<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
				<span class="margin-left10"> <b class="padding-right10 ">UHID : </b>
					<label>{{vm.model.implantIndentDetails.uhid}}</label>
				</span>
			</div>
			<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
				<span class="margin-left10"> <b class="padding-right10 ">Indent Date: </b>
					<label>{{vm.model.implantIndentDetails.indentDate | date:'dd/MM/yyyy' : 'UTC'}}</label>
				</span>
			</div>
			<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
				<span class="margin-left10"> <b class="padding-right10 ">Indent No. :</b>
					<label>{{vm.model.implantIndentDetails.indentNo}} </label>
				</span>
			</div>

		</div>


		<div class="row margin-top10">
			<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
				<span class="margin-left10"> <b class="padding-right10 ">To Store: </b>
					<label>{{vm.model.implantIndentDetails.store}}</label>
				</span>
			</div>
			<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
				<span class="margin-left10"> <b class="padding-right10 ">Priority : </b>
					<label>{{vm.model.implantIndentDetails.priority}}</label>
				</span>
			</div>
			<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
				<span class="margin-left10"> <b class="padding-right10 ">Type :</b>
					<label>{{vm.model.implantIndentDetails.indentType}}</label>
				</span>
			</div>
		</div>
		<div class="row padding-top10">
			<div class="container-fluid">
				<div class="table-container padding-left-right-set4 padding-top5">
					<div class="table-container-header">
						<table class="table table-striped table-hover table-condensed table-bordered">
							<thead class="mainServiceTableCommon">
								<tr>
									<th class="width6">Item Code</th>
									<th class="width6">Item Name</th>
									<th class="width6">Generic Name</th>
									<th class="width5">UOM</th>
									<th class="width5">UOM Unit</th>
									<th class="width6">Indent Qty</th>
									<th class="width6">Stock Available</th>

								</tr>
							</thead>
						</table>
					</div>
					<div class="table-container-body fix-height-scroll230" style="overflow-y: overlay;">
						<table class="table table-striped table-hover table-condensed table-bordered">
							<tbody>
								<tr ng-repeat="items in vm.model.implantIndentDetails.items | orderBy:sortType:sortReverse">
									<td class="width6 vertical-middle">{{items.itemCode}}</td>
									<td class="width6 vertical-middle">{{items.itemName}}</td>
									<td class="width6 vertical-middle">{{items.genericName}}</td>
									<td class="width5 vertical-middle">{{items.uomType}}</td>
									<td class="width5 vertical-middle">{{items.uomUnit}}</td>
									<td class="width6 vertical-middle">{{items.indentQuantity}}</td>
									<td class="width6 vertical-middle">{{items.stockAvailable}}</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
		</div>
		<footer class="col-lg-12 col-md-12 col-sm-12 padding-left-right-set4 padding-right20">
			<div class="row his-style margin-top10 padding-right20">
				<div class="col-lg-1 col-md-1 col-sm-2 text-right">
					<label>Remark:</label>
				</div>
				<div class="col-lg-10 col-md-10 col-sm-8 padding-left-right8">
					<textarea rows="1" ng-model="vm.model.implantIndentDetails.remark" class="form-control" readonly></textarea>
				</div>
				<div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4">
					<a href="#/implantIndent">
						<input type="button" value="Back" class="btn btn-primary btn-save-box-shadow">
					</a>
				</div>
			</div>
		</footer>
	</div>
</div>
<script src="resources/assets/js/common/page-height.js"></script>
