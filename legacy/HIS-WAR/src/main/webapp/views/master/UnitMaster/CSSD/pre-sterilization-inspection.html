<div id="page-content-wrapper">
	<div class="container-fluid his-style">
	
	<div class="main-heading-div">
				<div class="row">
					<div ng-include="'./views/common/select-cssd-store.html'"></div>
				</div>
			</div>
			
	
		<div class="row padding-top8">
			<div
				class="col-lg-2 col-md-2 col-sm-3 padding-left-right-set4 padding-top10">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-2 polymer-icon">
						<i class="fa fa-calendar" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11">
							<div class="">
						
									<input type="text" autocomplete="off" class="text-input floating-label dirty" 
									name="datePickerForFromDate" id="datePickerForFromDate" uib-datepicker-popup="dd/MM/yyyy"
									 ui-mask="99/99/9999" placeholder="DD/MM/YYYY"
									 
									  ng-model="datePickerForFromDate" model-view-value="true" is-open="datePickerForFromDate.opened"
									   datepicker-options="dateOptions" show-button-bar="false"
									    ng-click="openDatePickerForFromDate()" required="" style="">
									
									<label for="code" class="">
									Date (From)</label> <!-- Date should be selected from-to Date  -->
							</div>
					</div>
				</div>
			</div>
			<div
				class="col-lg-2 col-md-2 col-sm-3 padding-left-right-set4 padding-top10">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-2 polymer-icon">
						<i class="fa fa-calendar" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-10">
						<div class="">
							<input type="text" autocomplete="off" class="text-input floating-label dirty" 
									name="datePickerForToDate" id="datePickerForToDate" uib-datepicker-popup="dd/MM/yyyy"
									 ui-mask="99/99/9999" placeholder="DD/MM/YYYY"
									 
									  ng-model="datePickerForToDate" model-view-value="true" is-open="datePickerForToDate.opened"
									   datepicker-options="dateOptions" show-button-bar="false"
									    ng-click="openDatePickerForToDate()" required="" style=""> <label
								for="code">Date-Till</label>
						</div>
					</div>
				</div>
			</div>
			<div
				class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11">
						<div class="">
							<input type="text" autocomplete="off" name="code" id=""
								class="text-input floating-label dirty" ng-model="searchName"> <label
								for="code">Kit Name/Instrument Name</label>
						</div>
					</div>
				</div>
			</div>
			<div
				class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11">
						<div class="">
							<select class="text-input floating-label dirty" name="code" ng-model="selectedInspectionStatus" required>
								<option value="">All</option>
								<option value="Completed">Completed</option>
								<option value="Pending">Pending</option>
							</select> <label for="code">Status(n)</label>
						</div>
					</div>
				</div>
			</div>
			<div
				class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto padding-top10">
				<div class="common-save-button" style="padding-top:  0px;">
					<a href="" class="btn btn-primary btn-save-box-shadow" ng-click="getPendingInspectionListByMultipleFields()"
						title="Search"><i class="fa fa-search" aria-hidden="true" ></i></a>
				</div>
			</div>
		</div>
		<div class="row margin-top8 padding-left-right-set4">
			<div class="col-lg-12 col-md-12 col-sm-12">
				<table class="table table-bordered">
					<thead>
						<tr>
							<th class="width10">
								Transition No.
								<div class="float_right">
									<div><i class="fa fa-caret-up" aria-hidden="true"></i></div>
									<div class="margin-top-8"><i class="fa fa-caret-down" aria-hidden="true"></i></div>
								</div>
							</th>
							<th class="width12">Kit Code/Instrument Code
								<div class="float_right">
									<div>
										<i class="fa fa-caret-up" aria-hidden="true"></i>
									</div>
									<div class="margin-top-8">
										<i class="fa fa-caret-down" aria-hidden="true"></i>
									</div>
								</div>
							</th>
							<th class="width12">Kit Name/Instrument Name
								<div class="float_right">
									<div>
										<i class="fa fa-caret-up" aria-hidden="true"></i>
									</div>
									<div class="margin-top-8">
										<i class="fa fa-caret-down" aria-hidden="true"></i>
									</div>
								</div>
							</th>
							<th class="width12"> Date
								<div class="float_right">
									<div>
										<i class="fa fa-caret-up" aria-hidden="true"></i>
									</div>
									<div class="margin-top-8">
										<i class="fa fa-caret-down" aria-hidden="true"></i>
									</div>
								</div>
							</th>
							<th class="width3">Status(n)
								<div class="float_right">
									<div>
										<i class="fa fa-caret-up" aria-hidden="true"></i>
									</div>
									<div class="margin-top-8">
										<i class="fa fa-caret-down" aria-hidden="true"></i>
									</div>
								</div>
							</th>
							<th class="width3 text-center">Action taken
								<div class="float_right">
									<div>
										<i class="fa fa-caret-up" aria-hidden="true"></i>
									</div>
									<div class="margin-top-8">
										<i class="fa fa-caret-down" aria-hidden="true"></i>
									</div>
								</div>
							</th>
						</tr>
					</thead>
					<tbody>
					<tr ng-if="preInspectionKitList.length==0"><td class="text-center" colspan="6">{{loadingMessage}}</td></tr>
						<tr ng-repeat="data in preInspectionKitList">
							<td>{{data.transitionNumber}}</td>
							<td>{{data.code}}</td>
							<td>{{data.name}}</td>
							<td>{{data.created_date}}</td>
							<td>{{data.status}}</td>
							<td class="text-center"><a ui-sref="showPreSterilizationInspection({transitionNumber: data.transitionNumber})" title="View"><i class="fa fa-eye"></i></a></td>
							<!-- <td class="text-center"><a href="#/viewPreSterilizationInspection" title="View"><i
									class="fa fa-eye"></i></a></td> -->
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
	$(document).ready(function() {
		var documentHeight = $(window).height();
		var sideBarHeight = documentHeight - 55;
		$("#page-content-wrapper").css("height", sideBarHeight + "px");
	});

	$(".selectedPageName").text("Pending For Inspection");
	$(".sidebar-nav li").each(function() {
		$(this).find("a").parents("li").removeClass("active");
	});
	$('a[href$="preSterilizationInspection"]').parents("li").addClass("active");
</script>
