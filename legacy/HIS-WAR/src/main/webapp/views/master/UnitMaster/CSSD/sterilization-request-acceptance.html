<div id="page-content-wrapper">
	<div class="container-fluid his-style">
	
	<div class="main-heading-div">
				<div class="row">
					<div ng-include="'./views/common/select-cssd-store.html'"></div>
				</div>
			</div>
	
	
		<div class="row margin-top10">
			<div class="col-lg-1 col-md-1 col-sm-1 padding-left-right-set4 padding-top10">
				<div class="row input-container">
					<div class="col-lg-2 col-sm-2 col-md-2 polymer-icon">
						<i class="fa fa-calendar" aria-hidden="true"></i>
					</div>
					<div class="col-lg-10 col-sm-10 col-md-10">
						<div class="">
						
									<input type="text" autocomplete="off" class="text-input floating-label dirty" 
									name="datePickerForFromDate" id="datePickerForFromDate" uib-datepicker-popup="dd/MM/yyyy"
									 ui-mask="99/99/9999" placeholder="DD/MM/YYYY"
									 
									  ng-model="datePickerForFromDate" model-view-value="true" is-open="datePickerForFromDate.opened"
									   datepicker-options="dateOptions" show-button-bar="false"
									    ng-click="openDatePickerForFromDate()" required="" style="">
									
									<label for="code" class="">
									Date (From)</label>
						 </div>
						</div>
					</div>
				</div>
				<div class="col-lg-1 col-md-1 col-sm-1 padding-left-right-set4 padding-top10">
					<div class="row input-container">
						<div class="col-lg-2 col-sm-2 col-md-2 polymer-icon">
							<i class="fa fa-calendar" aria-hidden="true"></i>
						</div>
						<div class="col-lg-10 col-sm-10 col-md-10">
							<div class="">
								<input type="text" autocomplete="off" class="text-input floating-label dirty" 
									name="datePickerForToDate" id="datePickerForToDate" uib-datepicker-popup="dd/MM/yyyy"
									 ui-mask="99/99/9999" placeholder="DD/MM/YYYY"
									 
									  ng-model="datePickerForToDate" model-view-value="true" is-open="datePickerForToDate.opened"
									   datepicker-options="dateOptions" show-button-bar="false"
									    ng-click="openDatePickerForToDate()" required="" style=""> <label
								for="code">Date-Till</label>
						   </div>
							</div>
						</div>
				</div>
				<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-tasks" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<!-- <div class="">
								<select name="" id="" class="text-input floating-label dirty">
									<option label="" value=""></option>
								</select>
								<label for="code">Requesting Store</label>
							</div> -->
							<div class="">
								<select class="text-input floating-label" name="fromStore"
								ng-model="selectedRequestingStore"
								ng-options="data.storeId as data.storeName for data in requestingStoreList" required>
								</select> <label for="requestingStore">Requesting Store</label>
				  			</div>
						</div>
					</div>
				</div>
				<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-tasks" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<!-- <div class="">
								<select name="" id="" class="text-input floating-label dirty">
									<option label="" value=""></option>
								</select>
								<label for="code">Issuing Store</label>
							</div> -->
							<div class="">
								<select class="text-input floating-label" name="toStore"
								ng-model="selectedIssuingStore"
								 ng-options="data.storeId as data.storeName for data in issuingStoreList" required disabled>
								</select> <label for="issuingStore">Issuing Store</label>
							</div>
						</div>
					</div>
				</div>

				<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-bullseye" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<div class="">
									<input type="text" autocomplete="off" name="code" id="" class="text-input floating-label dirty" ng-model="requestNo">
								<label for="code">Request No.</label>
							</div>
						</div>
					</div>
				</div>

				<div class="col-lg-2 col-md-2 col-sm-1 padding-left-right-set4 padding-top10">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-2 col-md-2 polymer-icon ">
							<i class="fa fa-dot-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-10 col-md-10">
							<div class="">
									<!-- <select name="status" id="" class="text-input floating-label dirty">
										<option value=""></option>
									</select>
								<label for="description" class="LISDynamicLabel">Status</label> -->
								<select class="text-input floating-label dirty" name="code" ng-model="selectedSterRequestAcceptanceStatus" required>
										<option value="">All</option>
										<option value="Cancelled">Cancelled</option>
										<option value="Closed">Closed</option>
										<option value="Pending">Pending</option>
								</select> <label for="code">Status(n)</label>
							</div>
						</div>
					</div>
				</div>
				<div class="col-lg-2 col-sm-2 col-md-2 padding-top10">
					<div class="common-save-button" style="padding-top:  0px;">
						<a href="" class="btn btn-primary btn-save-box-shadow" style="width: auto;" ng-click="getSterRequestAcceptanceByMultipleFields()">
							<i class="fa fa-search" aria-hidden="true"></i>
						</a>
					</div>
				</div>
			</div>
			<div class="row margin-top4 padding-left-right-set0">
				<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 float_right">
					<input type="text" autocomplete="off" class="text-search-box" ng-model="search" placeholder="Search" style="margin-top:0px">
					<i class="fa fa-search common-search-text-icon" aria-hidden="true"></i>
				</div>
			</div>
			<div class="row padding-top4 padding-left-right-set4">
				<div class="col-lg-12 col-md-12 col-sm-12 height380-table-with-scroll">
					<table class="table table-bordered first-checkBox-padding margin-top4">
						<!-- mainServiceTable -->
						<thead class="mainServiceTableCommon">
							<tr>
								<th class="width8">Request No.</th>
								<th class="width8">Request (Date)</th>
								<th class="width8">Store (Requestor)</th>
								<th class="width8">Issuing Store</th>
								<th class="width10">Remark</th>
								<th class="width5">Status(n)</th>
								<th class="width8 text-center vertical-middle">Action taken</th>
							</tr>
						</thead>
						<tbody>
							<!-- <tr>
								<td class="text-center" colspan="11">
									<p>No Record Found</p>
								</td>
							</tr> -->
							<!-- <tr>
								<td></td>
								<td></td>
								<td></td>
								<td></td>
								<td></td>
								<td></td>
								<td class="text-center">
									<a href="#/detailsSterilizationRequestAcceptance">Details</a>
								</td>
							</tr> -->
						<tr ng-if="sterRequestAcceptanceList.length==0"><td class="text-center" colspan="7">{{loadingMessage}}</td></tr>	
						<tr ng-repeat="info in sterRequestAcceptanceList">
							<td>{{info.requestNo}}</td>
							<td>{{info.createdDate}}</td>
							<td>{{info.requestingStore}}</td>
							<td>{{info.issueingStore}}</td>
							<td>{{info.remark}}</td>
							<td>{{info.status}}</td>
							<td class="padding-edit-button-table text-center">
											<div class="col-lg-6 col-md-6 padding-left-right-set4 text-right">
												<a ui-sref="detailsSterilizationRequestAcceptance({requestNo: info.requestNo})" title="View">Details</a>
											</div>
							</td>
						</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
</div>
<script src="resources/assets/js/common/page-height.js"></script>


<script>

$(document).ready(function() {  
	 $(".selectedPageName").text("Sterilization Request Acceptance");
	$(".sidebar-nav li").each(function() {
		$(this).find("a").parents("li").removeClass("active");
	});
	$('a[href$="sterilizationRequestAcceptance"]').parents("li").addClass("active");
});




</script>
