<div id="page-content-wrapper">
	<div class="container-fluid his-style">
		<div class="row padding-top12">
		<form name="storeTypeForm"  novalidate>
		  <div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11">
						<div class="form-group"   show-errors>
							<input type="text" autocomplete="off" name="code" id="" class="text-input floating-label" ng-model="common.code" required> 
							<label for="description" class="LISDynamicLabel">Code<span class="star">*</span></label>
							<p class="help-block" ng-if="storeTypeForm.code.$error.required">Code is required</p>
						</div>
					</div>
				</div>
			</div>
			<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11">
						<div class="form-group"   show-errors>
							<input type="text" autocomplete="off" name="type" id="" class="text-input floating-label" ng-model="common.type" required> 
							<label for="description" class="LISDynamicLabel">Description<span class="star">*</span></label>
							<p class="help-block" ng-if="storeTypeForm.type.$error.required">Description is required</p>
						</div>
					</div>
				</div>
			</div>
			</form>
		</div>
		<div class="row padding-top8">
			<div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
				<div class=" ">
					<a href="" class="btn btn-primary btn-save-box-shadow" title="Save" data-toggle="modal"  data-target="" ng-click="save()" ng-if="saveBtnFlag">
					<i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
					
					<a href="" class="btn btn-primary btn-save-box-shadow" title="Update" data-toggle="modal"  data-target=""  ng-click="update()" ng-if="updateBtnFlag">
					<i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
					
				</div>
			</div>
			<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set0 float_right">
				<input type="text" autocomplete="off" class="text-search-box dirty" placeholder="Search" style="margin-top: 0px"  ng-model="searchKeyword">
				<i class="fa fa-search common-search-text-icon" aria-hidden="true"></i>
			</div>
		</div>
		<div class="row padding-left-right-set4 table-container padding-top5">
		<div class="col-md-6 col-sm-7 padding-left-right-set4">
				<div class="row">
					<div class="col-lg-3 col-md-6 col-sm-6" style="padding-left: 0px;">
						<div class="search">
						<label class="show-entries">Show 
						<select name="DataTables_Table_0_length" aria-controls="DataTables_Table_0"
							ng-init="noOfRecordsPerPage='10'" ng-model="noOfRecordsPerPage"
							ng-change="setNoOfRecords();" class="search-popUp-ddl">
								<option value="10">10</option>
								<option value="25">25</option>
								<option value="50">50</option>
								<option value="100">100</option>
						</select> entries
						</label>
					</div>
					</div>
				</div>
			</div>
			<div class="table-container">
				<div class="table-container-header">
					<table
						class="table table-striped table-hover table-condensed table-bordered">
						<thead>
							<tr>
								<th class="width3">
									Code
								</th>
								<th class="width3">
									Description
								</th>
								<th class="width2 text-center">
									Status(n)
								</th>
								<th class="width2 text-center">
									Action taken
								</th>
							</tr>
						</thead>
					</table>
				</div>
				<div class="table-container-body fix-height-scroll360" style="overflow: overlay;"> <!-- fix-height-scroll230, background: #fff; -->
					<table
						class="table table-striped table-hover table-condensed table-bordered">
						<tbody>
							<tr ng-repeat="info in commonList|orderBy:column:reverse|filter:searchKeyword">
								<td class="width3">{{info.code}}</td>
								<td class="width3">{{info.type}}</td>
								<td class="width2 vertical-middle text-center">
											<label class="switch"> 
												<input type="checkbox" ng-model="info.isActive"  ng-true-value="true"  ng-false-value="false"  ng-change="updateStatus(info.storeTypeId,info.isActive)">
												<div class="slider round"></div>
											</label>
										</td>
								<td class="width2 text-center" title="Edit">
								<i class="fa fa-pencil" style="color: #3131d2;" aria-hidden="true " ng-click="showUpdateBtn(info.storeTypeId)" title="Edit"></i>
								
							</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div> 
		<div class="row margin-bottom45 sss">
			<ul ng-if="pager.pages.length" class="pagination table-list"
				style="font-size: 14px;">
				<li ng-class="{disabled:pager.currentPage === 1}"><a
					ng-click="setPage(1,'true')">First</a></li>
				<li ng-class="{disabled:pager.currentPage === 1}"><a
					ng-click="setPage(pager.currentPage - 1,'true')">Previous</a></li>
				<li ng-repeat="page in pager.pages"
					ng-class="{active:pager.currentPage === page}"><a
					ng-click="setPage(page,'true')">{{page}}</a></li>
				<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
					<a ng-click="setPage(pager.currentPage + 1,'true')">Next</a>
				</li>
				<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
					<a ng-click="setPage(pager.totalPages,'true')">Last</a>
				</li>
			</ul>
		</div>
	</div>
</div>	

<modal visible="showModal"></modal> 
<script src="resources/assets/js/common/page-height.js"></script>
<script type="text/javascript">

$(document).ready(function() {  
	// $(".patienttSearchResult").hide();
	//$(".icon-span").hide();
	 $(".selectedPageName").text("Store Type Master");
	$(".sidebar-nav li").each(function() {
		$(this).find("a").parents("li").removeClass("active");
	});
	$('a[href$="storeTypeMaster"]').parents("li").addClass("active");
});
</script>
