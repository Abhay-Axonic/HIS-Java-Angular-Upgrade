<div id="page-content-wrapper">
	<div class="container-fluid his-style">
	<form name="ambulanceFacilitiesForm" novalidate >
	<div class="row padding-top12">
		<div class="row">
		<div class="col-lg-4 col-md-4 col-sm-4 padding-left-right-set4 padding-top10">
			<div class="row input-container">
				<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
					<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
				</div>
				<div class="col-lg-11 col-sm-11 col-md-11">
					<div class="">
						<input type="text" autocomplete="off" class="text-input floating-label"  name="ambFacilities" ng-model="ambulanceFacilities.ambFacilities" required="required"> 
							<label for="description" class="LISDynamicLabel">Ambulance Facilities<span class="star">*</span></label>
						<p class="help-block" ng-if="ambulanceFacilitiesForm.ambFacilities.$error.required">Ambulance Facilities is required</p>
						<input type="hidden" name="ambulanceFacilitiesMasterId" ng-model="ambulanceFacilities.ambulanceFacilitiesMasterId" class="text-input floating-label">
					</div>
				</div>
			</div>
		</div>
	 </div>
	</div>
	</form>
	 <div class="row padding-top8">
	 
	 <div class="col-md-8 col-sm-8 padding-left-right-set4">
					<div class="row">
						<div class="col-lg-3 col-md-6 col-sm-6" style="padding-left: 0px;">
							<div class="search">
							<label class="show-entries">Show 
							<select name="DataTables_Table_0_length" aria-controls="DataTables_Table_0"
								ng-init="noOfRecordsPerPage='10'" ng-model="noOfRecordsPerPage"
								ng-change="setNoOfRecords();" class="search-popUp-ddl">
									<option value="10">10</option>
									<option value="25">25</option>
									<option value="50">50</option>
									<option value="100">100</option>
							</select> entries
							</label>
						</div>
						</div>
					</div>
				</div>
			<div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
				<div class=" ">
						<a href="" class="btn btn-primary btn-save-box-shadow" title="Save" data-toggle="modal"  ng-click="saveAmbulanceFacilities()" ng-if="saveBtnFlag">
					<i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
					
					<a href="" class="btn btn-primary btn-save-box-shadow" title="Update" data-toggle="modal" ng-click="updateAmbulanceFacilities()" ng-if="updateBtnFlag">
			        <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
				</div>
			</div>
			<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set0 float_right">
				<input type="text" autocomplete="off" class="text-search-box ng-pristine ng-untouched ng-valid ng-empty search-popUp-ddl" placeholder="Search" style="margin-top:0px" ng-model="searchKeyword">
				<i class="fa fa-search common-search-text-icon" aria-hidden="true"></i>
			</div>
		</div>
		<modal visible="showModal"></modal>
	 <div class="row padding-left-right-set4 table-container padding-top12">
			<div class="table-container">
				<div class="table-container-header">
					<table
						class="table table-striped table-hover table-condensed table-bordered">
						<thead>
							<tr>
								<th class="width3">
									Ambulance Facilities
								</th>
								<th class="width1 text-center">
									Status(n)
								</th>
								<th class="width1 text-center">
									Action taken
								</th>
							</tr>
						</thead>
					</table>
				</div> 
				<div class="table-container-body fix-height-scroll400" style="overflow: overlay;"> <!-- fix-height-scroll230, background: #fff; -->
					<table
						class="table table-striped table-hover table-condensed table-bordered">
						<tbody>
							<tr ng-repeat="info in ambulanceFacilitiesList|filter:searchKeyword">
								<td class="width3">{{info.ambFacilities}}</td>
								<td class="width1 vertical-middle text-center">
									<label class="switch"> 
									<input type="checkbox" ng-model="info.status" placeholder="Delete" ng-true-value="'A'"  ng-false-value="'I'"  ng-change="updateStatus(info.ambulanceFacilitiesMasterId,info.status)">
									<div class="slider round"></div>
									</label>
								</td>
								<td class="width1 text-center"><a><i class="fa fa-pencil" aria-hidden="true" ng-click="showUpdateBtn(info.ambulanceFacilitiesMasterId)"></i></a></td>
							</tr>
						</tbody>
					</table>
				</div>
				<div class="row margin-bottom45 sss">
					<ul ng-if="pager.pages.length" class="pagination table-list"
						style="font-size: 14px;">
						<li ng-class="{disabled:pager.currentPage === 1}"><a
							ng-click="setPage(1,'true')">First</a></li>
						<li ng-class="{disabled:pager.currentPage === 1}"><a
							ng-click="setPage(pager.currentPage - 1,'true')">Previous</a></li>
						<li ng-repeat="page in pager.pages"
							ng-class="{active:pager.currentPage === page}"><a
							ng-click="setPage(page,'true')">{{page}}</a></li>
						<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
							<a ng-click="setPage(pager.currentPage + 1,'true')">Next</a>
						</li>
						<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
							<a ng-click="setPage(pager.totalPages,'true')">Last</a>
						</li>
					</ul>
				</div>
			</div>
		</div> 
	</div> 
</div>		


<script src="resources/assets/js/common/page-height.js"></script>
<script type="text/javascript">

$(document).ready(function() {  
	var documentHeight = $(window).height();
	var sideBarHeight = documentHeight - 55;
	 $(".selectedPageName").text("Ambulance Facilities Master");
	$(".sidebar-nav li").each(function() {
		$(this).find("a").parents("li").removeClass("active");
	});
	$('a[href$="ambulanceFacilitiesMaster"]').parents("li").addClass("active");
});
</script>
