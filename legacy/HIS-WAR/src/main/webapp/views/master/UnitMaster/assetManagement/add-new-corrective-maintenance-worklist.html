							<input type="text" autocomplete="off" class="text-input floating-label dirty"

										    uib-datepicker-popup="dd/MM/yyyy" ui-mask="99/99/9999"

											ng-click="openToDatePicker()"   >
							<label for="description" class="LISDynamicLabel">Resolution Expected Date <span class="star">*</span> </label>

						</div>

					<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
						<div class="row input-container">

								<i class="fa fa-clock-o" aria-hidden="true"></i>

									<input type="text" autocomplete="off" name="description" id="" ng-model="corectiveMaintenanceObj.resolutionExpectedTime" class="text-input floating-label"  ng-init="initClockPicker()"> 
									<label for="description" class="">Resolution Expected Time <span class="star">*</span> </label>

							</div>
						</div>
					</div>

			</div>

<div id="addNewItemWasteStore" class="modal fade ng-scope in common-large-popup" role="dialog" data-keyboard="false" data-backdrop="static">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<div class="modal-title patient-details-row">
					Add Item List
					<button type="button" ng-click="" class="close" data-dismiss="modal">&times;</button>
				</div>
			</div>
			<div class="modal-body height-table-with-scroll	">
				<fieldset>
					<div class="row">
						<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
							<div class="row input-container">
								<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
									<i class="fa fa-tasks" aria-hidden="true"></i>
								</div>
								<div class="col-lg-11 col-sm-11 col-md-11">
									<div class="">
									
										<select name="assetCategory" id="assetCategory" class="text-input floating-label dirty" data-ng-options="category.category for category in assetCategoriesList"
										 ng-model="assetCategoryObj" ng-change="getProductCategoryList(assetCategoryObj.id)">
										</select>

										<label for="code">Asset Category</label>
									</div>
								</div>
							</div>
						</div>
						<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
							<div class="row input-container">
								<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
									<i class="fa fa-tasks" aria-hidden="true"></i>
								</div>
								<div class="col-lg-11 col-sm-11 col-md-11">
									<div class="">
										<select name="productCategory" id="productCategory" class="text-input floating-label dirty" data-ng-options="x as x.category for x in productCategoriesList track by x.id"
										 ng-model="productCategoryObj">
										</select>
										<label for="code">Product Category</label>
									</div>
								</div>
							</div>
						</div>
						<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
							<div class="row input-container">
								<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon ">
									<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
								</div>
								<div class="col-lg-11 col-sm-11 col-md-11 ">
									<div class="">
										<input type="text" autocomplete="off" name="description" id="" class="text-input floating-label" ng-model="itemObj.itemCode">
										<label for="description" class="LISDynamicLabel">Item Code</label>
									</div>
								</div>
							</div>
						</div>
						<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
							<div class="row input-container">
								<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon ">
									<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
								</div>
								<div class="col-lg-11 col-sm-11 col-md-11 ">
									<div class="">
										<input type="text" autocomplete="off" name="description" id="" class="text-input floating-label" ng-model="itemObj.itemName">
										<label for="description" class="LISDynamicLabel">Item Name</label>
									</div>
								</div>
							</div>
						</div>
						<div class="col-lg-1 col-md-1 col-sm-1 padding-left-right-set4 his-style">
							<div class="common-save-button">
								<a href="" class="btn btn-primary btn-save-box-shadow" id="searchBtn" style="width: auto;" ng-click="searchNewItem()">
									<i class="fa fa-search" aria-hidden="true"></i>
								</a>
							</div>
						</div>
					</div>
					<div class="row common-popup-height-350">

							<table class="table table-bordered">
								<thead>
									<tr>
										<th class="width1 text-center media-middle ">
											<input type="checkbox" ng-model="vm.model.selectAllRows" ng-click="vm.model.SelectAllItems()" ng-disabled="!vm.model.searchNewItemList.length" />
										</th>
										<th class="width10">Asset Category
											<div class="float_right" ng-click="sortType = 'assetCategory'; sortReverse = !sortReverse">
												<div>
													<i class="fa fa-caret-up" aria-hidden="true"></i>
												</div>
												<div class="margin-top-8">
													<i class="fa fa-caret-down" aria-hidden="true"></i>
												</div>
											</div>
										</th>
										<th class="width10">Product Category
											<div class="float_right" ng-click="sortType = 'productCategory'; sortReverse = !sortReverse">
												<div>
													<i class="fa fa-caret-up" aria-hidden="true"></i>
												</div>
												<div class="margin-top-8">
													<i class="fa fa-caret-down" aria-hidden="true"></i>
												</div>
											</div>
										</th>
										<th class="width10">Item Code
											<div class="float_right" ng-click="sortType = 'itemCode'; sortReverse = !sortReverse">
												<div>
													<i class="fa fa-caret-up" aria-hidden="true"></i>
												</div>
												<div class="margin-top-8">
													<i class="fa fa-caret-down" aria-hidden="true"></i>
												</div>
											</div>
										</th>
										<th class="width10">Item Name
											<div class="float_right" ng-click="sortType = 'itemName'; sortReverse = !sortReverse">
												<div>
													<i class="fa fa-caret-up" aria-hidden="true"></i>
												</div>
												<div class="margin-top-8">
													<i class="fa fa-caret-down" aria-hidden="true"></i>
												</div>
											</div>
										</th>
									</tr>
								</thead>
								<tbody>
