					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
					</div>
					<div class="col-lg-4 col-sm-4 col-md-4">

					</div>
				</div>

			<div class="row padding-top8">
			<div class="col-lg-8 col-md-8 col-sm-8 padding-left-right-set4">
								<div class="search">
									<label class="show-entries">Show 
									<select ng-init="pagination.pageSize='10'" 
										ng-model="pagination.pageSize" 
										ng-change="pagination.setTotalPages(pagination)" class="search-popUp-ddl">
											<option value="10">10</option>
											<option value="25">25</option>
											<option value="50">50</option>
											<option value="100">100</option>
									</select> records 
									</label>
								</div>
				</div>
			<div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
				<div class=" ">
			        
			        <a href="" class="btn btn-primary btn-save-box-shadow" title="{{updateDepartmentStoreMapper ? 'Update' : 'Save' }}" data-toggle="modal" ng-click="SaveAndUpdateDeptStroreMapper()">
			        <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
				</div>
			</div>
			<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set0 float_right">
				<input type="text" autocomplete="off" class="text-search-box ng-pristine ng-untouched ng-valid ng-empty search-popUp-ddl" placeholder="Search" style="margin-top:0px" ng-model="searchKeyword">
				<i class="fa fa-search common-search-text-icon" aria-hidden="true"></i>
			</div>
		</div>
		<div class="row padding-top10">
			<div class="col-md-12 col-lg-12 col-sm-12" id="nonBillableTableHt">

						<table class="table table-bordered first-checkBox-padding"><!-- mainServiceTable -->
							<thead class="mainServiceTableCommon">
								<tr>
									<th class="width8">
										Store
									</th>
									<th class="width8">
										Department
									</th>
									<th class="width3">
										Status(n)
									</th>
									<th class="width3 text-center vertical-middle">Action taken
									</th>
								</tr>
							</thead>
							<tbody>
								<tr ng-repeat="info in pagination.data |orderBy:column:reverse|filter:searchKeyword">
								<td >{{info.storeName}}</td>
								<td>{{info.deptName}}</td>
								<td><label class="switch"> <input type="checkbox"
									ng-model="info.status" ng-checked="info.status=='A'"
									ng-true-value="'A'" ng-false-value="'I'"
									ng-change="updateStatus(info.deptStoreMapperId,info.status)">
									<div class="slider round"></div>
							     </label></td>
									<td class="text-center"><a><i class="fa fa-pencil"
									aria-hidden="true" ng-click="showUpdateBtn(info.deptStoreMapperId)"></i></a></td>
								</tr>
							</tbody>
						</table>
						<table class="table table-bordered">
					<tr ng-if="(getDeptStoremappedList|filter:searchKeyword)=='' || (getDeptStoremappedList|filter:searchKeyword)==null">
						<td><p style="text-align: center;margin-top: 0px !important;margin-bottom: 1px !important;">No Records Found</p></td>
					</tr>
				</table>
				<div class="row margin-bottom45 center-block">
					<ul ng-if="pagination.totalPages > 1" class="pagination table-list"
						style="font-size: 14px; cursor: pointer;">
						<li ng-class="{disabled:pagination.currentPage === 1}"><a
							ng-click="pagination.setFirstPage(pagination)">First</a>
						</li>
						<li ng-class="{disabled:pagination.currentPage === 1}"><a
							ng-click="pagination.setPreviousPage(pagination)">Previous</a>
						</li>
						<li ng-repeat="page in pagination.getPagesList(pagination)"
							ng-class="{active:pagination.currentPage === page}"><a
							ng-click="pagination.setPage(page, pagination)">{{page}}</a>
						</li>
						<li ng-class="{disabled:pagination.currentPage === pagination.totalPages}">
							<a ng-click="pagination.setNextPage(pagination)">Next</a>
						</li>
						<li ng-class="{disabled:pagination.currentPage === pagination.totalPages}">
							<a ng-click="pagination.setLastPage(pagination)">Last</a>
						</li>
					</ul>
				</div>
					</div>
			   </div>
			</div>
