
<!-- Page Content -->
<div id="page-content-wrapper" class="">
	<div class="container-fluid his-style">
		<fieldset class="">
			<div class="row">
				<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
		          	<span class="">
		          		<b class="padding-right10 "> Request Type :</b>
		          		<label>
		          			<div ng-if="detailsObj.requestTypeId == 1">Breakdown</div>
		          			<div ng-if="detailsObj.requestTypeId == 2">Installation</div>
		          			<div ng-if="detailsObj.requestTypeId == 3">As And When</div>
		          		</label>
		          	</span>
		        </div>
		        <div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
		          	<span class="">
		          		<b class="padding-right10 "> Request Criticality :</b>
		          		<label>
		          			<div ng-if="detailsObj.requestCriticalityId == 1">Normal</div>
		          			<div ng-if="detailsObj.requestCriticalityId == 2">Urgent</div>
		          		</label>
		          	</span>
		        </div>	
			</div>
			<div class="row">
				<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
		          	<span class="">
		          		<b class="padding-right10 "> Asset Category :</b><label>{{detailsObj.assetcategory}}</label>
		          	</span>
		        </div>
		        <div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
		          	<span class="">
		          		<b class="padding-right10 "> Asset Code :</b><label>{{detailsObj.assetCode}}</label>
		          	</span>
		        </div>
		        <div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
		          	<span class="">
		          		<b class="padding-right10 "> Asset Name :</b><label>{{detailsObj.assetName}}</label>
		          	</span>
		        </div>
		        <div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
		          	
		          	<div class="">
		          			<select name="batchList"class="text-input floating-label dirty" data-ng-options="x as x.serialNumber for x in serialNumberList track by x.batchId"
								 ng-model="serialNoObj"  ng-disabled="editflag">
							</select>
							<label for="code">Serial No. :</label>
					</div>
		        </div>
			</div>
			<div class="row padding-top10">
				<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
		          	<span class="">
		          		<b class="padding-right10 "> Request Date Time :</b><label>{{detailsObj.requestDateTime}}</label>
		          	</span>
		        </div>
				<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
						<div class="col-lg-1 col-md-1 col-sm-1 padding-left-right-set4 padding-top10 text-right text-width-auto">
								<label class="switch"> 
									<input type="checkbox" class="" id="1" ng-model="detailsObj.isDown"  ng-true-value="true" ng-false-value="false" ng-change="changedowndate();"  ng-disabled="editflag">
									<div class="slider round"></div>
								</label>
							</div>
							<div class="col-lg-6 col-md-6 col-sm-6 padding-left-right-set4 padding-top12"><label class="cursor-pointer" for="1">Is Operative</label></div>
					</div>
					
				<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
					<div class="row input-container">
							<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
								<i class="fa fa-calendar" aria-hidden="true"></i>
							</div>
							<div class="col-lg-11 col-sm-11 col-md-11">
								<div class="">
								
								<input type="text" autocomplete="off" class="text-input floating-label dirty"
												name="fromDatepicker" id="fromDatepicker"
											    uib-datepicker-popup="dd/MM/yyyy" ui-mask="99/99/9999"
												placeholder="DD/MM/YYYY" ng-model="detailsObj.downDateTime"
												model-view-value="true" is-open="fromDatepicker.opened"
												datepicker-options="fromdateOptions" show-button-bar="false"
												ng-click="openFromDatePicker()"   ng-disabled="editflag">
												<label for="description" class="" > 
								<label for="description" class="LISDynamicLabel">Down Time Date</label> 
								</div>
							</div>
						</div>
		        </div> 
		        
		        <div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 padding-top10">
					<div class="row input-container">
						<div class="col-lg-2 col-sm-2 col-md-2 polymer-icon">
							<i class="fa fa-clock-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-10 col-sm-10 col-md-10">
							<div class="clockpicker">
								<input type="text" autocomplete="off" name="description" id="" ng-model="detailsObj.downTime" class="text-input floating-label"  ng-init="initClockPicker()" ng-disabled="editflag"> 
								<label for="description" class="">Down Time</label>
							</div>
						</div>
					</div>
				</div>
		        
			</div>
			<div class="row padding-top10">
				<div class="col-lg-12 col-md-12 col-sm-12 padding-left-right-set0">
					<div class="row">
						<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
							<b class="padding-right10 ">Request Details:</b>
						</div>
						<div class="col-lg-9 col-md-9 col-sm-9 padding-left-right-set4">
						<div class="col-lg-12 col-md-12">
							</div>
								<textarea type="text" autocomplete="off" class="dirty" name="editor" ng-model="detailsObj.requestDetails"  id="editor" rows="8" cols="50" ck-editor ng-disabled="editflag"></textarea>
							</div>
					</div>
				</div>
			</div>
			<div class="row padding-top5">
				<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
					<b class="padding-right10 ">Remarks:</b>
				</div>
				<div class="col-lg-9 col-md-9 col-sm-9 padding-left-right-set4">
					<textarea rows="2" class="dirty" ng-model="detailsObj.remark" ng-disabled="editflag"></textarea>
				</div>
			</div>
			<div class="row">
		        	<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-calendar" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<div class="">
							<input type="text" autocomplete="off" class="text-input floating-label dirty"
											name="toDatepicker" id="toDatepicker"
										    uib-datepicker-popup="dd/MM/yyyy" ui-mask="99/99/9999"
											placeholder="DD/MM/YYYY" ng-model="detailsObj.resolutionExpectedDateTime"
											model-view-value="true" is-open="toDatepicker.opened"
											datepicker-options="todateOptions" show-button-bar="false"
											ng-click="openToDatePicker()"   >
							<label for="description" class="LISDynamicLabel">Resolution Expected Date</label> 
							</div>
						</div>
						</div>
					</div>
					<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
						<div class="row input-container">
							<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
								<i class="fa fa-clock-o" aria-hidden="true"></i>
							</div>
							<div class="col-lg-11 col-sm-11 col-md-11">
								<div class="clockpicker">
									<input type="text" autocomplete="off" name="description" id="" ng-model="detailsObj.resolutionExpectedTime" class="text-input floating-label"  ng-init="initClockPicker()"> 
									<label for="description" class="">Resolution Expected Time</label>
								</div>
							</div>
						</div>
					</div>
			</div>
		</fieldset>
		
		<footer class="col-lg-12 col-md-12 col-sm-12 padding-left-right-set4 padding-right20">
			<div class="row his-style padding-right20">
				<div class="col-lg-9 col-md-9 col-sm-9 padding-left-right-set4"></div>
			       <div class="col-lg-1 col-md-1 col-sm-1 padding-left-right-set4">
			           <div class="">
			               <a href="">
			                   <input type="button" id="updateBtn" value="PMS Details" class="btn btn-primary btn-save-box-shadow" ng-click="getPMSDetails();">
			               </a>
			           </div>
			       </div>
			     <div class="col-lg-1 col-md-1 col-sm-1 padding-left-right-set4" ng-if="editflag == false">
		           <div class="">
		              <a href="">
		                   <input type="button" value="Update" id="updateBtn" class="btn btn-primary btn-save-box-shadow" ng-click="saveCorectiveMaintenance();">
		               </a>
		           </div>
		       	</div>
			       <div class="col-lg-1 col-md-1 col-sm-1 padding-left-right-set4">
		           <div class="">
		              <a href="#/correctiveMaintenance">
		                   <input type="button" value="Back" class="btn btn-primary btn-save-box-shadow">
		               </a>
		           </div>
		       </div>
			</div>
		</footer>
	</div>
</div>
<!--  Accessories Details modal start -->
<div ng-include="'./views/common/accessories-details.html'" class="ng-scope"></div>
<!--  Accessories Details modal end -->
<!-- PMS Details modal start -->
<div ng-include="'./views/common/PMS-details.html'" class="ng-scope"></div>

<!-- create checklist modal start -->
<div id="ChecklistModal" class="modal fade ng-scope in common-medium-popup" role="dialog">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<div class="modal-title patient-details-row">
					Check List
					<button type="button" class="close" data-dismiss="modal">&times;</button>
				</div>
			</div>
			<div class="modal-body">
				<!--  row start -->
				<div class="row">
					<div class="col-lg-12 col-md-12 padding-left-right-set4 common-table-height-250 margin-top4" id="">
						<table class="table table-bordered table-striped">
							<thead>
								<tr class="table-th-bg">
									<th class="width1">
										<input type="checkbox">
									</th>
									<th class="width20">
										Name
									</th>
									<th class="width80">
										Remark
									</th>
								</tr>
							</thead>
							<tbody>
								<tr>
									<td>
										<input type="checkbox">
									</td>
									<td>
										1
									</td>
									<td><textarea rows="2"></textarea></td>
								</tr>
								<tr>
									<td>
										<input type="checkbox">
									</td>
									<td>
										2
									</td>
									<td><textarea rows="2"></textarea></td>
								</tr>
								<tr>
									<td>
										<input type="checkbox">
									</td>
									<td>
										3
									</td>
									<td><textarea rows="2"></textarea></td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
			<div class="modal-footer" style="border:none;">
				<div class="pull-right">
					<button type="button" data-dismiss="modal" class="btn btn-primary" id="saveBtn">Save</button>
				</div>
			</div>
		</div>
	</div>
</div>
<!-- create checklist modal end -->
<!-- view create checklist modal start -->
<div id="viewChecklistModal" class="modal fade ng-scope in common-medium-popup" role="dialog">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<div class="modal-title patient-details-row">
					View Check List
					<button type="button" class="close" data-dismiss="modal">&times;</button>
				</div>
			</div>
			<div class="modal-body">
				<!--  row start -->
				<div class="row">
					<div class="col-lg-12 col-md-12 padding-left-right-set4 common-table-height-250 margin-top4" id="">
						<table class="table table-bordered table-striped">
							<thead>
								<tr class="table-th-bg">
									<th class="width1">
										<input type="checkbox" checked>
									</th>
									<th class="width20">
										Name
									</th>
									<th class="width80">
										Remark
									</th>
								</tr>
							</thead>
							<tbody>
								<tr>
									<td>
										<input type="checkbox" checked>
									</td>
									<td>
										1
									</td>
									<td>-</td>
								</tr>
								<tr>
									<td>
										<input type="checkbox" checked>
									</td>
									<td>
										2
									</td>
									<td></td>
								</tr>
								<tr>
									<td>
										<input type="checkbox" checked>
									</td>
									<td>
										3
									</td>
									<td></td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
<!-- view create checklist modal end -->

<script type="text/javascript">
$( document ).ready(function() {
	$(".selectedPageName").text("Details Corrective Maintenance");
});
/* ************** radioRejected4 ********** */

$( ".radioRejected4" ).change(function() {
	if ($(this).is(":checked"))
	{
		$(this).closest(".row").siblings(".rejection-details-row4").show();
		$(".approved-qty-remark").show();
	}
});
$( ".radioAcceptedHold4" ).change(function() {
	if ($(this).is(":checked"))
	{
		$(this).closest(".row").siblings(".rejection-details-row4").hide();
		$(".approved-qty-remark").hide();
	}
});
</script>
