<!-- Page Content -->
<div id="page-content-wrapper" class="">
	<div class="container-fluid his-style">
		<fieldset>
			<div class="row margin-top4">
				<div class="col-lg-3 col-md-3 col-sm-4 padding-left-right-set4 padding-top10">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-2 polymer-icon">
							<i class="fa fa-color" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-10">
							<div class="">
<!-- 								<select class="text-input floating-label" ng-model="common.generalLedgerCode"> -->
<!-- 									<option value=""></option> -->
<!-- 								</select> -->
								<input type="text" autocomplete="off" class="text-input floating-label dirty" ng-model="common.generalLedgerCode" /> 
								<label for="code">GL Code<span class="star">*</span></label>
							</div>
						</div>
					</div>
				</div>
				<div class="col-lg-3 col-md-3 col-sm-4 padding-left-right-set4 padding-top10">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-2 polymer-icon">
							<i class="fa fa-user-md fa-color" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-10">
							<div class="">
<!-- 								<select class="text-input floating-label  "> -->
<!-- 									<option value=""></option> -->
<!-- 								</select> -->
								<input type="text" autocomplete="off" class="text-input floating-label dirty" ng-model="common.generalLedgerName" /> 
								<label for="code">GL Description<span class="star">*</span></label>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div class="row margin-top8">
				<div class="col-lg-8 col-md-8 col-sm-8 padding-left-right-set4">
					<div class="search">
						<label class="show-entries">Show <select
							name="DataTables_Table_0_length"
							aria-controls="DataTables_Table_0"
							ng-init="noOfRecordsPerPage='10'" ng-model="noOfRecordsPerPage"
							ng-change="setNoOfRecords();" class="search-popUp-ddl">
								<option value="10">10</option>
								<option value="25">25</option>
								<option value="50">50</option>
								<option value="100">100</option>
						</select> entries
						</label>
					</div>
				</div>
				<div class="col-lg-4 col-md-4 col-sm-4">
					<div class="col-lg-10 col-md-9 col-sm-9">
						<input type="text" autocomplete="off" class="text-search-box" placeholder="Search" ng-model="searchKeyword">
						<i class="fa fa-search common-search-text-icon padding-top8" aria-hidden="true"></i>
					</div>
					<div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
				<div class="padding-top4">
					 <a href="" class="btn btn-primary btn-save-box-shadow" title="Save" data-toggle="modal" ng-click="save()"
										ng-if="saveBtnFlag"> <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
						<a href="" class="btn btn-primary btn-save-box-shadow" title="Update" data-toggle="modal" ng-click="update()"
										ng-if="updateBtnFlag"> <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
				</div>
			</div>
				</div>
			</div>
		</fieldset>
		<div class="row margin-top8 padding-left-right-set4 height-table-with-scroll">
			<div class="col-lg-12 col-md-12 col-sm-12">
				<table class="table table-bordered first-checkBox-padding">
					<!-- mainServiceTable -->
					<thead class="mainServiceTableCommon">
						<tr>
							<th class="width8">GL Code</th>
							<th class="width15">GL Description</th>
							<th class="width6">Status(n)</th>
							<th class="width5">Action taken</th>
						</tr>
					</thead>
					<tbody>
						<tr ng-repeat="info in commonList|filter:searchKeyword">
							<td>{{info.generalLedgerCode}}</td>
							<td>{{info.generalLedgerName}}</td>
							<td>
								<label class="switch">
									<input type="checkbox" ng-model="info.status" ng-true-value="'A'" ng-false-value="'I'"
														ng-change="updateStatus(info.generalLedgerId,info.status)">
									<div class="slider round"></div>
								</label>
							</td>
							<td class="padding-edit-button-table text-center">
							
								<a><i class="fa fa-pencil" aria-hidden="true" ng-click="showUpdateBtn(info.generalLedgerId)"></i></a>
							
							</td>
						</tr>
					</tbody>
				</table>
				<div class="row margin-bottom45 sss">
									<ul ng-if="pager.pages.length" class="pagination table-list"
										style="font-size: 14px;">
										<li ng-class="{disabled:pager.currentPage === 1}"><a
											ng-click="setPage(1,'true')">First</a></li>
										<li ng-class="{disabled:pager.currentPage === 1}"><a
											ng-click="setPage(pager.currentPage - 1,'true')">Previous</a></li>
										<li ng-repeat="page in pager.pages"
											ng-class="{active:pager.currentPage === page}"><a
											ng-click="setPage(page,'true')">{{page}}</a></li>
										<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
											<a ng-click="setPage(pager.currentPage + 1,'true')">Next</a>
										</li>
										<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
											<a ng-click="setPage(pager.totalPages,'true')">Last</a>
										</li>
									</ul>
								</div>
			</div>
		</div>
	</div>
</div>
<modal visible="showModal"></modal>

<script src="resources/assets/js/common/page-height.js"></script>

<script>

$(document).ready(function() {
	 
	 $(".selectedPageName").text("GL Code");
	$(".sidebar-nav li").each(function() {
		$(this).find("a").parents("li").removeClass("active");
	});
	$('a[href$="GLcode"]').parents("li").addClass("active");
});



</script>
