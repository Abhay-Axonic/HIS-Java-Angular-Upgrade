
<div class="second-level-tab-display-div">
	<div class="row margin-top10">
		<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 float_right">
			<input  class="text-search-box"
				ng-model="searchGroupDetailsFilter" placeholder="Search" title="Search"
				style="margin-top: 0px"> <i
				class="fa fa-search common-search-text-icon" aria-hidden="true"></i>
		</div>
	</div>	
<div class="row padding-left-right-set4 margin-top10">
					<div class="col-md-12 fix-height-scroll450">
					
					
						<table class="table">
							<tr class="table-th-bg">
								<th class="width4">
									Date
									<div class="float_right">
										<div><i class="fa fa-caret-up" aria-hidden="true"></i></div>
										<div class="margin-top-8"><i class="fa fa-caret-down" aria-hidden="true"></i></div>
									</div>
								</th>
								<th class="width10">
									Service
									<div class="float_right">
										<div><i class="fa fa-caret-up" aria-hidden="true"></i></div>
										<div class="margin-top-8"><i class="fa fa-caret-down" aria-hidden="true"></i></div>
									</div>
								</th>
								<th class="width10">
									Sub Department
									<div class="float_right">
										<div><i class="fa fa-caret-up" aria-hidden="true"></i></div>
										<div class="margin-top-8"><i class="fa fa-caret-down" aria-hidden="true"></i></div>
									</div>
								</th>
								<th class="width8">
									Status
									<div class="float_right">
										<div><i class="fa fa-caret-up" aria-hidden="true"></i></div>
										<div class="margin-top-8"><i class="fa fa-caret-down" aria-hidden="true"></i></div>
									</div>
								</th>
								<th class="width4">
									Cancel Service
									<div class="float_right">
										<div><i class="fa fa-caret-up" aria-hidden="true"></i></div>
										<div class="margin-top-8"><i class="fa fa-caret-down" aria-hidden="true"></i></div>
									</div>
								</th>
							</tr>
							<tr ng-repeat="info in pendingServicesList | filter:searchGroupDetailsFilter">
								<td><div>{{info.orderDateString}}</div></td>
								<td><div>{{info.serviceStandardName}}</div></td>
								<td><div>{{info.subSpecialityName}}</div></td>
								<td><div>Pending</div></td>
								<td>
									<span class="hide-show-reason-for-cancel-service margin-top8">
										<select ng-model="cancelReasonId" class="width65">
										<option value="">Select Reason</option>
											<option ng-repeat="res in reasonList" ng-if="res.reasonTypeId == 8" value="{{res.reasonMasterId}}">{{res.reasonDesc}}</option>
										</select>
									</span>
									<span class="pull-right vertical-middle padding-top4">
										<a href="" class="cursor-pointer"><i class="fa fa-times" title="Cancel Service" ng-click="cancelPendingService(cancelReasonId,info)"></i></a></span>
								</td>
							</tr>
							
							
						</table>
					</div>
				</div>	
		</div>
