<div id="page-content-wrapper" class="">
	<div class="container-fluid his-style">
		<div class="row">
			<div class="col-lg-2 col-md-2 col-sm-3 padding-left-right-set4 padding-top10">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11">
						<div class="">
							<select class="text-input floating-label dirty">
								<option value=""></option>
								<option value="-">-</option>
							</select> <label for="code">Company<span class="star">*</span></label>
						</div>
					</div>
				</div>
			</div>
			<div class="col-lg-3 col-md-3 col-sm-3 margin-left5 padding-left-right-set4">
				<label>Document</label><input type="file" file-model="" fileinput="file" class="ng-isolate-scope" validfile>
				<p ng-show="fileError" style="color:red;">{{fileError}}</p>
			</div>
			<div class="col-lg-1 col-md-1 col-sm-2 margin-top5">
	     		<button class="btn btn-primary btn-save-box-shadow text-width-auto padding-left-right-10">Upload</button>
	     	</div>
		</div>
		<div class="row padding-top10">
			<div class="col-md-6 col-sm-7 padding-left-right-set4"></div>
			<div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
		        <a href="" class="btn btn-primary btn-save-box-shadow ng-scope" title="Save" data-toggle="modal">
		        <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
		      </div>
		</div>
		<div class="row padding-left-right-set4 table-container padding-top8">
			<div class="table-container">
				<div class="table-container-header">
					<table
						class="table table-striped table-hover table-condensed table-bordered">
						<thead>
							<tr>
								<th class="width4">Membership Id</th>
								<th class="width10">Employee Name</th>
							</tr>
						</thead>
					</table>
				</div>
				<div class="table-container-body fix-height-scroll300" style="overflow: overlay;"> <!-- fix-height-scroll230, background: #fff; -->
					<table
						class="table table-striped table-hover table-condensed table-bordered">
						<tbody>
							<tr>
								<td class="width4"></td>
								<td class="width10"></td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	
	</div>
</div>
