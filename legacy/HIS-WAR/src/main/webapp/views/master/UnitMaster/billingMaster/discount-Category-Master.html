<!-- Page Content -->
		<div id="page-content-wrapper">
			<div class="container-fluid his-style">
							<div class="row margin-top10">
							<form name="discountForm" novalidate >
									<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
											<div class="row input-container">
												<div class="col-lg-2 col-sm-2 col-md-2 polymer-icon ">
													<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
												</div>
												<div class="col-lg-10 col-sm-10 col-md-10 ">
													<div class="form-group"   show-errors>
														<input type="text" autocomplete="off" name="code" id="" class="text-input floating-label" ng-model="discountType.code" required="required"> 
														<label for="" class="LISDynamicLabel">Code<span class="star">*</span></label>
														<p class="help-block" ng-if="discountForm.code.$error.required">Code is required</p>
													</div>
												</div>
											</div>
										</div>
										
										
										
										<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
											<div class="row input-container">
												<div class="col-lg-2 col-sm-2 col-md-2 polymer-icon ">
													<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
												</div>
												<div class="col-lg-10 col-sm-10 col-md-10 ">
													<div class="form-group"   show-errors>
														<input type="text" autocomplete="off" name="type" id="" class="text-input floating-label" ng-model="discountType.type" required="required"> 
														<label for="" class="LISDynamicLabel"> Description<span class="star">*</span></label>
														<p class="help-block" ng-if="discountForm.type.$error.required">Code is required</p>
													</div>
												</div>
											</div>
										</div>
										</form>
									</div>
				<div class="row padding-top8">
				<div class="col-md-6 col-sm-7 padding-left-right-set4">
				<div class="row">
					<div class="col-lg-3 col-md-6 col-sm-6" style="padding-left: 0px;">
						<div class="search">
						<label class="show-entries">Show 
						<select name="DataTables_Table_0_length" aria-controls="DataTables_Table_0"
							ng-init="noOfRecordsPerPage='10'" ng-model="noOfRecordsPerPage"
							ng-change="setNoOfRecords();" class="search-popUp-ddl">
								<option value="10">10</option>
								<option value="25">25</option>
								<option value="50">50</option>
								<option value="100">100</option>
						</select> entries
						</label>
					</div>
					</div>
				</div>
			</div>
					<div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
						<div class=" ">
							<a href="" class="btn btn-primary btn-save-box-shadow" title="Save" data-toggle="modal"  ng-click="save()" ng-if="saveBtnFlag">
							<i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
							
							<a href="" class="btn btn-primary btn-save-box-shadow" title="Update" data-toggle="modal"  ng-click="update()" ng-if="updateBtnFlag">
							<i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
						</div>
					</div>
					<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set0 float_right">
						<input type="text" autocomplete="off" class="text-search-box dirty" placeholder="Search" ng-model="search" style="margin-top: 0px" >
						<i class="fa fa-search common-search-text-icon" aria-hidden="true"></i>
					</div>
				</div>					
	<div class="row padding-left-right-set4 table-container padding-top8">
			<div class="table-container">
				<div class="table-container-header">
					<table class="table table-striped table-hover table-condensed table-bordered">
						<thead>
							<tr>
								<th class="width3">
									Code
								</th>
								<th class="width3">
									Description
								</th>
								<th class="width1 text-center">
									Status(n)
								</th>
								<th class="width1 text-center">
									Action taken
								</th>
							</tr>
						</thead>
					</table>
				</div>
				<div class="table-container-body fix-height-scroll400" style="overflow: overlay;"> <!-- fix-height-scroll230, background: #fff; -->
					<table
						class="table table-striped table-hover table-condensed table-bordered">
						<tbody>
							<tr ng-repeat="info in discountList | filter : search">
								<td class="width3">{{info.code}}</td>
								<td class="width3">{{info.type}}</td>
								<td class="width1 vertical-middle text-center">
											<label class="switch"> 
												<input type="checkbox" ng-model="info.isActive"  ng-true-value="true"  ng-false-value="false"  ng-change="updateStatus(info.discountTypeId,info.isActive)">
												<div class="slider round"></div>
											</label>
										</td>
								<td class="width1 text-center" title="edit">
								<i class="fa fa-pencil" style="color: #3131d2;" aria-hidden="true " ng-click="showUpdateBtn(info.discountTypeId)" title="Edit"></i>
								
							</td>
							</tr>
						</tbody>
					</table>
					<div class="row margin-bottom45 sss">
					<ul ng-if="pager.pages.length" class="pagination table-list"
						style="font-size: 14px;">
						<li ng-class="{disabled:pager.currentPage === 1}"><a
							ng-click="setPage(1,'true')">First</a></li>
						<li ng-class="{disabled:pager.currentPage === 1}"><a
							ng-click="setPage(pager.currentPage - 1,'true')">Previous</a></li>
						<li ng-repeat="page in pager.pages"
							ng-class="{active:pager.currentPage === page}"><a
							ng-click="setPage(page,'true')">{{page}}</a></li>
						<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
							<a ng-click="setPage(pager.currentPage + 1,'true')">Next</a>
						</li>
						<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
							<a ng-click="setPage(pager.totalPages,'true')">Last</a>
						</li>
					</ul>
				</div>
				</div>
			</div>
		</div> 			
			</div>
		</div>
			<modal visible="showModal"></modal> 
	<script>
	$(document).ready(function() {
	
	var documentHeight= $(window).height();
    var sideBarHeight = documentHeight - 55;
 	$("#page-content-wrapper").css("height", sideBarHeight + "px" );
	});
	
	$(".selectedPageName").text("Discount Category Master");
	$(".sidebar-nav li").each(function() {
		$(this).find("a").parents("li").removeClass("active");
	});
	$('a[href$="discountCategoryMaster"]').parents("li").addClass("active");
 	</script>
