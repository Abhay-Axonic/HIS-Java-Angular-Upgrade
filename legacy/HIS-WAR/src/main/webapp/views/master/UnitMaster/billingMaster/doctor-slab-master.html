<!-- Page Content -->
<div id="page-content-wrapper" class="">
	<div class="container-fluid his-style">
		<fieldset>
			<!-- <legend class="heading-div">Batch/MRP/Expiry Date Change</legend> -->
			<div class="row margin-top10">
				<div
					class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-2 polymer-icon">
							<i class="fa fa-dot-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-10">
							<div class="">
								<select class="text-input floating-label" name="doctorId" ng-model="doctorId"  required>
									<option value="">Select Doctor</option>
									<option ng-repeat="info in doctorsList" value="{{info.doctorId}}" ng-value="{{info.doctorId}}">{{info.doctorName}}</option>
								</select> <label for="code" class="long-text-overflow">Doctor</label>
							</div>
						</div>
					</div>
				</div>
				
				<div
					class="col-lg-1 col-md-1 col-sm-1 padding-left-right-set4 text-width-auto float_right margin-top8">
					
				</div>
				
			</div>
			<div class="row margin-top10" ng-repeat="slabList in doctorSlabList">
							<div class="col-lg-2 col-md-2 col-sm-3 padding-left-right-set4" ng-if="slabList.status=='A'">
								<div class="row input-container test-master-sample">
										<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon ">
										<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
									</div>
									<div class="col-lg-11 col-sm-11 col-md-11 ">
										<div class="">
											<input type="text" autocomplete="off"  name="description" allow-decimal-numbers ng-decimal="200" id="" ng-model="slabList.slabFrom" class="text-input floating-label"   ng-disabled = "true"> 
											<label for="description" class="">Slab From</label>
										</div>
									</div>
								</div>
							</div>
							<div class="col-lg-2 col-md-2 col-sm-3 padding-left-right-set4" ng-if="slabList.status=='A'">
								<div class="row input-container test-master-sample">
										<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon ">
										<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
									</div>
									<div class="col-lg-11 col-sm-11 col-md-11 ">
										<div class="">
											<input type="text" autocomplete="off"  name="description" id="" allow-decimal-numbers ng-decimal="200" ng-model="slabList.slabTo"  class="text-input floating-label"> 
											<label for="description" class="">Slab To</label>
										</div>
									</div>
								</div>
							</div>
							<div class="col-lg-2 col-md-2 col-sm-3 padding-left-right-set4" ng-if="slabList.status=='A'">
								<div class="row input-container test-master-sample">
										<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon ">
										<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
									</div>
									<div class="col-lg-11 col-sm-11 col-md-11 ">
										<div class="">
											<input type="text" autocomplete="off"  name="description" id="" allow-decimal-numbers ng-decimal="200" ng-model="slabList.percentage" class="text-input floating-label" ng-init="initClockPicker()" ng-change="toChecklimit(slabList.percentage,$index);"> 
											<label for="description" class="">Percentage %</label>
										</div>
									</div>
								</div>
							</div>
							<div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 width3" ng-if="slabList.status=='A'">
									<input style="width:100%;" type="button" name="" value="+" ng-click="addSlab($index+1)"  class="btn btn-info">&nbsp;
							</div>
							<div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 width3" ng-if="slabList.status=='A'">
								<input style="width:100%;" type="button" name="" id="" value="-"  ng-click="removeSlab($index+1)"  class="btn btn-info">&nbsp;&nbsp;
							</div>
						</div>
		</fieldset>
		<div class="row padding-top10">
				<div class="col-md-6 col-sm-7 padding-left-right-set4">
					<div class="row">
						<div class="col-lg-3 col-md-6 col-sm-6" style="padding-left: 0px;">
								<div class="search">
								<label class="show-entries">Show 
								<select name="DataTables_Table_0_length" aria-controls="DataTables_Table_0"
									ng-init="noOfRecordsPerPage='10'" ng-model="noOfRecordsPerPage"
									ng-change="setNoOfRecords();" class="search-popUp-ddl" convert-to-number>
										<option value="10">10</option>
										<option value="25">25</option>
										<option value="50">50</option>
										<option value="100">100</option>
								</select> entries
								</label>
							</div>
						</div>
					</div>
				</div>
				 <div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
			        <a href="" ng-click="saveDoctorSlab()"> <input type="button" value="Save"
							class="btn btn-primary btn-save-box-shadow">
						</a>
			      </div>
			      <div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set0 float_right">
			        <input type="text" autocomplete="off" class="text-search-box ng-pristine ng-untouched ng-valid ng-empty search-popUp-ddl" placeholder="Search" style="margin-top:0px" ng-model="searchKeyword">
			        <i class="fa fa-search common-search-text-icon" aria-hidden="true"></i>
			      </div>
			</div>
			
			<div class="row padding-top10 padding-left-right-set4">
			<div id="fixed-thead-tfoot-scroll" class="fixed-thead-tfoot-scroll fix-height-scroll380">
			  <table id="main-table" class="main-table width100">
			    <thead class="mainServiceTableCommon">
						<tr>
							<th class="width1">Doctor</th>
							<th class="width1 text-center">Slab Info</th>
							<th class="width1 text-center">Status(n)</th>
							<th class="width1 text-center">Action taken</th>
						</tr>
					</thead>
			    <tbody>
						<tr ng-repeat="info in doctorSlabMasterList|filter:searchKeyword">
							<td class="text-center">{{info.doctorName}}</td>
							<td class="text-center"><i class="fa fa-info-circle" aria-hidden="true" title="Information" ng-click="viewInfo(info,1);"></i></td>
							<td class="text-center"><label class="switch"> 
								<input type="checkbox" ng-model="info.status"  ng-true-value="'A'"  ng-false-value="'I'"  ng-change="updateStatus(info.doctorId,info.status)">
								<div class="slider round"></div>
								</label></td>
							<td class="text-center"><a  ng-click="viewInfo(info,0);" class="cursor-pointer" ng-class="{disabled: info.status=='I'}" ><i class="fa fa-pencil"></i></a></td>
						</tr>
 				</tbody>
			    
			  </table>
			</div>
		</div>
		<div class="row margin-top4 padding-left-right-set4">
			<div class="col-lg-12 col-md-12 col-sm-12">
				
					<div class="row margin-bottom45 sss">
					<ul ng-if="pager.pages.length" class="pagination table-list"
						style="font-size: 14px;">
						<li ng-class="{disabled:pager.currentPage === 1}"><a
							ng-click="setPage(1,'true')">First</a></li>
						<li ng-class="{disabled:pager.currentPage === 1}"><a
							ng-click="setPage(pager.currentPage - 1,'true')">Previous</a></li>
						<li ng-repeat="page in pager.pages"
							ng-class="{active:pager.currentPage === page}"><a
							ng-click="setPage(page,'true')">{{page}}</a></li>
						<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
							<a ng-click="setPage(pager.currentPage + 1,'true')">Next</a>
						</li>
						<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
							<a ng-click="setPage(pager.totalPages,'true')">Last</a>
						</li>
					</ul>
				</div>
			</div>
		</div>
	</div>
</div>

<!-- doctorSlabDetailsList START -->
<div id="doctorSlabInfo" class="modal fade ng-scope in common-medium-popup" data-backdrop="static" role="dialog">
	<div class="modal-dialog">
	<form name="uploadForm" novalidate>
		<div class="modal-content">
			<div class="modal-header padding-zero">
				<div class="modal-title patient-details-row">
					Slab Information
					<button type="button" class="close" data-dismiss="modal">&times;</button>
				</div>
			</div>
			
			<div class="modal-body">
				<div class="row">
					<div class="row margin-top10 common-sub-table padding-left-right-set4">
					<table class="table table-striped table-bordered">
						<thead>
								<tr>
									
									<th class="test-name-width">Slab From</th>
									<th class="test-name-width">Slab To</th>
									<th class="test-name-width">Percentage %</th>
								</tr>
							</thead>
							<tbody>
								<tr ng-repeat = "info in doctorSlabDetailsList">
									<td>{{info.slabFrom}}</td>
									<td>{{info.slabTo}}</td>
									<td>{{info.percentage}} %</td>
								</tr>
							</tbody>
					</table>
					<table class="table table-bordered">
						 <tr ng-if="doctorSlabDetailsList.length==0">
							<td><p style="text-align: center;margin-top: 0px !important;margin-bottom: 1px !important;">No Records Found</p></td>
						</tr>
					</table>
				</div>
				</div>
			</div>
			
			<div class="modal-footer" style="border: none;">
				<div class="row">
					<div class="col-lg-1 col-md-2 col-sm-2  padding-left-right-set4 text-width-auto float-right">
						<button class="btn btn-primary btn-save-box-shadow  width100" title="Ok" data-dismiss="modal">
						<i class="fa fa-check" aria-hidden="true"></i> </button>
					</div>
				</div>
			</div>
		</div>
		</form>
		
	</div>
</div>
<!-- doctorSlabDetailsList END -->
<script type="text/javascript">
$(document).ready(function() {
$(".selectedPageName").text("Doctor Slab Master");
$(".sidebar-nav li").each(function() {
	$(this).find("a").parents("li").removeClass("active");
});
$('a[href$="doctorSlabMaster"]').parents("li").addClass("active");
});
</script>
