<div id="page-content-wrapper">
	<div class="container-fluid his-style">
		<div class="row padding-top8">
			<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top4">
		 		<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11">
					    <div class="form-group" >
							<select class="text-input floating-label" name="trustId"   ng-model="trustlistObj.trustId"  convert-to-number  required>
								<option ng-repeat="info in trustList" value="{{info.trustId}}">{{info.trustName}}</option>
							</select><label for="code">Trust Name</label>
						</div>
					</div>
				</div>
			</div>
			<div class="col-lg-2 col-md-2 col-sm-3 padding-left-right-set4 padding-top2">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-calendar" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11">
						<div class="">
							<input type="text" autocomplete="off" readonly class="text-input floating-label dirty"
							 name="" id="" uib-datepicker-popup="dd/MM/yyyy" ui-mask="99/99/9999"
							placeholder="DD/MM/YYYY" ng-model="trustObj.fromDate"
							model-view-value="true" is-open="datepicker1.opened"
							datepicker-options="dateOptions" 
							show-button-bar="false"	ng-click="openDatePicker1()" required>
								<label for="description" class="">Date (From)</label>
							</div>
					</div>
				</div>
			</div>
			<div class="col-lg-2 col-md-2 col-sm-3 padding-left-right-set4 padding-top2">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-calendar" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11">
						<div class="">
							<input type="text" autocomplete="off" readonly class="text-input floating-label dirty"
							 name="" id="" uib-datepicker-popup="dd/MM/yyyy" ui-mask="99/99/9999"
							placeholder="DD/MM/YYYY" ng-model="trustObj.toDate"
							model-view-value="true" is-open="datepicker2.opened"
							datepicker-options="dateOptions" 
							show-button-bar="false"	ng-click="openDatePicker2()" required>
								<label for="description" class="">Date-Till</label>
							</div>
					</div>
				</div>
			</div>
			<div class="col-lg-1 col-md-2 col-sm-2 padding-left-right-set4 margin-top0 text-width-auto padding-top2">
				<div class="">
					<a href="" class="btn btn-primary btn-save-box-shadow width-100" id="searchBtn" ng-click="collectionList(trustObj.toDate,trustObj.fromDate,trustlistObj.trustId)">
						<i class="fa fa-search" aria-hidden="true"></i>
					</a>
				</div>
			</div>
		</div>
		
		
		<div class="row padding-left-right-set4 table-container padding-top5">
			<div class="table-container">
				<div class="table-container-header">
					<table class="table table-striped table-hover table-condensed table-bordered">
						<thead>
							<tr>
							    <th class="width5" scope="col" rowspan="2">Inflow No.</th>
						         <th class="width5" scope="col" rowspan="2">Organization Name</th>
						         <th class="width15" scope="col" colspan="3" style="text-align: center;">Credit</th>
						         <th class="width15" scope="col" colspan="3" style="text-align: center;">Debit</th>
						      </tr>
							<tr>
								<th>Date</th>
								<th>Mode of Payment</th>
								<th>Amount</th>
								<th>Patient Details</th>
								<th>Bill No.</th>
								<th>Amount Utilized</th>
							</tr>
						</thead>
					</table>
				</div>
				<div class="table-container-body fix-height-scroll380" style="overflow: overlay;"> <!-- fix-height-scroll230, background: #fff; -->
					<table
						class="table table-striped table-hover table-condensed table-bordered">
						<tbody>
							<tr ng-repeat="info in CollectList|orderBy:column:reverse|filter:searchKeyword">
						        <td>{{info.fundInFlowDetailsId}}</td>
						        <td>{{info.trustName}}</td>
						        <td>{{info.creditDate | date : "dd/MM/y"}}</td>
						        <td ng-if="info.paymentModeId==1">Cash</td>
						        <td ng-if="info.paymentModeId==2">Cheque</td>
								<td ng-if="info.paymentModeId==3">Card</td>
								<td ng-if="info.paymentModeId==8">E-transfer</td>
						        <td>{{info.amount}}</td>
						        <td>--</td>
						        <td>--</td>
						        <td>--</td>
                                 </tr>
                                 
						</tbody>
					</table>
				</div>
				<div class="table-container-footer">
					<table
						class="table table-striped table-hover table-condensed table-bordered">
						<tfoot>
							<tr>
						        <td class="border-right-none"></td>
						        <td class="border-right-none"></td>
						        <td class="text-right">Total</td>
						        <td><input type="text" autocomplete="off" ng-model="totalAmount" class="w-100 dirty"  disabled="disabled"></td>
						      	<td class="border-right-none"></td>
						      	<td class="text-right">Total</td>
						      	<td><input type="text" autocomplete="off" class="w-100 dirty" disabled="disabled"></td>
						      </tr>
						      <tr>
						        <td class="border-right-none border-top"></td>
						        <td class="border-right-none border-top"></td>
						        <td class="border-right-none border-top"></td>
						        <td class="border-right-none border-top"></td>
						      	<td class="border-right-none border-top"></td>
						      	<td class="border-top text-right">Total Balance Fund</td>
						      	<td class="border-top"><input type="text" autocomplete="off" class="w-100 dirty" disabled="disabled"></td>
						      </tr>
						</tfoot>
					</table>
				</div>
			</div>
		</div>
		
	</div>
</div>

<script src="resources/assets/js/common/page-height.js"></script>
<script type="text/javascript">
$(document).ready(function() {  
	// $(".patienttSearchResult").hide();
	//$(".icon-span").hide();
	 $(".selectedPageName").text("Fund Status Dashboard");
	$(".sidebar-nav li").each(function() {
		$(this).find("a").parents("li").removeClass("active");
	});
	$('a[href$="fundStatusDashboard"]').parents("li").addClass("active");
});
</script>
