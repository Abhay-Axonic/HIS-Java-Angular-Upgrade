<!-- **************** Get service modal EHC pakcage start ****************  -->
<div class="row">
	<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
		<div class="row input-container">
			<div class="col-lg-1 col-sm-1 col-md-2 polymer-icon">
				<i class="fa fa-dot-circle-o" aria-hidden="true"></i>
			</div>
			<div class="col-lg-11 col-sm-11 col-md-10">
				<div class="">
					<select class="text-input floating-label  " ng-model="searchServObj.groupId" ng-change="getSubSpecialityBySpecialityId(searchServObj.groupId)" >
						<option value="">-</option>
						<option ng-repeat="spec in specialityList" ng-value="spec.specialityId" value="{{spec.specialityId}}" >{{spec.specialityName}}</option>
					</select> <label for="code">Group<span class="star">*</span></label>
				</div>
			</div>
		</div>
	</div>
	<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
		<div class="row input-container">
			<div class="col-lg-1 col-sm-1 col-md-2 polymer-icon">
				<i class="fa fa-dot-circle-o" aria-hidden="true"></i>
			</div>
			<div class="col-lg-11 col-sm-11 col-md-10">
				<div class="">
					<select class="text-input floating-label " ng-model="searchServObj.subGroupId">
						<option value="">-</option>
						<option  ng-repeat="subspec in subSpecialityList" ng-value="subspec.subSpecialityMasterId" value="{{subspec.subSpecialityMasterId}}">{{subspec.subSpecialityMasterName}}</option>
					</select> <label for="code">Sub Group<span class="star">*</span></label>
				</div>
			</div>
		</div>
	</div>
	<div class="col-lg-2 col-md-2 col-sm-3 padding-left-right-set4 padding-top10">
		<div class="row input-container">
			<div class="col-lg-1 col-sm-1 col-md-2 polymer-icon">
				<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
			</div>
			<div class="col-lg-11 col-sm-11 col-md-10">
				<div class="">
					<input type="text" autocomplete="off" ng-model="searchServObj.serviceCode" press-enter="searchServices(searchServObj)" name="code" id="" class="text-input floating-label" > 
					<label for="code">Service Code </label>
				</div>
			</div>
		</div>
	</div>
	<div class="col-lg-2 col-md-2 col-sm-3 padding-left-right-set4 padding-top10">
		<div class="row input-container">
			<div class="col-lg-1 col-sm-1 col-md-2 polymer-icon">
				<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
			</div>
			<div class="col-lg-11 col-sm-11 col-md-10">
				<div class="">
					<input type="text" autocomplete="off" ng-model="searchServObj.serviceDescription" press-enter="searchServices(searchServObj)" name="code" id="" class="text-input floating-label" > 
					<label for="code">Service Description</label>
				</div>
			</div>
		</div>
	</div>
	<div
		class="col-lg-1 col-md-1 col-sm-1 text-width-auto padding-left-right-10 padding-top10">
		<div class="common-save-button" style="padding-top: 0px;">
			<a class="btn btn-primary btn-save-box-shadow"style="width: auto;" ng-click="searchServices(searchServObj)">
				<i class="fa fa-search" aria-hidden="true"></i>
			</a>
		</div>
	</div>
</div>
<div class="row padding-top10 padding-left-right-set4">
	<div id="fixed-thead-tfoot-scroll" class="fixed-thead-tfoot-scroll fix-height-scroll380">
	  <table id="main-table" class="main-table width100">
	    <thead>
	      <tr>
			<th class="width1 text-center media-middle ">
			<input
				type="checkbox" ng-model="$parent.selectAllSev"
				ng-click="selectAllServices(selectAllSev)"
				class="ng-pristine ng-untouched ng-valid ng-empty"></th>
			<th class="width10">Group
			</th>
			<th class="width10">Sub Group
			</th>
			<th class="width10">Service Code
			</th>
			<th class="width10">Service Description
			</th>
		</tr>
	    </thead>
	    <tbody>
	      <!-- ngRepeat: datum in vm.model.storeDataList | filter:search -->
			<tr ng-repeat="serv in searchServiceList" ng-if="serv.isDoctorReferralRequired == 'Y'">
			<td class="text-center"><input	type="checkbox" ng-model="serv.isSelected" class="ng-pristine ng-untouched ng-valid ng-empty"></td>
			<td>{{serv.groupDesc}}</td>
			<td>{{serv.subGroup}}</td>
			<td>{{serv.serviceCode}}</td>
			<td>{{serv.serviceDescription}}</td>
			</tr>
	    </tbody>
	  </table>
	</div>
</div>

<!-- **************** Get service modal EHC pakcage end ****************  -->
