<div id="page-content-wrapper">
	<div class="container-fluid his-style">
		
				<div class="row padding-left-right-set4">
					<div class="second-level-tab-display-div" style="">
						<fieldset class="normalRegistration sub-fieldset ng-scope">
							<!-- <legend
								class="main-heading-div commonPatientSearch cursor-pointer">Group</legend> -->
						</fieldset>
						<div class="row padding-top5">
							<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4">
								<div class="row input-container">
									<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
										<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
									</div>
									<div class="col-lg-11 col-sm-11 col-md-11">
										<div class="">
											<!-- <select class="text-input floating-label">
												<option></option>
												<option>-</option>
											</select> --> 
											<select ng-model="assetCategoryId" class="text-input floating-label"
									ng-change="getProductCatByAssestCat(assetCategoryId)">
									<option>Select Asset Category</option>
									<option ng-repeat="info in assetCategoryList" value="{{info.id}}">{{info.category}}</option>
									</select>
											<label for="code">Asset Category</label>
										</div>
									</div>
								</div>
							</div>
							<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4">
								<div class="row input-container">
									<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
										<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
									</div>
									<div class="col-lg-11 col-sm-11 col-md-11">
										<div class="">
											<!-- <select class="text-input floating-label">
												<option></option>
												<option>-</option>
											</select> --> 
											<select ng-model="productCategoryId" class="text-input floating-label">
									<option>Select Asset Category</option>
									<option ng-repeat="info in productCategoryList" value="{{info.id}}">{{info.category}}</option>
									</select>
											<label for="code">Product Category</label>
										</div>
									</div>
								</div>
							</div>
							<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4">
								<div class="row input-container">
									<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
										<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
									</div>
									<div class="col-lg-11 col-sm-11 col-md-11">
										<div class="">
											<select ng-model="paymentEntitlementId" class="text-input floating-label">
									<option>Select Paymententitlement</option>
									<option  value="3">Corporate</option>
									<option  value="2">Insurance</option>
									<option  value="1">Self</option>
									</select>
											<label for="code">Payment Entitlement</label>
										</div>
									</div>
								</div>
							</div>
							<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4">
								<div class="row input-container">
									<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
										<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
									</div>
									<div class="col-lg-11 col-sm-11 col-md-11">
										<div class="">
											<!-- <select class="text-input floating-label">
												<option></option>
												<option>-</option>
											</select>  -->
											<select class="text-input floating-label" ng-model="markupStatus">
										<!-- <option >Select status</option> -->
										<option value="0">MarkDown</option> 
										 <option value="1">MarkUp</option>
										</select>
											<label for="code">Mark</label>
										</div>
									</div>
								</div>
							</div>
							
							<div class="col-lg-2 col-md-2 col-sm-2 text-width-auto text-center margin-top-5 padding-left-right-set4">
								<div class="">
									<input type="button" value="Add" class="btn btn-primary btn-save-box-shadow text-width-auto" ng-click="addProductCategory()">
								</div>
							</div>
					<div
						class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto margin-top-5">
						<div class=" ">
							<a href="" class="btn btn-primary btn-save-box-shadow"
								title="Save" data-toggle="modal"
								data-target="#confirmSavePatientTypeDetails"><i
								class="fa fa-floppy-o" style="font-size: 21px"
								aria-hidden="true"></i></a>
						</div>
					</div>
				</div>
						<div
							class="row padding-left-right-set4 table-container padding-top5">
							<div class="table-container">
								<div class="table-container-header">
									<table
										class="table table-striped table-hover table-condensed table-bordered">
										<thead>
											
											<tr>
												<th class="width10">Asset Category</th>
												<th class="width10">Product Category</th>
												<th class="width10">Payment Entitlement</th>
												<th class="width10">MarkUp/MarkDown</th>
												<th class="width5">%</th>
												<th class="width5">Status(n)</th>
												<th class="width5">Action taken</th>
											</tr>
										</thead>
									</table>
								</div>
								<div class="table-container-body fix-height-scroll420"
									style="overflow: overlay;">
									<!-- fix-height-scroll230, background: #fff; -->
									<table
										class="table table-striped table-hover table-condensed table-bordered">
										<tbody>
											
											<tr ng-repeat="info in groupDetailList">
												<td class="width10">{{info.assetCategoryName}}</td>
												<td class="width10">{{info.productCategoryName}}</td>
												<td class="width10"><div ng-if="info.paymentEntitlementId == '1'">Self</div>
												<div ng-if="info.paymentEntitlementId == '2'">Insurance</div>
												<div ng-if="info.paymentEntitlementId == '3'">Corporate</div></td>
												<td class="width10"><div ng-if="info.markUpDown == '1'">MarkUp</div>
												<div ng-if="info.markUpDown == '0'">MarkDown</div>
												</td>
												<td class="width5"><input type="text" autocomplete="off" class="w-100" ng-disabled = "info.id != '' && info.id != null && info.id != undefined " ng-model="info.markUpDownPer"></td>
												<td class="width5">
												<label class="switch"> 
													 <input type="checkbox" ng-model="info.status"  ng-true-value="'A'"  ng-false-value="'I'" ng-change="updateStatus(info.id,info.status)">
													<div class="slider round"> </div>
												</label>
											</td>
												<td class="width5">
													<a><i class="fa fa-times"  ng-if="info.id == null || info.id == ''"  ng-click="removeAddedGroup(groupDetailList,$index)"></i></a>
													 <a class="cursor-pointer" title="Edit"  ng-if="info.id > 0" data-target="#12hrModal" data-toggle="modal" ng-class="{disabled: info.status=='I'}" ng-click="getDetails(info,$index)"><i class="fa fa-pencil"></i></a>
												</td>
											</tr>
										
										</tbody>
									</table>
								</div>
							</div>
						</div>
					</div>
				</div>
	</div>
</div>

<!-- CONFIRM POPUP FOR SAVE START-->
<div id="confirmSavePatientTypeDetails" class="modal fade ng-scope in" role="dialog">
	<div class="modal-dialog" style="width: 29% !important;"> <!-- width: 25% !important;margin: 200px 0 0 510px !important; -->
		<div class="modal-content">
			<div class="modal-header" style="padding:0px;">
				<div class="modal-title patient-details-row" style="margin-top: 7px;">
					Confirm
					<button type="button" class="close" data-dismiss="modal" ng-click="cancel();">&times;</button>
				</div>
			</div>
			<div class="modal-body">
				<div class="margin-left10"><span>Are you sure you want to Save?</span></div>
			</div>
			<div class="modal-footer" style="border:none;">
				<button type="button" data-dismiss="modal" class="btn btn-primary" id="okBtn" ng-click="savePharmacyTariff();">Ok</button>
				<button type="button" data-dismiss="modal" class="btn btn-primary" id="cancelBtn">Cancel</button>
			</div>
		</div>
	</div>
</div>
<!-- CONFIRM POPUP FOR SAVE END -->

		<div class="modal-content">
			<div class="modal-header padding-zero" style="padding:0px;">
				<div class="modal-title patient-details-row">
					Details
					<button type="button" class="close" data-dismiss="modal">&times;</button>
				</div>
			</div>
			<div class="modal-body">
				<div class="row margin-bottom10 padding-top10">
				<div class="col-lg-6 col-md-6 col-sm-6 padding-left-right-set4">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11">
						<div class="">
							<select class="text-input floating-label" convert-to-number ng-model="markupStatusPopup">
										<option >Select status</option>
										<option value="1">MarkUp</option>
										<option value="0">MarkDown</option>
										</select> <label for="code">Mark</label>
						</div>
					</div>
				</div>
			</div>
			    </div>
			    <div class="row padding-bottom10">
			    <div class="col-lg-6 col-md-6 col-sm-6 padding-left-right-set4">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11">
						<div class="">
							<input type="text" autocomplete="off" class="w-100" ng-model="markUpDownPerPopup" style="    margin-left: 3px;
    border-radius: 10px;
    border: 1px solid;
    height: 38px;"><label for="code">Pecentage</label>
						</div>
					</div>
				</div>
			</div>
				
			    </div>
			</div>
			<div class="modal-footer padding-top10" style="border:none;">
				<button type="button" data-dismiss="modal" class="btn btn-primary" id="" ng-click="submitDetails()">Submit</button>
			</div>
		</div>
	</div>
</div>
