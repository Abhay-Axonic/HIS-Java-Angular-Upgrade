<div id="page-content-wrapper">
	<div class="container-fluid his-style">
		<fieldset>
			<legend class="heading-div">Blood Bank Type Component Master</legend>
			<div class="row">
				<div class="col-lg-2 col-md-2 col-sm-3 padding-left-right-set4 padding-top10">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-stop-circle-o" aria-hidden="true" style="    margin-top: 25px;
"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">

								<div class="form-group">
									<label for="code" class="LISDynamicLabel">Bag Type<span class="star">*</span></label>
										<select  class="text-input floating-label dirty" ng-model="common.bloodBagTypeId" name="bloodBagTypeId" required>
											<option value="" ng-selected="true">Please Select The Bag Type</option>
											<option ng-repeat="info in bagTypeList" ng-selected="false" value="{{info.bloodBagTypeId}}">{{info.bloodBagTypeDesc}}</option>
										</select>
<!-- 										<p class="help-block" ng-if="commonform.bloodBagTypeId.$error.required">{{plzSelectTo}}</p> -->
									</div>
						</div>
					</div>
				</div>
				
				
		  </div>
		<div class="row padding-top10">
			<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4"></div>
			<div class="col-lg-8 col-md-8 col-sm-8 padding-left-right-set4">
				<div class="row col-md-5set" id="">
					<div class="col-lg-5 col-md-5 col-sm-5 padding-left-right-set4">
								<div class="">
										<label class="common-lable-color-set"> Component Type<span class="star">*</span></label>
										<div class="masterborderScroll">
											<div class="checkbox" ng-repeat="component in componentList">
												<label class="common-lable-color-set">
												<input type="checkbox" ng-model="getComponentList[component.bloodComponentId]" 
												ng-click="addcomponent(component.bloodComponentId,component.bloodComponentDesc)" value="{{component.bloodComponentId}}">{{component.bloodComponentDesc}}</label>
											</div>
										</div>
									</div>
					</div>

							<div class="col-lg-1 col-md-1 col-sm-1 padding-left-right-set4">
									<div class="text-center margintop120">
										<button type="button" class="btn btn-primary text-width-auto btn-sm selectionBtn" ng-click="selectcomponent()"> << >> </button>
									</div>
								</div>
					<div class="col-lg-5 col-md-5 col-sm-5 padding-left-right-set4">

							<div class="">
										<label class="common-lable-color-set">Selected ICD Code <span class="star">*</span></label>
										<div class="masterborderScroll">
										<div class="checkbox" ng-repeat="selectDignosis in selectBloodBankTypeComponentMasterList">
												<label  class="common-lable-color-set">{{selectDignosis.bloodComponentDesc}}</label>
											</div>
										</div>
									</div>
					</div>
				</div>
			</div>
			<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4"></div>
		</div>
		<div class="row padding-top10">
				<div class="col-md-6 col-sm-7 padding-left-right-set4">
					<div class="row">
						<div class="col-lg-3 col-md-6 col-sm-6" style="padding-left: 0px;">
								<div class="search">
								<label class="show-entries">Show <select name="DataTables_Table_0_length" aria-controls="DataTables_Table_0" ng-init="noOfRecordsPerPage='10'" class="search-popUp-ddl ng-pristine ng-untouched ng-valid ng-not-empty dirty">
										<option value="10">10</option>
										<option value="25">25</option>
										<option value="50">50</option>
										<option value="100">100</option>
								</select> entries
								</label>
							</div>
						</div>
					</div>
				</div>
				<div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
			        <a href="" class="btn btn-primary btn-save-box-shadow" title="Save" data-toggle="modal" ng-click="save()" ng-if="saveBtnFlag">
			        <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
			      
			        <a href="" class="btn btn-primary btn-save-box-shadow" title="Update" data-toggle="modal" ng-click="update()" ng-if="updateBtnFlag">
			        <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
			     </div>
			     <div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set0 float_right">
			        <input type="text" autocomplete="off" class="text-search-box search-popUp-ddl" placeholder="Search" style="margin-top:0px" ng-model="searchKeyword">
			        <i class="fa fa-search common-search-text-icon" aria-hidden="true"></i>
			     </div>
			</div>
			<div class="row padding-left-right-set4 margin-top8">
			<div class="col-md-12">
				<table class="table table-bordered">
					<thead>
						<tr class="">
							<th class="width10">Bag Type</th>
							<th class="width8">Selected Component Type</th>
							<th class="width5 text-center">Status(n)</th>
							<th class="width5 text-center">Action taken</th>
						</tr>
					</thead>
					<tbody>  
						<tr ng-repeat="info in commonList|orderBy:column:reverse|filter:searchKeyword">
							<td class="">{{info.bloodBagTypeDesc}}</td>
							<td class="text-center">
								<a >
								<i class="fa fa-info-circle" aria-hidden="true" data-toggle="modal"
									 data-target="#componentDetailedList" ng-click="getDetailedComponentList(info.bloodBagTypeId)"></i></a>
							</td>
							<td class="text-center">
								<label class="switch">
									<input type="checkbox" ng-model="info.status"
									ng-checked="info.status=='A'" ng-true-value="'A'"
									ng-false-value="'I'"
									ng-change="updateStatus(info.bloodBagTypeId,info.status)">
									<div class="slider round"></div>
								</label>
							</td>
							<td class="text-center">
								<a>
									<i class="fa fa-pencil" aria-hidden="true" ng-click="showUpdateBtn(info.bloodBagTypeId)" ></i>
								</a>
							</td>
						</tr>
					</tbody>
				</table>
				<div class="row margin-bottom45 sss">
					<ul ng-if="pager.pages.length" class="pagination table-list ng-scope" style="font-size: 14px;">
						<li ng-class="{disabled:pager.currentPage === 1}" class="disabled"><a ng-click="setPage(1,'true')">First</a></li>
						<li ng-class="{disabled:pager.currentPage === 1}" class="disabled"><a ng-click="setPage(pager.currentPage - 1,'true')">Previous</a></li>
						<li ng-repeat="page in pager.pages" ng-class="{active:pager.currentPage === page}" class="ng-scope active"><a ng-click="setPage(page,'true')" class="">1</a></li>
						<li ng-class="{disabled:pager.currentPage === pager.totalPages}" class="disabled">
							<a ng-click="setPage(pager.currentPage + 1,'true')">Next</a>
						</li>
						<li ng-class="{disabled:pager.currentPage === pager.totalPages}" class="disabled">
							<a ng-click="setPage(pager.totalPages,'true')">Last</a>
						</li>
					</ul>
				</div>
			</div>
			</div>
		
		</fieldset>
	</div>
</div>
<div id="componentDetailedList" class="modal fade ng-scope in common-medium-popup" role="dialog his-style">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header padding-zero">
				<div class="modal-title patient-details-row">
					Details
					<button type="button" class="close" data-dismiss="modal">&times;</button>
				</div>
			</div>
			<div class="modal-body">
				<div class="row padding-left-right-set4 table-container padding-top8">
					<div class="table-container">
						<div class="table-container-header">
							<table class="table table-striped table-hover table-condensed table-bordered">
								<thead>
									<tr>
										<th class="width1"><span class="">Sr No.</span></th>
										<th class="width2	"><span class="">Component Name</span></th>
									</tr>
								</thead>
							</table>
						</div>
						<div class="table-container-body fix-height-scroll230" style="overflow: overlay;">
							<table class="table table-striped table-hover table-condensed table-bordered">
								<tbody>
									<tr ng-repeat="info in getListObject track by $index">
										<td class="width1">{{$index+1}}</td>
										<td class="width2">{{info.bloodComponentDesc}}</td>
									</tr>
								</tbody>
									
							</table>
			             </div>
						</div>

					</div>
				</div>
			</div>
		</div>
	</div>
<script src="resources/assets/js/common/page-height.js"></script>
<script>
$(document).ready(function() {  
	 $(".selectedPageName").text("Blood Bank Type Component Master");
	 $(".sidebar-nav li").each(function() {
		$(this).find("a").parents("li").removeClass("active");
	  });
	   $('a[href$="bloodBankTypeComponent"]').parents("li").addClass("active");
});
</script>
