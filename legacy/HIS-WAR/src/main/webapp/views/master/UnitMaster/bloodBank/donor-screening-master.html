<div id="page-content-wrapper">
	<div class="container-fluid his-style">
		<div class="row">
			<div class="col-lg-4 col-md-4 col-sm-4 padding-left-right-set4 padding-top15">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon text-width-auto">
						<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11">
						<div class="">
							<input type="text" autocomplete="off" name="description" id="" ng-model="parameter" class="text-input floating-label dirty"> 
							<label for="description" class="LISDynamicLabel">Parameter<span class="star">*</span></label>
						</div>
					</div>
				</div>
			</div>
			<div class="col-lg-2 col-md-2 col-sm-3 padding-left-right-set4 padding-top15">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11">
						<div class="">
							<select class="text-input floating-label dirty" ng-model="deferredTypeId">
								<option value=""></option>
								<option value="{{cp.defferedTypeId}}" ng-value="cp.defferedTypeId" ng-repeat="cp in getDefferedTypeList">{{cp.defferedTypeName}}</option>
								
							</select> 
							<label for="description" class="LISDynamicLabel">Deferral Type<span class="star">*</span></label>
						</div>
					</div>
				</div>
			</div>
		
			<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top0">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-dot-circle-o" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11">
						<div class="">
							<label for="" class="LISDynamicLabel">Gender<span class="star">*</span></label>
							<div class="custom-drop-down-btn" ng-dropdown-multiselect="" ng-click=""
								options="getGenderList" selected-model="selectedGenderList">
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<div class="row padding-top4">
		 <div class="col-md-6 col-sm-7 padding-left-right-set4">
					<div class="row">
						<div class="col-lg-3 col-md-6 col-sm-6" style="padding-left: 0px;">
							<div class="search">
							<label class="show-entries">Show 
							<select name="DataTables_Table_0_length" aria-controls="DataTables_Table_0"
								ng-init="noOfRecordsPerPage='10'" ng-model="noOfRecordsPerPage"
								ng-change="setNoOfRecords();" class="search-popUp-ddl">
									<option value="10">10</option>
									<option value="25">25</option>
									<option value="50">50</option>
									<option value="100">100</option>
							</select> entries
							</label>
						</div>
						</div>
					</div>
				</div>
			<div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
				<div class=" ">
					 <a href="" class="btn btn-primary btn-save-box-shadow" title="Save" data-toggle="modal"  ng-if="saveBtnFlag" data-target="#confirmPatientTypeSave" ><i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a> 
					<a href="" class="btn btn-primary btn-save-box-shadow" title="Update" data-toggle="modal"  ng-if="updateBtnFlag" data-target="#confirmPatientTypeUpdate" ><i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
				</div>
			</div>
			<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set0 float_right">
				<input type="text" autocomplete="off" class="text-search-box dirty" placeholder="Search"  ng-model="searchKeyword" style="margin-top: 0px"> <i class="fa fa-search common-search-text-icon" aria-hidden="true"></i>
			</div>
			
		</div>
		<div class="row padding-left-right-set4 table-container padding-top4">
			<div class="table-container">
				<div class="table-container-header">
					<table
						class="table table-striped table-hover table-condensed table-bordered">
						<thead>
							<tr>
								<th class="width18">Parameter</th>
								<th class="width10">Deferral Type</th>
								<th class="width8">Gender</th>
								<th class="width5 text-center">Status(n)</th>
								<th class="width5 text-center">Action taken</th>
							</tr>
						</thead>
					</table>
				</div>
				<div class="table-container-body fix-height-scroll400" style="overflow: overlay;"> <!-- fix-height-scroll230, background: #fff; -->
					<table class="table table-striped table-hover table-condensed table-bordered">
						<tbody>
							<tr ng-repeat="info in getDonorScreeningList | filter:searchKeyword track by $index ">
								<td class="width18">{{info.parameter}}</td>
								<td class="width10">{{info.deferredType}}</td>
								<td class="width8">{{info.gender}}</td>
								<td class="width5 text-center">
									<label class="switch vertical-middle"> 
									<input type="checkbox" ng-model="info.status" ng-true-value="'A'" ng-false-value="'I'"
														ng-change="updateStatus(info.id,info.status)">
									<div class="slider round"></div>
								</label>
								</td>
								<td class="width5 text-center">
									<a ng-class="{disabled: info.status=='I'}" title="Edit"><i class="fa fa-pencil" ng-click="showUpdateBtn(info)"></i></a>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
				<div class="row margin-bottom45 sss">
					  <ul ng-if="pager.pages.length" class="pagination table-list"
						style="font-size: 14px;">
						<li ng-class="{disabled:pager.currentPage === 1}"><a
							ng-click="setPage(1,'true')">First</a></li>
						<li ng-class="{disabled:pager.currentPage === 1}"><a
							ng-click="setPage(pager.currentPage - 1,'true')">Previous</a></li>
						<li ng-repeat="page in pager.pages"
							ng-class="{active:pager.currentPage === page}"><a
							ng-click="setPage(page,'true')">{{page}}</a></li>
						<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
							<a ng-click="setPage(pager.currentPage + 1,'true')">Next</a>
						</li>
						<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
							<a ng-click="setPage(pager.totalPages,'true')">Last</a>
						</li>
					</ul>
				</div>
			</div>
		</div>
	</div>
</div>
<!-- CONFIRM POPUP FOR SAVE START-->
<div id="confirmPatientTypeSave" class="modal fade ng-scope in" role="dialog">
	<div class="modal-dialog" style="width: 560px !important; margin: 80px auto !important;"> <!-- width: 25% !important;margin: 200px 0 0 510px !important; -->
		<div class="modal-content">
			<div class="modal-header" style="padding: 0px!important;">
				<div class="modal-title patient-details-row">
					Confirm
					<button type="button" class="close" data-dismiss="modal"   ng-click="cancel();" >&times;</button>
				</div>
			</div>
			<div class="modal-body">
				<div class="margin-left10"><span>Are you sure you want to Save?</span></div>
			</div>
			<div class="modal-footer" style="border:none;">
				<button type="button" data-dismiss="modal" class="btn btn-primary" id="okBtn"  ng-if="saveBtnFlag" ng-click="savedonorScreening();">Ok</button>
				<button type="button" data-dismiss="modal" class="btn btn-primary" id="cancelBtn">Cancel</button>
			</div>
		</div>
	</div>
</div>
<!-- CONFIRM POPUP FOR SAVE END -->

<!-- CONFIRM POPUP FOR UPDATE START-->
<div id="confirmPatientTypeUpdate" class="modal fade ng-scope in" role="dialog">
	<div class="modal-dialog" style="width: 560px !important; margin: 80px auto !important;"> <!-- width: 25% !important;margin: 200px 0 0 510px !important; -->
		<div class="modal-content">
			<div class="modal-header" style="padding: 0px!important;">
				<div class="modal-title patient-details-row">
					Confirm
					<button type="button" class="close" data-dismiss="modal"   ng-click="cancel();" >&times;</button>
				</div>
			</div>
			<div class="modal-body">
				<div class="margin-left10"><span>Are you sure you want to Update?</span></div>
			</div>
			<div class="modal-footer" style="border:none;">
				<button type="button" data-dismiss="modal" class="btn btn-primary" id="okBtn" ng-if="updateBtnFlag"  ng-click="updateDonorScreening();">Ok</button>
				<button type="button" data-dismiss="modal" id="cancelBtn" class="btn btn-primary">Cancel</button>
			</div>
		</div>
	</div>
</div>
<!-- CONFIRM POPUP FOR UPDATE END -->
<script src="resources/assets/js/common/page-height.js"></script>
<script type="text/javascript">

$(document).ready(function() {  
	// $(".patienttSearchResult").hide();
	//$(".icon-span").hide();
	 $(".selectedPageName").text("Donor Screening Master");
	$(".sidebar-nav li").each(function() {
		$(this).find("a").parents("li").removeClass("active");
	});
	$('a[href$="donorScreeningMaster"]').parents("li").addClass("active");
});
</script>
