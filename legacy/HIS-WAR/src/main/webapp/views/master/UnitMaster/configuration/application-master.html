<script type="text/javascript">
	$(document).ready(
			function() {
				var documentHeight = $(window).height();
				var sideBarHeight = documentHeight - 55;
				$("#page-content-wrapper").css("height", sideBarHeight + "px");

				$(".selectedPageName").text("Application Configuration");
				$(".sidebar-nav li").each(function() {
					$(this).find("a").parents("li").removeClass("active");
				});
				$('a[href$="applicationConfiguration"]').parents("li")
						.addClass("active");
			});
	
	$(".toggle-password").click(function() {

		  $(this).toggleClass("fa-eye fa-eye-slash");
		  var input = $($(this).attr("toggle"));
		  if (input.attr("type") == "password") {
		    input.attr("type", "text");
		  } else {
		    input.attr("type", "password");
		  }
		});
	
	
	
	function showTextArea() {
		var selectBox = document.getElementById("selectBox");
		console.log("Selected value is:"+selectBox);
		var selectedValue = selectBox.options[selectBox.selectedIndex].value;
		if(selectedValue == 2) {
			document.getElementById("textAreaDiv").style.display = "block";
		} else {
			document.getElementById("textAreaDiv").style.display = "none";
		}
	}	
	
	function showTextAreaForMSG91() {
		var selectBox = document.getElementById("selectBox1");
		console.log("Selected value is:"+selectBox);
		var selectedValue = selectBox.options[selectBox.selectedIndex].value;
		if(selectedValue == 2) {
			document.getElementById("textAreaDiv1").style.display = "block";
		} else {
			document.getElementById("textAreaDiv1").style.display = "none";
		}
	}	     
	      
</script>
