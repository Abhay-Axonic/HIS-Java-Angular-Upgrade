<div id="page-content-wrapper">

							</div>
						</div>
					</div>

							<div class="" show-errors>
								<input type="text" autocomplete="off" name="patientName"  id="" ng-model="patientSearchObj.patientName" press-enter="searchPatient(patientSearchObj)" class="text-input floating-label dirty" value=""> 
								<label for="description" >Patient Name</label>
							</div>
						</div>
					</div>
				</div>

						</div>
						<div class="col-lg-10 col-sm-10 col-md-10">
							<div class="">
								<select class="text-input floating-label"
								ng-model="patientSearchObj.genderId"
								press-enter="searchPatient(patientSearchObj)">
								<option></option>
								<option ng-repeat="sex in genderList" value="{{sex.id}}">{{sex.desc}}</option>
							</select> <label for="code">Gender</label>
							</div>
						</div>
						</div>
					</div>
					<div class="col-lg-6 col-md-6 col-sm-6 padding-left-right-set4">

							<div class="col-lg-2 col-sm-2 col-md-2 polymer-icon ">
							<i class="fa fa-mobile" aria-hidden="true"></i>
						</div>
						<div class="col-lg-10 col-sm-10 col-md-10">
							<div class="">
								<input numbers-only type="text" autocomplete="off"  id="" ng-model="patientSearchObj.mobileNumber" press-enter="searchPatient(patientSearchObj)" class="text-input floating-label dirty"  value=""> 
								<label for="description" class="">Mobile Number</label>
							</div>
						</div>
						</div>
					</div>
				</div>
				<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">

							<div class="col-lg-2 col-sm-2 col-md-2 polymer-icon ">
							<i class="fa fa-calendar" aria-hidden="true"></i>
						</div>
						<div class="col-lg-10 col-sm-10 col-md-10">
							<div class="">
								<input type="text" autocomplete="off" class="text-input floating-label dirty"
											name="datepicker" id="datepickerSearch"
											uib-datepicker-popup="dd/MM/yyyy" ui-mask="99/99/9999"
											placeholder="DD/MM/YYYY" ng-model="datepickerSearch"
											model-view-value="true" is-open="datepickerSearch.opened"
											datepicker-options="dateOptions"  show-button-bar="false"
											ng-click="openDatePickerSearch()" press-enter="searchPatient(patientSearchObj)" > 
								 <label for="description" class="">Birth Date</label>
							</div>
						</div>
						</div>
					</div>
					<div class="col-lg-6 col-md-6 col-sm-6 padding-left-right-set4">

							<i class="fa fa-address-book" aria-hidden="true"></i>
						</div>
						<div class="col-lg-10 col-sm-10 col-md-10">
							<div class="">
								<select class="text-input floating-label dirty" name="identificationId"   ng-model="patientSearchObj.identificationTypeId"  >
											<option>Select Identification</option>
											<option ng-repeat="info in identificationList" value="{{info.identificationId}}">{{info.identificationName}}</option>

								<label for="" class="long-text-overflow">Identification Type</label>
							</div>
						</div>
						</div>
					</div>
				</div>	
				<div class="col-lg-2 col-md-4 col-sm-4 padding-left-right-set4 padding-top10">

							<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon ">
								<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
							</div>
							<div class="col-lg-10 col-sm-10 col-md-10 " >
								<div class="">
									<input type="text" autocomplete="off"  id="" ng-model="patientSearchObj.identificationNumber" press-enter="searchPatient(patientSearchObj)" class="text-input floating-label dirty " value="">
									 <label for="description" class="long-text-overflow">Identification No..</label>
								</div>
							</div>
							</div>
							<div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right padding-top2 margin-top-5">
								<div class="common-save-button" style="padding-top:  0px;">
					                <a href="" ng-click="searchPatient()" id="searchBtn" class="btn btn-primary btn-save-box-shadow" style="width: auto;">
					                  <i class="fa fa-search" aria-hidden="true"></i>
					                </a>
					             </div>
							</div>
					</div>
				</div>

		<div class="row padding-left-right-set4 table-container padding-top5">

				<div class="table-container-header">
					<table class="table table-striped table-hover table-condensed table-bordered">
						<thead>
							<tr>
								<th class="width1 text-center"></th>
								<th class="width6">Patient Name</th>
								<th class="width4">UHID</th>
								<th class="width4">Contact No.</th>
								<th class="width4 text-center">Status(n)</th>
								<th class="width4 text-center">Approved Amount</th>
							</tr>
						</thead>
					</table>
				</div>
				<div class="table-container-body fix-height-scroll430" style="overflow: overlay;"> <!-- fix-height-scroll230, background: #fff; -->

						<tbody>
							<tr>
								<td class="width1 text-center"><input type="checkbox"></td>
								<td class="width6"></td>
								<td class="width4"></td>
								<td class="width4"></td>
								<td class="width4 vertical-middle text-center">
									<label class="switch vertical-middle"> 
										<input type="checkbox">
										<div class="slider round"></div>
									</label>
								</td>
								<td class="width4 text-center">
									<a class="cursor-pointer" data-toggle="modal" data-target="#approvedAmtDetailsModal">
										<i class="fa fa-info-circle"></i>
									</a>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
		<div class="row his-style margin-top5 padding-right0">
				<div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-10 padding-right0 pull-right">
					<a>
						<input type="button" value="Save" class="btn btn-primary btn-save-box-shadow">
					</a>
				</div>
			</div>
	</div>
</div>

			<div class="modal-header" style="padding:0px;">
				<div class="modal-title patient-details-row">
					Trust Details
					<button type="button" class="close" data-dismiss="modal">&times;</button>
				</div>
			</div>
			<div class="modal-body">
				<div ng-include="'./views/common/patient-demography-info.html'" class="ng-scope"></div>
				<div class="row padding-left-right-10 table-container padding-top8">
					<div class="table-container">
						<div class="table-container-header">
							<table class="table table-striped table-hover table-condensed table-bordered">
								<thead>
									<tr>
										<th class="width2"></th>
										<th class="width12">Trust Name</th>
										<th class="width10">Amount</th>
										<th class="width5 text-center">Document</th>
									</tr>
								</thead>
							</table>
						</div>
						<div class="table-container-body fix-height-scroll320" style="overflow: overlay;"> <!-- fix-height-scroll230, background: #fff; -->

								<tbody>
									<tr>
										<td class="width2 text-center vertical-middle">
											<input type="checkbox" class="">
										</td>
										<td class="width12"></td>
										<td class="width10"></td>

											</a>
										</td>
									</tr>
								</tbody>
							</table>
						</div>

							<table class="table table-striped table-hover table-condensed table-bordered">
								<tfoot>
									<tr>
										<td class="width2 border-right-none"></td>
										<td class="width12 text-right">Total</td>
										<td class="width10 border-right-none"></td>
										<td class="width5"></td>
									</tr>
								</tfoot>
							</table>
						</div>
					</div>
				</div>

			<div class="modal-footer" style="border:none;">
				<button type="button" data-dismiss="modal" class="btn btn-primary width8" id="saveBtn">Save</button>
			</div>
		</div>
	</div>
