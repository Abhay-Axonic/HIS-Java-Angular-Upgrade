<style>
.cbxTree {
    font: 12px/1.5em Arial, "Helvetica CY", "Nimbus Sans L", sans-serif;
}
.cbxTree>.cbxTree-node {
    padding-left: 0;
}
.cbxTree-node {
    padding-left: 15px;
}
.cbxTree-swicth {
    width: 10px;
    height: 18px;
    font-size: 16px;
    color: #000;
    text-align: center;
    text-decoration: none;
    display: inline-block;
    margin-right: -13px;
}
.cbxTree-swicth:before {
    content: "+";
}
.cbxTree-swicth.open:before {
    content: "-";
}
.cbxTree-label {
    margin-left: 15px;
}
.cbxTree-swicth~.cbxTree-node {
    display: none;
}
.cbxTree-swicth.open~.cbxTree-node {
    display: block;
}
#minusId{
 display: none;
}
</style>
<div id="page-content-wrapper">
  <div class="container-fluid his-style">
    <div class="row">
      <div class="col-lg-4 col-md-4 col-sm-4 padding-left-right-set4 padding-top10">
        <div class="row input-container">
          <div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
            <i class="fa fa-stop-circle-o" style="    margin-top: 14px;" aria-hidden="true"></i>
          </div>
          <div class="col-lg-11 col-sm-11 col-md-11">
            <label class="LISDynamicLabel" style="margin-left: 14px;
    background: #fff !important;">Discharge Field</label>
            <div class="">
              <select class="text-input floating-label" name="dischargeFieldId" ng-model="dischargeFieldId" style="margin-top: -9px !important;"  required>
                <option>Select Field</option>
                <option ng-repeat="info in summaryFieldList"
                        ng-selected="false" value="{{info.dischargeFieldId}}">{{info.dischargeFieldDesc}}</option>
              </select>

            </div>
          </div>
        </div>
      </div>
      <div class="col-lg-4 col-md-4 col-sm-4 padding-left-right-set4 padding-top10">
        <div class="row input-container">
          <div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
            <i class="fa fa-stop-circle-o" style="    margin-top: 14px;" aria-hidden="true"></i>
          </div>
          <div class="col-lg-11 col-sm-11 col-md-11">
            <label class="LISDynamicLabel" style="    margin-left: 14px;
    background: #fff !important;">Optional Name</label>
            <div class="">
              <input type="text" style="    margin-top: -10px !important;" autocomplete="off" class="text-input floating-label dirty" ng-model="optionalName">

            </div>
          </div>
        </div>
      </div>

    </div>
    <div class="row">
    </div>




    <div class="row">
    </div>
    <div class="row">
    </div>

    <div class="row margin-top10 padding-left-right-10">
      <div class="col-md-6 col-sm-7 padding-left-right-set4">
        <div class="row">
          <div class="col-lg-3 col-md-6 col-sm-6" style="padding-left: 0px;">
            <div class="search">
              <label class="show-entries">Show
                <select name="DataTables_Table_0_length" aria-controls="DataTables_Table_0"
                        ng-init="noOfRecordsPerPage='10'" ng-model="noOfRecordsPerPage"
                        ng-change="setNoOfRecords();" class="search-popUp-ddl">
                  <option value="10">10</option>
                  <option value="25">25</option>
                  <option value="50">50</option>
                  <option value="100">100</option>
                </select> entries
              </label>
            </div>
          </div>
        </div>
      </div>
      <div class="row margin-top8 padding-left-right-set1">
        <div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto float_right">
          <div class=" padding-top4">
            <a href="" class="btn btn-primary btn-save-box-shadow" title="Save" data-toggle="modal" ng-click="save()"
              ng-if="saveBtnFlag"  > <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>

            <a href="" class="btn btn-primary btn-save-box-shadow" title="Update" data-toggle="modal" ng-click="update()"
               ng-if="updateBtnFlag"> <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
          </div>
        </div>
        <div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set0 float_right">
          <input type="text" autocomplete="off" class="text-search-box oneeeee" placeholder="Search" ng-model="searchKeyword" ng-change="searchDischargeFieldMapper(searchKeyword)">
          <i class="fa fa-search common-search-text-icon padding-top8" aria-hidden="true"></i>
        </div>
      </div>
    </div>

    <div class="row">
    </div>
    <div class="row margin-top4">
      <div class="col-lg-12 col-md-12 col-sm-12 padding-left-right-set1">
        <div class="table-container padding-left-right-set4 padding-top5">
          <div class="table-container-header">
            <table class="table table-striped table-hover table-condensed table-bordered">
              <thead class="mainServiceTableCommon">
              <tr>
                <th class="width5">Sr.No</th>
                <th class="width10">Hospital Discharge Field Name</th>
                <th class="width10">Optional Name</th>
                <th class="width3">Status(n)
                  <div class="float_right">
                    <div>
                      <i class="fa fa-caret-up" aria-hidden="true"></i>
                    </div>
                    <div class="margin-top-8">
                      <i class="fa fa-caret-down" aria-hidden="true"></i>
                    </div>
                  </div>
                </th>
                <th class="width3 text-center">Action taken</th>
              </tr>
              </thead>
            </table>
          </div>
          <div class="table-container-body fix-height-scroll450" style="overflow-y: overlay;">
            <table class="table table-striped table-hover table-condensed table-bordered">
              <tbody>
              <tr ng-repeat="info in commonList|orderBy:column:reverse">
                <td class="width5">{{info.dischargeFieldUnitWiseId}}</td>
                <td class="width10" title="{{info.dischargeFieldDesc}}">{{info.dischargeFieldDesc}}</td>
                <td class="width10" title="{{info.dischargeChangedName}}">{{info.dischargeChangedName}}</td>

                <td class="width3">
                  <label class="switch">
                    <input type="checkbox" ng-model="info.status" ng-true-value="'A'" ng-false-value="'I'" ng-change="updateStatus(info.dischargeFieldUnitWiseId,info.status)" >
                    <div class="slider round"></div>
                  </label>
                </td>
                <td class="width3 text-center">
                  <a>
                    <i class="fa fa-pencil" aria-hidden="true" ng-click="showUpdateBtn(info.dischargeFieldUnitWiseId)" ></i>
                  </a>
                </td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
    <div class="row margin-bottom45">
      <ul ng-if="pager.pages.length" class="pagination table-list"
          style="font-size: 14px;">
        <li ng-class="{disabled:pager.currentPage === 1}"><a
                ng-click="setPage(1,'true')">First</a></li>
        <li ng-class="{disabled:pager.currentPage === 1}"><a
                ng-click="setPage(pager.currentPage - 1,'true')">Previous</a></li>
        <li ng-repeat="page in pager.pages"
            ng-class="{active:pager.currentPage === page}"><a
                ng-click="setPage(page,'true')">{{page}}</a></li>
        <li ng-class="{disabled:pager.currentPage === pager.totalPages}">
          <a ng-click="setPage(pager.currentPage + 1,'true')">Next</a>
        </li>
        <li ng-class="{disabled:pager.currentPage === pager.totalPages}">
          <a ng-click="setPage(pager.totalPages,'true')">Last</a>
        </li>
      </ul>
    </div>
  </div>
</div>


<div id="TemplateInfoModal" class="modal fade ng-scope in common-large-popup" role="dialog" data-keyboard="false" data-backdrop="static">
  <div class="modal-dialog"> <!-- width: 25% !important;margin: 200px 0 0 510px !important; -->

      <div class="modal-header padding-zero" style="padding:0px;">
        <div class="modal-title patient-details-row">
          Template Info
          <button type="button" class="close" data-dismiss="modal">&times;</button>
        </div>
      </div>
      <div class="modal-body">
        <div class="row">
          <div class="row">

          </div>
          <div class="col-lg-12 col-md-12">
            <textarea ck-editor ng-model="value" disabled></textarea>
          </div>
        </div>

      </div>
      <div class="modal-footer" style="border:none;">
        <div class="row">
          <div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set0 float_right text-width-auto">

              <a href="" class="btn btn-primary btn-save-box-shadow width100" title="Save" data-dismiss="modal">
                <i class="fa fa-check-circle" style="font-size: 18px" aria-hidden="true"></i></a>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
<div id="columnsToPrint" class="common-medium-popup modal fade ng-scope"
     role="dialog" style="display: none;">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title patient-details-row" style="padding: -1px;">
          Column Details</div>
      </div>
      <div class="cbxTree">
        <div class="row">
          <!--NODE-1-->
          <div class="cbxTree-node" ng-repeat="info in columnsDetailsList" >
            <a class="cbxTree-swicth" ng-click="plusClick()"></a> <label class="cbxTree-label">
            <!-- <input type="checkbox" name="node-1" value="1" ng-click="addColumnData(objDisc, info);"
            class="cbxTree-cbx" ng-model="info.tableId"
            /> --> <span
                  class="cbxTree-txt">{{info.tableName}}</span>
          </label>
            <!--NODE-11-->
            <div id="minusId">
              <div class="cbxTree-node"  ng-repeat="data in info.listOfColumns track by $index">
                <a class=""></a> <label class="cbxTree-label">
                <!-- <input type="checkbox" name="node-11" ng-click="addColumnData(data, info.listOfColumns);"
                class="cbxTree-cbx" ng-model="objDisc[data.dischSumTabColMstId]"
                />  -->
                <input type="checkbox" name="node-11"
                       ng-click="addColumnData(info.listOfColumns, $index)" ng-true-value="true" ng-false-value="false" value=""
                       checklist-value="data" ng-model="data.isColumnRequired"
                       class="ng-scope ng-valid ng-dirty ng-valid-parse ng-touched ng-empty"
                       checklist-model="selectedColumnIds" style="">
                <span class="cbxTree-txt">{{data.columnName}}</span>
              </label>
              </div>
            </div>

          </div>
        </div>
      </div>
      <div class="row">
        <div
                class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set0 float_right text-width-auto">
          <div class=" ">
            <a href="" class="btn btn-primary btn-save-box-shadow width100"
               title="Cancel" data-dismiss="modal"> <i class="fa fa-times"
                                                       style="font-size: 18px" aria-hidden="true"></i></a>
          </div>
        </div>
        <div
                class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
          <div class=" ">
            <a href="" class="btn btn-primary btn-save-box-shadow width100"
               title="Save" data-dismiss="modal"
               ng-click="updateDischSumColumnToPrint()"> <i class="fa fa-floppy-o"
                                                            style="font-size: 21px" aria-hidden="true"></i></a>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

					$(this).find("a").parents("li").removeClass("active");
				});
				$('a[href$="dischargeFieldMapper"]').parents("li")
						.addClass("active");
			});

	CKEDITOR.editorConfig = function(config) {
		config.height = 350;
		config.width = '100%';
	};
