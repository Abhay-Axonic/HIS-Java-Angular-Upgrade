<div id="page-content-wrapper" >
    <div class="container-fluid his-style" style="height: 600px;" >
        <fieldset>
            <!-- <legend class="heading-div">Department Master</legend> -->
            <div class="row margin-top10">

                <div class="row padding-top0 padding-left-right-set4 margin-top5">
                    <div class="col-lg-12 col-md-12 col-sm-12 padding-left-right-set4">
                        <div class="card">
                            <div class="card-body">
<!--                                <h4 ><b>Vitals</b></h4>-->
                                <div class="form-group">
                                    <div  class="fixed-thead-tfoot-scroll">
                                        <table id="main-table" class="main-table width100">
                                            <thead>
                                            <tr>
                                                <th class="text-center width5">Sr. No.</th>
                                                <th class="text-center width20">Point</th>
                                                <th class="text-center width20">Strongly Disagree</th>
                                                <th class="text-center width20">Disagree</th>
                                                <th class="text-center width20">Agree</th>
                                                <th class="text-center width20">Strongly Agree</th>
                                            </tr>
                                            </thead>
                                            <tbody>
                                            <tr ng-repeat="item in ESSList track by $index">
                                                <td>{{item.id}}</td>
                                                <td>{{item.name}}
                                                </td>
                                                  <td ng-if="!$last">											  
												   <input type="radio" class="form-control"  name="option1_{{$index}}" value="stronglyDisagree" style="height: 21px;" ng-model="item.selectedOption"> 											    
												</td>
												<td ng-if="!$last">
													 <input type="radio" class="form-control"  name="option1_{{$index}}" value="disagree" style="height: 21px;" ng-model="item.selectedOption"> 
												</td>
												<td ng-if="!$last">
													 <input type="radio" class="form-control"  name="option1_{{$index}}" value="agree" style="height: 21px;" ng-model="item.selectedOption"> 
												</td>
												<td ng-if="!$last">
												     <input type="radio" class="form-control"  name="option1_{{$index}}" value="stronglyAgree" style="height: 21px;" ng-model="item.selectedOption">
												</td>
												
												<td ng-if="$last" colspan="4" class="text-center">
												<label for="ratingInput">Rating:</label>
										                <input type="number" min="1" max="10" placeholder="Rate 1-10" ng-model="survey.rating" style="width: 60px;" required>
										         </td>
					                      

                                            </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>

                <div class="row padding-top0 padding-left-right-set4 margin-top5">
                    <div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
                        <button type="submit" href=""  class="btn btn-primary btn-save-box-shadow" title="Save" data-toggle="modal" ng-click="saveSurvey()">
                            <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></button>
                    </div>
                </div>
            </div>

        </fieldset>
    </div>


</div>

<script>
    var documentHeight = $(window).height();
    var sideBarHeight = documentHeight - 55;
    $("#page-content-wrapper").css("height", sideBarHeight + "px");
    $(".selectedPageName").text("Department Master");
    $(".sidebar-nav li").each(function() {
        $(this).find("a").parents("li").removeClass("active");
    });
    $('a[href$="specialityMaster"]').parents("li").addClass("active");
</script>

<script>

$scope.validateRating = function(item) {
    if (item.rating < 1) {
        item.rating = 1;
    } else if (item.rating > 10) {
        item.rating = 10;
    }
};



</script>
