<div id="page-content-wrapper" class="clockPopupOver ">
	<div class="container-fluid his-style">
	<div class="row">
	  <div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
					    <div class="row input-container">
							<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
								<i class="fa fa-dot-circle-o" aria-hidden="true"></i>
							</div>
							<div class="col-lg-11 col-sm-11 col-md-11">
								<div class="">
									<select ng-model="icpcSystemObj" class="text-input floating-label"
									ng-options="x as x.icpcSystemDesc for x in icpcSystemList track by x.icpcSystemId"
									class="form-control" 
									ng-required="true">
									</select>
									<label for="patientName">System<span class="star">*</span></label>
								</div>
							</div>
						</div>
	   </div>
	 
		<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-dot-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							
							<div class="">
									<label for="">Specialty<span class="star">*</span></label>
									<div class="custom-drop-down-btn" ng-dropdown-multiselect="" ng-click="clicked('speciality')"
										options="specialityList" selected-model="selectedSpeacilityList">
									</div>
								</div>
						</div>
					</div>
				</div>
		</div>
			<div class="row padding-top10">
			
			<div class="col-lg-8 col-md-8 col-sm-8 padding-left-right-set4">
								<div class="search">
									<label class="show-entries">Show 
									<select ng-init="pagination.pageSize='10'" 
										ng-model="pagination.pageSize" 
										ng-change="pagination.setTotalPages(pagination)" class="search-popUp-ddl">
											<option value="10">10</option>
											<option value="25">25</option>
											<option value="50">50</option>
											<option value="100">100</option>
									</select> records 
									</label>
								</div>
				</div>
		      <div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
				<div class=" ">
				    <a href="" class="btn btn-primary btn-save-box-shadow" title="Save" data-toggle="modal" ng-click="saveICPCCodesConfigurationMapper()"> <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a><!-- end ngIf: saveBtnFlag --> <!-- ngIf: updateBtnFlag -->
				</div>
			 </div>
			 <div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set0 float_right">
				<input type="text" autocomplete="off" class="text-search-box dirty" placeholder="Search" ng-model="searchKeyword" style="margin-top: 0px" > <i class="fa fa-search common-search-text-icon" aria-hidden="true"></i>
			</div>
			</div>
		<div class="row padding-left-right-set4 table-container padding-top4">
			<div class="table-container">
				<div class="table-container-header">
					<table
						class="table table-striped table-hover table-condensed table-bordered">
						<thead class="mainServiceTableCommon">
											<tr>
												<th class="width10">System</th>
												<th class="width5 text-center">Specialty</th>
												<th class="width5 text-center">Status(n)</th>
												<th class="width4 text-center">Action taken</th>
											</tr>
										</thead>
					</table>
				</div>
				<div class="table-container-body fix-height-scroll450" style="overflow: overlay;"> <!-- fix-height-scroll230, background: #fff; -->
					<table
						class="table table-striped table-hover table-condensed table-bordered">
						<tbody>
							<tr ng-repeat="info2 in pagination.data |orderBy:column:reverse|filter:searchKeyword">
								<td class="width10">{{info2.systemName}}</td>
								<!-- <td class="width10">{{info2.icpcCode}}</td>
								<td class="width10">{{info2.description}}</td>
								 -->
								<td class="width5 text-center"><a data-toggle="modal" data-target="#SpecialityInfo"   ng-click="getSpecialityListByID(info2)"><i class="fa fa-info-circle"></i></a></td>
								<td class="width5 text-center">
							       <label class="switch"> 
							       	<input type="checkbox" ng-model="info2.status" ng-true-value="'A'" ng-false-value="'I'"  ng-change="updateStatus(info2.icpcCodeConfigurationId,info2.status)" >
								      <!-- <input type="checkbox"  class=" "> -->
								       <div class="slider round"></div>
							       </label>
						        </td>
								<td class="width4 text-center">
								   <a title="Edit"><i class="fa fa-pencil" aria-hidden="true" ng-click="updateDetails(info2);"></i></a>
								   &nbsp
								   <!-- <a title="Remove"><i class="fa fa-times" aria-hidden="true" data-toggle="modal" data-target="#confirmCancel"></i></a> -->
								</td>
							</tr>
						</tbody>
					</table>
				</div>
				<div class="row margin-bottom45 center-block">
					<ul ng-if="pagination.totalPages > 1" class="pagination table-list"
						style="font-size: 14px; cursor: pointer;">
						<li ng-class="{disabled:pagination.currentPage === 1}"><a
							ng-click="pagination.setFirstPage(pagination)">First</a>
						</li>
						<li ng-class="{disabled:pagination.currentPage === 1}"><a
							ng-click="pagination.setPreviousPage(pagination)">Previous</a>
						</li>
						<li ng-repeat="page in pagination.getPagesList(pagination)"
							ng-class="{active:pagination.currentPage === page}"><a
							ng-click="pagination.setPage(page, pagination)">{{page}}</a>
						</li>
						<li ng-class="{disabled:pagination.currentPage === pagination.totalPages}">
							<a ng-click="pagination.setNextPage(pagination)">Next</a>
						</li>
						<li ng-class="{disabled:pagination.currentPage === pagination.totalPages}">
							<a ng-click="pagination.setLastPage(pagination)">Last</a>
						</li>
					</ul>
				</div>
			</div>
		</div> 		
	</div>
</div>
<!-- Speciality Modal START -->
<div id="SpecialityInfo" class="modal fade ng-scope in common-small-popup" role="dialog">
	<div class="modal-dialog"> <!-- width: 25% !important;margin: 200px 0 0 510px !important; -->
		<div class="modal-content">
			<div class="modal-header padding-zero">
				<div class="modal-title patient-details-row">
					Specialty Details
					<button type="button" class="close" data-dismiss="modal">&times;</button>
				</div>
			</div>
			<div class="modal-body">
			
			<div class="row padding-left-right-set4 table-container padding-top4">
			<div class="table-container">
				<div class="table-container-header">
					<table
						class="table table-striped table-hover table-condensed table-bordered">
						<thead>
							<tr>
								<th class="width10">Specialty</th>
							</tr>
						</thead>
					</table>
				</div>
				<div class="table-container-body fix-height-scroll230" style="overflow: overlay;"> <!-- fix-height-scroll230, background: #fff; -->
					<table
						class="table table-striped table-hover table-condensed table-bordered">
						<tbody>
							<tr  ng-repeat="info3 in specialityListByID">
								<td class="width10">{{info3.specialityName}}</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div> 
			</div>
			<div class="modal-footer" style="border:none;">
				<button type="button" data-dismiss="modal" class="btn btn-primary" id="okBtn">Ok</button>
			</div>
		</div>
	</div>
</div>
<!-- Speciality Modal END -->
<script src="resources/assets/js/common/page-height.js"></script>
<script type="text/javascript">

$(document).ready(function() {  
	// $(".patienttSearchResult").hide();
	//$(".icon-span").hide();
	 $(".selectedPageName").text("ICPC Codes Configuration");
	$(".sidebar-nav li").each(function() {
		$(this).find("a").parents("li").removeClass("active");
	});
	$('a[href$="icpcCodesConfiguration"]').parents("li").addClass("active");
});
</script>
