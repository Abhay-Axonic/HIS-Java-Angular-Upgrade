<!-- Page Content -->
<div id="page-content-wrapper">
	<div class="container-fluid his-style">
		<fieldset>
		<form action="" name="nursingStationWardMappingForm" novalidate>
			<!-- <legend class="heading-div">Nursing Station Ward Mapping</legend> -->
			<div class="row margin-top10">
				
					<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 padding-top10">
						<div class="row input-container">
							<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
								<i class="fa fa-tasks" aria-hidden="true"></i>
							</div>
							<div class="col-lg-11 col-sm-11 col-md-11">
								<div class="form-group" show-errors>
									<select class="text-input floating-label" name="nursingStationId"
									ng-model="nursingMapperObj.nursingStationId" ng-change="getNursingStationId(nursingMapperObj.nursingStationId)" required>
									<option ng-repeat="info in nursingStationList"
										value="{{info.nursingStationId}}">{{info.nursingStationDesc}}</option>
									</select>
									<label for="code">Nursing Station<span class="star">*</span></label>
									<p class="help-block" ng-if="nursingStationWardMappingForm.nursingStationId.$error.required">Nursing Station is required</p>
								</div>
							</div>
						</div>
					</div>
					
				
			</div>
			<div class="row">
						<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4"></div>
						<div class="col-lg-8 col-md-8 col-sm-8 padding-left-right-set4">
							<div class="row col-md-5set" id="">
								<div class="col-lg-5 col-md-5 col-sm-5 padding-left-right-set4">
									<div class="">
										<label class="common-lable-color-set">Ward<span class="star">*</span></label>
										<div class="masterborderScroll">
										<div ng-repeat="info in wardList">
											<div class="checkbox">
												<label class="common-lable-color-set"><input
													type="checkbox" ng-model="specialityMst[info.wardId]" ng-click="addTempSpecialty(info.wardId,info.wardName)" value="{{info.wardName}}" >{{info.wardName}}</label>
											</div>
											</div>
										</div>
									</div>
								</div>
								<div class="col-lg-1 col-md-1 col-sm-1 padding-left-right-set4">
									<div class="text-center margintop120" style="    margin-left: -13px;width: 89px;">
										<button type="button"
											class="btn btn-primary width40 btn-sm" ng-click="selectSpeciality()" style="border: 1px solid #2A83F2 !important;background-color: #EBF4FF !important;color:#2A83F2 !important;border-radius: 10px;">&lt;&lt;&gt;&gt;</button>
<!-- 										<div class="padding-top10"> -->
<!-- 											<button type="button" -->
<!-- 												class="btn btn-primary width40 btn-sm"> << </button> -->
<!-- 										</div> -->
									</div>
								</div>
								<div class="col-lg-5 col-md-5 col-sm-5 padding-left-right-set4">
									<div class="">
										<label class="common-lable-color-set">Selected Ward</label>
										<div class="masterborderScroll">
										<div ng-repeat="info in selectedSpecialityList">
											<div class="checkbox">
												<label class="common-lable-color-set">{{info.wardName}}</label>
											</div>
										</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
		
		<div class="row margin-top10 padding-left-right-10">
		<div class="col-md-6 col-sm-7 padding-left-right-set4">
				<div class="row">
					<div class="col-lg-3 col-md-6 col-sm-6" style="padding-left: 0px;">
						<div class="search">
							<label class="show-entries">Show <select
								name="DataTables_Table_0_length"
								aria-controls="DataTables_Table_0"
								ng-init="noOfRecordsPerPage='10'" ng-model="noOfRecordsPerPage"
								ng-change="setNoOfRecords();" class="search-popUp-ddl">
									<option value="10">10</option>
									<option value="25">25</option>
									<option value="50">50</option>
									<option value="100">100</option>
							</select> entries
							</label>
						</div>
					</div>
				</div>
			</div>
			<div
				class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
				<div class=" ">
					<a href="" class="btn btn-primary btn-save-box-shadow" title="Save"
						data-toggle="modal" ng-click="saveNursingMapper()"
						ng-if="saveBtnFlag"> <i class="fa fa-floppy-o"
						style="font-size: 21px" aria-hidden="true"></i></a> <a href=""
						class="btn btn-primary btn-save-box-shadow" title="Update"
						data-toggle="modal" ng-click="updateNursingMapper()"
						ng-if="updateBtnFlag"> <i class="fa fa-floppy-o"
						style="font-size: 21px" aria-hidden="true"></i></a>
				</div>
			</div>
			<div
				class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set0 float_right">
				<input type="text" autocomplete="off" class="text-search-box" placeholder="Search" style="margin-top: 0px" ng-model="searchKeyword"> 
					<i class="fa fa-search common-search-text-icon" aria-hidden="true"></i>
			</div>
		</div>
		<div class="row padding-left-right-10 margin-top8">
			<div class="col-md-12">
				<table class="table table-bordered">
					<tr class=" ">
						<th class="width20">
							Nursing Station
							<div class="float_right">
								<div>
									<i class="fa fa-caret-up" aria-hidden="true"></i>
								</div>
								<div class="margin-top-8">
									<i class="fa fa-caret-down" aria-hidden="true"></i>
								</div>
							</div>
						</th>
						<th class="width5 text-center">
							Mapped Ward
						</th>
						<!-- <th class="width20">
							Selected Ward
							<div class="float_right">
								<div>
									<i class="fa fa-caret-up" aria-hidden="true"></i>
								</div>
								<div class="margin-top-8">
									<i class="fa fa-caret-down" aria-hidden="true"></i>
								</div>
							</div>
						</th> -->
						<th class="width8">
						Status(n)
							<div class="float_right">
								<div>
									<i class="fa fa-caret-up" aria-hidden="true"></i>
								</div>
								<div class="margin-top-8">
									<i class="fa fa-caret-down" aria-hidden="true"></i>
								</div>
							</div>
						</th>
						<th class="text-center width8">
						Action taken
							<div class="float_right">
								<div>
									<i class="fa fa-caret-up" aria-hidden="true"></i>
								</div>
								<div class="margin-top-8">
									<i class="fa fa-caret-down" aria-hidden="true"></i>
								</div>
							</div>
						</th>
						<!-- <th class="width5"></th> -->
					</tr>
					<tr ng-repeat="info in nursingMapperMasterList|filter:searchKeyword">
						<td>{{info.nursingStationDesc}}</td>
						<td class="text-center"> <!-- {{info.wardName}} -->
						<a data-toggle="modal" data-target="#nursingStationWardInfoModal">
						<i class="fa fa-info-circle" ng-click="geNursingStationMasterId(info.nursingStationId)"></i></a></td>
						<!-- <td>{{info.wardName}}</td> -->
						<td><label class="switch"> 
						<input type="checkbox"
								ng-model="info.status" ng-true-value="'A'" ng-false-value="'I'"
								ng-change="updateStatus(info.nursingStationId,info.status,info.nursingWardId)">
								<div class="slider round"></div></label></td>
						<td class="padding-edit-button-table text-center"><a><i class="fa fa-pencil"
								aria-hidden="true" ng-click="showUpdateBtn(info.nursingStationId,info.status)"></i></a></td>
						<!-- <td class="padding-edit-button-table text-center">
							<div class="">
								<a><i class="fa fa-info-circle" aria-hidden="true" title="Details" data-toggle="modal" data-target="#wardDetails"></i></a>
							</div>
						</td> -->
					</tr>
				</table>
				<div class="row margin-bottom45 sss">
					<ul ng-if="pager.pages.length" class="pagination table-list"
						style="font-size: 14px;">
						<li ng-class="{disabled:pager.currentPage === 1}"><a
							ng-click="setPage(1,'true')">First</a></li>
						<li ng-class="{disabled:pager.currentPage === 1}"><a
							ng-click="setPage(pager.currentPage - 1,'true')">Previous</a></li>
						<li ng-repeat="page in pager.pages"
							ng-class="{active:pager.currentPage === page}"><a
							ng-click="setPage(page,'true')">{{page}}</a></li>
						<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
							<a ng-click="setPage(pager.currentPage + 1,'true')">Next</a>
						</li>
						<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
							<a ng-click="setPage(pager.totalPages,'true')">Last</a>
						</li>
					</ul>
				</div>
			</div>
		</div>
		</form>
		</fieldset>
	</div>
</div>

<!-- nursingStationWardInfoModal START -->
<div id="nursingStationWardInfoModal" class="modal fade ng-scope in common-small-popup" role="dialog his-style">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header padding-zero">
				<div class="modal-title patient-details-row">
					Details
					<button type="button" class="close" data-dismiss="modal">&times;</button>
				</div>
			</div>
			<div class="modal-body">
				<div class="row padding-left-right-set4 table-container padding-top8">
					<div class="table-container">
						<div class="table-container-header">
							<table class="table table-striped table-hover table-condensed table-bordered">
								<thead>
									<tr>
										<th class="width2"><span class="">Sr No.</span></th>
										<th class="width10"><span class="">Ward</span></th>
									</tr>
								</thead>
							</table>
						</div>
						<div class="table-container-body fix-height-scroll230" style="overflow: overlay;">
							<table class="table table-striped table-hover table-condensed table-bordered">
								<tbody>
									<tr ng-repeat="info in wardInfoList track by $index">
										<td class="width2">{{$index+1}}</td>
										<td class="width10">{{info.wardName}}</td>
									</tr>
								</tbody>
							</table>
						</div>

					</div>
				</div>
			</div>
			<div class="modal-footer" style="border: none;">
				<button type="button" style="width: auto;" data-dismiss="modal" class="btn btn-primary width15" id="okBtn">Ok</button>
			</div>
		</div>
	</div>
</div>
<!-- nursingStationWardInfoModal END -->

<modal visible="showModal"></modal> 
<script type="text/javascript">
$(document).ready(function() {
	var documentHeight= $(window).height();
    var sideBarHeight = documentHeight - 55;
 	$("#page-content-wrapper").css("height", sideBarHeight + "px" );
});	
	$(".selectedPageName").text("Nursing Station Ward Mapping");
	$(".sidebar-nav li").each(function() {
		$(this).find("a").parents("li").removeClass("active");
	});
	$('a[href$="nursingStationWardMapping"]').parents("li").addClass("active");
</script>
