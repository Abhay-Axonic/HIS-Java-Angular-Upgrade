
<div id="page-content-wrapper">
    <div class="container-fluid his-style">
        <fieldset>
            <!-- <legend class="heading-div">Department Master</legend> -->
            <div class="row margin-top10">
                <form name="Specialityform" novalidate>
                    <div class="row">
                        <div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
                            <div class="row input-container">
                                <div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
                                    <i class="fa fa-dot-circle-o" aria-hidden="true"></i>
                                </div>

                                <input type="hidden">
                                <div class="col-lg-11 col-sm-11 col-md-11 ">
                                    <div class="form-group" show-errors>
                                        <input type="text" autocomplete="off" id="" class="text-input floating-label"
                                               name="specialityCode" ng-model="rackCode"
                                               required> <label for="code">Code<span class="star">*</span></label>
                                        <p class="help-block"
                                           ng-if="Specialityform.specialityCode.$error.required">Code
                                            is required</p>
                                    </div>

                                </div>
                            </div>
                        </div>
                        <div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
                            <div class="row input-container">
                                <div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
                                    <i class="fa fa-sticky-note-o" aria-hidden="true"></i>
                                </div>
                                <div class="col-lg-11 col-sm-11 col-md-11 ">
                                    <div class="form-group" show-errors>
                                        <input type="text" autocomplete="off" id="" class="text-input floating-label"
                                               name="specialityName" ng-model="rackDescription"
                                               required> <label for="description" class="">Description<span class="star">*</span></label>
                                        <p class="help-block"
                                           ng-if="Specialityform.specialityName.$error.required">Description
                                            is required</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </form>
            </div>
        </fieldset>



        <div class="row padding-top10">
            <div class="col-md-6 col-sm-7 padding-left-right-set4">
                <div class="row">
                    <div class="col-lg-3 col-md-6 col-sm-6" style="padding-left: 0px;">
                        <div class="search">
                            <label class="show-entries">Show
                                <select name="DataTables_Table_0_length" aria-controls="DataTables_Table_0"
                                        ng-init="noOfRecordsPerPage='10'" ng-model="noOfRecordsPerPage"
                                        ng-change="setNoOfRecords();" class="search-popUp-ddl">
                                    <option value="10">10</option>
                                    <option value="25">25</option>
                                    <option value="50">50</option>
                                    <option value="100">100</option>
                                </select> entries
                            </label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
                <a href="" class="btn btn-primary btn-save-box-shadow" title="Save" data-toggle="modal" ng-click="saveRack()" ng-hide="saveBtnFlag">
                    <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
                <a href="" class="btn btn-primary btn-save-box-shadow" title="Update" data-toggle="modal" ng-click="showUpdateBtn(info)" ng-hide="updateBtnFlag">
                    <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
            </div>
            <div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set0 float_right">
                <input type="text" autocomplete="off" class="text-search-box ng-pristine ng-untouched ng-valid ng-empty" placeholder="Search" style="margin-top:0px" ng-model="searchKeyword" ng-keyup="serachDepartmentMaster(searchKeyword)">
                <i class="fa fa-search common-search-text-icon" aria-hidden="true"></i>
            </div>
        </div>


        <div class="row padding-left-right-set4 margin-top4">
            <div class="col-md-12">
                <table class="table table-bordered">
                    <thead>
                    <tr class="">
                        <th class="width10">Rack Code</th>
                        <th class="width15">Description</th>
                        <th class="width8">Status(n)</th>
                        <th class="text-center width8">Action taken</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr ng-repeat="info in getMrd |filter:searchKeyword track by $index">
                        <td>{{info.rackCode}}</td>
                        <td>{{info.rackDescription}}</td>
                        <td><label class="switch"> <input type="checkbox"
                                                          ng-model="info.status" ng-true-value="'A'" ng-false-value="'I'"
                                                          ng-change="updateStatus(info.rackId,info.rackCode,info.rackDescription,info.rackId,info.status,$index)">
                            <div class="slider round"></div>
                        </label></td>
                        <td class="padding-edit-button-table text-center"><a> <i
                                class="fa fa-pencil" aria-hidden="true"
                                ng-click="viewBtn(info)"></i>
                        </a></td>
                    </tr>

                    </tbody>
                </table>

                <div class="row margin-bottom45">
                    <ul ng-if="pager.pages.length" class="pagination table-list"
                        style="font-size: 14px;">
                        <li ng-class="{disabled:pager.currentPage === 1}"><a
                                ng-click="setPage(1,'true')">First</a></li>
                        <li ng-class="{disabled:pager.currentPage === 1}"><a
                                ng-click="setPage(pager.currentPage - 1,'true')">Previous</a></li>
                        <li ng-repeat="page in pager.pages"
                            ng-class="{active:pager.currentPage === page}"><a
                                ng-click="setPage(page,'true')">{{page}}</a></li>
                        <li ng-class="{disabled:pager.currentPage === pager.totalPages}">
                            <a ng-click="setPage(pager.currentPage + 1,'true')">Next</a>
                        </li>
                        <li ng-class="{disabled:pager.currentPage === pager.totalPages}">
                            <a ng-click="setPage(pager.totalPages,'true')">Last</a>
                        </li>
                    </ul>
                </div>

            </div>
        </div>
    </div>
</div>
<script>
	var documentHeight = $(window).height();
	var sideBarHeight = documentHeight - 55;
	$("#page-content-wrapper").css("height", sideBarHeight + "px");
	$(".selectedPageName").text("Department Master");
	$(".sidebar-nav li").each(function() {
		$(this).find("a").parents("li").removeClass("active");
	});
	$('a[href$="specialityMaster"]').parents("li").addClass("active");
</script>
