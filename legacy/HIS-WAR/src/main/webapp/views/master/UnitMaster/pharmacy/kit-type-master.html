<div id="page-content-wrapper">
	<div class="container-fluid his-style">
		<div class="row">
			<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11 ">
						<div class="">
							<input type="text" autocomplete="off" name="kitTypeCode" id="" class="text-input floating-label" ng-model="vm.model.kitTypeCode"
							 ng-class="{dirty: vm.model.kitTypeCode}" ng-change="vm.model.isKitTypeCodeValid = false" maxlength="10">
							<p ng-if="vm.model.isKitTypeCodeValid" class="errorMsg">Kit Type Code is required</p>
							<label for="kitTypeCode">Kit Type Code</label>
						</div>

					</div>
				</div>
			</div>
			<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11 ">
						<div class="">
							<input type="text" autocomplete="off" name="kitTypeName" id="" class="text-input floating-label" ng-model="vm.model.kitTypeName"
							 ng-class="{dirty: vm.model.kitTypeName}" ng-change="vm.model.isKitTypeNameValid = false" maxlength="100">
							<p ng-if="vm.model.isKitTypeNameValid" class="errorMsg">Kit Type Name is required</p>
							<label for="kitTypeName">Kit Type</label>

						</div>
					</div>
				</div>
			</div>
			<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
				<div class="row input-container">
					<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
						<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
					</div>
					<div class="col-lg-11 col-sm-11 col-md-11">
						<div class="">
							<div class="col-lg-11 col-sm-11 col-md-11">
								<div class="">
									<select class="text-input floating-label" name="kitType" ng-model="vm.model.kitCategory" ng-options="kitCat. for kitCat in vm.model.kitCategoryist">
									</select>
									<label for="code">Kit Type</label>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div class="col-md-2 col-sm-2 padding-left-right-set4 text-width-auto padding-top8">
				<div class="">
					<a href class="btn btn-primary btn-save-box-shadow" title="Save" ng-click="vm.model.SaveKitType()">
						<i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i>
					</a>
				</div>

			</div>
			<div class="col-md-2 col-sm-2 padding-left-right-set4 text-width-auto padding-top8">
				<div class="">
					 <input type="button" value="Clear" class="btn btn-primary btn-save-box-shadow" ng-click="vm.model.ClearFields()">
				</div>
			</div>

		</div>
		<div class="row padding-top5">
			<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 float_right">
				<input type="text" autocomplete="off" class="text-search-box dirty" ng-model="search" placeholder="Search" style="margin-top: 0px">
				<i class="fa fa-search common-search-text-icon" aria-hidden="true"></i>
			</div>
		</div>
		<div class="row table-container padding-left-right-set4 padding-top8" id="implantTable" style="">
			<div class="col-md-12 col-lg-12 col-sm-8 table-container-header">
				<table class="table table-striped table-hover table-condensed table-bordered">
					<thead>
						<tr>
							<th class="width10 border-right-none">Kit Details</th>
							<th class="width10 border-right-none"></th>
							<th class="width5 border-right-none"></th>
							<th class="width5"></th>
						</tr>
						<tr class="">
							<th class="width10">Kit Type Code
								<div class="float_right" ng-click="sortType = 'code'; sortReverse = !sortReverse">
									<div>
										<i class="fa fa-caret-up" aria-hidden="true"></i>
									</div>
									<div class="margin-top-8">
										<i class="fa fa-caret-down" aria-hidden="true"></i>
									</div>
								</div>
							</th>
							<th class="width10">Kit Type Name
								<div class="float_right" ng-click="sortType = 'description'; sortReverse = !sortReverse">
									<div>
										<i class="fa fa-caret-up" aria-hidden="true"></i>
									</div>
									<div class="margin-top-8">
										<i class="fa fa-caret-down" aria-hidden="true"></i>
									</div>
								</div>
							</th>
							<th class="width5 text-center">Status</th>
							<th class="width5 text-center">Action</th>
						</tr>
					</thead>
				</table>
			</div>
			<div class="table-container-body fix-height-scroll400" style="overflow-y: overlay;">
				<table class="table table-striped table-hover table-condensed table-bordered">
					<tbody>
						<tr ng-repeat="kitType in vm.model.kitTypeList | filter : search | orderBy:sortType:sortReverse">
							<td class="width10">{{kitType.code}}</td>
							<td class="width10">{{kitType.description}}</td>
							<td class="width5 text-center">
								<label class="switch switch-small vertical-middle" title="{{kitType.status== true ? 'Active' : 'Inactive'}}">
									<input type="checkbox" class="switchInput" ng-model="kitType.status" ng-change="vm.model.ToggleStatus(kitType)">
									<div class="slider round slider-small"></div>
								</label>
							</td>
							<td class="width5 text-center">
								<a title="Edit" ng-click="vm.model.GetKitType(kitType.id)" ng-class="{disabled: !kitType.status}">
									<i class="fa fa-pencil" aria-hidden="true"></i>
								</a>
							</td>
						</tr>
						<tr ng-if="!vm.model.kitTypeList || vm.model.kitTypeList == false">
							<td colspan="4" class="text-center">
								<p>No Record Found</p>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
</div>
<script src="resources/assets/js/common/page-height.js"></script>
<script type="text/javascript">

	$(document).ready(function () {
		// $(".patienttSearchResult").hide();
		//$(".icon-span").hide();
		$(".selectedPageName").text("Kit Type Master");
		$(".sidebar-nav li").each(function () {
			$(this).find("a").parents("li").removeClass("active");
		});
		$('a[href$="KitTypeMaster"]').parents("li").addClass("active");
	});
</script>
