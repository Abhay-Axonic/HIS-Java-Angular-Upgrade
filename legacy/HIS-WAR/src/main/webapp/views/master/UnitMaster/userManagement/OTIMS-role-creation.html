<div id="page-content-wrapper">
	<div class="container-fluid his-style">
		<div class="row">
		<div class="col-lg-4 col-md-4 col-sm-4 padding-left-right-set4 padding-top10">
			<div class="row input-container">
				<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
					<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
				</div>
				<div class="col-lg-11 col-sm-11 col-md-11">
					<div class="">
						<select class="text-input floating-label" ng-model="common.roleName">
							<option>Select OTIMS User Role</option>
							<option value="OT Manager"> OT Manager</option>
							<option value="Surgeon"> Surgeon</option>
							<option value="admin"> admin</option>
							<option value="Anaesthetist"> Anaesthetist</option>
						</select> <label for="code">OTIMS Role Name</label>
					</div>
				</div>
			</div>
		</div>
	 </div>
		<div
			class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
			<div class=" ">
				<a href="" class="btn btn-primary btn-save-box-shadow" title="Save"data-toggle="modal" ng-click="save()" ng-if="saveBtnFlag"> <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
				<a href="" class="btn btn-primary btn-save-box-shadow"title="Update" data-toggle="modal" ng-click="update()" ng-if="updateBtnFlag"> <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
			</div>

			<div class=" padding-top4"></div>



		</div>
		<div class="row padding-left-right-set4 table-container padding-top12">
			<div class="table-container">
				<div class="table-container-header">
					<table
						class="table table-striped table-hover table-condensed table-bordered">
						<thead>
							<tr>
								<th class="width3">
									OTIMS Role Name
								</th>
								<th class="width1 text-center">
									Status
								</th>
								<th class="width1 text-center">
									Action
								</th>
							</tr>
						</thead>
					</table>
				</div> 
				<div class="table-container-body fix-height-scroll400" style="overflow: overlay;"> <!-- fix-height-scroll230, background: #fff; -->
					<table
						class="table table-striped table-hover table-condensed table-bordered">
						<tbody>
							<tr ng-repeat="info in commonList">
								<td class="width3">{{info.roleName}}</td>
								<td class="width1 vertical-middle text-center">
											<label class="switch"> 
												<input type="checkbox" ng-model="info.status" ng-true-value="'A'" ng-false-value="'I'"
														ng-change="updateStatus(info.roleId,info.status)">
												<div class="slider round"></div>
											</label>
										</td>
								<td class="width1 text-center" title="Remove">
								<i class="fa fa-pencil" style="color: #3131d2;" aria-hidden="true " title="Edit" ng-click="showUpdateBtn(info)"></i>
								&nbsp
								<i class="fa fa-times" style="color: #3131d2;" aria-hidden="true " title="Remove"></i>
							</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div> 
	</div> 
</div>		

<modal visible="showModal"></modal>
<script src="resources/assets/js/common/page-height.js"></script>
<script type="text/javascript">

$(document).ready(function() {  
	// $(".patienttSearchResult").hide();
	//$(".icon-span").hide();
	 $(".selectedPageName").text("OTIMS Role Creation");
	$(".sidebar-nav li").each(function() {
		$(this).find("a").parents("li").removeClass("active");
	});
	$('a[href$="OTIMSroleCreation"]').parents("li").addClass("active");
});
</script>
