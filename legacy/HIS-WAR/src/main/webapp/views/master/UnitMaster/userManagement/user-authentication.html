<div id="viewPassword" class="modal fade ng-scope in common-small-popup" role="dialog" data-keyboard="false" data-backdrop="static">
	<div class="modal-dialog"> <!-- width: 25% !important;margin: 200px 0 0 510px !important; -->
		<div class="modal-content">
			<div class="modal-header padding-zero" style="padding:0px;">
				<div class="modal-title patient-details-row">
					Password
					<button type="button" class="close" data-dismiss="modal">&times;</button>
				</div>
			</div>
			<div class="modal-body">
				<div class="row padding-top10" style="text-align:center;margin-bottom: 10px">
					{{viewPassword}}
				</div>
			</div>
		</div>
	</div>
</div>
<div id="changePasswordExpiryModal" class="modal fade ng-scope in common-small-popup" role="dialog" data-keyboard="false" data-backdrop="static">
	<div class="modal-dialog"> <!-- width: 25% !important;margin: 200px 0 0 510px !important; -->
		<div class="modal-content">
			<div class="modal-header padding-zero" style="padding:0px;">
				<div class="modal-title patient-details-row" style="font-size: 12px !important;">
					Change Password & Expiry
					<button type="button" class="close" data-dismiss="modal">&times;</button>
				</div>
			</div>
			<div class="modal-body">
				<div class="row padding-top10">
					<div class="col-lg-5 col-md-5 col-sm-5 padding-left-right-10 padding-top8">
						<label class="checkbox-inline"><input type="checkbox" ng-model ="passwordCheck" ng-true-value ="'Y'" ng-false-value="'N'" id="changePassword"><span></span>Change Password</label>
					</div>
					<div class="col-lg-7 col-md-7 col-sm-7 padding-left-right-10 newPassword">
						<div class="row input-container">
							<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
								<i class="fa fa-lock" aria-hidden="true"></i>
							</div>
							<div class="col-lg-11 col-sm-11 col-md-11">
								<div class="">
									<input type="text" autocomplete="off" ng-model ="password" name="description" id="" class="text-input floating-label dirty" > 
									<label for="description" class="">New Password</label>
								</div>
							</div>
						</div>
					</div>
				</div>
				<div class="row padding-top15 padding-bottom10">
					<div class="col-lg-5 col-md-5 col-sm-5 padding-left-right-10 padding-top8">
						<label class="checkbox-inline"><input type="checkbox" ng-model ="pwdExpiryCheck" ng-true-value ="'Y'" ng-false-value="'N'" id="changeExpiry"><span></span>Change Expiry</label>
					</div>
					<div class="col-lg-7 col-md-7 col-sm-7 padding-left-right-10 newExpiry">
						<div class="row input-container">
							<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
								<i class="fa fa-calendar" aria-hidden="true"></i>
							</div>
							<div class="col-lg-11 col-sm-11 col-md-11">
								<div class="">
								<div class="">
									<input name="fromDate"
											id="date1" type="text" autocomplete="off" class="text-input floating-label dirty ng-pristine ng-isolate-scope ng-valid-mask ng-empty ng-invalid ng-invalid-date ng-invalid-required ng-touched"
											uib-datepicker-popup="dd/MM/yyyy" ui-mask="99/99/9999"
											placeholder="DD/MM/YYYY" tabindex="13" ng-model="pwdExpiry"
											model-view-value="true" is-open="popup.opened"
											datepicker-options="dateOptions" show-button-bar="false" ng-click="open()"  />
										<label for="description" class="LISDynamicLabel">Expiry Date</label>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div class="modal-footer" style="border:none;">
				<div class="row">
					<div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set1 float_right text-width-auto">
						<div class=" ">
							<a href="" class="btn btn-primary btn-save-box-shadow width100" title="Cancel" data-dismiss="modal" ng-click = "cancelUserPassword()" >
							<i class="fa fa-times" style="font-size: 18px" aria-hidden="true"></i></a> 
						</div>
					</div>
					<div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
						<div class=" ">
							<a href="" class="btn btn-primary btn-save-box-shadow width100" title="Save" ng-click = "updateUserPassword()">
							<i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a> 
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
<script src="resources/assets/js/common/page-height.js"></script>
<script>
// hide show change password and expiry date 
$(".newPassword").hide();
$("#changePassword").click(function() {
    if($(this).is(":checked")) {
        $(".newPassword").show();
    } else {
        $(".newPassword").hide();
    }
});
$(".newExpiry").hide();
$("#changeExpiry").click(function() {
    if($(this).is(":checked")) {
        $(".newExpiry").show();
    } else {
        $(".newExpiry").hide();
    }
});
$(document).ready(function() {  
	// $(".patienttSearchResult").hide();
	 $(".selectedPageName").text("User Authentication");
	$(".sidebar-nav li").each(function() {
		$(this).find("a").parents("li").removeClass("active");
	});
	$('a[href$="userAuthentication"]').parents("li").addClass("active");
});
</script>
