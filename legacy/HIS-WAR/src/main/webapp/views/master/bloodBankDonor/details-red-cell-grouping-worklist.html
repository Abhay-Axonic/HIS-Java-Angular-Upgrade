<div id="page-content-wrapper">
	<div class="container-fluid his-style">
		<div class="row">
			<div class="col-lg-4 col-md-4 col-sm-4 padding-left-right-set4 padding-top10">
				<span class="margin-left10">
					<b class="padding-right10">Date :</b> 
					<label class="ng-binding">{{redCellGroupObj.collectionDate}}</label>
				</span>
			</div>
			<div class="col-lg-4 col-md-4 col-sm-4 padding-left-right-set4 padding-top10">
				<span class="margin-left10">
					<b class="padding-right10">Blood Unit No. :</b> 
					<label class="ng-binding">{{redCellGroupObj.bloodUnitNumber}}</label>
				</span>
			</div>
			<div class="col-lg-4 col-md-4 col-sm-4 padding-left-right-set4 padding-top10">
				<span class="margin-left10">
					<b class="padding-right10">Blood Group :</b>
					<label class="ng-binding">{{redCellGroupObj.bloodGroup}}</label>
				</span>
			</div>
			<div class="col-lg-4 col-md-4 col-sm-4 padding-left-right-set4 padding-top10">
				<span class="margin-left10">
					<b class="padding-right10">Barcode :</b>
					<label class="ng-binding">{{redCellGroupObj.barcode}}</label>
				</span>
			</div>
		</div>
		<div class="row padding-left-right-set4 table-container padding-top8">
			<div class="table-container">
				<div class="table-container-header">
					<table
						class="table table-striped table-hover table-condensed table-bordered">
						<thead>
							<tr>
								<th class="width10 text-center">Anti A</th>
								<th class="width10 text-center">Anti B</th>
								<th class="width10 text-center">Anti AB</th>
								<th class="width10 text-center">Anti D</th>
								<th class="width10 text-center">Anti A1</th>
								<th class="width10 text-center">Anti H</th>
							</tr>
						</thead>
					</table>
				</div>
				<div class="table-container-body" style="overflow: overlay;height:40px;"> <!-- fix-height-scroll230, background: #fff; -->
					<table
						class="table table-striped table-hover table-condensed table-bordered">
						<tbody>
							<tr>
								<td class="width10">
									<select class="w-100" ng-model="detailsObj.resultA">
										<option value="Y">Positive</option>
										<option value="N">Negative</option>
									</select>
								</td>
								<td class="width10">
									<select class="w-100" ng-model="detailsObj.resultB">
										<option value="Y">Positive</option>
										<option value="N">Negative</option>
									</select>
								</td>
								<td class="width10">
									<select class="w-100" ng-model="detailsObj.resultAB">
										<option value="Y">Positive</option>
										<option value="N">Negative</option>
									</select>
								</td>
								<td class="width10">
									<select class="w-100" ng-model="detailsObj.resultD">
										<option value="Y">Positive</option>
										<option value="N">Negative</option>
									</select>
								</td>
								<td class="width10">
									<select class="w-100" ng-model="detailsObj.resultA1">
										<option value="Y">Positive</option>
										<option value="N">Negative</option>
									</select>
								</td>
								<td class="width10">
									<select class="w-100" ng-model="detailsObj.resultH">
										<option value="Y">Positive</option>
										<option value="N">Negative</option>
									</select>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div> 
		<div class="row padding-left-right-set4">
			<label class="checkbox-inline">
				<input type="checkbox"  ng-true-value="true" ng-false-value="false"  ng-model="detailsObj.checkedCellGrouping">Checked Cell Grouping</label>
		</div>
		<footer class="col-lg-12 col-md-12 col-sm-12 padding-left-right-set4 padding-right20">
			<div class="row padding-right20">
				<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<div class="">
								<input type="text" autocomplete="off" name="description" id="" class="text-input floating-label dirty" ng-model="detailsObj.groupingIrregularAntibodies"> 
								<label for="description" class="LISDynamicLabel">Irregular Antibodies</label>
							</div>
						</div>
					</div>
				</div>
				<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">	
							<div class="">
							<select ng-model="detailsObj.groupingBloodGroupObj"
								class="text-input floating-label dirty"
								ng-options="info as info.bloodGroupDesc for info in bloodGroupList track by info.bloodGroupId"
								class="form-control" ng-required="true">
							</select> <label for="description" class="LISDynamicLabel">Blood Group</label>
							</div>
						</div>	
					</div>
				</div>
				<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<div class="">
								<select class="text-input floating-label dirty " name = "empList" ng-model="detailsObj.groupingTechnicianId" required >
									<option ng-repeat="info in usersList" ng-value="{{info.userId}}" value="{{info.userId}}"> {{info.userName}}</option>
								</select> 
								<label>Technician</label>
							</div>
						</div>
					</div>
				</div>
				<div class="col-lg-1 col-md-1 padding-left-right-set4 text-width-auto pull-right">
					<a>
						<input type="button" value="Save" class="btn btn-primary btn-save-box-shadow" ng-click="saveRedCellGrouping();">
					</a>
				</div>
				<div class="col-lg-1 col-md-1 padding-left-right-set1 text-width-auto pull-right">
					<a href="#/redCellGroupingWorklist">
						<input type="button" value="Back" class="btn btn-primary btn-save-box-shadow">
					</a>
				</div>
			</div>
		</footer>
		
	</div>
</div>
