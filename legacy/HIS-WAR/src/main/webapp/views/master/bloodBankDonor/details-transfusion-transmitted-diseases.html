		<div class="row ">
			<div class="col-lg-4 col-md-4 col-sm-4 padding-left-right-set4 padding-top10">
				<span class="margin-left10">
					<b class="padding-right10">Donor ID :</b> 
					<label class="ng-binding">{{common.donorNumber}}</label>
				</span>
			</div>
			<div class="col-lg-4 col-md-4 col-sm-4 padding-left-right-set4 padding-top10">
				<span class="margin-left10">
					<b class="padding-right10">Blood Bag No. :</b> 
					<label class="ng-binding">{{common.bloodBagNo}}</label>
				</span>
			</div>
			<div class="col-lg-4 col-md-4 col-sm-4 padding-left-right-set4 padding-top10">
				<span class="margin-left10">
					<b class="padding-right10">Collection Date :</b>
					<label class="ng-binding">{{common.collectionDate}}</label>
				</span>
			</div>
		</div>
		<div class="row">
			<div class="col-lg-4 col-md-4 col-sm-4 padding-left-right-set4 padding-top10">
				<span class="margin-left10">
					<b class="padding-right10">Bag Capacity :</b>
					<label class="ng-binding">{{common.bloodBagCapacity}}</label>
				</span>
			</div>
			<div class="col-lg-4 col-md-4 col-sm-4 padding-left-right-set4 padding-top10">
				<span class="margin-left10">
					<b class="padding-right10">Barcode :</b>
					<label class="ng-binding">{{common.barCode}}</label>
				</span>
			</div>
		</div>
		<div class="row margin-top4">
			<fieldset class="">
				<legend class="heading-div">TTD Details</legend>
				<div class="row">
					 <div class="col-lg-2 col-md-2 col-sm-3 padding-left-right-set4 padding-top10">
						<div class="row input-container">
							<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon ">
								<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
							</div>
							<div class="col-lg-11 col-sm-11 col-md-11 ">
								<div class="">
									<select ng-model="detailsObj.bloodGroupObj" class="text-input floating-label"
									ng-options="info as info.bloodGroupDesc for info in bloodGroupList track by info.bloodGroupId"
									class="form-control" 
									ng-required="true">
									</select>
									<label for="description" class="LISDynamicLabel">Blood Group</label>
								</div>
							</div>
						</div>
					</div> 
					<div class="col-lg-2 col-md-2 col-sm-3 padding-left-right-set4 padding-top10">
						<div class="row input-container">
							<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon ">
								<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
							</div>
							<div class="col-lg-11 col-sm-11 col-md-11 ">
								<div class="">
									<!-- <select class="text-input floating-label dirty" ng-model="detailsObj.bloodTestId">
										<option ng-repeat="test in testList" ng-value="{{test.bloodTestId}}">{{test.bloodTestDesc}}</option>
									</select> -->
									<select ng-model="detailsObj.bloodTestObj" class="text-input floating-label"
									ng-options="test as test.bloodTestDesc for test in testList track by test.bloodTestId"
									class="form-control" 
									ng-required="true">
									</select>
									<label for="description" class="LISDynamicLabel">Test Name</label>
								</div>
							</div>
						</div>
					</div>
					<div class="col-lg-4 col-md-4 col-sm-4 padding-left-right-set4 padding-top10">
						<div class="row input-container">
							<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon ">
								<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
							</div>
							<div class="col-lg-11 col-sm-11 col-md-11">
								<div class="">
									<select class="text-input floating-label dirty" ng-model="detailsObj.testResult">
										<option></option>
										<option value="true">Positive</option>
										<option value="false">Negative</option>
									</select>
									<label for="description" class="LISDynamicLabel">Result</label>
								</div>
							</div>
						</div>
					</div>
					<div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 padding-top5">
						<div class="width-div-for-patient-reg " style="float:none !important;">
							<a href="" class="btn btn-primary btn-save-box-shadow" title="Add">
								<i class="fa fa-plus" aria-hidden="true" ng-click="addTestDetails();"></i>
							</a>
						</div>
					</div>
					
				</div>
			</fieldset>
			<div class="col-lg-8 col-md-8  padding-left-right-set4 padding-top5">
				<div class="row padding-left-right-set0 table-container padding-top8">
					<div class="table-container">
						<div class="table-container-header">
							<table class="table table-striped table-hover table-condensed table-bordered">
								<thead>
									<tr>
										<th class="width10">Blood Group</th>
										<th class="width10">Test Name</th>
										<th class="width10">Result</th>
										<th class="width10">Action</th>
									</tr>
								</thead>
							</table>
						</div>
						<div class="table-container-body fix-height-scroll400" style="overflow: overlay;">
							<table class="table table-striped table-hover table-condensed table-bordered">
								<tbody>
									<tr ng-repeat="info in testDetailList">
										<td class="width10">{{info.bloodGroupDesc}}</td>
										<td class="width10">{{info.bloodTestDesc}}</td>
										<td class="width10">
											<div ng-if="info.testResult">Positive</div>
											<div ng-if="!info.testResult">Negative</div>
										</td>
										<td class="width10">
											<a><i class="fa fa-times" aria-hidden="true" ng-click="removeTestDetails($index)"></i></a>
										</td>
									</tr>
								</tbody>
							</table>
						</div>
					</div>
				</div>
			</div>
		</div>
		
		<footer class="col-lg-12 col-md-12 col-sm-12 padding-left-right-set4 padding-right20">
			<div class="row padding-right20">
				<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<div class="">
								<!-- <input type="text" autocomplete="off"  id="" class="text-input floating-label" ng-model="detailsObj.ttdDoneById"> -->
								<select class="text-input floating-label dirty " name = "empList" ng-model="detailsObj.ttdDoneById" required >
									<option ng-repeat="info in usersList" ng-value="{{info.userId}}" value="{{info.userId}}"> {{info.userName}}</option>
								</select> 
								<label for="code">TTD Done By</label>
							</div>
						</div>
					</div>
				</div>
				<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10 discardDiv">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<div class="">
								<input type="text" autocomplete="off" name="description" id="" class="text-input floating-label dirty"> 
								<label for="description" class="LISDynamicLabel">Reason</label>
							</div>
						</div>
					</div>
				</div>
				<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10 discardDiv">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<div class="">
								<input type="text" autocomplete="off" name="description" id="" class="text-input floating-label dirty"> 
								<label for="description" class="LISDynamicLabel">Done By</label>
							</div>
						</div>
					</div>
				</div>
				<div class="col-lg-1 col-md-2 col-sm-2 padding-left-right-set4 padding-top10 text-center margin-top4">
					<label>Collected From</label>
				</div>
				<div class="col-lg-3 col-md-4 col-sm-5 padding-left-right-set4 text-width-auto margin-top4">
					<div id="mediaType" class="customRadioBtn">
						<span>
							<input id="AcceptRdoBtn" name="AcceptRdoBtnGroup" type="radio" value="1" ng-model="detailsObj.ttdStatus" checked="checked" ng-click="checkValid();">
							<label for="AcceptRdoBtn">Accept</label>
						</span>
						<span>
							<input id="RejectRdoBtn" name="AcceptRdoBtnGroup" value="5" ng-model="detailsObj.ttdStatus" type="radio" >
							<label for="RejectRdoBtn">Discard</label>
						</span>
					</div>
				</div>	
				<div class="col-lg-1 col-md-1 padding-left-right-set4 text-width-auto pull-right">
					<a>
						<input type="button" value="Save" class="btn btn-primary btn-save-box-shadow" ng-click="saveDetails();">
					</a>
				</div>
				<div class="col-lg-1 col-md-1 padding-left-right-set1 text-width-auto pull-right">
					<a href="#/transfusionTransmittedDiseases">
						<input type="button" value="Back" class="btn btn-primary btn-save-box-shadow">
					</a>
				</div>
			</div>
		</footer>
		
		
	</div>
</div>
<script type="text/javascript">
$(".discardDiv").hide();
        $(function () {
            $("#discard").click(function () {
                if ($(this).is(":checked")) {
                    $(".discardDiv").show();
                } else {
                    $(".discardDiv").hide();
                }
            });
        });
    </script>
