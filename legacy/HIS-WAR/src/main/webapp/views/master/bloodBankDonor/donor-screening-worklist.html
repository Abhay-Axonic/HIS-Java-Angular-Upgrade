<!-- Page Content -->
<div id="page-content-wrapper">
	<div class="container-fluid his-style">
		<div class="row padding-left-right-set0">
			<div class="">
				<fieldset class="">
					
					<!-- <legend class="heading-div">Donor Search</legend> -->
					<form class="ng-pristine ng-valid">
						<div class="row divOtherRegistrationType">
							<div
								class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
								<div class="row input-container">
									<div class="col-lg-1 col-sm-2 col-md-2 polymer-icon">
										<i class="fa fa-calendar" aria-hidden="true"></i>
									</div>
									<div class="col-lg-11 col-sm-10 col-md-10">
										<div class="form-group">
										<input type="text" autocomplete="off" class="text-input floating-label dirty"
											name="fromDatepicker" id="fromDatepicker"
										    uib-datepicker-popup="dd/MM/yyyy" ui-mask="99/99/9999"
											placeholder="DD/MM/YYYY" ng-model="donorSearchObj.fromDate"
											model-view-value="true" is-open="fromDatepicker.opened"
											datepicker-options="dateOptions" show-button-bar="false"
											ng-click="openFromDatePicker()"  required>
											<label for="description" class=""> Date (From) </label>
											<!-- <input type="text" autocomplete="off" name="uhidNumber" class="text-input floating-label dirty">
											<label for="description" class="long-text-overflow">From Date</label> -->
										</div>
									</div>
								</div>
							</div>
							<div
								class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
								<div class="row input-container">
									<div class="col-lg-1 col-sm-2 col-md-2 polymer-icon ">
										<i class="fa fa-calendar" aria-hidden="true"></i>
									</div>
									<div class="col-lg-11 col-sm-10 col-md-10">
										<div class="">
											<input type="text" autocomplete="off" class="text-input floating-label dirty"
											name="toDatepicker" id="toDatepicker"
										    uib-datepicker-popup="dd/MM/yyyy" ui-mask="99/99/9999"
											placeholder="DD/MM/YYYY" ng-model="donorSearchObj.toDate"
											model-view-value="true" is-open="toDatepicker.opened"
											datepicker-options="dateOptions" show-button-bar="false"
											ng-click="openToDatePicker()"  required>
											<label for="description" class=""> Date-Till </label>
											<!-- <input type="text" autocomplete="off" class="text-input floating-label dirty">
											<label>To Date</label> -->
										</div>
									</div>
								</div>
							</div>
							<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
								<div class="row input-container">
									<div class="col-lg-1 col-sm-2 col-md-2 polymer-icon ">
										<i class="fa fa-user" aria-hidden="true"></i>
									</div>
									<div class="col-lg-11 col-sm-10 col-md-10">
										<div class="">
											<input type="text" autocomplete="off" class="text-input floating-label dirty" ng-model="donorSearchObj.donorName" press-enter="searchDonor();">
											<label>Donor Name</label>
										</div>
									</div>
								</div>
							</div>
							<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
								<div class="row input-container">
									<div class="col-lg-1 col-sm-2 col-md-2 polymer-icon ">
										<i class="fa fa-user" aria-hidden="true"></i>
									</div>
									<div class="col-lg-11 col-sm-10 col-md-10">
										<div class="">
											<input type="text" autocomplete="off" class="text-input floating-label dirty" ng-model="donorSearchObj.uhidNumber"  press-enter="searchDonor();" >
											<label>Donor ID</label>
										</div>
									</div>
								</div>
							</div>
							<div
								class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right padding-top10 text-width-auto">
								<div class="width-div-for-patient-reg ">
									<a href="" class="btn btn-primary btn-save-box-shadow" title="Search">
										<i class="fa fa-search" style="font-size: 21px" aria-hidden="true" ng-click="searchDonor();"></i>
									</a>
								</div>
							</div>

						</div>
					</form>
				</fieldset>
				</div>
				</div>
				<div class="row padding-top5">
					<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 float_right margin-top-5">
						<input type="text" autocomplete="off" class="text-search-box dirty ng-pristine ng-untouched ng-valid ng-empty" placeholder="Search" style="margin-top: 0px"
						ng-model="searchKeyword">
						<i class="fa fa-search common-search-text-icon" aria-hidden="true"></i>
					</div>
				</div>
				<div class="row padding-left-right-set4 table-container padding-top10">
					<div class="table-container">
						<div class="table-container-header">
							<table class="table table-striped table-hover table-condensed table-bordered">
								<thead>
									<tr>
										<th class="width10">Donor Id</th>
										<th class="width10">Donor Name</th>
										<th class="width6">Blood Group</th>
										<th class="width6">Gender</th>
										<th class="width6">Defferal Status</th>
										<th class="width6">Deffered Till</th>
										<th class="width5 text-center">Action taken</th>
									</tr>
								</thead>
							</table>
						</div>
						<div class="table-container-body fix-height-scroll450" style="overflow: overlay;"> <!-- fix-height-scroll230, background: #fff; -->
							<table class="table table-striped table-hover table-condensed table-bordered">
								<tbody>
									<tr ng-repeat="info in searchDonorList | filter:searchKeyword">
										<td class="width10">{{info.donorNumber}}</td>
										<td class="width10">{{info.donorName}}</td>
										<td class="width6">{{info.bloodGroup}}</td>
										<td class="width6">{{info.gender}}</td>
										<td class="width6">{{info.screeningResultStatus}}</td>
										<td class="width6">{{info.deferralDays}}</td>
										<!-- <td class="width6 text-center">
											<label class="switch vertical-middle"> 
											<input type="checkbox" ng-model="info.status" ng-true-value="'A'" ng-false-value="'I'"
														ng-change="updateStatus(info.patientTypeId,info.status)">
											<div class="slider round"></div>
										</label>
										</td> -->
										
										<td class="width5 text-center" ng-click="getDonorDetails(info)" ><span style="cursor: pointer">Details</span ></td>
										<!-- <td class="width5 text-center">
											<a href="#/donorScreening" class="cursor-pointer" title="Details" ng-click="getDonorDetails(info)">Details</a>
										</td> -->
									</tr>
								</tbody>
							</table>
						</div>
						<!-- <div class="table-container-footer">
							<table
								class="table table-striped table-hover table-condensed table-bordered">
								<tfoot>
									<tr>
										<td>No Record Found !!!</td>
									</tr>
								</tfoot>
							</table>
						</div> -->
					</div>
				</div> 
	</div>
</div>

<script src="resources/assets/js/common/page-height.js"></script>
<script>
$(document).ready(function() {  
	// $(".patienttSearchResult").hide();
	 $(".selectedPageName").text("Donor Screening Worklist");
	$(".sidebar-nav li").each(function() {
		$(this).find("a").parents("li").removeClass("active");
	});
	$('a[href$="donorScreeningWorklist"]').parents("li").addClass("active");
});
</script>
