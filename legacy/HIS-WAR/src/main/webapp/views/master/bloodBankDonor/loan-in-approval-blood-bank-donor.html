<!-- Page Content -->
<div id="page-content-wrapper">
	<div class="container-fluid his-style">
		<div class="row padding-left-right-set0">
			<div class="">
				<fieldset class="">
					<!-- <legend class="heading-div">Donor Search</legend> -->
					<form class="ng-pristine ng-valid">
						<div class="row divOtherRegistrationType">
							<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
								<div class="row input-container">
									<div class="col-lg-1 col-sm-2 col-md-2 polymer-icon">
										<i class="fa fa-calendar" aria-hidden="true"></i>
									</div>
									<div class="col-lg-11 col-sm-10 col-md-10">
										<div class="form-group">
											 <input type="text" autocomplete="off" class="text-input floating-label dirty"
											name="fromDatepicker" id="fromDatepicker"
										    uib-datepicker-popup="dd/MM/yyyy" ui-mask="99/99/9999"
											placeholder="DD/MM/YYYY" ng-model="searchObj.fromDate"
											model-view-value="true" is-open="fromDatepicker.opened"
											datepicker-options="dateOptions" show-button-bar="false"
											ng-click="openFromDatePicker()"  required>
											<label for="description" class=""> Date (From) </label>
										</div>
									</div>
								</div>
							</div>
							<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
								<div class="row input-container">
									<div class="col-lg-1 col-sm-2 col-md-2 polymer-icon ">
										<i class="fa fa-calendar" aria-hidden="true"></i>
									</div>
									<div class="col-lg-11 col-sm-10 col-md-10">
										<div class="">
											<input type="text" autocomplete="off" class="text-input floating-label dirty"
											name="toDatepicker" id="toDatepicker"
										    uib-datepicker-popup="dd/MM/yyyy" ui-mask="99/99/9999"
											placeholder="DD/MM/YYYY" ng-model="searchObj.toDate"
											model-view-value="true" is-open="toDatepicker.opened"
											datepicker-options="dateOptions" show-button-bar="false"
											ng-click="openToDatePicker()"  required>
											<label for="description" class=""> Date-Till </label>
										</div>
									</div>
								</div>
							</div>
							<!-- <div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">

										<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
									</div>
									<div class="col-lg-11 col-sm-10 col-md-10">
										<div class="">
											<input type="text" autocomplete="off" class="text-input floating-label dirty" ng-model="searchObj.bloodBagNo">
											<label>Blood Bag No.</label>
										</div>
									</div>
								</div>
							</div> -->
							<!-- <div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
								<div class="row input-container test-master-sample">
									<div class="col-lg-1 col-sm-2 col-md-2 polymer-icon ">
										<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
									</div>
									<div class="col-lg-11 col-sm-10 col-md-10">
										<div class="">
											<select class="text-input floating-label dirty">
												<option value="Select Identification"></option>
												<option value=""></option>
											</select> <label class="long-text-overflow">Status(n)</label>
										</div>
									</div>
								</div>
							</div> -->
							<div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4  padding-top10 text-width-auto"><!-- float_right -->
								<div class="width-div-for-patient-reg ">
									<a  class="btn btn-primary btn-save-box-shadow" title="Search">
										<i class="fa fa-search" style="font-size: 16px !important;" aria-hidden="true" ng-click="searchDetails();"></i>
									</a>
								</div>
							</div>
						</div>
					</form>
				</fieldset>
				</div>
				</div>
				<div class="row padding-top5">
					<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 float_right margin-top-5">
						<input type="text" autocomplete="off" class="text-search-box dirty" placeholder="Search" style="margin-top: 0px" ng-model="searchKeyword">
						<i class="fa fa-search common-search-text-icon" aria-hidden="true"></i>
					</div>
				</div>
				<div class="row padding-left-right-set4 table-container padding-top10">
					<div class="table-container">
						<div class="table-container-header">
							<table
								class="table table-striped table-hover table-condensed table-bordered">
								<thead>
									<tr>
										<th class="width8">Loan In Date</th>
										<th class="width8">Loan In No</th>
									<!-- 	<th class="width8">Blood Bank Name</th> -->
										<th class="width8">User Name</th>
									 	<th class="width8">Status(n)</th> 
										<th class="width5">Action taken</th>
									</tr>
								</thead>
							</table>
						</div>
						<div class="table-container-body fix-height-scroll450" style="overflow: overlay;"> <!-- fix-height-scroll230, background: #fff; -->
							<table class="table table-striped table-hover table-condensed table-bordered">
								<tbody>
									<tr ng-repeat="info in searchList | filter:searchKeyword">
										<td class="width8">{{info.createdDate}}</td>
										<td class="width8">{{info.loanInNumber}}</td>
									<!-- 	<td class="width8">{{info.bloodBank}}</td> -->
										<td class="width8">{{info.donorNumber}}</td>
										 <td class="width8">Pending</td> 
										<!-- <td class="width8">
											<a class="cursor-pointer" href="#/detailsLoanInBloodBank">Details</a>
										</td> -->
										<td class="width5 text-center" ng-click="getLoanInDetails(info)" ><span style="cursor: pointer">Details</span ></td>
									</tr>
								</tbody>
							</table>
						</div>
						<!-- <div class="table-container-footer">
							<table

<!-- *************************** cancel Modal start *********************************** -->
<div id="CanellationModal" class="modal fade ng-scope in common-small-popup" role="dialog" style="background: rgba(0, 0, 0, 0.33); z-index: 1300 !important;">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<div class="modal-title patient-details-row">
					Cancellation
					<button type="button" class="close" data-dismiss="modal">&times;</button>
				</div>
			</div>
			<div class="modal-body">
				<div class="row">
					<div class="col-md-12 padding-left-right-set">
						<div class="row input-container margin-top10">
							<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
								<i class="fa fa-sticky-note-o" aria-hidden="true"></i>
							</div>
							<div class="col-lg-11 col-sm-11 col-md-11 ">
								<div class="">
									<select class="text-input floating-label dirty" >
										<option></option>
									</select>
									<label >Select Reasons</label>
								</div>
							</div>
						</div>
						<div class="row input-container margin-top10">
							<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
								<i class="fa fa-sticky-note" aria-hidden="true"></i>
							</div>
							<div class="col-lg-11 col-sm-11 col-md-11 ">
								<div class="">
									<textarea name="code" rows="4" maxlength="100" class="text-input floating-label"></textarea>
									<label>Note</label>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div class="modal-footer" style="border:none;">
				<button type="button" class="btn btn-primary" >Save</button>
			</div>
		</div>
	</div>
</div>
<!-- *************************** cancel Modal end *********************************** -->
