<!-- Page Content -->
<div id="page-content-wrapper">
	<div class="container-fluid his-style">
		<div class="row padding-left-right-set0">
			<div class="">
				<fieldset class="">
					<!-- <legend class="heading-div">Donor Search</legend> -->
					<form class="ng-pristine ng-valid">
						<div class="row divOtherRegistrationType">
							<div
								class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
								<div class="row input-container">
									<div class="col-lg-1 col-sm-2 col-md-2 polymer-icon">
										<i class="fa fa-calendar" aria-hidden="true"></i>
									</div>
									<div class="col-lg-11 col-sm-10 col-md-10">
										<div class="form-group">
											<input type="text" autocomplete="off" class="text-input floating-label dirty"
											name="fromDatepicker" id="fromDatepicker"
										    uib-datepicker-popup="dd/MM/yyyy" ui-mask="99/99/9999"
											placeholder="DD/MM/YYYY" ng-model="comObj.fromDate"
											model-view-value="true" is-open="fromDatepicker.opened"
											datepicker-options="dateOptions" show-button-bar="false"
											ng-click="openFromDatePicker()"  required>
											<label class="long-text-overflow">Date (From)</label>
										</div>
									</div>
								</div>
							</div>
							<div
								class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
								<div class="row input-container">
									<div class="col-lg-1 col-sm-2 col-md-2 polymer-icon ">
										<i class="fa fa-calendar" aria-hidden="true"></i>
									</div>
									<div class="col-lg-11 col-sm-10 col-md-10">
										<div class="">
											<input type="text" autocomplete="off" class="text-input floating-label dirty"
											name="toDatepicker" id="toDatepicker"
										    uib-datepicker-popup="dd/MM/yyyy" ui-mask="99/99/9999"
											placeholder="DD/MM/YYYY" ng-model="comObj.toDate"
											model-view-value="true" is-open="toDatepicker.opened"
											datepicker-options="dateOptions" show-button-bar="false"
											ng-click="openToDatePicker()"  required>
											
											<label class="long-text-overflow">Date-Till</label>
										</div>
									</div>
								</div>
							</div>
							<div
								class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
								<div class="row input-container">
									<div class="col-lg-1 col-sm-2 col-md-2 polymer-icon ">
										<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
									</div>
									<div class="col-lg-11 col-sm-10 col-md-10">
										<div class="">
											<input type="text" autocomplete="off" class="text-input floating-label dirty" ng-model="comObj.bloodBagNo">
											<label class="long-text-overflow" >Blood Bag No.</label>
										</div>
									</div>
								</div>
							</div>
							<!-- <div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
								<div class="row input-container test-master-sample">
									<div class="col-lg-1 col-sm-2 col-md-2 polymer-icon ">
										<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
									</div>
									<div class="col-lg-11 col-sm-10 col-md-10">
										<div class="">
											<select class="text-input floating-label dirty">
												<option value="Select Identification"></option>
												<option value=""></option>
											</select> <label class="long-text-overflow">Status(n)</label>
										</div>
									</div>
								</div>
							</div> -->
							<div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right padding-top10 text-width-auto">
								<div class="width-div-for-patient-reg ">
									<a href="" class="btn btn-primary btn-save-box-shadow" title="Search" ng-click="searchDetails();">
										<i class="fa fa-search" style="font-size: 21px" aria-hidden="true"></i>
									</a>
								</div>
							</div>
						</div>
					</form>
				</fieldset>
				</div>
				</div>
				<div class="row padding-top5">
					<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 float_right margin-top-5">
						<input type="text" autocomplete="off"
							class="text-search-box dirty ng-pristine ng-untouched ng-valid ng-empty"
							placeholder="Search" style="margin-top: 0px" ng-model="searchKeyword"> <i
							class="fa fa-search common-search-text-icon" aria-hidden="true"></i>
					</div>
				</div>
				<div class="row padding-left-right-set4 table-container padding-top10">
					<div class="table-container">
						<div class="table-container-header">
							<table
								class="table table-striped table-hover table-condensed table-bordered">
								<thead>
									<tr>
										<th class="width10">Donor Id</th>
										<th class="width10">Blood Bag No.</th>
										<th class="width10">Collection Date</th>
										<th class="width10">Status(n)</th>
										<th class="width5 text-center">Action taken</th>
									</tr>
								</thead>
							</table>
						</div>
						<div class="table-container-body fix-height-scroll450" style="overflow: overlay;"> <!-- fix-height-scroll230, background: #fff; -->
							<table class="table table-striped table-hover table-condensed table-bordered">
								<tbody>
									<tr ng-repeat="data in searchList | filter:searchKeyword ">
										<td class="width10">{{data.donorNumber}}</td>
										<td class="width10">{{data.bloodBagNo}}</td>
										<td class="width10">{{data.collectionDate}}</td>
										<td class="width10">{{data.tTDStatusName}}</td>
										<td class="width5 text-center"><a href="" class="cursor-pointer" title="Details" ng-click="goToDetails(data);">Details</a></td>
									</tr>
								</tbody>
							</table>
						</div>
						<!-- <div class="table-container-footer">
							<table
								class="table table-striped table-hover table-condensed table-bordered">
								<tfoot>
									<tr>
										<td></td>
									</tr>
								</tfoot>
							</table>
						</div> -->
					</div>
				</div>
				
				
	</div>
</div>

<script src="resources/assets/js/common/page-height.js"></script>
<script>

$(document).ready(function() {  
	// $(".patienttSearchResult").hide();
	 $(".selectedPageName").text("Red Cell Grouping Worklist");
	$(".sidebar-nav li").each(function() {
		$(this).find("a").parents("li").removeClass("active");
	});
	$('a[href$="redCellGroupingWorklist"]').parents("li").addClass("active");
});


</script>
