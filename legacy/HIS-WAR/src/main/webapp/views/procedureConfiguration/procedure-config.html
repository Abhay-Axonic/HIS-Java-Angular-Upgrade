<style>
	.table-container table td
	{
		white-space:normal !important;
	}
</style>
<div id="page-content-wrapper">
	<div class="container-fluid his-style">
			<div class="row padding-top10">
				<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<div class="">
								<select ng-model="configObj.specialityId" class="text-input floating-label dirty">
								<option value="" selected>Select Specialty</option>
								<option value="{{spec.specialityId}}" ng-value="spec.specialityId" ng-repeat="spec in specialityList">{{spec.specialityName}}</option>
								</select> <label for="">Specialty</label>
							</div>
						</div>
					</div>
				</div>
				<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<div class="">
								<input type="text" autocomplete="off" name="description" class="text-input floating-label dirty"
								 ng-model="serviceId" uib-typeahead = "psrv.serviceName + '|' +psrv.serviceCode for psrv in searchProcServices($viewValue)" 
								 typeahead-on-select="selectProcService($item, $model, $label)" />
								<label for="">Procedure</label>
							</div>
						</div>
					</div>
				</div>
				<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<div class="">
								<input type="text" autocomplete="off" name="description" id="" ng-model="configObj.cptCode" class="text-input floating-label"> 
								<label for="description" class="">CPT Code</label>
							</div>
						</div>
					</div>
				</div>
				<!-- <div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<div class="">
							<select ng-model="configObj.procedureTypeId" class="text-input floating-label">
								<option value="" selected>Select Procedure Type</option>
								<option value="{{prcType.procedureTypeId}}" ng-value="prcType.procedureTypeId" ng-repeat="prcType in procedureTypes">{{prcType.procedureTypeName}}</option>
							</select>
							<label for="">Procedure Type</label>
							</div>
						</div>
					</div>
				</div> -->
				<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<div class="">
								<input type="text" autocomplete="off" name="description" id=""  ng-model="configObj.cptDescription" class="text-input floating-label"> 
								<label for="description" class="">Description</label>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div class="row padding-top8">
				<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
					<div class="row input-container">
						<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
							<i class="fa fa-stop-circle-o" aria-hidden="true"></i>
						</div>
						<div class="col-lg-11 col-sm-11 col-md-11">
							<div class="">
								<input type="text" autocomplete="off" name="description" id="" ng-model="configObj.procedureDuration" numbers-only  class="text-input floating-label"> 
								<label for="description" class="">Approx. Duration(in minutes)</label>
							</div>
						</div>
					</div>
				</div>
			<!-- 	<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set padding-top5">
					<label class="checkbox-inline"><input type="checkbox" value="">Is Pacs Required</label>
				</div> -->
				<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 text-width-auto pull-right">
					<div class="">
						<a href="" data-toggle="modal" data-target="#patientInstructionModal">
							<input type="button" value="Patient Instruction" class="btn btn-primary btn-save-box-shadow">
						</a>
					</div>
				</div>
			</div>
			<div class="row padding-top5">
				<div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
					<div class=" ">
					 <a href="" class="btn btn-primary btn-save-box-shadow" title="Save" data-toggle="modal" ng-click="save()"
										ng-if="saveBtnFlag"> <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
										
						<a href="" class="btn btn-primary btn-save-box-shadow" title="Update" data-toggle="modal" ng-click="update()"
										ng-if="updateBtnFlag"> <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
					</div>
				</div>
				<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 float_right">
					<input type="text" autocomplete="off" class="text-search-box dirty" placeholder="Search" style="margin-top:0px">
					<i class="fa fa-search common-search-text-icon" aria-hidden="true"></i>
				</div>
			</div>
			<div class="row padding-left-right-set4 table-container padding-top5">
				<div class="table-container">
					<div class="table-container-header">
						<table class="table table-striped table-hover table-condensed table-bordered">
							<thead>
								<tr>
									<th class="width6">Specialty</th>
									<th class="width6">Procedure</th>
									<th class="width6">CPT Code</th>
									<th class="width10">Description</th>
									<th class="width7">Approx. Duration (in min)</th>
								<!-- 	<th class="width6">Is Pacs Required</th> -->
									<th class="width2"></th>
									<th class="width4 text-center">Action</th>
								</tr>
							</thead>
						</table>
					</div>
					<div class="table-container-body fix-height-scroll500" style="overflow: overlay;"> <!-- fix-height-scroll230, background: #fff; -->
						<table
							class="table table-striped table-hover table-condensed table-bordered">
							<tbody>
								<tr ng-repeat="info in diagnosticProcConfigList|orderBy:column:reverse|filter:searchKeyword" >
									<td class="width6">{{info.specialityName}}</td>
									<td class="width6">{{info.serviceName}}</td>
									<td class="width6">{{info.cptCode}}</td>
									<td class="width10">{{info.cptDescription}}</td>
									<td class="width7">{{info.procedureDuration}}</td>
							<!-- 		<td class="width6">{{info.patientInstruction}}</td> -->
									<td class="width2 text-center">
										<a class="cursor-pointer" data-toggle="modal" data-target="#patientInstructionModal" ng-click="getSavePatientInstruction(info);"><i class="fa fa-info-circle"></i></a>
									</td>
									<td class="width4 text-center"> 
								             <a class="cursor-pointer"><i class="fa fa-pencil" aria-hidden="true" ng-click="showUpdateBtn(info.diagnosticProcedureConfigId)" ></i></a>
							        </td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
			
			
		</div>
	</div>
<!-- patientInstructionModal START -->
<div id="patientInstructionModal" class="modal fade ng-scope in common-large-modal" role="dialog" data-keyboard="false" data-backdrop="static">
	<div class="modal-dialog"> <!-- width: 25% !important;margin: 200px 0 0 510px !important; -->
		<div class="modal-content">
			<div class="modal-header padding-zero" style="padding:0px;">
				<div class="modal-title patient-details-row">
					Patient Instruction
					<button type="button" class="close" data-dismiss="modal">&times;</button>
				</div>
			</div>
			<div class="modal-body">
				<div class="row">
					<div class="row margin-top0">
						<div id="formeo-editor"></div>
						<div id="myHtml" class="render-form" style="display: none"></div>
					</div>
					<div class="col-lg-12 col-md-12">
						<textarea name="editor" type="text" autocomplete="off" id="editor" rows="20" cols="50"  ck-editor ng-model="configObj.patientInstruction" ></textarea>
					</div>
				</div>
			</div>
			<div class="modal-footer" style="border:none;">
				<button type="button" data-dismiss="modal" class="btn btn-primary" id="">Add</button>
				<button type="button" data-dismiss="modal" class="btn btn-primary">Cancel</button>
			</div>
		</div>
	</div>
</div>
<!-- patientInstructionModal END -->
<modal visible="showModal"></modal> 
<script src="resources/assets/js/common/page-height.js"></script>
<script type="text/javascript">
$(document).ready(function() {
  $(".selectedPageName").text("Procedure Configuration");
	$(".sidebar-nav li").each(function() {
		$(this).find("a").parents("li").removeClass("active");
	});
	$('a[href$="procedureConfig"]').parents("li").addClass("active");
});
</script>
