<!-- Page Content -->
<head>
  <style type="text/css">
    .borderRed {
      border: 2px solid #ff0000;
    }
  </style>
</head>
<div id="page-content-wrapper">
	<div class="container-fluid his-style">
		<fieldset>
			<div class="row">
				<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
          <div class="row input-container padding-top10 customRadioBtn">
            <label for="" class="font-weight700">Type :</label>
            <input ng-model="vm.model.assetType" ng-value="2" type="radio" name="FixedARadioB" id ="fixedAssetRadiobtn" ng-change="vm.model.isAssetTypeValid = false" ><!--ng-disabled="vm.model.itemId" -->
              <label for="fixedAssetRadiobtn" >Fixed Asset</label>
            <input ng-model="vm.model.assetType" ng-value="1" type="radio" name="FixedARadioB" id="consumblestRadiobtn" ng-change="vm.model.isAssetTypeValid = false">
              <label for="consumblestRadiobtn">Consumables</label>
          </div>
				</div>
				<div class="col-lg-8 col-md-8 col-sm-7"></div>
			</div>
			<div class="row table-container">
        <div class="table-container-header col-lg-12 col-md-12 padding-left-right-set4 padding-top10">
          <table class="table table-striped table-hover table-condensed table-bordered">
            <thead>
              <tr class="table-th-bg">
                <th colspan="12" class="font-weight700">Item Details</th>
              </tr>
            </thead>
          </table>
        </div>
				<div class="table-container-header col-lg-12 col-md-12 padding-left-right-set4">
					<table class="table table-striped table-hover table-condensed table-bordered">
						<thead>
							<tr>
								<th class="width3" title="Sr No">Sr No.</th>
								<th class="width12" title="Item Name">Item Name
								</th>
								<th class="width10" title="Manufacturer">Manufacturer
								</th>
								<th class="width10" title="Vendor">Vendor
								</th>								
								<th class="width10" title="Expected Price {{vm.model.Currency}}">Expected Price {{vm.model.Currency}}
								</th>
								<th class="width20"  title="Reason for Item Creation">Reason for Item Creation
									<span class="star">*</span>
								</th>
								<th class="width4" title="Action">Action</th>
							</tr>
						</thead>
          </table>
        </div>
        <div class="table-container-body col-lg-12 col-md-12 padding-left-right-set4 fix-height-scroll400" style="overflow: overlay;">
          <table class="table table-striped table-hover table-condensed table-bordered">
						<tbody>
							<tr ng-repeat="item in vm.model.items">
								<td class="width3">{{$index + 1}}</td>
								<td class="width12">
									<input type="text" autocomplete="off" ng-model="item.itemName" ng-blur="vm.model.ValidateItemName(item, $index)" class="select-box" ng-change="vm.model.isItemNameValid[$index] = false" ng-class="{borderRed: vm.model.isItemNameValid[$index]}" />
								</td>
								<td class="width10">
                  					<input type="text" autocomplete="off" ng-model="item.manufacturer" class="select-box" ng-blur="vm.model.ValidateManufacture(item, $index)" uib-typeahead="manufacturerNames.detail for manufacturerNames in vm.model.SearchManufacturer($viewValue)" typeahead-on-select="vm.model.AddManufacturer($item, item); vm.model.manufacturerSearch = '';" ng-change="vm.model.isManufacturerValid[$index] = false" ng-class="{borderRed: vm.model.isManufacturerValid[$index]}">
								</td>
								<td class="width10">
                  					<input type="text" autocomplete="off" ng-model="item.vendorName" class="select-box" ng-blur="vm.model.ValidateVendorName(item, $index)" uib-typeahead="vendorNames.detail for vendorNames in vm.model.SearchVendorNames($viewValue)" typeahead-on-select="vm.model.AddVendorName($item, item); vm.model.vendorSearch = '';" ng-change="vm.model.isVendorValid[$index] = false" ng-class="{borderRed: vm.model.isVendorValid[$index]}">
								</td>
								<td class="width10">
									<input type="text" class="select-box" ng-model="item.expectedPrice" ng-change="vm.model.isPriceValid[$index] = false" ng-class="{borderRed: vm.model.isPriceValid[$index]}" ng-blur="vm.model.SetDecimal(item, $index)" allow-decimal-numbers />
								</td>
								<td class="width20">
									<input type="text" autocomplete="off" ng-model="item.reasonForItemCreation" ng-blur="vm.model.ValidateManufacture(item, $index)" ng-change="vm.model.isReasonValid[$index] = false" ng-class="{borderRed: vm.model.isReasonValid[$index]}" class="select-box" maxlength="100" />
								</td>
								<td class="width4" style="width: 3.8% !important">
									<span>
										<input type="button" ng-click="vm.model.AddDuplicateRow($index)" value="+" class="btn btn-info add-dynamic-row note-width">
										<!-- ng-class="{disabled: !vm.model.isEnabled}" -->
									</span>
									<span>
										 <input type="button" ng-click="vm.model.RemoveRowData($index)" value="-" class="btn btn-info add-dynamic-row note-width" ng-if="$index !== 0"> 
										
										<!-- <input type="button" ng-click="vm.model.RemoveRowData($index)" value="-" class="btn btn-info add-dynamic-row note-width">
										<input type="button" value="-" ng-if="vm.model.walkInSale.items.length > 1"ng-click="vm.model.RemoveRowData($index)";
											class="btn btn-info add-dynamic-row note-width"> -->
									</span>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</fieldset>
		<footer class="col-lg-12 col-md-12 col-sm-12 padding-left-right-set4 padding-right20" style="padding-right: 40px !important;">
					<div class="row padding-top5 margin-top10 padding-right20">
			<div class="col-lg-10 col-md-10"></div>
			<div class="col-lg-1 col-md-1 padding-left-right-set4">
				<a href="" ng-click="vm.model.SavePurchaseRequest()" ng-class="{disabled: !vm.model.isEnabled}">
					<input type="button" value="Save" class="btn btn-primary btn-save-box-shadow">
				</a>
			</div>
			<div class="col-lg-1 col-md-1 padding-left-right-set4">
				<a href="" ng-click="vm.model.NavigateToItemRequest()">
					<input type="button" value="Back" class="btn btn-primary btn-save-box-shadow">
				</a>
			</div>
		</div>
				</footer>
	</div>
</div>
<!-- item remove  -->
<div id="confirmRemove" class="modal fade ng-scope in" role="dialog" data-backdrop="static">
  <div class="modal-dialog" style="width: 560px !important; margin: 80px auto !important;">
    <div class="modal-content">
      <div class="modal-header" style="padding: 0px!important;">
        <div class="modal-title patient-details-row">
          Confirm
          <button type="button" class="close" data-dismiss="modal">&times;</button>
        </div>
      </div>
      <div class="modal-body">
        <div class="margin-left10"><span>Are you sure you want to remove item?</span></div>
      </div>
      <div class="modal-footer" style="border:none;">
        <button type="button" class="btn btn-primary" ng-click="vm.model.ConfirmRemove()" id="okBtn">Ok</button>
        <button type="button" data-dismiss="modal" class="btn btn-primary" id="cancelBtn">Cancel</button>
      </div>
    </div>
  </div>
</div>

<script src="resources/assets/js/common/page-height.js"></script>
<script type="text/javascript">
$( document ).ready(function() {
	$(".selectedPageName").text("Item Request");
})
</script>
