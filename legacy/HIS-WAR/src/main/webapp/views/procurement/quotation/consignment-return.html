<div id="page-content-wrapper">
    <div class="container-fluid his-style">
        <fieldset>
            <div class="row margin-top10">
                <div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
                    <div class="row input-container">
                        <div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
                            <i class="fa fa-calendar-plus-o" aria-hidden="true"></i>
                        </div>
                        <div class="col-lg-11 col-sm-11 col-md-11">
                            <input type="text" autocomplete="off" class="text-input floating-label dirty" uib-datepicker-popup="dd/MM/yyyy"
                                placeholder="DD/MM/YYYY" ng-model="vm.model.fromDate" model-view-value="true"
                                is-open="vm.model.fromDateOpened" datepicker-options="vm.model.fromDateOptions"
                                show-button-bar="false" ng-click="vm.model.OpenFromDate()" readonly="">
                            <label for="fromDate">Date (From)</label>
                        </div>
                    </div>
                </div>
                <div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10">
                    <div class="row input-container">
                        <div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
                            <i class="fa fa-calendar-minus-o" aria-hidden="true"></i>
                        </div>
                        <div class="col-lg-11 col-sm-11 col-md-11">
                            <input type="text" autocomplete="off" ng-model="vm.model.toDate" class="text-input floating-label dirty"
                                uib-datepicker-popup="dd/MM/yyyy" placeholder="DD/MM/YYYY" model-view-value="true"
                                is-open="vm.model.toDateOpened" datepicker-options="vm.model.toDateOptions"
                                show-button-bar="false" ng-click="vm.model.OpenToDate()" readonly="">
                            <label for="toDate" class="LISDynamicLabel">Date-Till</label>
                        </div>
                    </div>
                </div>
                <div class="col-lg-2 col-md-2 col-sm-4 padding-left-right-set4 padding-top10">
                    <div class="row input-container">
                        <div class="col-lg-2 col-sm-2 col-md-2 polymer-icon ">
                            <i class="fa fa-building-o" aria-hidden="true"></i>
                        </div>
                        <div class="col-lg-10 col-sm-10 col-md-10" style="padding-top: 2px;">
                            <select ng-model="vm.model.store" class="text-input floating-label dirty"
                                data-ng-options="store.store for store in vm.model.storeList">
                            </select>
                            <label for="store" class="LISDynamicLabel">GRN Store</label>
                        </div>
                    </div>
                </div>
                <div class="col-lg-2 col-md-2 col-sm-4 padding-left-right-set4 padding-top10" style="width: 13%;">
                    <div class="row input-container">
                        <div class="col-lg-2 col-sm-2 col-md-2 polymer-icon ">
                            <i class="fa fa-dot-circle-o" aria-hidden="true"></i>
                        </div>
                        <div class="col-lg-10 col-sm-10 col-md-10 ">
                            <input type="text" autocomplete="off" ng-model="vm.model.vendorName" class="text-input floating-label" uib-typeahead="vendorNames.detail for vendorNames in vm.model.SearchVendorNames($viewValue)" typeahead-on-select="vm.model.AddVendorName($item); vm.model.search = '';">
                            <label for="vendorName">Vendor</label>
                        </div>
                    </div>
                </div>
                <div class="col-lg-2 col-md-2 col-sm-4 padding-left-right-set4 padding-top10">
                    <div class="row input-container">
                        <div class="col-lg-2 col-sm-2 col-md-2 polymer-icon ">
                            <i class="fa fa-dot-circle-o" aria-hidden="true"></i>
                        </div>
                        <div class="col-lg-10 col-sm-10 col-md-10" style="padding-top: 2px;">
                            <select ng-model="vm.model.grnType" class="text-input floating-label"
                                data-ng-options="type.type for type in vm.model.assetTypes"></select>
                            <label for="grnType" class="LISDynamicLabel">GRN Type</label>
                        </div>
                    </div>
                </div>
                <div class="col-lg-2 col-md-2 col-sm-4 padding-left-right-set4 padding-top10">
                    <div class="row input-container">
                        <div class="col-lg-2 col-sm-2 col-md-2 polymer-icon">
                            <i class="fa fa-dot-circle-o" aria-hidden="true"></i>
                        </div>
                        <div class="col-lg-10 col-sm-10 col-md-10" style="padding-top: 2px;">
                            <select ng-model="vm.model.status" class="text-input floating-label dirty"
                                data-ng-options="status.status for status in vm.model.statuses">
                            </select>
                            <label for="status" class="LISDynamicLabel">GRN Status</label>
                        </div>
                    </div>
                </div>
                <div class="col-lg-1 col-md-1 col-sm-1 padding-left-right-set4 text-width-auto padding-top10">
                    <div class="common-save-button" style="padding-top: 0px;">
                        <a href="" ng-click="vm.model.GetConsignmentStockList()" id="searchBtn"
                            class="btn btn-primary btn-save-box-shadow" style="width: auto;">
                            <i class="fa fa-search" aria-hidden="true"></i>
                        </a>
                    </div>
                </div>
            </div>
            <div class="row margin-top4">
                <div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
                    <div class="search ">
                        <label class="show-entries">Show
                            <select ng-init="vm.model.pagination.pageSize='10'" ng-model="vm.model.pagination.pageSize"
                                ng-change="vm.model.pagination.setTotalPages(vm.model.pagination)"
                                class="search-popUp-ddl">
                                <option value="10">10</option>
                                <option value="25">25</option>
                                <option value="50">50</option>
                                <option value="100">100</option>
                            </select> (records)
                        </label>
                    </div>
                </div>
                <div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 text-width-auto float_right">
                    <!-- <a href="" ng-click="vm.model.OpenPopup('Update', 'confirmSave', {})" class="btn btn-primary btn-save-box-shadow" title="Save">
                        <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i>
                    </a> -->
                    <a href="" ng-click="vm.model.SaveConsignmentStockList()" data-ng-class="{disabled:saveBtnDisabled==true}" class="btn btn-primary btn-save-box-shadow" title="Save">
                        <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i>
                    </a>
                </div>
                <div class="col-md-2 col-sm-2 padding-left-right-set4 text-width-auto float_right">
                    <a href="#/addNewConsignmentReturn">
                    <input type="button" value="Add New" class="btn btn-primary btn-save-box-shadow">
                    </a>
                </div>
                <div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4 float_right">
                    <input type="text" autocomplete="off" class="text-search-box" ng-model="vm.model.pagination.search" placeholder="Search"
                    ng-change="vm.model.pagination.searchData(vm.model.consignmentReturnList, vm.model.pagination)" style="margin-top: 0px"> 
                    <i class="fa fa-search common-search-text-icon" style="left:12px;top: 9px;" aria-hidden="true"></i>
                </div>
            </div>
        </fieldset>
        <div class="row padding-left-right-set4 padding-top4">
            <div class="col-md-12 col-lg-12 col-sm-8 padding-left-right-set0">
                <fieldset>
                    <div class="row table-container">
                        <div class="table-container-header">
                            <table class="table table-striped table-hover table-condensed table-bordered first-checkBox-padding">
                                <thead>
                                    <tr>
                                        <th class="width2">
                                            <input type="checkbox" ng-model="vm.model.selectAllRows" ng-click="vm.model.SelectAllCRItems(item)">
                                        </th>
                                        <th class="width5">
                                            Return No.
                                            <div class="float_right" ng-click="vm.model.pagination.sortBy(vm.model.pagination, 'returnNo', sortReverse = !sortReverse)">
                                                <div>
                                                    <i class="fa fa-caret-up" aria-hidden="true"></i>
                                                </div>
                                                <div class="margin-top-8">
                                                    <i class="fa fa-caret-down" aria-hidden="true"></i>
                                                </div>
                                            </div>
                                        </th>
                                        <th class="width5">
                                            GRN Store
                                            <div class="float_right" ng-click="vm.model.pagination.sortBy(vm.model.pagination, 'grnStore', sortReverse = !sortReverse)">
                                                <div>
                                                    <i class="fa fa-caret-up" aria-hidden="true"></i>
                                                </div>
                                                <div class="margin-top-8">
                                                    <i class="fa fa-caret-down" aria-hidden="true"></i>
                                                </div>
                                            </div>
                                        </th>
                                        <th class="width5">
                                            GRN Type
                                            <div class="float_right" ng-click="vm.model.pagination.sortBy(vm.model.pagination, 'assetType', sortReverse = !sortReverse)">
                                                <div>
                                                    <i class="fa fa-caret-up" aria-hidden="true"></i>
                                                </div>
                                                <div class="margin-top-8">
                                                    <i class="fa fa-caret-down" aria-hidden="true"></i>
                                                </div>
                                            </div>
                                        </th>
                                        <th class="width5">
                                            Vendor Name
                                            <div class="float_right" ng-click="vm.model.pagination.sortBy(vm.model.pagination, 'vendorName', sortReverse = !sortReverse)">
                                                <div>
                                                    <i class="fa fa-caret-up" aria-hidden="true"></i>
                                                </div>
                                                <div class="margin-top-8">
                                                    <i class="fa fa-caret-down" aria-hidden="true"></i>
                                                </div>
                                            </div>
                                        </th>
                                        
                                        <th class="width5">
                                            status(n)
                                            <div class="float_right" ng-click="vm.model.pagination.sortBy(vm.model.pagination, 'grnstatus', sortReverse = !sortReverse)">
                                                <div>
                                                    <i class="fa fa-caret-up" aria-hidden="true"></i>
                                                </div>
                                                <div class="margin-top-8">
                                                    <i class="fa fa-caret-down" aria-hidden="true"></i>
                                                </div>
                                            </div>
                                        </th>
                                        
                                        <th class="width5">
                                            GRN Status
                                            <div class="float_right" ng-click="vm.model.pagination.sortBy(vm.model.pagination, 'grnstatus', sortReverse = !sortReverse)">
                                                <div>
                                                    <i class="fa fa-caret-up" aria-hidden="true"></i>
                                                </div>
                                                <div class="margin-top-8">
                                                    <i class="fa fa-caret-down" aria-hidden="true"></i>
                                                </div>
                                            </div>
                                        </th>
                                        <th class="width5 vertical-middle text-center">Action taken</th>
                                    </tr>
                                </thead>
                            </table>
                        </div>
                        <div class="table-container-body" style="height:400px; overflow-y: scroll;">
                            <table class="table table-striped table-hover table-condensed table-bordered">
                                <tbody>
                                    <tr ng-repeat="item in vm.model.pagination.data" data-ng-class="{'disable': item.statusId == 4, 'cursorDisabled':item.statusId == 4}">
                                        <td class="width2">
                                            <input type="checkbox" ng-model="item.isSelected" ng-click="vm.model.SelectCRItem(item)" ng-disabled="item.statusId == 4">
                                        </td>
                                        <td class="width5" title="{{item.crNo}}">{{item.crNo}}</td>
                                        <td class="width5" title="{{item.storeName}}">{{item.storeName}}</td>
                                        <td class="width5" title="{{item.assetType}}">{{item.assetType}}</td>
                                        <td class="width5" title="{{item.vendorName}}">{{item.vendorName}}</td>
                                        <td class="width5" title="{{item.status}}">{{item.status}}</td>
                                        <td class="width5" title="{{item.status}}">{{item.grnStatus}}</td>
                                        <td class="width5 text-center" style="width: 4.75% !important;">
                                            <a class="cursor-pointer" ng-click="vm.model.NavigateToDetails(item)" href="" >Details</a>
                                            <!-- <a class="cursor-pointer" href="" ng-if="item.statusId == 4">Details</a> -->
                                        </td>
                                    </tr>
                                    <tr ng-if="!vm.model.pagination.data">
                                        <td class="text-center">
                                            <p>No Record Found</p>
                                        </td>
                                    </tr> 
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="row margin-bottom45 center-block">
                        <ul ng-if="vm.model.pagination.totalPages > 1" class="pagination table-list" style="font-size: 14px; cursor: pointer;">
                            <li ng-class="{disabled:vm.model.pagination.currentPage === 1}"><a
                                ng-click="vm.model.pagination.setFirstPage(vm.model.pagination)">First</a>
                            </li>
                            <li ng-class="{disabled:vm.model.pagination.currentPage === 1}"><a
                                ng-click="vm.model.pagination.setPreviousPage(vm.model.pagination)">Previous</a>
                            </li>
                            <li ng-repeat="page in vm.model.pagination.getPagesList(vm.model.pagination)"
                                ng-class="{active:vm.model.pagination.currentPage === page}"><a
                                ng-click="vm.model.pagination.setPage(page, vm.model.pagination)">{{page}}</a>
                            </li>
                            <li ng-class="{disabled:vm.model.pagination.currentPage === vm.model.pagination.totalPages}">
                                <a ng-click="vm.model.pagination.setNextPage(vm.model.pagination)">Next</a>
                            </li>
                            <li ng-class="{disabled:vm.model.pagination.currentPage === vm.model.pagination.totalPages}">
                                <a ng-click="vm.model.pagination.setLastPage(vm.model.pagination)">Last</a>
                            </li>
                        </ul>
                    </div>
                </fieldset>
            </div>
        </div>
    </div>
</div>
<div ng-include="'./views/common/qty-accept-reject.html'" class="ng-scope" style=""></div>
<script type="text/javascript">
    $(document).ready(function () {
        $(".rejection-details-row1").hide();
        $("#assetTableId").hide();
        $(".selectedPageName").text("Consignment Return");
        $(".sidebar-nav li").each(function () {
            $(this).find("a").parents("li").removeClass("active");
        });

        $(".selectedServicesList").hide();
        /*************************** rejection radio button function*********************************/
        $(".add-new-item-row").hide();
        $(".get-request-row").hide();
        $(".addNewItemRadioBtnClass").change(function () {
            if ($(this).is(":checked")) {
                $(".add-new-item-row").show('slow');
                $(".get-request-row").hide('slow');
            }
        });
        $(".getRequestListBtnClass").change(function () {
            if ($(this).is(":checked")) {
                $(".add-new-item-row").hide('slow');
                $(".get-request-row").show('slow');
            }
        });

    });
    /*************************** add button function start*********************************/
    $(".table-th-bg").click(function () {
        /* alert(); */
        $(this).next().find(".selectedServicesList").toggle();
    });

    /* ************** radioRejected1 ********** */

    $(".radioRejected1").change(function () {
        if ($(this).is(":checked")) {
            $(this).closest(".row").siblings(".rejection-details-row1").show();
        }
    });
    $(".radioAcceptedHold1").change(function () {
        if ($(this).is(":checked")) {
            $(this).closest(".row").siblings(".rejection-details-row1").hide();
        }
    });
</script>
