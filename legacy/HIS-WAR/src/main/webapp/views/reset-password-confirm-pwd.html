<style>
.padding-set15px{
	padding:15px 20px !important;
}
.margin-top50{
	margin-top:50px !important;
}

<!-- Page Content -->
<!-- ******* Reset Password modal -2  start ******** -->
<!--  <div id="ResetPasswordModal_updatePassword" class="modal fade ng-scope in common-small-popup" role="dialog" style="background-color: transparent !important;">  -->
<div id="page-content-wrapper">
	<div class="container-fluid his-style">
		<fieldset>
			<div class="row padding-left-right-set4">
				<div class="col-lg-4 col-md-4 col-sm-4"></div>
				<div class="col-lg-4 col-md-4 col-sm-4 padding-left-right-set4 padding-top10">
					<form  novalidate class="margin-top50">
						<div class="row">
							<div class="row margin-top10 enter-OTP-block bg-transperant padding-set15px" >
								<div class="row ">
									<div class=" col-lg-12 col-md-12 col-sm-12 padding-left-right-set4 padding-top10 margin-top10">
										<div class="row input-container">
											<div class="col-lg-1 col-sm-2 col-md-2 polymer-icon">
												<i class="fa fa-lock" aria-hidden="true"></i>
											</div>
											<div class="col-lg-11 col-sm-10 col-md-10 ">
												<div >
												<label for="code">Existing Password</label>
													<input type="password" id="myInput" class="text-input floating-label"  name="existing_password" ng-model="existingPassword"  required>
												</div>
											</div>
										</div>
									</div>
									<div class=" col-lg-12 col-md-12 col-sm-12 padding-left-right-set4 padding-top10 margin-top10">
										<div class="row input-container">
											<div class="col-lg-1 col-sm-2 col-md-2 polymer-icon">
												<i class="fa fa-lock" aria-hidden="true"></i>
											</div>
											<div class="col-lg-11 col-sm-10 col-md-10 ">
												<div >
												<label for="code" name="password">New Password</label>
													<input type="password" id="myInput1" class="text-input floating-label"  name="new_password"  ng-model="password" required>
												</div>
											</div>
										</div>
									</div>
									<div class=" col-lg-12 col-md-12 col-sm-12 padding-left-right-set4 padding-top10 margin-top10">
										<div class="row input-container">
											<div class="col-lg-1 col-sm-2 col-md-2 polymer-icon">
												<i class="fa fa-lock" aria-hidden="true"></i>
											</div>
											<div class="col-lg-11 col-sm-10 col-md-10 ">
												<div >
												<label for="code">Confirm Password</label>
													<input type="password" id="myInput2" class="text-input floating-label" name="confirm_password" ng-model="confirmPassword" required>
													
												</div>
											</div>
										</div>
									</div>
								</div>
								<div class="row">
									
									<div class="col-lg5 col-md-5 col-sm-5  padding-top10 ">
										<input type="checkbox" onclick="myFunction()">Show Password
									</div>
									
									<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4 padding-top10" >
										<input type="button" value="Submit" class="btn btn-info" style="width:100%;" ng-click="resetPwd()" style="font-size:12px !important;">
									</div>
									<div class="col-lg-5 col-md-5 col-sm-5"></div>
								</div>
							</div>
						</div>
					</form>
				</div>
				<div class="col-lg-4 col-md-4 col-sm-4"></div>
			</div>
		</fieldset>
	</div>
</div>
<!--  </div>  -->

		<!-- ******* Reset Password -2 modal end ******** -->
<script type="text/javascript">
	$(document).ready(function() {
		/* $(".enter-OTP-block").hide();
		 $(".set-password-block ").hide(); */
		var documentHeight = $(window).height();
		var sideBarHeight = documentHeight - 55;
		$("#page-content-wrapper").css("height", sideBarHeight + "px");

		$(".selectedPageName").text("Reset Password");
		$(".sidebar-nav li").each(function() {
			$(this).find("a").parents("li").removeClass("active");
		});
		$('a[href$="resetPwd"]').parents("li").addClass("active");
		
		$("#genertaeOTPLink").click(function(){
		    $(".enter-OTP-block").show();
		    $(".generate-OTP-block").hide();
		});
		$("#submitOTPbtn").click(function(){
		    $(".set-password-block").show();
		    $(".enter-OTP-block").hide();
		});
	});
	
	function myFunction() {
		  var x = document.getElementById("myInput");
		  if (x.type === "password") {
		    x.type = "text";
		  } else {
		    x.type = "password";
		  }
		  var x = document.getElementById("myInput1");
		  if (x.type === "password") {
		    x.type = "text";
		  } else {
		    x.type = "password";
		  }
		  
		  var x = document.getElementById("myInput2");
		  if (x.type === "password") {
		    x.type = "text";
		  } else {
		    x.type = "password";
		  }
		  
		}
</script>
