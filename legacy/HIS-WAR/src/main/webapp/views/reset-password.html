<script type="text/javascript">
	$(document).ready(function() {
		$(".enter-OTP-block").hide();
		 $(".set-password-block ").hide();
		var documentHeight = $(window).height();
		var sideBarHeight = documentHeight - 55;
		$("#page-content-wrapper").css("height", sideBarHeight + "px");

		$(".selectedPageName").text("Reset Password");
		$(".sidebar-nav li").each(function() {
			$(this).find("a").parents("li").removeClass("active");
		});
		$('a[href$="resetPwd"]').parents("li").addClass("active");
		
		$("#genertaeOTPLink").click(function(){
		    $(".enter-OTP-block").show();
		    $(".generate-OTP-block").hide();
		});
		$("#submitOTPbtn").click(function(){
		    $(".set-password-block").show();
		    $(".enter-OTP-block").hide();
		});
	});
</script>
