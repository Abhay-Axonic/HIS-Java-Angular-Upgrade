<link rel="stylesheet" type="text/css" href="resources/assets/css/template/drag-drop.css"/>


<div id="page-content-wrapper">
<div class="container-fluid his-style" >
<div class="row">
</div><br>
		<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set0 float_right">
				<input type="text" autocomplete="off" class="text-search-box dirty" placeholder="Search" style="margin-top: 0px"  ng-model="searchKeyword">
				<i class="fa fa-search common-search-text-icon" aria-hidden="true"></i>
			</div>

	<div class="row col-md-12 padding-left-right-set4">
		<table class="table table-striped table-hover table-condensed table-bordered margin-top10">
							<thead>
								<tr class="">
									<th class="width8">Title
									</th>
									
									<th class="width2">Status(n)
									</th>
									
									<th class="width2 vertical-middle" title="Action">Action taken
										
									</th>
								</tr>
							</thead>
							<tbody>
								<tr ng-repeat="tmp in vm.model.listDataObject|orderBy:column:reverse|filter:{title:searchKeyword}">
									<td class="width2" >{{tmp.title}}</td>
									<td class="width2" ><label class="switch"> <input type="checkbox"
								ng-model="tmp.status" ng-true-value="'A'" ng-false-value="'I'"
								ng-change="vm.model.updateStatus(tmp.dataObjectId,tmp.status)">
									<div class="slider round"></div></label></td>
									<td class="padding-edit-button-table width2">
										 <a ng-click="vm.model.viewDataObject(tmp)">
											<i class="fa fa-file-code-o" aria-hidden="true" data-toggle="modal" data-target="#viewTemplateModal" title="Details"></i>
										</a> 
										<a ng-click="vm.model.editDataObject(tmp)">
											<i class="fa fa-pencil" aria-hidden="true" title="Edit"></i>
										</a>
										<!-- <a ng-click="vm.model.deactivateTemplate(tmp.templateId)">
											<i class="fa fa-times" aria-hidden="true" title="Deactivae"></i>
										</a> -->
									</td>
								</tr>
							</tbody>
						</table>
	</div>
</div>
</div>

<div id="viewTemplateModal" class="modal fade ng-scope in common-large-popup" style=" background-color: white;margin-left: 10%;width: 80%;height: 100%;margin-top: 4%;padding-right: 0 !important;background-color:transparent !important;position: absolute;" role="dialog">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header padding-zero">
				<div class="modal-title patient-details-row">
					Template
					<button type="button" class="close" data-dismiss="modal">&times;</button>
				</div>
			</div>
			<div class="modal-body"  style="overflow-y: scroll !important; max-height:600px; padding-bottom:15px !important;" >
				<div style="padding:4px 8px !important; background-color: white !important;">
					<div id="htmlContent" class="row" >
					</div>
				</div>
			</div>
			
		</div>
	</div>		

</div>
<script src="resources/assets/js/common/page-height.js"></script>
<script>
$(document).ready(function() {  
	 $(".selectedPageName").text("Clinical Section Summary");
	$(".sidebar-nav li").each(function() {
		$(this).find("a").parents("li").removeClass("active");
	});
	$('a[href$="templates"]').parents("li").addClass("active");
});
</script>
