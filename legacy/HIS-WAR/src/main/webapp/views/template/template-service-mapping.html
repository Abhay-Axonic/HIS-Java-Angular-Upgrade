<div ng-include="'./views/common/common-information-modal.html'"></div>

<div id="page-content-wrapper">
	<div class="container-fluid his-style">
	 <fieldset>
			<div class="row margin-top10">
			 <form name="commonform" novalidate>
					<div class="row">
						<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
							<div class="row input-container">
								<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
									<i class="fa fa-stop-circle-o" style="margin-top: 22px;" aria-hidden="true"></i>
								</div>
								<div class="col-lg-11 col-sm-11 col-md-11 ">
									<div class="form-group">
									<label for="code">Speciality</label>
										<select class="text-input floating-label" name="specialityId" ng-model="common.specialityId" ng-change="getSubSpecialityBySpeciality(common.specialityId)" convert-to-number required>
											<option ng-repeat="info in specialityList"  value="{{info.specialityId}}">{{info.specialityName}}</option>
										</select> 
									</div>
								</div>
							</div>
						</div>
						<div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
							<div class="row input-container">
								<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
									<i class="fa fa-stop-circle-o" style="margin-top: 22px;" aria-hidden="true"></i>
								</div>
								<div class="col-lg-11 col-sm-11 col-md-11 ">
									<div class="form-group">
									<label for="code">Sub-Speciality</label>
										<select class="text-input floating-label"  name="subSpecialityId" ng-model="common.subSpecialityId" ng-change="getServiceBySubSpecilatity(common.subSpecialityId)" convert-to-number required>
											<option ng-repeat="info in subSpecialityList"  value="{{info.subSpecialityId}}">{{info.subSpecialityName}}</option>
										</select>
									</div>
								</div>
							</div>
						</div>
						 <div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set4">
							<div class="row input-container">
								<div class="col-lg-1 col-sm-1 col-md-1 polymer-icon">
									<i class="fa fa-stop-circle-o" style="margin-top: 22px;" aria-hidden="true"></i>
								</div>
								<div class="col-lg-11 col-sm-11 col-md-11 ">
									<div class="form-group">
									<label for="code">Services</label>
										<!-- <select  class="text-input floating-label dirty" ng-model="common.templateId" name="templateId" convert-to-number required>
											<option value="" ng-selected="true">Please Select Service</option>
											<option ng-repeat="getTemplateTitle in templateList" ng-selected="false" value="{{getTemplateTitle.templateId}}">{{getTemplateTitle.title}}</option>
										</select> -->
										 <select  class="text-input floating-label dirty" ng-model="common.serviceId" name="serviceId" required>
											<option value="" ng-selected="true">Please Select Service</option>
											<option ng-repeat="service in serviceList" ng-selected="false" value="{{service.serviceId}}">{{service.serviceStandardName}}</option>
										</select>
										
									</div>
								</div>
							</div>
						</div>
					</div>
					<div class="row padding-top10">
						<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4"></div>
						<div class="col-lg-8 col-md-8 col-sm-8 padding-left-right-set4">
							<div class="row col-md-5set" id="">
								<div class="col-lg-5 col-md-5 col-sm-5 padding-left-right-set4">
									<div class="">
										<label class="common-lable-color-set">Templates</label>
										<div class="col-lg-12 col-md-12 col-sm-12 padding-left-right-set4" style="z-index: 9;">
												<input type="text" autocomplete="off" class="text-search-box dirty" ng-model="serachTemplate" placeholder="Search" style=" margin-top:  2px;">
												<i class="fa fa-search common-search-text-icon padding-left5 padding-top4" aria-hidden="true"></i>
										</div>
										<div class="masterborderScroll" style="width: 437px;margin-left: 3px;height: 131px !important;">
											<div class="checkbox" ng-repeat="template in templateList|filter:serachTemplate">
												<label class="common-lable-color-set">
												<input type="checkbox" ng-model="UserNursingStationMppr[template.templateId]" 
												ng-click="addNursingStation(template.templateId,template.title)" value="{{template.templateId}}">{{template.title}}</label>
											</div>
										</div>
									</div>
								</div>
								<div class="col-lg-1 col-md-1 col-sm-1 padding-left-right-set4">
									<div class="text-center margintop120">
										<button type="button" class="btn btn-primary text-width-auto btn-sm selectionBtn" ng-click="selectNursingStation()"> << >> </button>									</div>
								</div>
								<div class="col-lg-5 col-md-5 col-sm-5 padding-left-right-set4">
									<div class="">
										<label class="common-lable-color-set">Selected Services</label>
										<div class="masterborderScroll">
											<div class="checkbox ng-scope" ng-repeat="selectNursingStation in selectTemplateServiceMapperList">
												<label class="common-lable-color-set">{{selectNursingStation.title}}</label>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
						<div class="col-lg-2 col-md-2 col-sm-2 padding-left-right-set4"></div>
					</div>
				</form>
			</div>
		</fieldset>
		<div class="row padding-top10">
				<div class="col-md-6 col-sm-7 padding-left-right-set4">
					<div class="row">
						<div class="col-lg-3 col-md-6 col-sm-6" style="padding-left: 0px;">
								<div class="search">
								<label class="show-entries">Show <select
									name="DataTables_Table_0_length"
									class="search-popUp-ddl" ng-init="noOfRecordsPerPage='10'" ng-model="noOfRecordsPerPage"
										ng-change="setNoOfRecords();">
										<option value="10">10</option>
										<option value="25">25</option>
										<option value="50">50</option>
										<option value="100">100</option>
								</select> entries
								</label>
							</div>
						</div>
					</div>
				</div>
				<div class="col-lg-1 col-md-1 col-sm-2 padding-left-right-set4 float_right text-width-auto">
			         <a href="" class="btn btn-primary btn-save-box-shadow" title="Save" data-toggle="modal" ng-click="save()" ng-if="saveBtnFlag">
			        <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
			      
			        <a href="" class="btn btn-primary btn-save-box-shadow" title="Update" data-toggle="modal" ng-click="update()" ng-if="updateBtnFlag">
			        <i class="fa fa-floppy-o" style="font-size: 21px" aria-hidden="true"></i></a>
			      </div>
			      <div class="col-lg-3 col-md-3 col-sm-3 padding-left-right-set0 float_right">
			        <input type="text" autocomplete="off" class="text-search-box search-popUp-ddl" placeholder="Search" style="margin-top:0px" ng-model="searchKeyword">
			        <i class="fa fa-search common-search-text-icon" aria-hidden="true"></i>
			      </div>
			</div>
			<div class="row padding-left-right-set4 margin-top8">
			<div class="col-md-12">
			   <div class="row padding-left-right-set4 table-container padding-top8">
			<div class="table-container">
				<div class="table-container-header">
					<table
						class="table table-striped table-hover table-condensed table-bordered">
						<thead>
						  <tr class="">
							<th class="LISDynamicLabelOne">Service Name</th>
							<th class="text-center width10">Template</th>
							<th class="width8 text-center">Status(n)</th>
							<th class="width8 text-center">Action taken</th>
						  </tr>
					   </thead>
					</table>
				</div>
				<div class="table-container-body fix-height-scroll230" style="overflow: overlay;"> <!-- fix-height-scroll230, background: #fff; -->
					<table
						class="table table-striped table-hover table-condensed table-bordered">
						<tbody>
						
						<tr ng-repeat="info in commonList|orderBy:column:reverse|filter:searchKeyword">
							<td class="LISDynamicLabelOne">{{info.serviceStandardName}}</td>
							<td class="text-center width10">
								<a>
									<i class="fa fa-info-circle" aria-hidden="true" data-toggle="modal" data-target="#templateServiceMappingDetails" ng-click="getNursingStationMappedByUserId(info.serviceId)"></i>
								</a>
							</td>
							<td class="width8 text-center">
								<label class="switch"> <input type="checkbox"class="" ng-model="info.status"
									ng-checked="info.status=='A'" ng-true-value="'A'"
									ng-false-value="'I'"  ng-change="updateStatus(info.serviceId,info.status)">
										<div class="slider round"></div>
								</label>
							</td>
							<td class="width8 text-center">
								<a><i class="fa fa-pencil" aria-hidden="true" ng-click="showUpdateBtn(info.serviceId)"></i> </a>
							</td>
							
						</tr>
					</tbody>
					</table>
				</div>
			</div>
		</div> 
				<div class="row margin-bottom45 sss">
					<ul class="pagination table-list"
						style="font-size: 14px;">
						<li ng-class="{disabled:pager.currentPage === 1}"><a
							ng-click="setPage(1,'true')">First</a></li>
						<li ng-class="{disabled:pager.currentPage === 1}"><a
							ng-click="setPage(pager.currentPage - 1,'true')">Previous</a></li>
						<li ng-repeat="page in pager.pages"
							ng-class="{active:pager.currentPage === page}"><a
							ng-click="setPage(page,'true')">{{page}}</a></li>
						<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
							<a ng-click="setPage(pager.currentPage + 1,'true')">Next</a>
						</li>
						<li ng-class="{disabled:pager.currentPage === pager.totalPages}">
							<a ng-click="setPage(pager.totalPages,'true')">Last</a>
						</li>
					</ul>
				</div>
				</div>
			</div>
	</div>
</div>	
<!-- templateServiceMappingDetails START -->
<div id="templateServiceMappingDetails" class="modal fade ng-scope in common-medium-popup" role="dialog his-style">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header padding-zero">
				<div class="modal-title patient-details-row">
					Details
					<button type="button" class="close" data-dismiss="modal">&times;</button>
				</div>
			</div>
			<div class="modal-body">
				<div class="row padding-left-right-set4 table-container padding-top8">
					<div class="table-container">
						<div class="table-container-header">
							<table class="table table-striped table-hover table-condensed table-bordered">
								<thead>
									<tr>
										<th class="width10"><span class="">Sr No.</span></th>
										<th class="width10"><span class="">Service Code</span></th>
										<th class="width10"><span class="">Service Name</span></th>
									    <th class="width10"><span class="">Template Name</span></th>
									</tr>
								</thead>
							</table>
						</div>
						<div class="table-container-body fix-height-scroll230" style="overflow: overlay;">
							<table class="table table-striped table-hover table-condensed table-bordered">
								<tbody>
									<tr ng-repeat="info in getListObject track by $index">
										<td class="width10">{{$index+1}}</td>
										<td class="width10">{{info.serviceStandardCode}}</td>
										<td class="width10">{{info.serviceStandardName}}</td>
									    <td class="width10">{{info.title}}</td>
									</tr>
								</tbody>
									
							</table>
			             </div>
						</div>

					</div>
				</div>
			</div>
		</div>
</div>
<!-- templateServiceMappingDetails END -->
<script src="resources/assets/js/common/page-height.js"></script>
<script type="text/javascript">
	$(".selectedPageName").text("Clinical Form Service Mapping");
	$(".sidebar-nav li").each(function() {
		$(this).find("a").parents("li").removeClass("active");
	});
	$('a[href$="templateServiceMapping"]').parents("li").addClass("active");
</script>
