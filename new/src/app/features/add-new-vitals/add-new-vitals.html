<div class="container-fluid">
  <h4>Add New Vitals</h4>
  <table class="table table-striped table-bordered">
    <thead><tr>
        <th>Parameter</th>
        <th>Observations</th>
        <th>Action</th>
    </tr></thead>
    <tbody>
      @for (info of rows(); track $index) {
        <tr>
          <td>{{ info.vitalName }}</td>
          <td>{{ info.observation }}</td>
          <td>—</td>
          <td>
            <button class="btn btn-xs btn-primary" (click)="saveVitals()">saveVitals</button>
          </td>
        </tr>
      } @empty {
        <tr><td colspan="3" class="text-center">No records</td></tr>
      }
    </tbody>
  </table>
</div>
