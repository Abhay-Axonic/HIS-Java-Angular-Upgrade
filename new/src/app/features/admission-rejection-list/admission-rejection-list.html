<div class="container-fluid">
  <h4>Admission Rejection List</h4>
  <table class="table table-striped table-bordered">
    <thead><tr>
        <th>Patient Name</th>
        <th>Doctor</th>
        <th>DAO</th>
        <th>Ward</th>
        <th>Bed/Room</th>
        <th>Rejection Remark</th>
        <th>Action</th>
    </tr></thead>
    <tbody>
      @for (info of rows(); track $index) {
        <tr>
          <td>{{ info.patientFullName }}</td>
          <td>{{ info.doctorFullName }}</td>
          <td>{{ info.daoDesc }}</td>
          <td>{{ info.wardName }}</td>
          <td>{{ info.bedNumber }}</td>
          <td>{{ info.rejectionRemark }}</td>
          <td>—</td>
          <td>
            <button class="btn btn-xs btn-primary" (click)="accept($index)">accept</button>
            <button class="btn btn-xs btn-primary" (click)="reject($index)">reject</button>
          </td>
        </tr>
      } @empty {
        <tr><td colspan="7" class="text-center">No records</td></tr>
      }
    </tbody>
  </table>
</div>
