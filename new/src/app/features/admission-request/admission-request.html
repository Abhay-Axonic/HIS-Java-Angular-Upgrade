<div class="container-fluid">
  <h4>Admission Request</h4>
  <table class="table table-striped table-bordered">
    <thead><tr>
        <th>Ward</th>
        <th>Vacant</th>
        <th>Reserved</th>
        <th>Occupied</th>
    <th>Action</th>
    </tr>
    </thead>
    <tbody>
      @for (info of rows(); track $index) {
        <tr>
          <td>{{ info.wardName }}</td>
          <td>{{ info.vacant }}</td>
          <td>{{ info.reserved }}</td>
          <td>{{ info.occupied }}</td>
          <td>
            <button class="btn btn-xs btn-primary" (click)="saveAdmissionRequest()">saveAdmissionRequest</button>
            <button class="btn btn-xs btn-primary" (click)="getbedStatus()">getbedStatus</button>
          </td>
        </tr>
      } @empty {
        <tr><td colspan="4" class="text-center">No records</td></tr>
      }
    </tbody>
  </table>
</div>
