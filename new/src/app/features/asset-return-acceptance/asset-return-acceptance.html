<div class="container-fluid his-style">
  <div class="row padding-top10">
    <div class="col-lg-2">
      <label>Date (From)</label>
      <input type="date" class="form-control" [ngModel]="fromDate()" (ngModelChange)="fromDate.set($event)" />
    </div>
    <div class="col-lg-2">
      <label>Date-Till</label>
      <input type="date" class="form-control" [ngModel]="toDate()" (ngModelChange)="toDate.set($event)" />
    </div>
    <div class="col-lg-2">
      <label>From Store</label>
      <select class="form-control" [(ngModel)]="fromStore">
        @for (s of fromStoreList(); track s.id) {
          <option [ngValue]="s">{{ s['store'] ?? 'All Stores' }}</option>
        }
      </select>
    </div>
    <div class="col-lg-2">
      <label>To Store</label>
      <select class="form-control" [(ngModel)]="toStore">
        @for (s of toStoreList(); track s.id) {
          <option [ngValue]="s">{{ s['store'] ?? 'All Stores' }}</option>
        }
      </select>
    </div>
    <div class="col-lg-2">
      <label>Status</label>
      <select class="form-control" [(ngModel)]="status">
        @for (s of statusList(); track s.id) {
          <option [ngValue]="s">{{ s['status'] ?? 'All' }}</option>
        }
      </select>
    </div>
    <div class="col-lg-1">
      <a class="btn btn-primary btn-save-box-shadow" id="searchBtn" (click)="search()">Search</a>
    </div>
  </div>

  <table class="table table-bordered margin-top10">
    <thead>
      <tr>
        <th>Return No</th>
        <th></th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (item of pagination().data; track item.id) {
        <tr>
          <td>{{ item.returnNo }}</td>
          <td><a title="Print" (click)="printReport(item)"><i class="fa fa-print"></i></a></td>
          <td><a href="javascript:void(0)" (click)="assetReturnAcceptanceDetails(item)">Details</a></td>
        </tr>
      }
    </tbody>
  </table>

  @if (pagination().totalPages > 1) {
    <ul class="pagination table-list">
      <li [class.disabled]="pagination().currentPage === 1"><a (click)="page('first')">First</a></li>
      <li [class.disabled]="pagination().currentPage === 1"><a (click)="page('prev')">Previous</a></li>
      @for (p of pagesList(); track p) {
        <li [class.active]="pagination().currentPage === p"><a (click)="page(p)">{{ p }}</a></li>
      }
      <li [class.disabled]="pagination().currentPage === pagination().totalPages"><a (click)="page('next')">Next</a></li>
      <li [class.disabled]="pagination().currentPage === pagination().totalPages"><a (click)="page('last')">Last</a></li>
    </ul>
  }
</div>
