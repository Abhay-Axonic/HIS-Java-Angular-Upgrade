<div class="container-fluid">
  <h4>Bed Allocation</h4>
  <table class="table table-striped table-bordered">
    <thead><tr>
        <th>Floor</th>
        <th>Ward</th>
        <th>Ward Bed No.</th>
        <th>Bed Category</th>
        <th>Patient</th>
        <th>Action</th>
    </tr></thead>
    <tbody>
      @for (info of rows(); track $index) {
        <tr>
          <td>{{ info.floorName }}</td>
          <td>{{ info.wardName }}</td>
          <td>{{ info.bedNumber }}</td>
          <td>{{ info.bedCategoryDesc }}</td>
          <td>{{ info.patientFullName }}</td>
          <td>—</td>
          <td>
            <button class="btn btn-xs btn-primary" (click)="bedSearchByMultipleCriteria()">bedSearchByMultipleCriteria</button>
            <button class="btn btn-xs btn-primary" (click)="bedAllocationPopUp($index)">bedAllocationPopUp</button>
          </td>
        </tr>
      } @empty {
        <tr><td colspan="6" class="text-center">No records</td></tr>
      }
    </tbody>
  </table>
</div>
