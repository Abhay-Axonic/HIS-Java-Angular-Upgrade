<div class="container-fluid">
  <h4>Bed Availability</h4>
  <table class="table table-striped table-bordered">
    <thead><tr>
        <th>Bed Category</th>
        <th>Ward Bed Category</th>
        <th>Available</th>
    </tr></thead>
    <tbody>
      @for (info of rows(); track $index) {
        <tr>
          <td>{{ info.bedCategoryDesc }}</td>
          <td>{{ info.wardBedCategoryDesc }}</td>
          <td>{{ info.availableBeds }}</td>
          <td>
            <button class="btn btn-xs btn-primary" (click)="searchBedAvaliable()">searchBedAvaliable</button>
          </td>
        </tr>
      } @empty {
        <tr><td colspan="3" class="text-center">No records</td></tr>
      }
    </tbody>
  </table>
</div>
