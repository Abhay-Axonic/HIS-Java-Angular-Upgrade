<div class="container-fluid">
  <h4>Bed Under Maintenance</h4>
  <table class="table table-striped table-bordered">
    <thead><tr>
        <th>Ward</th>
        <th>Bed No.</th>
        <th>From Date</th>
        <th>To Date</th>
        <th>Reason</th>
        <th>Action</th>
    </tr></thead>
    <tbody>
      @for (info of rows(); track $index) {
        <tr>
          <td>{{ info.wardName }}</td>
          <td>{{ info.bedNumber }}</td>
          <td>{{ info.fromDate }}</td>
          <td>{{ info.toDate }}</td>
          <td>{{ info.reasonDesc }}</td>
          <td>—</td>
          <td>
            <button class="btn btn-xs btn-primary" (click)="searchBed()">searchBed</button>
          </td>
        </tr>
      } @empty {
        <tr><td colspan="6" class="text-center">No records</td></tr>
      }
    </tbody>
  </table>
</div>
