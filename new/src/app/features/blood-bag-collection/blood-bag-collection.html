<div class="bloodbank">
  <h2>Blood Bag Collection</h2>

  <!-- The donor header (read-only, from the worklist navigation). -->
  <section class="bb-section">
    <div class="bb-form">
      <label>Donor Id <span class="bb-ro">{{ form().donorNumber ?? donor()?.donorNumber ?? donor()?.donorId ?? '—' }}</span></label>
      <label>Donor Name <span class="bb-ro">{{ form().donorName ?? donor()?.donorName ?? '—' }}</span></label>
      <label>Blood Group <span class="bb-ro">{{ form().bloodGroup ?? donor()?.bloodGroup ?? '—' }}</span></label>
      <label>Gender <span class="bb-ro">{{ form().gender ?? donor()?.gender ?? '—' }}</span></label>
    </div>
  </section>

  <!-- The collection fields (the legacy's donorDetailsObj). -->
  <section class="bb-section">
    <h3>Collection</h3>
    <div class="bb-form">
      <label>Camp Name
        <select [ngModel]="form().campId" (ngModelChange)="setField('campId', $event)">
          <option [ngValue]="null">—</option>
          @for (c of camps(); track c.id) { <option [ngValue]="c.id">{{ c.name }}</option> }
        </select>
      </label>
      <label>Blood Bank Name
        <select [ngModel]="form().bloodBankId" (ngModelChange)="setField('bloodBankId', $event)">
          <option [ngValue]="null">—</option>
          @for (b of banks(); track b.id) { <option [ngValue]="b.id">{{ b.name }}</option> }
        </select>
      </label>
      <label>Collection Date
        <input type="date" [ngModel]="form().collectionDate" (ngModelChange)="setField('collectionDate', $event)" />
      </label>
      <label>From Time
        <input type="time" [ngModel]="form().fromTime" (ngModelChange)="setField('fromTime', $event)" />
      </label>
      <label>To Time
        <input type="time" [ngModel]="form().toTime" (ngModelChange)="setField('toTime', $event)" />
      </label>
      <label>Collected From
        <label class="radio-inline"><input type="radio" [checked]="form().collectedFrom === 1" (change)="setField('collectedFrom', 1)" /> Blood Bank</label>
        <label class="radio-inline"><input type="radio" [checked]="form().collectedFrom === 2" (change)="setField('collectedFrom', 2)" /> Camp</label>
      </label>
      <label>Blood Unit No.
        <input type="text" [ngModel]="form().bloodUnitNumber" (ngModelChange)="setField('bloodUnitNumber', $event)" />
      </label>
      <label>Segment No.
        <input type="text" [ngModel]="form().segmentNumber" (ngModelChange)="setField('segmentNumber', $event)" />
      </label>
      <label>Barcode
        <input type="text" [ngModel]="form().barCode" (ngModelChange)="setField('barCode', $event)" />
      </label>
      <label>Blood Bag Type
        <input type="number" [ngModel]="form().bloodBagTypeId" (ngModelChange)="setField('bloodBagTypeId', $event)" />
      </label>
      <label>Bag Capacity (ml)
        <select [ngModel]="form().bagCapacityId" (ngModelChange)="setField('bagCapacityId', $event)">
          <option [ngValue]="null">—</option>
          @for (cap of capacities(); track cap.id) { <option [ngValue]="cap.id">{{ cap.name }}</option> }
        </select>
      </label>
      <label>Batch No.
        <input type="text" [ngModel]="form().batchNo" (ngModelChange)="setField('batchNo', $event)" />
      </label>
    </div>
  </section>

  <!-- The termination + accept/discard (the legacy's status radios). -->
  <section class="bb-section">
    <h3>Result</h3>
    <div class="bb-form">
      <label>
        <input type="radio" [checked]="form().bloodBagCollectionStatusId === 1" (change)="setField('bloodBagCollectionStatusId', 1)" /> Accept
      </label>
      <label>
        <input type="radio" [checked]="form().bloodBagCollectionStatusId === 2" (change)="setField('bloodBagCollectionStatusId', 2)" /> Discard
      </label>
      <label>Termination Reason
        <select [ngModel]="form().terminationReasonId" (ngModelChange)="setField('terminationReasonId', $event)">
          <option [ngValue]="null">—</option>
          @for (r of reasons(); track r.id) { <option [ngValue]="r.id">{{ r.name }}</option> }
        </select>
      </label>
    </div>
  </section>

  <!-- The examination child rows (the legacy's exam block). -->
  <section class="bb-section">
    <h3>Examinations</h3>
    <button type="button" class="btn-primary" (click)="addExam()">Add Examination</button>
    @for (e of exams(); track $index) {
      <div class="bb-form">
        <label>Examination Date
          <input type="date" [ngModel]="e.examinationDate" (ngModelChange)="setExamField($index, 'examinationDate', $event)" />
        </label>
        <label>Pulse
          <input type="number" [ngModel]="e.pulse" (ngModelChange)="setExamField($index, 'pulse', $event)" />
        </label>
        <label>BP Systolic
          <input type="number" [ngModel]="e.bpSystolic" (ngModelChange)="setExamField($index, 'bpSystolic', $event)" />
        </label>
        <label>BP Diastolic
          <input type="number" [ngModel]="e.bpDiastolic" (ngModelChange)="setExamField($index, 'bpDiastolic', $event)" />
        </label>
      </div>
    }
  </section>

  <section class="bb-section">
    <button type="button" class="btn-primary" (click)="save()" [disabled]="saving() || !loaded()">
      {{ saving() ? 'Saving…' : 'Save' }}
    </button>
  </section>
</div>
