<div class="container-fluid">
  <h4>Cancel For Discharge</h4>
  <table class="table table-striped table-bordered">
    <thead><tr>
        <th>Patient</th>
        <th>UHID</th>
        <th>Ward</th>
        <th>Bed</th>
        <th>Doctor</th>
        <th>Reason</th>
        <th>Action</th>
    </tr></thead>
    <tbody>
      @for (info of rows(); track $index) {
        <tr>
          <td>{{ info.patientFullName }}</td>
          <td>{{ info.uhidNum }}</td>
          <td>{{ info.wardName }}</td>
          <td>{{ info.bedNumber }}</td>
          <td>{{ info.doctorFullName }}</td>
          <td>{{ info.reasonDesc }}</td>
          <td>—</td>
          <td>
            <button class="btn btn-xs btn-primary" (click)="cancelAndUpdateExtendPdd()">cancelAndUpdateExtendPdd</button>
          </td>
        </tr>
      } @empty {
        <tr><td colspan="7" class="text-center">No records</td></tr>
      }
    </tbody>
  </table>
</div>
