<div class="page-content">
  <h2 class="page-title">Cancellation Master</h2>

  <div class="toolbar">
    <input
      type="text"
      class="text-search-box"
      placeholder="Search…"
      [(ngModel)]="searchTerm"
    />
    <button class="btn-primary" (click)="save()">Save</button>
  </div>

  @if (loading()) {
    <div class="loading-hint">Loading…</div>
  }

  <table class="data-table">
    <thead>
      <tr>
        <th>Code</th>
        <th>Reason</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      @for (row of filteredRows(); track row.id ?? row.code) {
        <tr>
          <td>{{ row.code }}</td>
          <td>{{ row.reason }}</td>
          <td>{{ row.isActive ? 'Active' : 'Inactive' }}</td>
        </tr>
      }
      @if (!filteredRows().length && !loading()) {
        <tr>
          <td colspan="3" class="empty-cell">No cancellation reasons found.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
