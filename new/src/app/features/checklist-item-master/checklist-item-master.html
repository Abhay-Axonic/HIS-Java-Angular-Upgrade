<!--
  See checklist-item-master.ts's class doc comment: one form/button/
  function serves both Create and Update (real, well-built upsert with a
  correct duplicate-check on both paths), no confirm-modal, status-toggle
  triggers a real list reload on success (unlike this batch's other 3
  screens).
-->
<section class="page">
  <fieldset>
    <div class="form-row">
      <div class="field">
        <label for="itemCode">Code</label>
        <input
          id="itemCode"
          type="text"
          autocomplete="off"
          [ngModel]="form().code"
          (ngModelChange)="updateField('code', $event)"
          name="itemCode"
        />
      </div>

      <div class="field">
        <label for="itemDescription">Description</label>
        <input
          id="itemDescription"
          type="text"
          autocomplete="off"
          [ngModel]="form().description"
          (ngModelChange)="updateField('description', $event)"
          name="itemDescription"
        />
      </div>
    </div>
  </fieldset>

  <div class="toolbar">
    <input type="text" [ngModel]="searchKeyword()" (ngModelChange)="searchKeyword.set($event)" placeholder="Search" />
    <button type="button" class="btn-primary icon-btn" title="Save" (click)="onSaveClick()">
      <i class="fa fa-floppy-o" aria-hidden="true"></i>
    </button>
  </div>

  <table class="data-table">
    <thead>
      <tr>
        <th>Code</th>
        <th>Description</th>
        <th class="text-center">Status(n)</th>
        <th class="text-center">Action taken</th>
      </tr>
    </thead>
    <tbody>
      @for (row of displayedRows(); track row.checklistItemMasterId) {
        <tr>
          <td>{{ row.code }}</td>
          <td>{{ row.description }}</td>
          <td class="text-center">
            <app-status-toggle [checked]="row.status === 'A'" (toggled)="toggleStatus(row)" />
          </td>
          <td class="text-center">
            <i class="icon-edit" title="Edit" (click)="edit(row)"></i>
          </td>
        </tr>
      }
      @if (!displayedRows().length) {
        <tr>
          <td colspan="4" class="text-center">No Records Found</td>
        </tr>
      }
    </tbody>
  </table>
</section>
