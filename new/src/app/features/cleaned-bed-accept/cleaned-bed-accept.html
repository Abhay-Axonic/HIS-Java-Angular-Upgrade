<div class="container-fluid">
  <h4>Cleaned Bed Accept</h4>
  <table class="table table-striped table-bordered">
    <thead><tr>
        <th>Floor</th>
        <th>Ward</th>
        <th>Ward Bed No.</th>
        <th>Cleaned On</th>
        <th>Action</th>
    </tr></thead>
    <tbody>
      @for (info of rows(); track $index) {
        <tr>
          <td>{{ info.floorName }}</td>
          <td>{{ info.wardName }}</td>
          <td>{{ info.bedNumber }}</td>
          <td>{{ info.cleanedDate }}</td>
          <td>—</td>
          <td>
            <button class="btn btn-xs btn-primary" (click)="toggleSelectionAccept($index)">toggleSelectionAccept</button>
            <button class="btn btn-xs btn-primary" (click)="bedSearchByMultipleCriteria()">bedSearchByMultipleCriteria</button>
          </td>
        </tr>
      } @empty {
        <tr><td colspan="5" class="text-center">No records</td></tr>
      }
    </tbody>
  </table>
</div>
