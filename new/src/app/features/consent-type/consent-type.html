<div class="ct-wrap">
  <header class="ct-header">
    <h2>Consent Type</h2>
    <span class="ct-sub">Global Master / OTIMS — module 528</span>
  </header>

  @if (loading()) {
    <p class="ct-muted">Loading consent types…</p>
  } @else if (error()) {
    <div class="ct-state ct-error">
      <p>{{ error() }}</p>
    </div>
  } @else {
    <table class="ct-table">
      <thead>
        <tr>
          <th>Code</th>
          <th>Name</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        @for (row of rows(); track row.consentTypeMasterId) {
          <tr>
            @for (cell of rowCells(row); track $index) {
              <td>{{ cell }}</td>
            }
          </tr>
        } @empty {
          <tr><td colspan="3" class="ct-empty">No records.</td></tr>
        }
      </tbody>
    </table>
  }
</div>
