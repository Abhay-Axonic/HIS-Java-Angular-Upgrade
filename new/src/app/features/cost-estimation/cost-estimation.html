<div class="container-fluid">
  <h4>Cost Estimation</h4>
  <table class="table table-striped table-bordered">
    <thead><tr>
        <th>Service Description</th>
        <th>Group</th>
        <th>Rate</th>
        <th>Quantity</th>
        <th>Final Amount</th>
        <th>Self payable</th>
        <th>Credit payable</th>
        <th>Action</th>
    </tr></thead>
    <tbody>
      @for (info of rows(); track $index) {
        <tr>
          <td title="UNRESOLVED — no backend quote">—</td>
          <td title="UNRESOLVED — no backend quote">—</td>
          <td>{{ info.rate }}</td>
          <td>{{ info.quantity }}</td>
          <td title="UNRESOLVED — no backend quote">—</td>
          <td>{{ info.selfPayable }}</td>
          <td>{{ info.creditPayable }}</td>
          <td>—</td>
          <td>
            <button class="btn btn-xs btn-primary" (click)="getToggleValues()">getToggleValues</button>
            <button class="btn btn-xs btn-primary" (click)="redirectToPrefix()">redirectToPrefix</button>
          </td>
        </tr>
      } @empty {
        <tr><td colspan="8" class="text-center">No records</td></tr>
      }
    </tbody>
  </table>
</div>
