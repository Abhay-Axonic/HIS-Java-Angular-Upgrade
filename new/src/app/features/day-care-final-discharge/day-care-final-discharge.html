<div class="container-fluid">
  <h4>Day Care Final Discharge</h4>
  <table class="table table-striped table-bordered">
    <thead><tr>
        <th>UHID</th>
        <th>Patient Details</th>
        <th>Ward</th>
        <th>Bed No.</th>
        <th>Action</th>
    </tr></thead>
    <tbody>
      @for (info of rows(); track $index) {
        <tr>
          <td>{{ info.uhidnumber }}</td>
          <td>{{ info.pFirstName }}</td>
          <td>{{ info.wardName }}</td>
          <td>{{ info.bedNumber }}</td>
          <td>—</td>
          <td>
            <button class="btn btn-xs btn-primary" (click)="vocateBedAgainstPatient($index)">vocateBedAgainstPatient</button>
            <button class="btn btn-xs btn-primary" (click)="patientDocumnetInformation($index)">patientDocumnetInformation</button>
          </td>
        </tr>
      } @empty {
        <tr><td colspan="5" class="text-center">No records</td></tr>
      }
    </tbody>
  </table>
</div>
