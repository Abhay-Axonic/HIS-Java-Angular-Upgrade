<div class="container-fluid">
  <h4>Day Care Patient For Discharge</h4>
  <table class="table table-striped table-bordered">
    <thead><tr>
        <th>Ward Bed No.</th>
        <th>Payment Entitlement</th>
        <th>Pass No.</th>
        <th>Expiry Date</th>
        <th>Print</th>
    </tr></thead>
    <tbody>
      @for (info of rows(); track $index) {
        <tr>
          <td>{{ info.bedNumber }}</td>
          <td>{{ info.paymentEntitlement }}</td>
          <td>{{ info.passNumber }}</td>
          <td>{{ info.expiryDate }}</td>
          <td>—</td>
          <td>
            <button class="btn btn-xs btn-primary" (click)="finalDischarge($index)">finalDischarge</button>
            <button class="btn btn-xs btn-primary" (click)="pendingServies()">pendingServies</button>
            <button class="btn btn-xs btn-primary" (click)="redirectBilling($index)">redirectBilling</button>
            <button class="btn btn-xs btn-primary" (click)="showDischargeMedication($index)">showDischargeMedication</button>
          </td>
        </tr>
      } @empty {
        <tr><td colspan="5" class="text-center">No records</td></tr>
      }
    </tbody>
  </table>
</div>
