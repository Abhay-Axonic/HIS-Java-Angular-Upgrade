<div class="container-fluid">
  <h4>Death Registration</h4>
  <table class="table table-striped table-bordered">
    <thead><tr>
        <th>Patient</th>
        <th>UHID</th>
        <th>Date of Death</th>
        <th>Country</th>
        <th>Action</th>
    <th>Action</th>
    </tr>
    </thead>
    <tbody>
      @for (info of rows(); track $index) {
        <tr>
          <td>{{ info.patientFullName }}</td>
          <td>{{ info.uhidnumber }}</td>
          <td>{{ info.dateOfDeath }}</td>
          <td>{{ info.countryName }}</td>
          <td>—</td>
          <td>
            <button class="btn btn-xs btn-primary" (click)="saveDeathRegistration()">saveDeathRegistration</button>
            <button class="btn btn-xs btn-primary" (click)="addImageDetails()">addImageDetails</button>
            <button class="btn btn-xs btn-primary" (click)="viewDoc($index)">viewDoc</button>
          </td>
        </tr>
      } @empty {
        <tr><td colspan="5" class="text-center">No records</td></tr>
      }
    </tbody>
  </table>
</div>
