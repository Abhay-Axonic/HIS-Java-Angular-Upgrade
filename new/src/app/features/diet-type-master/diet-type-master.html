<div class="dtm-wrap">
  <header class="dtm-header">
    <h2>Diet Type Master</h2>
    <span class="dtm-sub">Kitchen / Diet — module 510</span>
  </header>

  @if (loading()) {
    <p class="dtm-muted">Loading diet types…</p>
  } @else if (error()) {
    <div class="dtm-state dtm-error">
      <p>{{ error() }}</p>
    </div>
  } @else {
    <table class="dtm-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Diet Type</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        @for (row of rows(); track row.id) {
          <tr>
            @for (cell of rowCells(row); track $index) {
              <td>{{ cell }}</td>
            }
          </tr>
        } @empty {
          <tr><td colspan="3" class="dtm-empty">No records.</td></tr>
        }
      </tbody>
    </table>
  }
</div>
