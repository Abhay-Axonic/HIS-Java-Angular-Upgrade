<div class="container-fluid">
  <h4>Discharged Patients</h4>
  <table class="table table-striped table-bordered">
    <thead><tr>
        <th>Doctor</th>
        <th>Specialty</th>
        <th>Ward</th>
        <th>Ward Bed No.</th>
        <th>Hospital Discharge-Clinical Re</th>
        <th>Action taken</th>
    <th>Action taken</th>
    </tr>
    </thead>
    <tbody>
      @for (info of rows(); track $index) {
        <tr>
          <td>{{ info.doctorName }}</td>
          <td>{{ info.specialityDesc }}</td>
          <td>{{ info.wardName }}</td>
          <td>{{ info.bedNumber }}</td>
          <td>{{ info.clinicalRemarks }}</td>
          <td>—</td>
          <td>
            <button class="btn btn-xs btn-primary" (click)="searchDischargedPatient()">searchDischargedPatient</button>
            <button class="btn btn-xs btn-primary" (click)="open($index)">open</button>
          </td>
        </tr>
      } @empty {
        <tr><td colspan="6" class="text-center">No records</td></tr>
      }
    </tbody>
  </table>
</div>
