<div class="dm-wrap">
  <header class="dm-header">
    <h2>Dose Master</h2>
    <span class="dm-sub">Common / Global — module 502</span>
  </header>

  @if (loading()) {
    <p class="dm-muted">Loading doses…</p>
  } @else if (error()) {
    <div class="dm-state dm-error">
      <p>{{ error() }}</p>
    </div>
  } @else {
    <table class="dm-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Dose</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        @for (row of rows(); track row.id) {
          <tr>
            @for (cell of rowCells(row); track $index) {
              <td>{{ cell }}</td>
            }
          </tr>
        } @empty {
          <tr><td colspan="3" class="dm-empty">No records.</td></tr>
        }
      </tbody>
    </table>
  }
</div>
