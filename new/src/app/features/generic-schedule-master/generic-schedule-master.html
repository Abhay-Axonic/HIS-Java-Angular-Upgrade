<div class="gsm-wrap">
  <header class="gsm-header">
    <h2>Generic Schedule Master</h2>
    <span class="gsm-sub">Pharmacy / Global — module 827</span>
  </header>

  @if (loading()) {
    <p class="gsm-muted">Loading generic schedules…</p>
  } @else if (error()) {
    <div class="gsm-state gsm-error">
      <p>{{ error() }}</p>
    </div>
  } @else {
    <table class="gsm-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Schedule Name</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        @for (row of rows(); track row.id) {
          <tr>
            @for (cell of rowCells(row); track $index) {
              <td>{{ cell }}</td>
            }
          </tr>
        } @empty {
          <tr><td colspan="3" class="gsm-empty">No records.</td></tr>
        }
      </tbody>
    </table>
  }
</div>
