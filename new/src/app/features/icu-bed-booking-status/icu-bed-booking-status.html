<div class="container-fluid">
  <h4>Icu Bed Booking Status</h4>
  <table class="table table-striped table-bordered">
    <thead><tr>
        <th>Patient</th>
        <th>UHID</th>
        <th>ICU Bed</th>
        <th>Status</th>
        <th>Booked On</th>
        <th>Action</th>
    </tr></thead>
    <tbody>
      @for (info of rows(); track $index) {
        <tr>
          <td>{{ info.patientFullName }}</td>
          <td>{{ info.uhidnumber }}</td>
          <td>{{ info.icuBedNumber }}</td>
          <td>{{ info.status }}</td>
          <td>{{ info.bookedDate }}</td>
          <td>—</td>
          <td>
            <button class="btn btn-xs btn-primary" (click)="search()">search</button>
          </td>
        </tr>
      } @empty {
        <tr><td colspan="6" class="text-center">No records</td></tr>
      }
    </tbody>
  </table>
</div>
