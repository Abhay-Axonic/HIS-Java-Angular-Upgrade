<div class="container-fluid">
  <h4>Intiate Transfer Care</h4>
  <table class="table table-striped table-bordered">
    <thead><tr>
        <th>Patient</th>
        <th>UHID</th>
        <th>Bed</th>
        <th>Doctor</th>
        <th>Speciality</th>
        <th>Action</th>
    </tr></thead>
    <tbody>
      @for (info of rows(); track $index) {
        <tr>
          <td>{{ info.patientFullName }}</td>
          <td>{{ info.uhidNum }}</td>
          <td>{{ info.bedNumber }}</td>
          <td>{{ info.doctorFullName }}</td>
          <td>{{ info.specialityName }}</td>
          <td>—</td>
          <td>
            <button class="btn btn-xs btn-primary" (click)="saveTransferOfCareRequest()">saveTransferOfCareRequest</button>
            <button class="btn btn-xs btn-primary" (click)="displayNote($index)">displayNote</button>
            <button class="btn btn-xs btn-primary" (click)="displayRejectionNote()">displayRejectionNote</button>
          </td>
        </tr>
      } @empty {
        <tr><td colspan="6" class="text-center">No records</td></tr>
      }
    </tbody>
  </table>
</div>
