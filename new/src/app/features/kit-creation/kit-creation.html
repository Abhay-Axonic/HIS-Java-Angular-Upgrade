<div class="kc-wrap">
  <header class="kc-header">
    <h2>Kit Creation</h2>
    <span class="kc-sub">Unit Master / CSSD — module 555</span>
  </header>

  @if (loading()) {
    <p class="kc-muted">Loading kits…</p>
  } @else if (error()) {
    <div class="kc-state kc-error">
      <p>{{ error() }}</p>
    </div>
  } @else {
    <table class="kc-table">
      <thead>
        <tr>
          <th>Code</th>
          <th>Name</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        @for (row of rows(); track row.kitId) {
          <tr>
            @for (cell of rowCells(row); track $index) {
              <td>{{ cell }}</td>
            }
          </tr>
        } @empty {
          <tr><td colspan="3" class="kc-empty">No records.</td></tr>
        }
      </tbody>
    </table>
  }
</div>
