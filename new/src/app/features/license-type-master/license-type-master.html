<div class="ltm-wrap">
  <header class="ltm-header">
    <h2>License Type Master</h2>
    <span class="ltm-sub">Global Master / Org — module 379</span>
  </header>

  @if (loading()) {
    <p class="ltm-muted">Loading license types…</p>
  } @else if (error()) {
    <div class="ltm-state ltm-error">
      <p>{{ error() }}</p>
    </div>
  } @else {
    <table class="ltm-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>License Type</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        @for (row of rows(); track row.id) {
          <tr>
            @for (cell of rowCells(row); track $index) {
              <td>{{ cell }}</td>
            }
          </tr>
        } @empty {
          <tr><td colspan="3" class="ltm-empty">No records.</td></tr>
        }
      </tbody>
    </table>
  }
</div>
