<div class="ptm-wrap">
  <header class="ptm-header">
    <h2>Loyalty Card Creation</h2>
    <span class="ptm-sub">Global Master — module 729</span>
  </header>

  @if (loading()) {
    <p class="ptm-muted">Loading loyalty cards…</p>
  } @else if (error()) {
    <div class="ptm-state ptm-error">
      <p>{{ error() }}</p>
    </div>
  } @else {
    <table class="ptm-table">
      <thead>
        <tr>
          <th>Card No.</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        @for (row of rows(); track row.loyaltyCardId) {
          <tr>
            @for (cell of rowCells(row); track $index) {
              <td>{{ cell }}</td>
            }
          </tr>
        } @empty {
          <tr><td colspan="2" class="ptm-empty">No records.</td></tr>
        }
      </tbody>
    </table>
  }
</div>
