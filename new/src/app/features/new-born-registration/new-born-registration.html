<div class="container-fluid">
  <h4>New Born Registration</h4>
  <table class="table table-striped table-bordered">
    <thead><tr>
        <th>Prefix</th>
        <th>Mother's Name</th>
        <th>Name of Baby</th>
        <th>Weight</th>
        <th>Date of Birth</th>
        <th>Time of Birth</th>
        <th>Gestational Age</th>
        <th>Birth Type</th>
        <th>Gender</th>
    </tr></thead>
    <tbody>
      @for (info of rows(); track $index) {
        <tr>
          <td title="UNRESOLVED — no backend quote">—</td>
          <td title="UNRESOLVED — no backend quote">—</td>
          <td>{{ info.pFirstName }}</td>
          <td title="UNRESOLVED — no backend quote">—</td>
          <td>{{ info.dob }}</td>
          <td title="UNRESOLVED — no backend quote">—</td>
          <td title="UNRESOLVED — no backend quote">—</td>
          <td title="UNRESOLVED — no backend quote">—</td>
          <td>{{ info.genderCode }}</td>
          <td>
            <button class="btn btn-xs btn-primary" (click)="saveNewBornBaby()">saveNewBornBaby</button>
          </td>
        </tr>
      } @empty {
        <tr><td colspan="9" class="text-center">No records</td></tr>
      }
    </tbody>
  </table>
</div>
