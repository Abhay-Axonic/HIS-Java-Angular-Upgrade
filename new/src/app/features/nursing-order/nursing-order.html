<div class="container-fluid">
  <h4>Nursing Order</h4>
  <div class="row form-group">
    <label>Patient</label>
    <input class="form-control" [ngModel]="patientId()" (ngModelChange)="patientId.set($event)" placeholder="Patient search" />
  </div>
  <div class="row form-group">
    <label>Nursing Order</label>
    <input class="form-control" [ngModel]="nursingOrderId()" (ngModelChange)="nursingOrderId.set($event)" />
  </div>
  <div class="row form-group">
    <label>Frequency</label>
    <input class="form-control" [ngModel]="frequencyId()" (ngModelChange)="frequencyId.set($event)" />
  </div>
  <div class="row form-group">
    <label>Instruction</label>
    <textarea class="form-control" [ngModel]="instruction()" (ngModelChange)="instruction.set($event)"></textarea>
  </div>
  <div class="row form-group">
    <label>Start Date</label>
    <input class="form-control" [ngModel]="startDate()" (ngModelChange)="startDate.set($event)" />
  </div>
  <button class="btn btn-primary" (click)="open4()">Open</button>
  <button class="btn btn-default" (click)="openDatePicker()">Pick Date</button>
</div>
