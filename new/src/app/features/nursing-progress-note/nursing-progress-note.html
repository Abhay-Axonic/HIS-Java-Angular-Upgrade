<div class="container-fluid">
  <h4>Nursing Progress Note</h4>
  <table class="table table-striped table-bordered">
    <thead>
      <tr><th>Name</th><th>Date</th><th>Time</th><th>Action</th></tr>
    </thead>
    <tbody>
      @for (row of rows(); track $index) {
        <tr>
          <td>{{ row.patientName }}</td>
          <td>{{ row.noteDate }}</td>
          <td>{{ row.noteTime }}</td>
          <td></td>
        </tr>
      } @empty {
        <tr><td colspan="4" class="text-center">No progress notes</td></tr>
      }
    </tbody>
  </table>
</div>
