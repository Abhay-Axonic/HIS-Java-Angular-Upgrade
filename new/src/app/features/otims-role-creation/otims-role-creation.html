<section class="page">
  <div class="form-grid">
    <div class="field">
      <label for="roleName">OTIMS Role Name</label>
      <select id="roleName" [ngModel]="form().roleName" (ngModelChange)="updateRoleName($event)" name="roleName">
        <option [value]="placeholder">{{ placeholder }}</option>
        @for (option of roleNameOptions; track option) {
          <option [value]="option">{{ option }}</option>
        }
      </select>
    </div>
  </div>

  <div class="toolbar">
    @if (saveMode()) {
      <button type="button" class="btn-primary icon-btn" title="Save" (click)="save()">
        <i class="fa fa-floppy-o" aria-hidden="true"></i>
      </button>
    } @else {
      <button type="button" class="btn-primary icon-btn" title="Update" (click)="update()">
        <i class="fa fa-floppy-o" aria-hidden="true"></i>
      </button>
    }
  </div>

  <table class="data-table">
    <thead>
      <tr>
        <th>OTIMS Role Name</th>
        <th class="text-center">Status</th>
        <th class="text-center">Action</th>
      </tr>
    </thead>
    <tbody>
      @for (row of list(); track row.roleId) {
        <tr>
          <td>{{ row.roleName }}</td>
          <td class="text-center">
            <app-status-toggle [checked]="row.status === 'A'" (toggled)="toggleStatus(row)" />
          </td>
          <td class="text-center">
            <i class="icon-edit" title="Edit" (click)="edit(row)"></i>
          </td>
        </tr>
      }
      @if (!list().length) {
        <tr>
          <td colspan="3" class="text-center">No Records Found</td>
        </tr>
      }
    </tbody>
  </table>
</section>

@if (showConfirmModal()) {
  <div class="modal-backdrop" (click)="closeConfirmModal()">
    <div class="modal" (click)="$event.stopPropagation()">
      <header>
        Confirm
        <button type="button" (click)="closeConfirmModal()">&times;</button>
      </header>
      <div class="modal-body">
        <span>Are you sure you want to Save?</span>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-primary" (click)="confirmSave()">Ok</button>
        <button type="button" class="btn-primary" (click)="closeConfirmModal()">Cancel</button>
      </div>
    </div>
  </div>
}
