<div class="lab">
  <h2>Out Patient</h2>

  <section class="lb-section">
    <table class="lb-table">
      <thead>
        <tr><th>Patient</th><th>Test / Sample</th><th>Status</th><th></th></tr>
      </thead>
      <tbody>
        @for (r of rows(); track $index) {
          <tr>
            <td>{{ r.patientName ?? r.patientId }}</td>
            <td>{{ r.testName ?? r.sampleType ?? r.testId ?? '—' }}</td>
            <td>{{ r.status ?? '—' }}</td>
            <td><button type="button" (click)="pick(r)">Select</button></td>
          </tr>
        }
        @if (!rows().length && loaded()) {
          <tr><td colspan="4" class="lb-empty">No rows.</td></tr>
        }
        @if (!rows().length && !loaded()) {
          <tr><td colspan="4" class="lb-empty">Loading…</td></tr>
        }
      </tbody>
    </table>
  </section>

  <section class="lb-section">
    <h3>Result Entry</h3>
    <div class="lb-form">
      <label>Result
        <input type="text" [ngModel]="result()" (ngModelChange)="result.set($event)" />
      </label>
      <label>Remark
        <input type="text" [ngModel]="remark()" (ngModelChange)="remark.set($event)" />
      </label>
    </div>
    <button type="button" class="btn-primary" (click)="save()" [disabled]="saving() || !selected()">Save</button>
  </section>
</div>
