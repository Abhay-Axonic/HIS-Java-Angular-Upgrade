<div class="container-fluid">
  <h4>Pending Consult Order Request</h4>
  <table class="table table-striped table-bordered">
    <thead><tr>
        <th>UHID</th>
        <th>Patient</th>
        <th>Doctor</th>
        <th>To Speciality</th>
        <th>Ward</th>
        <th>Note</th>
        <th>Action</th>
    <th>Action</th>
    </tr>
    </thead>
    <tbody>
      @for (info of rows(); track $index) {
        <tr>
          <td>{{ info.uhidnumber }}</td>
          <td>{{ info.patientName }}</td>
          <td>{{ info.doctorName }}</td>
          <td>{{ info.toSpecialityName }}</td>
          <td>{{ info.wardName }}</td>
          <td title="UNRESOLVED — no backend quote">—</td>
          <td>—</td>
          <td>
            <button class="btn btn-xs btn-primary" (click)="selectItem()">selectItem</button>
            <button class="btn btn-xs btn-primary" (click)="displayNote($index)">displayNote</button>
            <button class="btn btn-xs btn-primary" (click)="acceptConsultOrder()">acceptConsultOrder</button>
          </td>
        </tr>
      } @empty {
        <tr><td colspan="7" class="text-center">No records</td></tr>
      }
    </tbody>
  </table>
</div>
