<div class="container-fluid">
  <h4>Pending Nursing Order</h4>
  <table class="table table-striped table-bordered">
    <thead><tr>
        <th>Patient</th>
        <th>UHID</th>
        <th>Order</th>
        <th>Doctor</th>
        <th>Status</th>
        <th>Action</th>
    <th>Action</th>
    </tr>
    </thead>
    <tbody>
      @for (info of rows(); track $index) {
        <tr>
          <td>{{ info.patientFullName }}</td>
          <td>{{ info.uhidnumber }}</td>
          <td>{{ info.nursingOrderDesc }}</td>
          <td>{{ info.doctorFullName }}</td>
          <td>{{ info.status }}</td>
          <td>—</td>
          <td>
            <button class="btn btn-xs btn-primary" (click)="approveOrder(info)">Approve</button>
          </td>
        </tr>
      } @empty {
        <tr><td colspan="6" class="text-center">No records</td></tr>
      }
    </tbody>
  </table>
</div>
