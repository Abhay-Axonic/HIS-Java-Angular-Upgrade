<div class="container-fluid">
  <h4>Pending Short Leave</h4>
  <table class="table table-striped table-bordered">
    <thead><tr>
        <th>Patient</th>
        <th>UHID</th>
        <th>Doctor</th>
        <th>Floor/Bed</th>
        <th>From</th>
        <th>To</th>
        <th>Action</th>
    </tr></thead>
    <tbody>
      @for (info of rows(); track $index) {
        <tr>
          <td>{{ info.patientName }}</td>
          <td>{{ info.uhidNumber }}</td>
          <td>{{ info.doctorName }}</td>
          <td>{{ info.floorName + ' / ' + info.bedNumber }}</td>
          <td title="UNRESOLVED — no backend quote">—</td>
          <td title="UNRESOLVED — no backend quote">—</td>
          <td>—</td>
          <td>
            <button class="btn btn-xs btn-primary" (click)="getAdmissionDataAccept()">getAdmissionDataAccept</button>
          </td>
        </tr>
      } @empty {
        <tr><td colspan="7" class="text-center">No records</td></tr>
      }
    </tbody>
  </table>
</div>
