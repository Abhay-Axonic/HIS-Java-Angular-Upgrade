<div class="container-fluid">
  <h4>Pre Authorization Request</h4>
  <table class="table table-striped table-bordered">
    <thead><tr>
        <th>Visit Type</th>
        <th>Payment Entitlement</th>
        <th>Visit Date | No.</th>
        <th>Patient Details</th>
        <th>Company / TPA</th>
        <th>Contract</th>
        <th>Insurance Name</th>
        <th>Insurance No.</th>
        <th>Status</th>
    </tr></thead>
    <tbody>
      @for (info of rows(); track $index) {
        <tr>
          <td title="UNRESOLVED — no backend quote">—</td>
          <td>{{ info.paymentEntitlementDesc }}</td>
          <td title="UNRESOLVED — no backend quote">—</td>
          <td>{{ info.patientName }}</td>
          <td title="UNRESOLVED — no backend quote">—</td>
          <td title="UNRESOLVED — no backend quote">—</td>
          <td title="UNRESOLVED — no backend quote">—</td>
          <td title="UNRESOLVED — no backend quote">—</td>
          <td title="UNRESOLVED — no backend quote">—</td>
          <td>
            <button class="btn btn-xs btn-primary" (click)="searchPreAuthorizationRequest()">searchPreAuthorizationRequest</button>
            <button class="btn btn-xs btn-primary" (click)="editViewPreAuthorizationRequest()">editViewPreAuthorizationRequest</button>
          </td>
        </tr>
      } @empty {
        <tr><td colspan="9" class="text-center">No records</td></tr>
      }
    </tbody>
  </table>
</div>
