<div class="pcfg-wrap">
  <header class="pcfg-header">
    <h2>Procedure Configurations</h2>
    <span class="pcfg-sub">OTIMS / Global — module 696</span>
  </header>

  @if (loading()) {
    <p class="pcfg-muted">Loading procedure configurations…</p>
  } @else if (error()) {
    <div class="pcfg-state pcfg-error">
      <p>{{ error() }}</p>
    </div>
  } @else {
    <table class="pcfg-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Procedure</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        @for (row of rows(); track row.id) {
          <tr>
            @for (cell of rowCells(row); track $index) {
              <td>{{ cell }}</td>
            }
          </tr>
        } @empty {
          <tr><td colspan="3" class="pcfg-empty">No records.</td></tr>
        }
      </tbody>
    </table>
  }
</div>
