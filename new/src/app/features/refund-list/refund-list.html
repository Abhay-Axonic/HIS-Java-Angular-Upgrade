<div class="container-fluid">
  <h4>Refund List</h4>
  <table class="table table-striped table-bordered">
    <thead><tr>
        <th>Refund CR No.</th>
        <th>Refund CR Date</th>
        <th>UHID</th>
        <th>Patient Name</th>
        <th>Mobile No.</th>
        <th>Refund Against</th>
        <th>Visit Type</th>
        <th>Remark</th>
        <th>Refund Amount</th>
    </tr></thead>
    <tbody>
      @for (info of rows(); track $index) {
        <tr>
          <td>{{ info.refundCnNo }}</td>
          <td>{{ info.refundCnDate }}</td>
          <td>{{ info.uhidNumber }}</td>
          <td>{{ info.patientName }}</td>
          <td>{{ info.mobileNo }}</td>
          <td title="CLIENT-SIDE DESC — needs a master lookup in the component (service-layer change)">—</td>
          <td title="CLIENT-SIDE DESC — needs a master lookup in the component (service-layer change)">—</td>
          <td title="UNRESOLVED — no backend quote">—</td>
          <td title="UNRESOLVED — no backend quote">—</td>
          <td>
            <button class="btn btn-xs btn-primary" (click)="searchCNMaster()">searchCNMaster</button>
            <button class="btn btn-xs btn-primary" (click)="refundListSearch()">refundListSearch</button>
          </td>
        </tr>
      } @empty {
        <tr><td colspan="9" class="text-center">No records</td></tr>
      }
    </tbody>
  </table>
</div>
