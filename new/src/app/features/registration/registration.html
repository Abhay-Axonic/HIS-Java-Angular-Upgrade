<div class="registration">
  <h2>Patient Registration</h2>

  <section class="reg-section">
    <h3>Personal Details</h3>
    <div class="reg-grid">
      <label>Prefix
        <select [ngModel]="form().prefixId" (ngModelChange)="updateField('prefixId', $event)"
          [class.invalid]="isRequiredMissing('prefixId')">
          <option [ngValue]="null">-- Select --</option>
          @for (p of prefixList(); track p.id) {
            <option [ngValue]="p.id">{{ p.name ?? p.code ?? p.desc }}</option>
          }
        </select>
      </label>
      <label>First Name @if (isRequired('firstName')) { <span class="req">*</span> }
        <input type="text" [ngModel]="form().firstName" (ngModelChange)="updateField('firstName', $event)"
          [class.invalid]="isRequiredMissing('firstName')" />
      </label>
      <label>Middle Name
        <input type="text" [ngModel]="form().middleName" (ngModelChange)="updateField('middleName', $event)" />
      </label>
      <label>Last Name
        <input type="text" [ngModel]="form().lastName" (ngModelChange)="updateField('lastName', $event)"
          [class.invalid]="isRequiredMissing('lastName')" />
      </label>
      <label>Gender @if (isRequired('genderId')) { <span class="req">*</span> }
        <select [ngModel]="form().genderId" (ngModelChange)="updateField('genderId', $event)"
          [class.invalid]="isRequiredMissing('genderId')">
          <option [ngValue]="null">-- Select --</option>
          @for (g of genderList(); track g.id) {
            <option [ngValue]="g.id">{{ g.name ?? g.code ?? g.desc }}</option>
          }
        </select>
      </label>
      <label>Date of Birth (DD/MM/YYYY) @if (isRequired('dob')) { <span class="req">*</span> }
        <input type="text" placeholder="DD/MM/YYYY" [ngModel]="form().dob"
          (ngModelChange)="updateField('dob', $event)" [class.invalid]="isRequiredMissing('dob')" />
      </label>
      <label>Mobile @if (isRequired('mobileNumber')) { <span class="req">*</span> }
        <input type="text" maxlength="10" [ngModel]="form().mobileNumber"
          (ngModelChange)="updateField('mobileNumber', $event)" [class.invalid]="isRequiredMissing('mobileNumber')" />
      </label>
      <label>Email
        <input type="email" [ngModel]="form().email" (ngModelChange)="updateField('email', $event)" />
      </label>
    </div>
  </section>

  <section class="reg-section">
    <h3>Identification</h3>
    <div class="reg-grid">
      <label>Identification Type @if (isRequired('identificationTypeId')) { <span class="req">*</span> }
        <select [ngModel]="form().identificationTypeId" (ngModelChange)="updateField('identificationTypeId', $event)"
          [class.invalid]="isRequiredMissing('identificationTypeId')">
          <option [ngValue]="null">-- Select --</option>
          @for (i of identificationList(); track i.id) {
            <option [ngValue]="i.id">{{ i.name ?? i.desc }}</option>
          }
        </select>
      </label>
      <label>Identification Number @if (isRequired('identificationNumber')) { <span class="req">*</span> }
        <input type="text" [ngModel]="form().identificationNumber"
          (ngModelChange)="updateField('identificationNumber', $event)"
          [class.invalid]="isRequiredMissing('identificationNumber')" />
      </label>
      <label>Expiry (DD/MM/YYYY)
        <input type="text" placeholder="DD/MM/YYYY" [ngModel]="form().identificationExpiryDate"
          (ngModelChange)="updateField('identificationExpiryDate', $event)" />
      </label>
    </div>
  </section>

  <section class="reg-section">
    <h3>Kin Details</h3>
    <div class="reg-grid">
      <label>Kin Name @if (isRequired('kinName')) { <span class="req">*</span> }
        <input type="text" [ngModel]="form().kinName" (ngModelChange)="updateField('kinName', $event)"
          [class.invalid]="isRequiredMissing('kinName')" />
      </label>
      <label>Relation @if (isRequired('relationId')) { <span class="req">*</span> }
        <select [ngModel]="form().relationId" (ngModelChange)="updateField('relationId', $event)"
          [class.invalid]="isRequiredMissing('relationId')">
          <option [ngValue]="null">-- Select --</option>
          @for (r of relationList(); track r.id) {
            <option [ngValue]="r.id">{{ r.name ?? r.desc }}</option>
          }
        </select>
      </label>
      <label>Kin Mobile @if (isRequired('kinMobileNo')) { <span class="req">*</span> }
        <input type="text" maxlength="10" [ngModel]="form().kinMobileNo"
          (ngModelChange)="updateField('kinMobileNo', $event)" />
      </label>
    </div>
  </section>

  <section class="reg-section">
    <h3>Address</h3>
    <div class="reg-grid">
      <label>Country
        <select [ngModel]="form().countryId" (ngModelChange)="onCountryChange($event)">
          <option [ngValue]="null">-- Select --</option>
          @for (c of countryList(); track c.id) {
            <option [ngValue]="c.id">{{ c.name ?? c.desc }}</option>
          }
        </select>
      </label>
      <label>State
        <select [ngModel]="form().stateId" (ngModelChange)="onStateChange($event)" [disabled]="!stateList().length">
          <option [ngValue]="null">-- Select --</option>
          @for (s of stateList(); track s.id) {
            <option [ngValue]="s.id">{{ s.name ?? s.desc }}</option>
          }
        </select>
      </label>
      <label>District
        <select [ngModel]="form().districtId" (ngModelChange)="onDistrictChange($event)" [disabled]="!districtList().length">
          <option [ngValue]="null">-- Select --</option>
          @for (d of districtList(); track d.id) {
            <option [ngValue]="d.id">{{ d.name ?? d.desc }}</option>
          }
        </select>
      </label>
      <label>City
        <select [ngModel]="form().cityId" (ngModelChange)="onCityChange($event)" [disabled]="!cityList().length">
          <option [ngValue]="null">-- Select --</option>
          @for (c of cityList(); track c.id) {
            <option [ngValue]="c.id">{{ c.name ?? c.desc }}</option>
          }
        </select>
      </label>
      <label>Area
        <select [ngModel]="form().areaId" (ngModelChange)="updateField('areaId', $event)" [disabled]="!areaList().length">
          <option [ngValue]="null">-- Select --</option>
          @for (a of areaList(); track a.id) {
            <option [ngValue]="a.id">{{ a.name ?? a.desc }}</option>
          }
        </select>
      </label>
      <label>Zip Code
        <input type="text" [ngModel]="form().zipCode" (ngModelChange)="updateField('zipCode', $event)" />
      </label>
      <label class="reg-full">Address
        <textarea [ngModel]="form().address" (ngModelChange)="updateField('address', $event)"></textarea>
      </label>
    </div>
  </section>

  <section class="reg-section">
    <h3>Payment Entitlement</h3>
    <div class="reg-grid">
      <label>Entitlement
        <select [ngModel]="form().paymentEntitlementId" (ngModelChange)="updateField('paymentEntitlementId', $event)">
          <option [ngValue]="null">-- Select --</option>
          @for (e of paymentEntitlementList(); track e.id) {
            <option [ngValue]="e.id">{{ e.name ?? e.desc }}</option>
          }
        </select>
      </label>
    </div>
  </section>

  <div class="reg-actions">
    <button class="btn-primary" (click)="save()" [disabled]="saving()">Save</button>
  </div>
</div>
