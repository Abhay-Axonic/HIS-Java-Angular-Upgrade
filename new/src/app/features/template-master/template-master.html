<div class="tm-wrap">
  <header class="tm-header">
    <h2>Lab Template Master</h2>
    <span class="tm-sub">Unit Master / LIS — module 58</span>
  </header>

  @if (loading()) {
    <p class="tm-muted">Loading templates…</p>
  } @else if (error()) {
    <div class="tm-state tm-error">
      <p>{{ error() }}</p>
    </div>
  } @else {
    <table class="tm-table">
      <thead>
        <tr>
          <th>Code</th>
          <th>Name</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        @for (row of rows(); track row.labTemplateId) {
          <tr>
            @for (cell of rowCells(row); track $index) {
              <td>{{ cell }}</td>
            }
          </tr>
        } @empty {
          <tr><td colspan="3" class="tm-empty">No records.</td></tr>
        }
      </tbody>
    </table>
  }
</div>
