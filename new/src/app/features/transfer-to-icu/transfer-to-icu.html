<div class="container-fluid">
  <h4>Transfer To Icu</h4>
  <table class="table table-striped table-bordered">
    <thead><tr>
        <th>Patient</th>
        <th>UHID</th>
        <th>ICU Type</th>
        <th>Doctor</th>
        <th>Note</th>
        <th>Action</th>
    </tr></thead>
    <tbody>
      @for (info of rows(); track $index) {
        <tr>
          <td>{{ info.patientFullName }}</td>
          <td>{{ info.UHIDNumber }}</td>
          <td>{{ info.icutype }}</td>
          <td>{{ info.firstName }}</td>
          <td>{{ info.note }}</td>
          <td>—</td>
          <td>
            <button class="btn btn-xs btn-primary" (click)="saveIcuTransferRequest()">saveIcuTransferRequest</button>
            <button class="btn btn-xs btn-primary" (click)="displayNote($index)">displayNote</button>
          </td>
        </tr>
      } @empty {
        <tr><td colspan="6" class="text-center">No records</td></tr>
      }
    </tbody>
  </table>
</div>
