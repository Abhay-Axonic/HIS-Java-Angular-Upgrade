<div class="unsm-wrap">
  <header class="unsm-header">
    <h2>User Nursing Station Mapper</h2>
    <span class="unsm-sub">Unit Master / Master — module 689</span>
  </header>

  @if (loading()) {
    <p class="unsm-muted">Loading mappers…</p>
  } @else if (error()) {
    <div class="unsm-state unsm-error">
      <p>{{ error() }}</p>
    </div>
  } @else {
    <table class="unsm-table">
      <thead>
        <tr>
          <th>Employee</th>
          <th>Emp Code</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        @for (row of rows(); track row.userId) {
          <tr>
            @for (cell of rowCells(row); track $index) {
              <td>{{ cell }}</td>
            }
          </tr>
        } @empty {
          <tr><td colspan="3" class="unsm-empty">No records.</td></tr>
        }
      </tbody>
    </table>
  }
</div>
