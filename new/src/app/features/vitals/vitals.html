<div class="container-fluid">
  <h4>Vitals</h4>
  <table class="table table-striped table-bordered">
    <thead><tr>
        <th>Parameter</th>
        <th>Observation</th>
        <th>Created</th>
        <th>Time</th>
        <th>Action</th>
    <th>Action</th>
    </tr>
    </thead>
    <tbody>
      @for (info of rows(); track $index) {
        <tr>
          <td>{{ info.vitalName }}</td>
          <td>{{ info.observation }}</td>
          <td>{{ info.createdDate }}</td>
          <td>{{ info.vitalTime }}</td>
          <td>—</td>
          <td>
            <button class="btn btn-xs btn-primary" (click)="addVital()">addVital</button>
            <button class="btn btn-xs btn-primary" (click)="searchVitals()">searchVitals</button>
          </td>
        </tr>
      } @empty {
        <tr><td colspan="5" class="text-center">No records</td></tr>
      }
    </tbody>
  </table>
</div>
