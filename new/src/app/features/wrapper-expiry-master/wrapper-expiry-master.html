<div class="wem-wrap">
  <header class="wem-header">
    <h2>Wrapper Expiry Master</h2>
    <span class="wem-sub">Unit Master / CSSD — module 554</span>
  </header>

  @if (loading()) {
    <p class="wem-muted">Loading wrappers…</p>
  } @else if (error()) {
    <div class="wem-state wem-error">
      <p>{{ error() }}</p>
    </div>
  } @else {
    <table class="wem-table">
      <thead>
        <tr>
          <th>Code</th>
          <th>Name</th>
          <th>Duration (days)</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        @for (row of rows(); track row.id) {
          <tr>
            @for (cell of rowCells(row); track $index) {
              <td>{{ cell }}</td>
            }
          </tr>
        } @empty {
          <tr><td colspan="4" class="wem-empty">No records.</td></tr>
        }
      </tbody>
    </table>
  }
</div>
